<title id="ro-b-033-p05-title">A Dance for the Toys: p05</title>
<desc id="ro-b-033-p05-desc">Sam bends his head and body forward in a bow, clapping with both palms touching in front of him. Mo bows beside him with both wings meeting in a clap.</desc>
