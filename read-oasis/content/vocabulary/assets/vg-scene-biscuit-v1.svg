<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-biscuit d-biscuit">
  <title id="t-biscuit">Biscuit</title>
  <desc id="d-biscuit">One large round golden biscuit with chocolate chips and a bite taken out of the top-right edge.</desc>
  <defs>
    <radialGradient id="bis-body" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f5d08a"/>
      <stop offset="70%" stop-color="#e0a94e"/>
      <stop offset="100%" stop-color="#b97e2e"/>
    </radialGradient>
    <filter id="bis-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#fef3c7"/>
  <ellipse cx="200" cy="256" rx="120" ry="18" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#bis-sh)">
    <!-- biscuit disc with a scalloped bite on the upper-right -->
    <path d="M200 60
             A100 100 0 1 0 300 160
             A34 34 0 0 1 268 120
             A30 30 0 0 1 250 78
             A100 100 0 0 0 200 60 Z"
          fill="url(#bis-body)" stroke="#8a5a20" stroke-width="5"/>
    <!-- baked texture dots -->
    <g fill="#c98b3a" opacity="0.6"><circle cx="150" cy="110" r="3"/><circle cx="120" cy="180" r="3"/><circle cx="230" cy="210" r="3"/></g>
    <!-- chocolate chips -->
    <g fill="#4a2410" stroke="#2b1508" stroke-width="2">
      <ellipse cx="150" cy="150" rx="12" ry="10"/>
      <ellipse cx="210" cy="130" rx="11" ry="9"/>
      <ellipse cx="180" cy="200" rx="12" ry="10"/>
      <ellipse cx="240" cy="185" rx="10" ry="8"/>
      <ellipse cx="120" cy="130" rx="9" ry="8"/>
      <ellipse cx="228" cy="235" rx="9" ry="8"/>
    </g>
  </g>
</svg>
