<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-drink d-drink">
  <title id="t-drink">Drink</title>
  <desc id="d-drink">A child raising a cup to the lips and sipping through a straw, showing drinking.</desc>
  <defs>
    <radialGradient id="drk-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <filter id="drk-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#drk-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#drk-sh)">
    <!-- Head -->
    <circle cx="180" cy="130" r="40" fill="#fcc79a" stroke="#0f172a" stroke-width="4"/>
    <path d="M141 122 C146 84 214 84 219 122 C208 100 152 100 141 122 Z" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <circle cx="170" cy="128" r="5" fill="#0f172a"/>
    <circle cx="196" cy="128" r="5" fill="#0f172a"/>
    <circle cx="160" cy="142" r="6.5" fill="#fb7185" opacity="0.35"/>
    <!-- open sipping mouth -->
    <ellipse cx="188" cy="150" rx="8" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Body -->
    <path d="M150 178 Q182 168 214 178 L222 262 Q182 272 142 262 Z" fill="#a855f7" stroke="#0f172a" stroke-width="4"/>

    <!-- Arm raising cup -->
    <path d="M206 196 Q246 190 254 152" fill="none" stroke="#a855f7" stroke-width="18" stroke-linecap="round"/>

    <!-- Cup at the lips -->
    <path d="M232 132 L276 132 L270 190 L238 190 Z" fill="#ef4444" stroke="#0f172a" stroke-width="4"/>
    <path d="M232 132 L276 132 L274 148 L234 148 Z" fill="#fecaca" stroke="#0f172a" stroke-width="2"/>
    <!-- straw from cup to mouth -->
    <line x1="250" y1="120" x2="196" y2="150" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="120" x2="256" y2="138" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <!-- refreshment sparkles -->
    <g fill="#0ea5e9">
      <circle cx="300" cy="110" r="5"/><circle cx="318" cy="132" r="4"/><circle cx="296" cy="146" r="3.5"/>
    </g>
  </g>
</svg>
