<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-drink desc-drink">
  <title id="title-drink">Drink - Child drinking from a cup</title>
  <desc id="desc-drink">A happy child holding a cup with a straw to their mouth, taking a sip.</desc>
  <defs>
    <linearGradient id="drink-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="drink-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="juice-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="150" ry="6" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Body/torso -->
    <path d="M155 175 Q200 165 245 175 L255 265 L145 265 Z" fill="url(#drink-shirt)" stroke="#4c1d95" stroke-width="3"/>
    <!-- Neck -->
    <rect x="188" y="145" width="24" height="18" fill="url(#drink-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Right arm (holding cup up to face) -->
    <path d="M240 180 Q265 155 245 130" fill="none" stroke="url(#drink-shirt)" stroke-width="20" stroke-linecap="round"/>
    <!-- Right hand (holding cup) -->
    <circle cx="242" cy="128" r="12" fill="url(#drink-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Left arm (down at side) -->
    <path d="M160 180 Q140 210 145 240" fill="none" stroke="url(#drink-shirt)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="147" cy="245" r="11" fill="url(#drink-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="200" cy="115" r="35" fill="url(#drink-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Hair -->
    <path d="M167 105 Q170 78 200 72 Q230 78 233 105 Q225 88 200 85 Q175 88 167 105 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Eyes (closed happy, taking a sip) -->
    <path d="M182 115 Q188 111 194 115" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <path d="M206 115 Q212 111 218 115" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="175" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="225" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
    <!-- Small "O" shaped mouth around straw -->
    <ellipse cx="205" cy="140" rx="4" ry="5" fill="#7c2d12" stroke="#0c0a09" stroke-width="1.5"/>

    <!-- Cup (in right hand, tilted slightly toward face) -->
    <path d="M225 120 L232 65 L280 65 L285 120 Z" fill="url(#cup-grad)" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Juice inside -->
    <path d="M234 75 L278 75 L282 118 L227 118 Z" fill="url(#juice-grad)" stroke="#7c2d12" stroke-width="1.5" opacity="0.9"/>
    <!-- Cup rim highlight -->
    <ellipse cx="256" cy="65" rx="24" ry="4" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
    <!-- Ice cubes -->
    <rect x="240" y="80" width="10" height="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
    <rect x="258" y="88" width="10" height="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>

    <!-- Straw (from cup to mouth) -->
    <path d="M240 65 L215 138" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
    <path d="M242 65 L217 138" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Sip line detail on straw -->
    <line x1="225" y1="100" x2="228" y2="98" stroke="#831843" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bubbles/refreshment sparkles -->
  <g>
    <circle cx="290" cy="70" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="305" cy="90" r="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="80" cy="115" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <path d="M100 60 L102 66 L108 68 L102 70 L100 76 L98 70 L92 68 L98 66 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
  </g>
</svg>