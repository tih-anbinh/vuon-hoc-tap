<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-card desc-card">
  <title id="title-card">Card</title>
  <desc id="desc-card">A folded greeting card standing open with a red heart on the front.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#card-bg)"/>
  <ellipse cx="200" cy="255" rx="150" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Back panel -->
    <path d="M200 90 L330 110 L330 250 L200 240 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="4"/>
    <!-- Front panel -->
    <path d="M200 90 L70 110 L70 250 L200 240 Z" fill="#fbcfe8" stroke="#1e293b" stroke-width="4"/>
    <!-- Fold line -->
    <line x1="200" y1="90" x2="200" y2="240" stroke="#9d174d" stroke-width="2.5"/>
    <!-- Heart on front -->
    <path d="M135 145 C120 128 95 138 95 158 C95 178 135 205 135 205 C135 205 175 178 175 158 C175 138 150 128 135 145 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <!-- Sparkle on back -->
    <path d="M275 150 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#fbbf24"/>
  </g>
</svg>
