<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-zoo d-zoo">
  <title id="t-zoo">Zoo</title>
  <desc id="d-zoo">A welcoming zoo entrance arch with flags, with a friendly lion and a giraffe peeking out from behind it.</desc>
  <defs>
    <linearGradient id="zoo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="zoo-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#zoo-bg)"/>
  <ellipse cx="200" cy="280" rx="160" ry="12" fill="#0f172a" opacity="0.1"/>

  <!-- Giraffe peeking (left, tall) -->
  <g filter="url(#zoo-sh)" stroke="#0f172a" stroke-width="4">
    <rect x="70" y="120" width="22" height="120" rx="10" fill="#f5c451"/>
    <path d="M66 128 Q60 108 78 100 Q96 104 96 124 Z" fill="#f5c451"/>
    <path d="M70 112 l-4 -12 M92 112 l4 -12" stroke="#a16207" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="118" r="3.5" fill="#0f172a"/>
    <g fill="#c2872a"><circle cx="76" cy="150" r="4"/><circle cx="86" cy="172" r="4"/><circle cx="78" cy="196" r="4"/></g>
  </g>

  <!-- Entrance arch (center, target landmark) -->
  <g filter="url(#zoo-sh)" stroke="#0f172a" stroke-width="4">
    <rect x="128" y="120" width="26" height="120" rx="4" fill="#f97316"/>
    <rect x="246" y="120" width="26" height="120" rx="4" fill="#f97316"/>
    <path d="M120 122 Q200 66 280 122 L280 138 Q200 86 120 138 Z" fill="#fb923c"/>
    <!-- flags on the arch -->
    <path d="M200 78 L200 58" stroke="#0f172a" stroke-width="3"/>
    <path d="M200 60 L222 66 L200 72 Z" fill="#ef4444"/>
    <path d="M150 96 L150 80" stroke="#0f172a" stroke-width="3"/><path d="M150 82 L168 86 L150 92 Z" fill="#3b82f6"/>
    <path d="M250 96 L250 80" stroke="#0f172a" stroke-width="3"/><path d="M250 82 L232 86 L250 92 Z" fill="#22c55e"/>
    <!-- paw sign -->
    <circle cx="200" cy="150" r="16" fill="#fde68a"/>
    <g fill="#78350f"><circle cx="200" cy="152" r="6"/><circle cx="193" cy="144" r="2.5"/><circle cx="200" cy="141" r="2.5"/><circle cx="207" cy="144" r="2.5"/></g>
  </g>

  <!-- Lion peeking (right) -->
  <g filter="url(#zoo-sh)" stroke="#0f172a" stroke-width="4">
    <circle cx="322" cy="210" r="40" fill="#f59e0b"/>
    <g fill="#b45309"><path d="M322 170 l-8 -18 12 10 z"/><path d="M362 210 l18 -8 -10 12 z"/><path d="M322 250 l-8 18 12 -10 z"/><path d="M282 210 l-18 -8 10 12 z"/><path d="M292 180 l-14 -12 16 4z"/><path d="M352 180 l14 -12 -16 4z"/></g>
    <circle cx="322" cy="212" r="30" fill="#fbbf24"/>
    <circle cx="312" cy="206" r="4.5" fill="#0f172a"/>
    <circle cx="332" cy="206" r="4.5" fill="#0f172a"/>
    <path d="M322 216 l-6 6 12 0 z" fill="#7c2d12"/>
    <path d="M322 222 Q314 232 306 226 M322 222 Q330 232 338 226" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
