<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-listen desc-listen">
  <title id="title-listen">Listen - Child listening with hand at ear</title>
  <desc id="desc-listen">A child with hand cupped near their ear, listening intently, with concentric sound waves and musical notes.</desc>
  <defs>
    <linearGradient id="listen-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="listen-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="150" cy="265" rx="90" ry="7" fill="#0f172a" opacity="0.12"/>

  <!-- Sound waves (concentric arcs from right side, coming toward ear) -->
  <g stroke="#a855f7" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M235 115 Q255 130 235 155" opacity="0.9"/>
    <path d="M255 100 Q285 130 255 170" opacity="0.7"/>
    <path d="M275 85 Q315 130 275 185" opacity="0.5"/>
  </g>

  <!-- Musical notes floating -->
  <g filter="url(#soft-shadow)">
    <!-- Note 1 -->
    <circle cx="310" cy="90" r="7" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
    <line x1="317" y1="88" x2="317" y2="55" stroke="#4c1d95" stroke-width="3" stroke-linecap="round"/>
    <path d="M317 55 Q330 60 328 75" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
    <!-- Note 2 -->
    <circle cx="345" cy="140" r="7" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
    <line x1="352" y1="138" x2="352" y2="110" stroke="#4c1d95" stroke-width="3" stroke-linecap="round"/>
    <!-- Note 3 -->
    <circle cx="330" cy="200" r="6" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
    <line x1="336" y1="198" x2="336" y2="170" stroke="#4c1d95" stroke-width="3" stroke-linecap="round"/>
    <path d="M336 170 Q346 173 344 185" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- Body/torso -->
    <path d="M105 175 Q150 168 195 175 L205 265 L95 265 Z" fill="url(#listen-shirt)" stroke="#134e4a" stroke-width="3"/>
    <!-- Neck -->
    <rect x="138" y="145" width="24" height="18" fill="url(#listen-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Left arm (down at side) -->
    <path d="M110 180 Q95 210 100 240" fill="none" stroke="url(#listen-shirt)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="102" cy="243" r="10" fill="url(#listen-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Right arm (raised, hand cupped near ear) -->
    <path d="M190 180 Q210 155 195 130" fill="none" stroke="url(#listen-shirt)" stroke-width="18" stroke-linecap="round"/>
    <!-- Right hand (cupped, C-shape) -->
    <path d="M200 125 Q220 115 225 130 Q225 145 210 145 Q195 145 195 135 Z" fill="url(#listen-skin)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Fingers -->
    <path d="M204 122 Q218 118 220 130" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.5"/>
    <path d="M204 128 Q216 126 218 135" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.5"/>

    <!-- Head -->
    <circle cx="150" cy="115" r="35" fill="url(#listen-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Hair -->
    <path d="M117 105 Q120 78 150 72 Q180 78 183 105 Q175 88 150 85 Q125 88 117 105 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Ear (right side, prominent for listening) -->
    <path d="M182 115 Q195 115 195 130 Q195 145 182 140 Q178 130 182 115 Z" fill="url(#listen-skin)" stroke="#a16207" stroke-width="2.5"/>
    <path d="M186 122 Q190 128 188 135" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <!-- Left ear -->
    <ellipse cx="115" cy="118" rx="6" ry="9" fill="url(#listen-skin)" stroke="#a16207" stroke-width="2"/>

    <!-- Eyes (looking to the side, concentrating) -->
    <circle cx="140" cy="115" r="3" fill="#0c0a09"/>
    <circle cx="164" cy="115" r="3" fill="#0c0a09"/>
    <!-- Eyebrows raised in listening -->
    <path d="M132 105 L146 105" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M158 105 L172 105" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small "shh" mouth -->
    <ellipse cx="152" cy="138" rx="4" ry="3" fill="#7c2d12" stroke="#0c0a09" stroke-width="1.5"/>
    <!-- Cheeks -->
    <circle cx="125" cy="130" r="5" fill="#fca5a5" opacity="0.5"/>
    <circle cx="175" cy="130" r="5" fill="#fca5a5" opacity="0.5"/>
  </g>
</svg>