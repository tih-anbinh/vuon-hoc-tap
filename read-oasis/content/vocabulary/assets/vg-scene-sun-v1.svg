<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-sun desc-sun">
  <title id="title-sun">Sun - Radiant golden sun</title>
  <desc id="desc-sun">A bright golden sun with a friendly smiling face, radiant sunbeams, and warm glowing rays, occupying the center of the frame.</desc>
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Warm background glow circle -->
  <circle cx="200" cy="150" r="135" fill="#fef9c3" opacity="0.45"/>

  <!-- TARGET OBJECT: SUN & RAYS (Occupying 75% canvas) -->
  <g id="sun-figure" filter="url(#soft-shadow)">
    <!-- 8 Primary Pointed Rays -->
    <g fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linejoin="round">
      <!-- Top -->
      <polygon points="190,75 200,25 210,75"/>
      <!-- Top-Right -->
      <polygon points="245,100 285,60 255,110"/>
      <!-- Right -->
      <polygon points="275,140 325,150 275,160"/>
      <!-- Bottom-Right -->
      <polygon points="255,190 285,240 245,200"/>
      <!-- Bottom -->
      <polygon points="210,225 200,275 190,225"/>
      <!-- Bottom-Left -->
      <polygon points="155,200 115,240 145,190"/>
      <!-- Left -->
      <polygon points="125,160 75,150 125,140"/>
      <!-- Top-Left -->
      <polygon points="145,110 115,60 155,100"/>
    </g>

    <!-- 8 Secondary Rounded Flame Beams (Alternating) -->
    <g fill="#facc15" stroke="#d97706" stroke-width="2.5">
      <!-- NNE -->
      <path d="M225,80 Q240,40 248,88 Z"/>
      <!-- ENE -->
      <path d="M270,122 Q310,105 272,135 Z"/>
      <!-- ESE -->
      <path d="M272,165 Q310,195 270,178 Z"/>
      <!-- SSE -->
      <path d="M248,212 Q240,260 225,220 Z"/>
      <!-- SSW -->
      <path d="M175,220 Q160,260 152,212 Z"/>
      <!-- WSW -->
      <path d="M128,178 Q90,195 128,165 Z"/>
      <!-- WNW -->
      <path d="M128,135 Q90,105 130,122 Z"/>
      <!-- NNW -->
      <path d="M152,88 Q160,40 175,80 Z"/>
    </g>

    <!-- Central Radiant Solar Disc -->
    <circle cx="200" cy="150" r="75" fill="url(#sun-glow)" stroke="#d97706" stroke-width="4.5"/>

    <!-- Friendly Sun Face (Engaging for children) -->
    <!-- Left Eye -->
    <circle cx="175" cy="138" r="8" fill="#1e293b"/>
    <circle cx="173" cy="135" r="2.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="225" cy="138" r="8" fill="#1e293b"/>
    <circle cx="223" cy="135" r="2.5" fill="#ffffff"/>

    <!-- Cheerful Rosy Cheeks -->
    <ellipse cx="165" cy="155" rx="12" ry="7" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="235" cy="155" rx="12" ry="7" fill="#f43f5e" opacity="0.45"/>

    <!-- Big Happy Smile -->
    <path d="M180 162 Q200 185 220 162" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>