<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sun desc-sun">
  <title id="title-sun">sun</title>
  <desc id="desc-sun">A bright yellow sun with rays shining in a blue sky.</desc>
  <rect width="400" height="300" rx="20" fill="#E3F2FD"/>
  <rect y="240" width="400" height="60" rx="0" fill="#C8E6C9"/>
  <!-- Clouds -->
  <ellipse cx="80" cy="200" rx="45" ry="18" fill="white" opacity="0.5"/>
  <ellipse cx="320" cy="220" rx="40" ry="15" fill="white" opacity="0.4"/>
  <g transform="translate(200, 130)">
    <!-- Rays -->
    <g stroke="#FDD835" stroke-width="5" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="-90" x2="0" y2="-70"/>
      <line x1="0" y1="70" x2="0" y2="90"/>
      <line x1="-90" y1="0" x2="-70" y2="0"/>
      <line x1="70" y1="0" x2="90" y2="0"/>
      <line x1="-63" y1="-63" x2="-50" y2="-50"/>
      <line x1="50" y1="-50" x2="63" y2="-63"/>
      <line x1="-63" y1="63" x2="-50" y2="50"/>
      <line x1="50" y1="50" x2="63" y2="63"/>
    </g>
    <!-- Shorter rays -->
    <g stroke="#FBC02D" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <line x1="-35" y1="-78" x2="-28" y2="-62"/>
      <line x1="35" y1="-78" x2="28" y2="-62"/>
      <line x1="-78" y1="-35" x2="-62" y2="-28"/>
      <line x1="78" y1="-35" x2="62" y2="-28"/>
      <line x1="-78" y1="35" x2="-62" y2="28"/>
      <line x1="78" y1="35" x2="62" y2="28"/>
      <line x1="-35" y1="78" x2="-28" y2="62"/>
      <line x1="35" y1="78" x2="28" y2="62"/>
    </g>
    <!-- Sun body -->
    <circle cx="0" cy="0" r="50" fill="#FDD835" stroke="#F9A825" stroke-width="3"/>
    <!-- Inner glow -->
    <circle cx="0" cy="0" r="38" fill="#FFEE58" opacity="0.5"/>
    <!-- Face -->
    <circle cx="-14" cy="-8" r="5" fill="#F57F17"/>
    <circle cx="14" cy="-8" r="5" fill="#F57F17"/>
    <path d="M-12,12 Q0,24 12,12" fill="none" stroke="#F57F17" stroke-width="3" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-24" cy="6" r="6" fill="#FFB74D" opacity="0.4"/>
    <circle cx="24" cy="6" r="6" fill="#FFB74D" opacity="0.4"/>
  </g>
</svg>
