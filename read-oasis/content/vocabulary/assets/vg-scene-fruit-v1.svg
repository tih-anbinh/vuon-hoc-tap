<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-fruit desc-fruit">
  <title id="title-fruit">Fruit - Bowl of mixed fruit</title>
  <desc id="desc-fruit">A big bowl overflowing with colorful fruit: an apple, a banana, an orange, grapes and a pear, showing the category of fruit.</desc>
  <defs>
    <linearGradient id="fu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="fu-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#fu-bg)"/>
  <rect x="0" y="240" width="400" height="60" fill="#a16207"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#5c3210" stroke-width="4"/>
  <ellipse cx="200" cy="252" rx="150" ry="9" fill="#0f172a" opacity="0.25"/>
  <g filter="url(#soft-shadow)">
    <!-- fruits behind bowl rim -->
    <!-- pear -->
    <path d="M95,135 Q90,105 105,95 Q120,88 128,105 Q145,120 138,148 Q130,168 112,165 Q92,160 95,135 Z" fill="#a3e635" stroke="#4d7c0f" stroke-width="3.5"/>
    <line x1="112" y1="95" x2="115" y2="82" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- apple -->
    <circle cx="170" cy="120" r="34" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <path d="M170,86 Q168,74 175,68" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="184" cy="72" rx="10" ry="6" fill="#22c55e" stroke="#14532d" stroke-width="2" transform="rotate(-25 184 72)"/>
    <ellipse cx="158" cy="110" rx="7" ry="10" fill="#fca5a5" opacity="0.7" transform="rotate(-20 158 110)"/>
    <!-- orange -->
    <circle cx="240" cy="128" r="30" fill="#fb923c" stroke="#9a3412" stroke-width="3.5"/>
    <circle cx="240" cy="102" r="4" fill="#4d7c0f"/>
    <g fill="#fdba74" opacity="0.7">
      <circle cx="230" cy="120" r="2"/>
      <circle cx="248" cy="115" r="2"/>
      <circle cx="243" cy="138" r="2"/>
      <circle cx="228" cy="136" r="2"/>
    </g>
    <!-- grapes -->
    <g fill="#a855f7" stroke="#6b21a8" stroke-width="2.5">
      <circle cx="292" cy="115" r="11"/>
      <circle cx="312" cy="122" r="11"/>
      <circle cx="284" cy="135" r="11"/>
      <circle cx="304" cy="142" r="11"/>
      <circle cx="322" cy="140" r="10"/>
      <circle cx="296" cy="158" r="10"/>
      <circle cx="314" cy="160" r="9"/>
    </g>
    <line x1="302" y1="104" x2="306" y2="90" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- banana draped in front -->
    <path d="M120,155 Q180,190 275,168 Q288,164 283,154 Q195,178 128,143 Q117,146 120,155 Z" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <!-- bowl -->
    <path d="M70,170 Q70,240 200,240 Q330,240 330,170 Z" fill="url(#fu-bowl)" stroke="#0c4a6e" stroke-width="4"/>
    <ellipse cx="200" cy="170" rx="130" ry="16" fill="none" stroke="#0c4a6e" stroke-width="4"/>
  </g>
</svg>
