<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-draw desc-draw">
  <title id="title-draw">Draw - Hand drawing a picture</title>
  <desc id="desc-draw">A hand holding a pencil, drawing a colorful star and sun on paper.</desc>
  <defs>
    <linearGradient id="draw-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pencil-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="150" ry="6" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Paper (tilted slightly) -->
    <rect x="60" y="120" width="240" height="140" rx="4" fill="url(#paper-grad)" stroke="#94a3b8" stroke-width="3" transform="rotate(-3 180 190)"/>
    <!-- Drawing on paper: sun -->
    <circle cx="130" cy="170" r="18" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="130" y1="145" x2="130" y2="135"/>
      <line x1="130" y1="195" x2="130" y2="205"/>
      <line x1="105" y1="170" x2="95" y2="170"/>
      <line x1="155" y1="170" x2="165" y2="170"/>
      <line x1="112" y1="152" x2="105" y2="145"/>
      <line x1="148" y1="152" x2="155" y2="145"/>
      <line x1="112" y1="188" x2="105" y2="195"/>
      <line x1="148" y1="188" x2="155" y2="195"/>
    </g>
    <!-- Sun face -->
    <circle cx="125" cy="167" r="1.5" fill="#0c0a09"/>
    <circle cx="135" cy="167" r="1.5" fill="#0c0a09"/>
    <path d="M125 175 Q130 179 135 175" fill="none" stroke="#0c0a09" stroke-width="1.5"/>
    <!-- Drawing: star (being drawn NOW, near pencil tip) -->
    <path d="M220 200 L226 215 L242 215 L229 224 L234 240 L220 231 L206 240 L211 224 L198 215 L214 215 Z" fill="#fb7185" stroke="#9f1239" stroke-width="2"/>
    <!-- Drawing: small heart -->
    <path d="M215 155 Q207 145 200 152 Q195 158 215 175 Q235 158 230 152 Q223 145 215 155 Z" fill="#f43f5e" stroke="#881337" stroke-width="2"/>

    <!-- Pencil (diagonal, tip pointing at star) -->
    <g transform="rotate(35 300 100)">
      <!-- Body -->
      <rect x="230" y="90" width="130" height="20" fill="url(#pencil-grad)" stroke="#78350f" stroke-width="2.5"/>
      <!-- Body stripes -->
      <line x1="240" y1="90" x2="240" y2="110" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
      <line x1="260" y1="90" x2="260" y2="110" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
      <line x1="280" y1="90" x2="280" y2="110" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
      <!-- Tip (cone) -->
      <path d="M230 90 L200 100 L230 110 Z" fill="#fef3c7" stroke="#78350f" stroke-width="2.5"/>
      <!-- Graphite -->
      <path d="M210 97 L200 100 L210 103 Z" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
      <!-- Eraser end -->
      <rect x="358" y="88" width="18" height="24" rx="2" fill="#fda4af" stroke="#9f1239" stroke-width="2.5"/>
      <rect x="356" y="88" width="5" height="24" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Hand holding pencil -->
    <path d="M280 130 Q265 125 260 140 Q258 155 275 158 L305 155 Q320 148 315 135 Q310 122 295 122 Z" fill="url(#draw-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Thumb -->
    <path d="M290 128 Q305 115 320 128 Q322 140 305 138" fill="url(#draw-skin)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Finger creases -->
    <path d="M275 145 Q290 148 305 145" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.5"/>
    <!-- Sleeve/wrist -->
    <path d="M255 158 L245 195 L285 200 L295 165 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  </g>

  <!-- Little motion sparkles -->
  <path d="M60 100 L63 107 L70 110 L63 113 L60 120 L57 113 L50 110 L57 107 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
  <path d="M350 200 L353 207 L360 210 L353 213 L350 220 L347 213 L340 210 L347 207 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
</svg>