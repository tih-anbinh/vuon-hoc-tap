<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-apple desc-apple">
  <title id="title-apple">Apple - Crisp red apple</title>
  <desc id="desc-apple">A juicy red apple with a green leaf and brown stem, accompanied by a fresh crisp apple slice, occupying the center of the frame.</desc>
  <defs>
    <radialGradient id="apple-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadows -->
  <ellipse cx="180" cy="265" rx="75" ry="12" fill="#0f172a" opacity="0.15"/>
  <ellipse cx="295" cy="265" rx="45" ry="8" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: APPLE (Occupying 70% canvas) -->
  <g id="apple-figure" filter="url(#soft-shadow)">
    <!-- Brown Stem -->
    <path d="M185 85 C185 55 205 45 215 40" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>

    <!-- Green Leaf -->
    <path d="M192 70 C225 50 255 65 250 85 C220 85 200 80 192 70 Z" fill="url(#leaf-grad)" stroke="#166534" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M196 73 Q220 75 245 83" fill="none" stroke="#bbf7d0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Whole Red Apple -->
    <path d="M180 85 C135 60 90 90 90 150 C90 220 145 255 175 255 C180 255 185 250 190 255 C220 255 270 220 270 150 C270 90 225 60 180 85 Z" fill="url(#apple-grad)" stroke="#7f1d1d" stroke-width="4"/>

    <!-- Glossy Highlight Curve -->
    <path d="M115 110 C105 130 105 160 115 180" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle cx="122" cy="100" r="4" fill="#ffffff" opacity="0.6"/>

    <!-- Apple Slice -->
    <g id="apple-slice">
      <path d="M260 255 C330 255 355 210 350 160 C325 195 295 235 260 255 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
      <path d="M265 250 C310 225 330 190 345 162 C315 175 285 210 265 250 Z" fill="#fef9c3" stroke="#fef08a" stroke-width="2"/>
      <ellipse cx="308" cy="205" rx="3.5" ry="6" fill="#451a03" transform="rotate(-30 308 205)"/>
    </g>
  </g>
</svg>