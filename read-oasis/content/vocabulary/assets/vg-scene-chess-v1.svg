<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-chess desc-chess">
  <title id="title-chess">Chess</title>
  <desc id="desc-chess">A black and white chessboard with a tall king and knight chess pieces on it.</desc>
  <defs>
    <linearGradient id="chess-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#chess-bg)"/>
  <ellipse cx="200" cy="270" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Board -->
    <rect x="90" y="195" width="220" height="70" fill="#f5f5f4" stroke="#1e293b" stroke-width="4"/>
    <g fill="#44403c">
      <rect x="90" y="195" width="27.5" height="17.5"/>
      <rect x="145" y="195" width="27.5" height="17.5"/>
      <rect x="200" y="195" width="27.5" height="17.5"/>
      <rect x="255" y="195" width="27.5" height="17.5"/>
      <rect x="117.5" y="212.5" width="27.5" height="17.5"/>
      <rect x="172.5" y="212.5" width="27.5" height="17.5"/>
      <rect x="227.5" y="212.5" width="27.5" height="17.5"/>
      <rect x="282.5" y="212.5" width="27.5" height="17.5"/>
      <rect x="90" y="230" width="27.5" height="17.5"/>
      <rect x="145" y="230" width="27.5" height="17.5"/>
      <rect x="200" y="230" width="27.5" height="17.5"/>
      <rect x="255" y="230" width="27.5" height="17.5"/>
      <rect x="117.5" y="247.5" width="27.5" height="17.5"/>
      <rect x="172.5" y="247.5" width="27.5" height="17.5"/>
      <rect x="227.5" y="247.5" width="27.5" height="17.5"/>
      <rect x="282.5" y="247.5" width="27.5" height="17.5"/>
    </g>

    <!-- White King -->
    <g fill="#f8fafc" stroke="#1e293b" stroke-width="3.5">
      <ellipse cx="150" cy="195" rx="26" ry="9"/>
      <path d="M132 190 L138 130 L162 130 L168 190 Z"/>
      <circle cx="150" cy="120" r="16"/>
      <rect x="145" y="82" width="10" height="26"/>
      <rect x="136" y="90" width="28" height="10"/>
    </g>

    <!-- Black Knight -->
    <g fill="#334155" stroke="#0f172a" stroke-width="3.5">
      <ellipse cx="250" cy="195" rx="24" ry="9"/>
      <path d="M234 190 L240 155 L262 155 L266 190 Z"/>
      <path d="M240 155 Q232 120 258 108 Q276 104 270 128 L268 140 Q280 138 274 150 L262 155 Z"/>
      <circle cx="262" cy="120" r="3" fill="#f8fafc"/>
    </g>
  </g>
</svg>
