<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-chess desc-chess">
  <title id="title-chess">Chess</title>
  <desc id="desc-chess">A square black-and-white checkered chessboard seen from above, with several chess pieces (a king, a queen, a knight and pawns) standing on the squares.</desc>
  <defs>
    <linearGradient id="chess-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="chess-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#chess-bg)"/>
  <ellipse cx="200" cy="278" rx="140" ry="12" fill="#0f172a" opacity="0.12"/>

  <!-- Square checkered board (6x6), clear grid -->
  <g filter="url(#chess-sh)">
    <rect x="80" y="66" width="240" height="200" rx="6" fill="#f5f5f4" stroke="#1e293b" stroke-width="5"/>
    <g fill="#44403c">
      <!-- row 1 -->
      <rect x="80"  y="66"  width="40" height="33.3"/>
      <rect x="160" y="66"  width="40" height="33.3"/>
      <rect x="240" y="66"  width="40" height="33.3"/>
      <!-- row 2 -->
      <rect x="120" y="99.3" width="40" height="33.3"/>
      <rect x="200" y="99.3" width="40" height="33.3"/>
      <rect x="280" y="99.3" width="40" height="33.3"/>
      <!-- row 3 -->
      <rect x="80"  y="132.6" width="40" height="33.3"/>
      <rect x="160" y="132.6" width="40" height="33.3"/>
      <rect x="240" y="132.6" width="40" height="33.3"/>
      <!-- row 4 -->
      <rect x="120" y="165.9" width="40" height="33.3"/>
      <rect x="200" y="165.9" width="40" height="33.3"/>
      <rect x="280" y="165.9" width="40" height="33.3"/>
      <!-- row 5 -->
      <rect x="80"  y="199.2" width="40" height="33.3"/>
      <rect x="160" y="199.2" width="40" height="33.3"/>
      <rect x="240" y="199.2" width="40" height="33.3"/>
      <!-- row 6 -->
      <rect x="120" y="232.5" width="40" height="33.5"/>
      <rect x="200" y="232.5" width="40" height="33.5"/>
      <rect x="280" y="232.5" width="40" height="33.5"/>
    </g>
    <!-- grid lines for clarity -->
    <g stroke="#1e293b" stroke-width="1.5" opacity="0.55">
      <line x1="120" y1="66" x2="120" y2="266"/>
      <line x1="160" y1="66" x2="160" y2="266"/>
      <line x1="200" y1="66" x2="200" y2="266"/>
      <line x1="240" y1="66" x2="240" y2="266"/>
      <line x1="280" y1="66" x2="280" y2="266"/>
      <line x1="80" y1="99.3"  x2="320" y2="99.3"/>
      <line x1="80" y1="132.6" x2="320" y2="132.6"/>
      <line x1="80" y1="165.9" x2="320" y2="165.9"/>
      <line x1="80" y1="199.2" x2="320" y2="199.2"/>
      <line x1="80" y1="232.5" x2="320" y2="232.5"/>
    </g>
  </g>

  <!-- White King (front-left) -->
  <g filter="url(#chess-sh)" fill="#f8fafc" stroke="#1e293b" stroke-width="3">
    <ellipse cx="140" cy="222" rx="20" ry="7"/>
    <path d="M126 218 L131 176 L149 176 L154 218 Z"/>
    <circle cx="140" cy="168" r="12"/>
    <rect x="136" y="140" width="8" height="20"/>
    <rect x="130" y="146" width="20" height="8"/>
  </g>
  <!-- White Queen -->
  <g filter="url(#chess-sh)" fill="#f8fafc" stroke="#1e293b" stroke-width="3">
    <ellipse cx="200" cy="222" rx="18" ry="6.5"/>
    <path d="M188 218 L193 182 L207 182 L212 218 Z"/>
    <circle cx="200" cy="174" r="11"/>
    <path d="M191 168 L194 156 L200 164 L206 156 L209 168 Z"/>
  </g>

  <!-- Black Knight (right) -->
  <g filter="url(#chess-sh)" fill="#334155" stroke="#0f172a" stroke-width="3">
    <ellipse cx="262" cy="150" rx="19" ry="6.5"/>
    <path d="M248 146 L253 118 L271 118 L275 146 Z"/>
    <path d="M253 118 Q246 88 270 78 Q287 74 281 96 L279 106 Q290 104 284 116 L272 118 Z"/>
    <circle cx="272" cy="92" r="2.6" fill="#f8fafc"/>
  </g>
  <!-- Black Pawn -->
  <g filter="url(#chess-sh)" fill="#334155" stroke="#0f172a" stroke-width="3">
    <ellipse cx="150" cy="120" rx="14" ry="5"/>
    <path d="M141 117 L145 100 L155 100 L159 117 Z"/>
    <circle cx="150" cy="94" r="9"/>
  </g>
  <!-- White Pawn -->
  <g filter="url(#chess-sh)" fill="#f8fafc" stroke="#1e293b" stroke-width="3">
    <ellipse cx="228" cy="200" rx="14" ry="5"/>
    <path d="M219 197 L223 180 L233 180 L237 197 Z"/>
    <circle cx="228" cy="174" r="9"/>
  </g>
</svg>
