<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-newspaper desc-newspaper">
  <title id="title-newspaper">Newspaper</title>
  <desc id="desc-newspaper">A folded newspaper with a big headline banner, a photo box, and columns of text.</desc>
  <defs>
    <linearGradient id="newspaper-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#newspaper-bg)"/>
  <ellipse cx="200" cy="262" rx="140" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Paper -->
    <rect x="95" y="45" width="210" height="205" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="3.5"/>
    <!-- Fold line -->
    <line x1="200" y1="45" x2="200" y2="250" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Headline banner -->
    <rect x="110" y="58" width="180" height="26" rx="3" fill="#1e293b"/>
    <g fill="#f8fafc">
      <rect x="120" y="66" width="54" height="10" rx="2"/>
      <rect x="182" y="66" width="42" height="10" rx="2"/>
      <rect x="232" y="66" width="48" height="10" rx="2"/>
    </g>

    <!-- Photo box -->
    <rect x="112" y="95" width="80" height="60" rx="3" fill="#60a5fa" stroke="#1e293b" stroke-width="2"/>
    <circle cx="132" cy="115" r="8" fill="#fde047"/>
    <path d="M112 155 L145 128 L170 145 L192 128 L192 155 Z" fill="#22c55e"/>

    <!-- Text columns right of photo -->
    <g stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round">
      <line x1="205" y1="100" x2="288" y2="100"/>
      <line x1="205" y1="114" x2="288" y2="114"/>
      <line x1="205" y1="128" x2="288" y2="128"/>
      <line x1="205" y1="142" x2="270" y2="142"/>
      <!-- Two columns lower -->
      <line x1="112" y1="172" x2="192" y2="172"/>
      <line x1="112" y1="186" x2="192" y2="186"/>
      <line x1="112" y1="200" x2="192" y2="200"/>
      <line x1="112" y1="214" x2="175" y2="214"/>
      <line x1="205" y1="160" x2="288" y2="160"/>
      <line x1="205" y1="174" x2="288" y2="174"/>
      <line x1="205" y1="188" x2="288" y2="188"/>
      <line x1="205" y1="202" x2="288" y2="202"/>
      <line x1="205" y1="216" x2="260" y2="216"/>
    </g>
  </g>
</svg>
