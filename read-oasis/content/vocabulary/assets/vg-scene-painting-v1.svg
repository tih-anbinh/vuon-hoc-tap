<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-painting desc-painting">
  <title id="title-painting">Painting - Child painting a picture on an easel</title>
  <desc id="desc-painting">A child holding a brush and palette, painting a colorful rainbow picture on a canvas standing on a wooden easel.</desc>
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#pt-bg)"/>
  <rect x="0" y="252" width="400" height="48" fill="#d6a35c" opacity="0.55"/>
  <ellipse cx="200" cy="258" rx="145" ry="9" fill="#0f172a" opacity="0.2"/>
  <!-- easel -->
  <g filter="url(#soft-shadow)">
    <line x1="235" y1="55" x2="200" y2="262" stroke="#a16207" stroke-width="8" stroke-linecap="round"/>
    <line x1="235" y1="55" x2="272" y2="262" stroke="#a16207" stroke-width="8" stroke-linecap="round"/>
    <line x1="236" y1="120" x2="236" y2="258" stroke="#a16207" stroke-width="7" stroke-linecap="round"/>
    <!-- shelf -->
    <rect x="160" y="196" width="152" height="12" rx="4" fill="#c98a3b" stroke="#78350f" stroke-width="3"/>
    <!-- canvas -->
    <rect x="160" y="72" width="150" height="124" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="4"/>
    <!-- rainbow painting on canvas -->
    <g fill="none" stroke-linecap="round">
      <path d="M180,175 Q235,95 290,175" stroke="#ef4444" stroke-width="9"/>
      <path d="M188,175 Q235,110 282,175" stroke="#f59e0b" stroke-width="9"/>
      <path d="M196,175 Q235,125 274,175" stroke="#facc15" stroke-width="9"/>
      <path d="M204,175 Q235,140 266,175" stroke="#22c55e" stroke-width="9"/>
      <path d="M212,175 Q235,153 258,175" stroke="#3b82f6" stroke-width="9"/>
    </g>
    <circle cx="185" cy="95" r="11" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
  </g>
  <!-- child painter -->
  <g filter="url(#soft-shadow)">
    <!-- head -->
    <circle cx="78" cy="112" r="30" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <!-- beret -->
    <path d="M48,104 Q45,74 80,74 Q112,76 108,102 Q80,92 48,104 Z" fill="#7c3aed" stroke="#4c1d95" stroke-width="3"/>
    <circle cx="80" cy="72" r="5" fill="#4c1d95"/>
    <!-- face -->
    <circle cx="70" cy="114" r="4" fill="#0f172a"/>
    <circle cx="88" cy="114" r="4" fill="#0f172a"/>
    <path d="M70,126 Q79,133 88,126" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="122" r="5" fill="#fda4af" opacity="0.7"/>
    <!-- smock body -->
    <path d="M56,140 L100,140 L110,215 L46,215 Z" fill="#22c55e" stroke="#14532d" stroke-width="3.5"/>
    <!-- paint splashes on smock -->
    <circle cx="72" cy="170" r="5" fill="#ef4444"/>
    <circle cx="90" cy="188" r="4" fill="#3b82f6"/>
    <circle cx="63" cy="196" r="4" fill="#facc15"/>
    <!-- arm with brush toward canvas -->
    <path d="M100,150 Q130,140 150,132" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="153" cy="130" r="8" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <!-- brush -->
    <line x1="158" y1="127" x2="178" y2="118" stroke="#a16207" stroke-width="5" stroke-linecap="round"/>
    <path d="M178,118 L192,110 Q196,114 190,119 L180,123 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <!-- arm with palette -->
    <path d="M56,152 Q35,165 32,180" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- palette -->
    <path d="M8,185 Q4,163 28,158 Q56,154 60,176 Q62,196 40,200 Q14,203 8,185 Z" fill="#e8b478" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="24" cy="172" r="5" fill="#ef4444"/>
    <circle cx="40" cy="168" r="5" fill="#3b82f6"/>
    <circle cx="47" cy="182" r="5" fill="#facc15"/>
    <circle cx="30" cy="188" r="5" fill="#22c55e"/>
    <!-- legs -->
    <path d="M64,215 L62,255" stroke="#1e40af" stroke-width="11" stroke-linecap="round"/>
    <path d="M92,215 L94,255" stroke="#1e40af" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="60" cy="260" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="97" cy="260" rx="12" ry="6" fill="#0f172a"/>
  </g>
</svg>
