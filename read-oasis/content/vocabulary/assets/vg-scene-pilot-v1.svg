<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-pilot d-pilot">
  <title id="t-pilot">Pilot</title>
  <desc id="d-pilot">A smiling pilot wearing a captain's cap and blue uniform, with an aeroplane flying in the sky behind, showing an aeroplane pilot.</desc>
  <defs>
    <linearGradient id="pil-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="pil-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#pil-sky)"/>
  <!-- Clouds -->
  <g fill="#fff" opacity="0.85">
    <ellipse cx="322" cy="70" rx="34" ry="18"/><ellipse cx="296" cy="78" rx="24" ry="14"/>
    <ellipse cx="70" cy="118" rx="30" ry="16"/>
  </g>
  <!-- Aeroplane behind (top-right) -->
  <g filter="url(#pil-sh)" stroke="#0f172a" stroke-width="3">
    <path d="M270 96 Q330 84 372 92 Q378 100 372 108 Q330 116 274 110 Z" fill="#e2e8f0"/>
    <path d="M300 96 L288 74 L302 74 L318 94 Z" fill="#cbd5e1"/>
    <path d="M300 108 L292 126 L306 126 L318 110 Z" fill="#cbd5e1"/>
    <path d="M368 90 L384 82 L380 96 Z" fill="#94a3b8"/>
    <circle cx="330" cy="102" r="3" fill="#38bdf8"/><circle cx="344" cy="102" r="3" fill="#38bdf8"/>
  </g>

  <!-- Pilot bust -->
  <g filter="url(#pil-sh)" stroke="#0f172a" stroke-width="4">
    <!-- shoulders / uniform -->
    <path d="M96 292 Q100 214 168 202 Q236 214 240 292 Z" fill="#1e3a8a"/>
    <!-- lapels -->
    <path d="M168 206 L146 250 L168 236 Z" fill="#1d4ed8"/>
    <path d="M168 206 L190 250 L168 236 Z" fill="#1d4ed8"/>
    <!-- shirt + tie -->
    <path d="M160 210 L176 210 L176 236 L168 232 L160 236 Z" fill="#fff"/>
    <path d="M166 214 L170 214 L174 250 L168 258 L162 250 Z" fill="#ef4444"/>
    <!-- wings badge -->
    <path d="M198 226 l16 0 M214 226 l10 -4 M214 226 l10 4" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <circle cx="214" cy="226" r="4" fill="#fbbf24"/>
    <!-- neck + head -->
    <rect x="156" y="180" width="24" height="26" fill="#fcc79a"/>
    <circle cx="168" cy="150" r="38" fill="#fcc79a"/>
    <circle cx="156" cy="150" r="5" fill="#0f172a"/>
    <circle cx="182" cy="150" r="5" fill="#0f172a"/>
    <path d="M154 168 Q168 180 182 168" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="146" cy="160" r="6" fill="#fb7185" opacity="0.35"/>
    <!-- captain's cap -->
    <path d="M122 128 Q168 108 214 128 L214 122 Q168 92 122 122 Z" fill="#1e3a8a"/>
    <rect x="120" y="126" width="96" height="14" rx="4" fill="#111827"/>
    <rect x="152" y="118" width="32" height="14" rx="3" fill="#0b1220"/>
    <!-- gold emblem -->
    <circle cx="168" cy="125" r="5" fill="#fbbf24"/>
    <!-- visor -->
    <path d="M120 140 Q168 152 216 140 L216 148 Q168 160 120 148 Z" fill="#0b1220"/>
  </g>
</svg>
