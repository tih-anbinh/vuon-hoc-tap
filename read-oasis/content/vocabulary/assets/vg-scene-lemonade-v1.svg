<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-lemonade desc-lemonade">
  <title id="title-lemonade">Lemonade - Glass of lemonade</title>
  <desc id="desc-lemonade">A tall glass of pale yellow lemonade with ice cubes, a lemon slice, and a green mint leaf garnish.</desc>
  <defs>
    <linearGradient id="lemonade-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="60" y1="268" x2="340" y2="268" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="268" rx="55" ry="6" fill="#0f172a" opacity="0.1"/>

  <g id="lemonade-figure" filter="url(#soft-shadow)">
    <!-- Glass -->
    <path d="M152 65 L142 255 Q142 265 200 265 Q258 265 258 255 L248 65 Z" fill="#e0f2fe" stroke="#94a3b8" stroke-width="3" opacity="0.5"/>

    <!-- Lemonade fill -->
    <path d="M154 80 L144 252 Q144 260 200 260 Q256 260 256 252 L246 80 Z" fill="url(#lemonade-fill)" opacity="0.7"/>

    <!-- Ice cubes -->
    <rect x="170" y="120" width="25" height="22" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2" opacity="0.7" transform="rotate(-8 182 131)"/>
    <rect x="205" y="140" width="22" height="20" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2" opacity="0.7" transform="rotate(5 216 150)"/>
    <rect x="175" y="170" width="20" height="18" rx="4" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2" opacity="0.6" transform="rotate(-3 185 179)"/>

    <!-- Bubbles -->
    <circle cx="185" cy="210" r="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="215" cy="230" r="2.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="195" cy="240" r="2" fill="#ffffff" opacity="0.35"/>

    <!-- Glass shine -->
    <path d="M160 85 L152 245 Q154 250 158 250 L166 85 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Lemon slice on rim -->
    <g transform="translate(248, 68) rotate(20)">
      <path d="M-18 0 A18 18 0 0 1 18 0 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2.5"/>
      <path d="M-14 0 A14 14 0 0 1 14 0 Z" fill="#fef9c3"/>
      <line x1="0" y1="-13" x2="0" y2="0" stroke="#eab308" stroke-width="1.5"/>
      <line x1="-11" y1="-7" x2="0" y2="0" stroke="#eab308" stroke-width="1.5"/>
      <line x1="11" y1="-7" x2="0" y2="0" stroke="#eab308" stroke-width="1.5"/>
    </g>

    <!-- Mint leaf -->
    <path d="M155 62 C140 50 130 42 135 35 C140 28 150 35 155 50 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M155 55 C145 45 138 40 137 36" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Glass rim -->
    <ellipse cx="200" cy="65" rx="48" ry="8" fill="none" stroke="#94a3b8" stroke-width="3"/>
  </g>
</svg>