<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bus-stop desc-bus-stop">
  <title id="title-bus-stop">Bus stop - Bus stop sign and shelter by the road</title>
  <desc id="desc-bus-stop">A bus stop with a tall sign showing a bus symbol, a small shelter with a bench where a child waits, and a bus arriving on the road.</desc>
  <defs>
    <linearGradient id="bp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bp-sky)"/>
  <circle cx="48" cy="44" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="300" cy="50" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- pavement -->
  <rect x="0" y="216" width="400" height="32" fill="#cbd5e1"/>
  <line x1="0" y1="216" x2="400" y2="216" stroke="#64748b" stroke-width="3.5"/>
  <!-- road -->
  <rect x="0" y="248" width="400" height="52" fill="#475569"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#1e293b" stroke-width="4"/>
  <line x1="0" y1="276" x2="400" y2="276" stroke="#fde047" stroke-width="4" stroke-dasharray="18,14"/>
  <!-- shelter -->
  <g filter="url(#soft-shadow)">
    <rect x="180" y="98" width="150" height="12" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="3.5"/>
    <rect x="188" y="110" width="10" height="106" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <rect x="312" y="110" width="10" height="106" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <!-- glass back -->
    <rect x="198" y="118" width="114" height="70" fill="#bae6fd" opacity="0.6" stroke="#64748b" stroke-width="3"/>
    <!-- bench -->
    <rect x="206" y="180" width="98" height="9" rx="3" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <rect x="212" y="189" width="8" height="27" fill="#78350f"/>
    <rect x="290" y="189" width="8" height="27" fill="#78350f"/>
    <!-- waiting child sitting -->
    <circle cx="252" cy="140" r="14" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <path d="M240,134 Q240,122 252,122 Q264,122 264,134 L260,138 Q252,128 244,138 Z" fill="#451a03" stroke="#1c1917" stroke-width="2.5"/>
    <circle cx="247" cy="139" r="2.2" fill="#0f172a"/>
    <circle cx="257" cy="139" r="2.2" fill="#0f172a"/>
    <path d="M247,147 Q252,151 257,147" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M242,154 L262,154 L266,180 L238,180 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3"/>
    <path d="M244,182 L244,196 Q244,200 250,200" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M260,182 L260,196 Q260,200 266,200" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <!-- backpack beside -->
    <rect x="276" y="162" width="20" height="20" rx="5" fill="#f43f5e" stroke="#881337" stroke-width="3"/>
  </g>
  <!-- BUS STOP SIGN (hero element) -->
  <g filter="url(#soft-shadow)">
    <rect x="96" y="70" width="12" height="146" fill="#64748b" stroke="#334155" stroke-width="3.5"/>
    <rect x="52" y="40" width="100" height="62" rx="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="4.5"/>
    <!-- bus pictogram on sign -->
    <rect x="66" y="56" width="72" height="30" rx="6" fill="#fefce8" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="72" y="61" width="14" height="11" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <rect x="90" y="61" width="14" height="11" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <rect x="108" y="61" width="14" height="11" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="82" cy="86" r="5" fill="#0f172a"/>
    <circle cx="120" cy="86" r="5" fill="#0f172a"/>
  </g>
  <!-- bus arriving on road -->
  <g filter="url(#soft-shadow)">
    <rect x="252" y="238" width="140" height="44" rx="8" fill="#facc15" stroke="#a16207" stroke-width="4"/>
    <g fill="#bae6fd" stroke="#a16207" stroke-width="2.5">
      <rect x="262" y="246" width="24" height="16" rx="3"/>
      <rect x="292" y="246" width="24" height="16" rx="3"/>
      <rect x="322" y="246" width="24" height="16" rx="3"/>
    </g>
    <rect x="354" y="246" width="20" height="28" rx="3" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="284" cy="284" r="11" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="284" cy="284" r="4" fill="#94a3b8"/>
    <circle cx="352" cy="284" r="11" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="352" cy="284" r="4" fill="#94a3b8"/>
    <!-- motion lines -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round">
      <line x1="228" y1="250" x2="244" y2="250"/>
      <line x1="220" y1="262" x2="240" y2="262"/>
    </g>
  </g>
</svg>
