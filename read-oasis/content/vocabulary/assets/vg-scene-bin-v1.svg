<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bin desc-bin">
  <title id="title-bin">Bin</title>
  <desc id="desc-bin">A green rubbish bin with a lid and vertical ridges, with a crumpled paper ball nearby.</desc>
  <defs>
    <linearGradient id="bin-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bin-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#bin-bg)"/>
  <ellipse cx="200" cy="262" rx="140" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <path d="M140 100 L260 100 L248 255 L152 255 Z" fill="url(#bin-body)" stroke="#1e293b" stroke-width="4"/>
    <!-- Ridges -->
    <g stroke="#166534" stroke-width="3">
      <line x1="170" y1="110" x2="164" y2="248"/>
      <line x1="200" y1="110" x2="200" y2="248"/>
      <line x1="230" y1="110" x2="236" y2="248"/>
    </g>
    <!-- Lid -->
    <ellipse cx="200" cy="98" rx="66" ry="16" fill="#16a34a" stroke="#1e293b" stroke-width="4"/>
    <ellipse cx="200" cy="90" rx="66" ry="16" fill="#22c55e" stroke="#1e293b" stroke-width="4"/>
    <rect x="188" y="70" width="24" height="14" rx="6" fill="#166534" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Paper ball -->
  <g filter="url(#soft-shadow)">
    <circle cx="315" cy="235" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <path d="M300 230 L312 238 M320 225 L328 235 M305 245 L318 240" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  </g>
</svg>
