<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-sheep desc-sheep">
  <title id="title-sheep">Sheep - Fluffy white sheep</title>
  <desc id="desc-sheep">A fluffy white sheep with a woolly cloud-like body, dark face and legs, and a gentle expression standing on green grass.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="40" y1="265" x2="360" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Grass tufts -->
  <path d="M70 265 C73 256 77 256 80 265" fill="#86efac" stroke="none"/>
  <path d="M150 265 C153 258 157 258 160 265" fill="#86efac" stroke="none"/>
  <path d="M250 265 C253 258 257 258 260 265" fill="#86efac" stroke="none"/>
  <path d="M330 265 C333 257 337 257 340 265" fill="#86efac" stroke="none"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="265" rx="90" ry="10" fill="#0f172a" opacity="0.12"/>

  <!-- SHEEP -->
  <g id="sheep-figure" filter="url(#soft-shadow)">
    <!-- Dark legs -->
    <!-- Rear left -->
    <rect x="135" y="215" width="16" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="133" y="254" width="20" height="8" rx="3" fill="#1e293b"/>

    <!-- Rear right -->
    <rect x="160" y="218" width="14" height="42" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="158" y="254" width="18" height="8" rx="3" fill="#0f172a"/>

    <!-- Front left -->
    <rect x="240" y="215" width="16" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="238" y="254" width="20" height="8" rx="3" fill="#1e293b"/>

    <!-- Front right -->
    <rect x="263" y="218" width="14" height="42" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="261" y="254" width="18" height="8" rx="3" fill="#0f172a"/>

    <!-- Woolly body (cloud-like bumps) -->
    <circle cx="160" cy="175" r="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="195" cy="165" r="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="235" cy="165" r="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="265" cy="175" r="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="180" cy="195" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="215" cy="200" r="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="250" cy="195" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Central wool fill -->
    <ellipse cx="210" cy="180" rx="60" ry="35" fill="#f1f5f9"/>

    <!-- Top wool bumps -->
    <circle cx="175" cy="148" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="200" cy="142" r="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="228" cy="145" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="252" cy="152" r="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Small tail (woolly puff) -->
    <circle cx="125" cy="180" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="118" cy="175" r="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Dark face -->
    <ellipse cx="295" cy="155" rx="25" ry="28" fill="#334155" stroke="#1e293b" stroke-width="3"/>

    <!-- Wool on forehead -->
    <circle cx="278" cy="132" r="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="295" cy="128" r="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="310" cy="134" r="11" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Ears -->
    <ellipse cx="272" cy="148" rx="14" ry="7" fill="#334155" stroke="#1e293b" stroke-width="2" transform="rotate(-20 272 148)"/>
    <ellipse cx="320" cy="148" rx="14" ry="7" fill="#334155" stroke="#1e293b" stroke-width="2" transform="rotate(20 320 148)"/>

    <!-- Eyes -->
    <circle cx="288" cy="150" r="5" fill="#1e293b"/>
    <circle cx="286" cy="148" r="2" fill="#ffffff"/>

    <circle cx="306" cy="150" r="5" fill="#1e293b"/>
    <circle cx="304" cy="148" r="2" fill="#ffffff"/>

    <!-- Nose -->
    <ellipse cx="297" cy="165" rx="6" ry="4" fill="#1e293b"/>

    <!-- Mouth -->
    <path d="M292 170 Q297 176 302 170" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <circle cx="283" cy="162" r="5" fill="#f9a8d4" opacity="0.3"/>
    <circle cx="311" cy="162" r="5" fill="#f9a8d4" opacity="0.3"/>
  </g>
</svg>