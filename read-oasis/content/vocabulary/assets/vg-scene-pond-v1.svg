<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-pond desc-pond">
  <title id="title-pond">Pond</title>
  <desc id="desc-pond">A small round pond with lily pads, a pink flower, cattails, and a frog on a leaf.</desc>
  <defs>
    <linearGradient id="pond-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <radialGradient id="pond-water" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#pond-bg)"/>

  <g filter="url(#soft-shadow)">
    <!-- Water -->
    <ellipse cx="200" cy="185" rx="155" ry="85" fill="url(#pond-water)" stroke="#075985" stroke-width="4"/>
    <!-- Ripples -->
    <g fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.6">
      <ellipse cx="260" cy="200" rx="40" ry="18"/>
      <ellipse cx="260" cy="200" rx="24" ry="10"/>
    </g>
  </g>

  <!-- Cattails -->
  <g stroke="#166534" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="200" x2="60" y2="110"/>
    <line x1="78" y1="205" x2="78" y2="130"/>
  </g>
  <rect x="55" y="90" width="12" height="34" rx="6" fill="#78350f"/>
  <rect x="73" y="112" width="10" height="28" rx="5" fill="#92400e"/>

  <!-- Lily pads -->
  <g filter="url(#soft-shadow)">
    <path d="M120 190 a30 20 0 1 0 8 -14 Z" fill="#22c55e" stroke="#166534" stroke-width="2.5"/>
    <ellipse cx="250" cy="155" rx="34" ry="22" fill="#16a34a" stroke="#14532d" stroke-width="2.5"/>
    <path d="M250 155 L228 148" stroke="#14532d" stroke-width="2"/>
    <!-- Flower -->
    <g fill="#f9a8d4" stroke="#be185d" stroke-width="1.5">
      <ellipse cx="145" cy="175" rx="8" ry="14" transform="rotate(0 145 175)"/>
      <ellipse cx="145" cy="175" rx="8" ry="14" transform="rotate(60 145 175)"/>
      <ellipse cx="145" cy="175" rx="8" ry="14" transform="rotate(120 145 175)"/>
    </g>
    <circle cx="145" cy="175" r="6" fill="#fde047"/>
  </g>

  <!-- Frog on pad -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="250" cy="145" rx="22" ry="15" fill="#65a30d" stroke="#3f6212" stroke-width="2.5"/>
    <circle cx="240" cy="132" r="8" fill="#65a30d" stroke="#3f6212" stroke-width="2"/>
    <circle cx="260" cy="132" r="8" fill="#65a30d" stroke="#3f6212" stroke-width="2"/>
    <circle cx="240" cy="131" r="3" fill="#1e293b"/>
    <circle cx="260" cy="131" r="3" fill="#1e293b"/>
    <path d="M242 148 Q250 154 258 148" fill="none" stroke="#3f6212" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
