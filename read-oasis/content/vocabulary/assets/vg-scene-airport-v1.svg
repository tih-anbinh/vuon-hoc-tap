<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-airport desc-airport">
  <title id="title-airport">Airport</title>
  <desc id="desc-airport">An airport control tower and terminal building with a jet airplane on the runway under a blue sky.</desc>
  <defs>
    <linearGradient id="airport-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="airport-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#airport-sky)"/>
  <!-- clouds -->
  <ellipse cx="70" cy="52" rx="34" ry="13" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="96" cy="46" rx="24" ry="12" fill="#ffffff" opacity="0.9"/>
  <!-- runway tarmac -->
  <rect x="0" y="205" width="400" height="95" fill="#64748b"/>
  <rect x="0" y="205" width="400" height="10" fill="#475569"/>
  <!-- runway centre-line dashes -->
  <g fill="#fde047">
    <rect x="30" y="252" width="40" height="9" rx="2"/>
    <rect x="110" y="252" width="40" height="9" rx="2"/>
    <rect x="190" y="252" width="40" height="9" rx="2"/>
    <rect x="270" y="252" width="40" height="9" rx="2"/>
    <rect x="350" y="252" width="40" height="9" rx="2"/>
  </g>
  <ellipse cx="205" cy="240" rx="150" ry="16" fill="#0f172a" opacity="0.15"/>

  <!-- terminal + control tower (background context, smaller) -->
  <g filter="url(#soft-shadow)">
    <rect x="18" y="150" width="130" height="58" rx="6" fill="url(#airport-tower)" stroke="#1e293b" stroke-width="3"/>
    <rect x="30" y="162" width="18" height="20" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="56" y="162" width="18" height="20" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="82" y="162" width="18" height="20" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="108" y="162" width="18" height="20" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="1.8"/>
    <!-- control tower -->
    <rect x="150" y="112" width="26" height="96" fill="url(#airport-tower)" stroke="#1e293b" stroke-width="3"/>
    <path d="M142 112 L184 112 L179 88 L147 88 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="3"/>
    <rect x="149" y="92" width="28" height="15" rx="2" fill="#38bdf8" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="163" y1="88" x2="163" y2="72" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="163" cy="70" r="4" fill="#ef4444"/>
  </g>

  <!-- BIG airplane (dominant subject) taking off -->
  <g filter="url(#soft-shadow)" transform="rotate(-8 245 165)">
    <!-- fuselage -->
    <path d="M120,168
             Q118,150 150,148
             L330,150
             Q372,152 378,166
             Q372,180 330,182
             L150,184
             Q118,182 120,168 Z"
          fill="#f8fafc" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
    <!-- nose cone accent -->
    <path d="M360,152 Q378,152 378,166 Q378,180 360,180 Z" fill="#3b82f6" stroke="#1e293b" stroke-width="3"/>
    <!-- cockpit window -->
    <path d="M352,156 Q366,156 368,166 Q366,176 352,176 Z" fill="#bae6fd" stroke="#1e293b" stroke-width="2"/>
    <!-- tail fin -->
    <path d="M126,166 L104,116 L138,120 L150,166 Z" fill="#3b82f6" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- tail plane -->
    <path d="M128,172 L108,188 L142,180 Z" fill="#93c5fd" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- main wing (swept back, toward viewer) -->
    <path d="M232,178 L200,224 L264,196 Z" fill="#60a5fa" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- far wing hint (up) -->
    <path d="M244,158 L224,120 L272,150 Z" fill="#93c5fd" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- engine under wing -->
    <ellipse cx="238" cy="188" rx="16" ry="9" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
    <!-- windows row -->
    <g fill="#38bdf8" stroke="#1e293b" stroke-width="1.5">
      <circle cx="180" cy="166" r="5"/>
      <circle cx="204" cy="166" r="5"/>
      <circle cx="228" cy="166" r="5"/>
      <circle cx="252" cy="166" r="5"/>
      <circle cx="276" cy="166" r="5"/>
      <circle cx="300" cy="166" r="5"/>
      <circle cx="324" cy="166" r="5"/>
    </g>
    <!-- cheat-line -->
    <line x1="150" y1="176" x2="352" y2="176" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
