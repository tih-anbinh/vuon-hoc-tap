<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ear desc-ear">
  <title id="title-ear">Ear</title>
  <desc id="desc-ear">A friendly child's face turned slightly, with one ear highlighted by a bright ring, clearly pointing out the ear on the face.</desc>
  <defs>
    <radialGradient id="ear-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </radialGradient>
    <linearGradient id="ear-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="ear-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#ear-bg)"/>
  <ellipse cx="200" cy="272" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="face" filter="url(#soft-shadow)">
    <ellipse cx="210" cy="160" rx="90" ry="102" fill="url(#ear-skin)" stroke="#c2762e" stroke-width="4"/>
    <path d="M125 130 C130 78 300 78 300 130 C285 108 265 118 248 106 C228 122 200 122 182 106 C162 118 142 108 125 130 Z" fill="url(#ear-hair)"/>

    <!-- Eyes shifted right (3/4 view) -->
    <ellipse cx="200" cy="150" rx="13" ry="15" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="202" cy="152" r="6.5" fill="#5b3a1e"/>
    <circle cx="199" cy="149" r="2.5" fill="#ffffff"/>
    <ellipse cx="252" cy="150" rx="13" ry="15" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="254" cy="152" r="6.5" fill="#5b3a1e"/>
    <circle cx="251" cy="149" r="2.5" fill="#ffffff"/>
    <path d="M187 130 Q200 122 214 130" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M239 130 Q252 122 266 130" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M225 168 C232 182 238 192 234 198 C230 204 222 204 218 198 C214 192 218 182 225 168 Z" fill="#f7b98a" stroke="#b5651d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="185" cy="196" r="12" fill="#fb7185" opacity="0.35"/>
    <circle cx="270" cy="196" r="12" fill="#fb7185" opacity="0.35"/>
    <path d="M200 224 Q228 244 258 224" fill="none" stroke="#b5651d" stroke-width="4.5" stroke-linecap="round"/>

    <!-- TARGET: EAR (large, clear ear shape facing viewer) -->
    <path d="M132 140
             C102 138 88 168 96 200
             C102 226 122 240 138 230
             C128 220 122 206 128 196
             C138 200 150 194 148 180
             C160 176 158 156 144 154
             C150 142 144 140 132 140 Z"
          fill="url(#ear-skin)" stroke="#b5651d" stroke-width="5" stroke-linejoin="round"/>
    <!-- Inner ear curve (helix -> concha) -->
    <path d="M128 162
             C110 168 108 192 120 210"
          fill="none" stroke="#b5651d" stroke-width="4" stroke-linecap="round"/>
    <path d="M134 182 C124 186 122 200 130 210" fill="none" stroke="#b5651d" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Earlobe -->
    <ellipse cx="134" cy="226" rx="12" ry="10" fill="url(#ear-skin)" stroke="#b5651d" stroke-width="4"/>
  </g>

  <ellipse cx="124" cy="188" rx="50" ry="56" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 7"/>
</svg>
