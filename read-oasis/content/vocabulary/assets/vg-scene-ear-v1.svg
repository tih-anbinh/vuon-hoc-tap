<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ear desc-ear">
  <title id="title-ear">Ear - Clear ear and sound waves</title>
  <desc id="desc-ear">A clearly defined human ear with sound wave arcs arriving at it, occupying the center of the frame.</desc>
  <defs>
    <linearGradient id="ear-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Incoming Sound Waves (Concentric arcs conveying sound & hearing function) -->
  <g id="sound-waves" opacity="0.85">
    <path d="M110 110 C90 135 90 165 110 190" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M80 90 C50 125 50 175 80 210" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 70 C10 120 10 180 50 230" fill="none" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- TARGET OBJECT: EAR (Occupying 70% canvas) -->
  <g id="ear-figure" filter="url(#soft-shadow)">
    <!-- Soft Head Contour behind ear for natural context -->
    <path d="M210 35 C175 80 170 220 205 265" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Ear Outline (Outer Helix, Earlobe) -->
    <path d="M195 90
             C195 50 240 40 280 50
             C325 65 345 110 340 160
             C335 200 310 230 285 245
             C255 260 225 255 210 235
             C200 220 205 200 215 195
             C225 190 220 175 210 170
             C198 165 195 150 205 140
             C210 135 200 110 195 90 Z"
          fill="url(#ear-skin)" stroke="#c2410c" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Outer Helix Rim Curl (Folded edge) -->
    <path d="M210 70
             C240 55 295 65 315 105
             C325 125 320 170 305 195"
          fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>

    <!-- Inner Ear Creases & Concha (Antihelix and ear canal bowl) -->
    <!-- Antihelix Ridge -->
    <path d="M285 95 C265 115 255 140 260 175 C265 200 250 215 235 220" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <path d="M285 95 C295 110 295 130 290 145" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

    <!-- Ear Canal Cavity (Concha - deeper shadow) -->
    <path d="M228 150 C235 140 250 145 250 160 C250 175 235 180 225 170 Z" fill="#c2410c" opacity="0.35"/>
    <path d="M228 152 C233 145 245 148 245 160 C245 170 234 174 227 167 Z" fill="#9a3412" opacity="0.5"/>

    <!-- Tragus (Little protective flap in front of ear canal) -->
    <path d="M208 148 C215 150 220 158 215 165 C210 170 205 165 208 148 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Earlobe highlight (Smooth soft lobe) -->
    <ellipse cx="250" cy="235" rx="12" ry="8" fill="#fff7ed" opacity="0.6"/>
  </g>
</svg>