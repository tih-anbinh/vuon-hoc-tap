<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ear desc-ear">
  <title id="title-ear">ear</title>
  <desc id="desc-ear">A child's face with an arrow pointing to their ear, with sound waves nearby.</desc>
  <rect width="400" height="300" rx="20" fill="#FFF3E0"/>
  <!-- Character face (close-up) -->
  <g transform="translate(180, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="60" fill="#FFCC80" stroke="#F9A825" stroke-width="2.5"/>
    <!-- Hair -->
    <path d="M-45,-30 Q-30,-60 0,-55 Q30,-60 45,-30" fill="#5D4037" stroke="#4E342E" stroke-width="2"/>
    <!-- Ear (highlighted) -->
    <ellipse cx="-58" cy="0" rx="10" ry="16" fill="#FFCC80" stroke="#FF7043" stroke-width="3"/>
    <ellipse cx="-56" cy="0" rx="5" ry="10" fill="#FFAB91" opacity="0.4"/>
    <!-- Face -->
    <circle cx="-18" cy="-5" r="5" fill="#4E342E"/>
    <circle cx="18" cy="-5" r="5" fill="#4E342E"/>
    <circle cx="-17" cy="-6" r="2" fill="white"/>
    <circle cx="19" cy="-6" r="2" fill="white"/>
    <path d="M-8,18 Q0,24 8,18" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-28" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
    <circle cx="28" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
  </g>
  <!-- Sound waves near ear -->
  <g fill="none" stroke="#FF7043" stroke-width="2" opacity="0.5">
    <path d="M90,130 Q80,140 90,155" stroke-linecap="round"/>
    <path d="M78,125 Q65,145 78,165" stroke-linecap="round"/>
    <path d="M66,120 Q50,145 66,175" stroke-linecap="round"/>
  </g>
  <!-- Arrow -->
  <g fill="none" stroke="#E53935" stroke-width="3">
    <path d="M90,100 Q100,120 108,135" stroke-linecap="round"/>
    <polygon points="105,138 115,138 108,146" fill="#E53935" stroke="none"/>
  </g>
  <text x="60" y="95" font-family="sans-serif" font-size="20" font-weight="bold" fill="#E53935">ear</text>
</svg>
