<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-girl desc-girl">
  <title id="title-girl">Girl - Happy girl with pigtails in a dress</title>
  <desc id="desc-girl">A cheerful girl with brown pigtails tied with ribbons, wearing a pink dress, waving hello in a sunny meadow.</desc>
  <defs>
    <linearGradient id="gl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="gl-dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#gl-bg)"/>
  <circle cx="345" cy="50" r="26" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <rect x="0" y="248" width="400" height="52" fill="#4d7c0f"/>
  <path d="M0,248 Q100,240 200,248 T400,248 L400,258 L0,258 Z" fill="#65a30d"/>
  <!-- flowers -->
  <g>
    <circle cx="70" cy="268" r="8" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <circle cx="330" cy="272" r="8" fill="#facc15" stroke="#b45309" stroke-width="2"/>
  </g>
  <ellipse cx="200" cy="256" rx="95" ry="8" fill="#0f172a" opacity="0.25"/>
  <g filter="url(#soft-shadow)">
    <!-- head -->
    <circle cx="200" cy="110" r="44" fill="#fcd9b6" stroke="#78350f" stroke-width="4"/>
    <!-- hair with fringe -->
    <path d="M156,102 Q158,62 200,63 Q242,62 244,102 Q230,80 200,80 Q170,80 156,102 Z" fill="#78350f"/>
    <!-- pigtails -->
    <ellipse cx="145" cy="125" rx="15" ry="26" fill="#78350f"/>
    <ellipse cx="255" cy="125" rx="15" ry="26" fill="#78350f"/>
    <!-- ribbons -->
    <g fill="#facc15" stroke="#b45309" stroke-width="2">
      <path d="M140,104 L130,94 L142,96 L147,88 L150,100 Z"/>
      <path d="M260,104 L270,94 L258,96 L253,88 L250,100 Z"/>
    </g>
    <!-- face -->
    <circle cx="185" cy="108" r="5.5" fill="#0f172a"/>
    <circle cx="215" cy="108" r="5.5" fill="#0f172a"/>
    <circle cx="183" cy="106" r="2" fill="#fff"/>
    <circle cx="213" cy="106" r="2" fill="#fff"/>
    <path d="M184,126 Q200,138 216,126" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="170" cy="120" rx="8" ry="5" fill="#fb923c" opacity="0.55"/>
    <ellipse cx="230" cy="120" rx="8" ry="5" fill="#fb923c" opacity="0.55"/>
    <!-- dress -->
    <path d="M178,152 L222,152 L245,235 L155,235 Z" fill="url(#gl-dress)" stroke="#9d174d" stroke-width="4"/>
    <!-- dress pocket dots -->
    <circle cx="185" cy="200" r="5" fill="#fdf2f8" opacity="0.8"/>
    <circle cx="215" cy="200" r="5" fill="#fdf2f8" opacity="0.8"/>
    <circle cx="200" cy="178" r="5" fill="#fdf2f8" opacity="0.8"/>
    <!-- waving arm -->
    <path d="M222,162 Q252,140 262,115" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="264" cy="110" r="9" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <!-- other arm -->
    <line x1="178" y1="165" x2="152" y2="192" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="188" y1="235" x2="188" y2="252" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <line x1="212" y1="235" x2="212" y2="252" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- shoes -->
    <ellipse cx="186" cy="256" rx="13" ry="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
    <ellipse cx="214" cy="256" rx="13" ry="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
  </g>
</svg>
