<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-key desc-key">
  <title id="title-key">Key</title>
  <desc id="desc-key">A shiny golden old-fashioned key with a round loop head and toothed end.</desc>
  <defs>
    <linearGradient id="key-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="key-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#key-bg)"/>
  <ellipse cx="200" cy="215" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <g transform="rotate(-25 200 150)">
      <!-- Head loop -->
      <circle cx="90" cy="150" r="46" fill="url(#key-metal)" stroke="#92400e" stroke-width="5"/>
      <circle cx="90" cy="150" r="20" fill="url(#key-bg)" stroke="#92400e" stroke-width="4"/>
      <!-- Shaft -->
      <rect x="130" y="138" width="180" height="24" rx="6" fill="url(#key-metal)" stroke="#92400e" stroke-width="4"/>
      <!-- Teeth -->
      <rect x="270" y="162" width="18" height="26" fill="url(#key-metal)" stroke="#92400e" stroke-width="3.5"/>
      <rect x="296" y="162" width="14" height="20" fill="url(#key-metal)" stroke="#92400e" stroke-width="3.5"/>
      <!-- Highlight -->
      <line x1="140" y1="145" x2="300" y2="145" stroke="#fffbeb" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
</svg>
