<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-banana desc-banana">
  <title id="title-banana">banana</title>
  <desc id="desc-banana">A bright yellow banana with a curved shape.</desc>
  <rect width="400" height="300" rx="20" fill="#F3E5F5"/>
  <g transform="translate(200, 150)">
    <!-- Shadow -->
    <ellipse cx="0" cy="70" rx="60" ry="8" fill="#CE93D8" opacity="0.2"/>
    <!-- Banana body -->
    <path d="M-60,20 Q-70,-30 -30,-55 Q10,-75 50,-50 Q80,-30 70,10 Q65,25 55,20 Q40,-15 10,-35 Q-20,-45 -45,-20 Q-55,-5 -50,20 Z" fill="#FDD835" stroke="#F9A825" stroke-width="2.5"/>
    <!-- Banana tip -->
    <path d="M-60,20 Q-65,30 -55,28 Q-52,22 -50,20" fill="#8D6E63" stroke="#795548" stroke-width="1.5"/>
    <!-- Stem -->
    <path d="M70,10 Q78,5 75,-2" fill="#8D6E63" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
    <!-- Highlight -->
    <path d="M-30,-40 Q0,-55 30,-40" fill="none" stroke="#FFF9C4" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <!-- Spots (ripe) -->
    <circle cx="-10" cy="-20" r="2" fill="#F9A825" opacity="0.4"/>
    <circle cx="20" cy="-30" r="1.5" fill="#F9A825" opacity="0.4"/>
  </g>
</svg>
