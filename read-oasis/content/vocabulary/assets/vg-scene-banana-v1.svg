<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-banana d-banana">
  <title id="t-banana">Banana</title>
  <desc id="d-banana">A single big ripe yellow banana with a brown stem and tip, curved across the centre of the card.</desc>
  <defs>
    <linearGradient id="ban-peel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="ban-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#fef9c3"/>
  <ellipse cx="200" cy="238" rx="150" ry="20" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#ban-sh)">
    <!-- Single clean banana body -->
    <path d="M78 120
             C96 74 150 62 208 76
             C286 96 330 156 336 200
             C338 214 324 220 314 210
             C300 176 262 130 200 116
             C150 106 116 122 108 152
             C104 168 86 166 82 148
             C80 138 78 128 78 120 Z"
          fill="url(#ban-peel)" stroke="#854d0e" stroke-width="5"/>
    <!-- Highlight ridge -->
    <path d="M108 118 C160 104 250 128 306 196" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
    <!-- Stem (top-left) -->
    <path d="M78 122 C68 108 66 92 74 82 L92 88 C88 100 90 112 100 122 Z" fill="#65a30d" stroke="#3f6212" stroke-width="4"/>
    <rect x="70" y="76" width="16" height="16" rx="4" fill="#4d7c0f" stroke="#365314" stroke-width="3"/>
    <!-- Brown tip (bottom-right) -->
    <path d="M314 210 q14 6 18 0 q-2 -10 -12 -14 Z" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  </g>
</svg>
