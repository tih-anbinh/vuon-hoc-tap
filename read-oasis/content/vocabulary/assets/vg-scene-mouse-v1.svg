<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-mouse desc-mouse">
  <title id="title-mouse">Mouse - Small grey mouse</title>
  <desc id="desc-mouse">A small grey mouse with large round ears, a long thin tail, bright eyes, and tiny pink paws, nibbling a piece of cheese.</desc>
  <defs>
    <linearGradient id="mouse-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="40" y1="255" x2="360" y2="255" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="255" rx="80" ry="8" fill="#0f172a" opacity="0.12"/>

  <!-- Cheese wedge (supporting object) -->
  <g id="cheese">
    <path d="M280 230 L320 210 L340 240 L300 255 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M320 210 L340 240 L340 250 L320 220 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <path d="M300 255 L340 240 L340 250 L300 260 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <!-- Cheese holes -->
    <circle cx="300" cy="238" r="4" fill="#d97706"/>
    <circle cx="315" cy="228" r="3" fill="#d97706"/>
    <circle cx="325" cy="242" r="3.5" fill="#b45309"/>
  </g>

  <!-- MOUSE -->
  <g id="mouse-figure" filter="url(#soft-shadow)">
    <!-- Long thin tail (curving) -->
    <path d="M100 200 C60 190 40 160 50 130 C55 115 70 120 65 135 C55 160 75 185 105 195" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>

    <!-- Body (plump, teardrop) -->
    <ellipse cx="190" cy="200" rx="65" ry="42" fill="url(#mouse-fur)" stroke="#475569" stroke-width="3.5"/>

    <!-- Belly -->
    <ellipse cx="195" cy="215" rx="40" ry="22" fill="#e2e8f0"/>

    <!-- Rear leg -->
    <ellipse cx="140" cy="245" rx="16" ry="10" fill="#fecdd3" stroke="#475569" stroke-width="2.5"/>

    <!-- Front paws (reaching toward cheese) -->
    <path d="M245 210 C255 215 265 225 270 230" fill="none" stroke="url(#mouse-fur)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="272" cy="232" r="7" fill="#fecdd3" stroke="#475569" stroke-width="2"/>

    <path d="M240 220 C250 228 260 235 265 240" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="267" cy="242" r="6" fill="#fecdd3" stroke="#475569" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="255" cy="170" rx="35" ry="30" fill="url(#mouse-fur)" stroke="#475569" stroke-width="3.5"/>

    <!-- Snout (pointed) -->
    <ellipse cx="285" cy="180" rx="16" ry="12" fill="#cbd5e1" stroke="#475569" stroke-width="2.5"/>

    <!-- Big round ears -->
    <circle cx="232" cy="145" r="22" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <circle cx="232" cy="145" r="14" fill="#fecdd3"/>

    <circle cx="270" cy="140" r="22" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <circle cx="270" cy="140" r="14" fill="#fecdd3"/>

    <!-- Eyes (bright, alert) -->
    <circle cx="248" cy="168" r="7" fill="#1e293b"/>
    <circle cx="246" cy="165" r="2.5" fill="#ffffff"/>

    <circle cx="268" cy="165" r="6" fill="#1e293b"/>
    <circle cx="266" cy="163" r="2" fill="#ffffff"/>

    <!-- Pink nose -->
    <ellipse cx="298" cy="178" rx="5" ry="4" fill="#f9a8d4" stroke="#e11d48" stroke-width="1.5"/>

    <!-- Whiskers -->
    <line x1="295" y1="175" x2="330" y2="168" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="295" y1="180" x2="332" y2="180" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="295" y1="185" x2="328" y2="192" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="280" y1="172" x2="275" y2="160" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="282" y1="185" x2="278" y2="195" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M290 184 Q295 188 300 184" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>