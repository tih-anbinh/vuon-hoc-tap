<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-fork desc-fork">
  <title id="title-fork">Fork</title>
  <desc id="desc-fork">A shiny silver dining fork with four prongs and a long handle.</desc>
  <defs>
    <linearGradient id="fork-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fork-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#fork-bg)"/>
  <ellipse cx="200" cy="262" rx="70" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Prongs -->
    <rect x="158" y="45" width="9" height="70" rx="4" fill="url(#fork-metal)" stroke="#64748b" stroke-width="2.5"/>
    <rect x="176" y="45" width="9" height="70" rx="4" fill="url(#fork-metal)" stroke="#64748b" stroke-width="2.5"/>
    <rect x="194" y="45" width="9" height="70" rx="4" fill="url(#fork-metal)" stroke="#64748b" stroke-width="2.5"/>
    <rect x="212" y="45" width="9" height="70" rx="4" fill="url(#fork-metal)" stroke="#64748b" stroke-width="2.5"/>
    <!-- Neck/base of prongs -->
    <path d="M155 110 Q190 130 225 110 L218 155 L162 155 Z" fill="url(#fork-metal)" stroke="#64748b" stroke-width="3"/>
    <!-- Handle -->
    <rect x="176" y="150" width="28" height="110" rx="14" fill="url(#fork-metal)" stroke="#64748b" stroke-width="3.5"/>
    <!-- Highlight -->
    <line x1="185" y1="160" x2="185" y2="250" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
