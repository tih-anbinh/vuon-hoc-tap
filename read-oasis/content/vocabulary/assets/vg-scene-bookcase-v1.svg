<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bookcase desc-bookcase">
  <title id="title-bookcase">Bookcase - Tall wooden shelf full of colorful books</title>
  <desc id="desc-bookcase">A tall wooden bookcase with three shelves packed with colorful upright and leaning books, plus a small plant on top.</desc>
  <defs>
    <linearGradient id="bkc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bkc-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2955a"/>
      <stop offset="100%" stop-color="#8a5a24"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bkc-bg)"/>
  <rect x="0" y="265" width="400" height="35" fill="#a16207"/>
  <ellipse cx="200" cy="268" rx="130" ry="8" fill="#0f172a" opacity="0.25"/>
  <g filter="url(#soft-shadow)">
    <!-- case -->
    <rect x="105" y="45" width="190" height="222" rx="6" fill="url(#bkc-wood)" stroke="#451a03" stroke-width="4"/>
    <!-- inner back -->
    <rect x="118" y="58" width="164" height="196" fill="#5c3210"/>
    <!-- shelves -->
    <rect x="112" y="118" width="176" height="8" fill="url(#bkc-wood)" stroke="#451a03" stroke-width="2"/>
    <rect x="112" y="186" width="176" height="8" fill="url(#bkc-wood)" stroke="#451a03" stroke-width="2"/>
    <!-- top shelf books -->
    <g stroke="#0f172a" stroke-width="2">
      <rect x="124" y="70" width="16" height="48" fill="#ef4444"/>
      <rect x="141" y="75" width="14" height="43" fill="#3b82f6"/>
      <rect x="156" y="70" width="16" height="48" fill="#facc15"/>
      <rect x="173" y="78" width="13" height="40" fill="#22c55e"/>
      <rect x="187" y="72" width="15" height="46" fill="#a855f7"/>
      <!-- leaning book -->
      <rect x="212" y="76" width="14" height="44" fill="#fb923c" transform="rotate(12 219 98)"/>
      <rect x="236" y="70" width="16" height="48" fill="#14b8a6"/>
      <rect x="253" y="75" width="14" height="43" fill="#ec4899"/>
    </g>
    <!-- middle shelf books -->
    <g stroke="#0f172a" stroke-width="2">
      <rect x="124" y="140" width="15" height="46" fill="#22c55e"/>
      <rect x="140" y="145" width="14" height="41" fill="#f59e0b"/>
      <rect x="155" y="140" width="16" height="46" fill="#3b82f6"/>
      <!-- stacked horizontal books -->
      <rect x="185" y="170" width="52" height="10" fill="#ef4444"/>
      <rect x="188" y="160" width="46" height="10" fill="#a855f7"/>
      <rect x="191" y="150" width="40" height="10" fill="#facc15"/>
      <rect x="248" y="140" width="15" height="46" fill="#14b8a6"/>
      <rect x="264" y="146" width="13" height="40" fill="#fb923c"/>
    </g>
    <!-- bottom shelf books -->
    <g stroke="#0f172a" stroke-width="2">
      <rect x="124" y="208" width="16" height="46" fill="#ec4899"/>
      <rect x="141" y="213" width="14" height="41" fill="#3b82f6"/>
      <rect x="156" y="208" width="15" height="46" fill="#facc15"/>
      <rect x="172" y="212" width="14" height="42" fill="#ef4444"/>
      <rect x="196" y="212" width="13" height="42" fill="#22c55e" transform="rotate(-10 202 233)"/>
      <rect x="222" y="208" width="16" height="46" fill="#a855f7"/>
      <rect x="239" y="214" width="14" height="40" fill="#fb923c"/>
      <rect x="254" y="208" width="15" height="46" fill="#14b8a6"/>
    </g>
    <!-- plant on top of the case -->
    <path d="M255,26 Q255,14 245,8 M255,26 Q255,12 265,6 M255,26 Q254,16 255,10" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="245" cy="7" rx="7" ry="10" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(-30 245 7)"/>
    <ellipse cx="265" cy="5" rx="7" ry="10" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(30 265 5)"/>
    <ellipse cx="255" cy="10" rx="6" ry="9" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <path d="M242,26 L268,26 L264,45 L246,45 Z" fill="#fb923c" stroke="#9a3412" stroke-width="3"/>
  </g>
</svg>
