<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-festival desc-festival">
  <title id="title-festival">Festival</title>
  <desc id="desc-festival">A festive outdoor scene with colourful bunting flags, balloons, and fireworks in the sky.</desc>
  <defs>
    <linearGradient id="festival-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#festival-bg)"/>

  <!-- Fireworks -->
  <g stroke-width="3" stroke-linecap="round">
    <g stroke="#fde047" fill="#fde047">
      <line x1="90" y1="60" x2="90" y2="35"/>
      <line x1="90" y1="60" x2="110" y2="45"/>
      <line x1="90" y1="60" x2="70" y2="45"/>
      <line x1="90" y1="60" x2="112" y2="65"/>
      <line x1="90" y1="60" x2="68" y2="65"/>
      <line x1="90" y1="60" x2="105" y2="82"/>
      <line x1="90" y1="60" x2="75" y2="82"/>
      <circle cx="90" cy="60" r="4"/>
    </g>
    <g stroke="#f472b6" fill="#f472b6">
      <line x1="315" y1="80" x2="315" y2="58"/>
      <line x1="315" y1="80" x2="333" y2="66"/>
      <line x1="315" y1="80" x2="297" y2="66"/>
      <line x1="315" y1="80" x2="335" y2="88"/>
      <line x1="315" y1="80" x2="295" y2="88"/>
      <line x1="315" y1="80" x2="325" y2="100"/>
      <line x1="315" y1="80" x2="305" y2="100"/>
      <circle cx="315" cy="80" r="4"/>
    </g>
  </g>

  <!-- Bunting flags -->
  <path d="M20 120 Q200 150 380 120" fill="none" stroke="#fef3c7" stroke-width="2.5"/>
  <g stroke="#1e293b" stroke-width="1.5">
    <path d="M40 124 L64 124 L52 148 Z" fill="#ef4444"/>
    <path d="M80 128 L104 128 L92 152 Z" fill="#3b82f6"/>
    <path d="M120 131 L144 131 L132 155 Z" fill="#22c55e"/>
    <path d="M160 133 L184 133 L172 157 Z" fill="#f59e0b"/>
    <path d="M216 133 L240 133 L228 157 Z" fill="#ef4444"/>
    <path d="M256 131 L280 131 L268 155 Z" fill="#3b82f6"/>
    <path d="M296 128 L320 128 L308 152 Z" fill="#22c55e"/>
    <path d="M336 124 L360 124 L348 148 Z" fill="#f59e0b"/>
  </g>

  <!-- Balloons -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="120" cy="220" rx="26" ry="32" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <line x1="120" y1="252" x2="122" y2="290" stroke="#fef3c7" stroke-width="2"/>
    <ellipse cx="200" cy="205" rx="28" ry="35" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <line x1="200" y1="240" x2="200" y2="290" stroke="#fef3c7" stroke-width="2"/>
    <ellipse cx="280" cy="220" rx="26" ry="32" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <line x1="280" y1="252" x2="278" y2="290" stroke="#fef3c7" stroke-width="2"/>
  </g>
</svg>
