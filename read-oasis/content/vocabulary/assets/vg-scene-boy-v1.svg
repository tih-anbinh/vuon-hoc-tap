<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-boy desc-boy">
  <title id="title-boy">Boy</title>
  <desc id="desc-boy">A happy young boy with short hair, a blue T-shirt, and shorts, standing and waving.</desc>
  <defs>
    <linearGradient id="boy-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="boy-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#boy-bg)"/>
  <ellipse cx="200" cy="275" rx="90" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Legs -->
    <rect x="178" y="220" width="18" height="52" rx="8" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="3"/>
    <rect x="204" y="220" width="18" height="52" rx="8" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="3"/>
    <ellipse cx="185" cy="274" rx="16" ry="8" fill="#ef4444" stroke="#1e293b" stroke-width="2.5"/>
    <ellipse cx="215" cy="274" rx="16" ry="8" fill="#ef4444" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Shorts -->
    <rect x="172" y="195" width="56" height="35" rx="8" fill="#1e40af" stroke="#1e293b" stroke-width="3"/>
    <!-- Body / T-shirt -->
    <path d="M170 140 Q200 128 230 140 L228 200 L172 200 Z" fill="#3b82f6" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Arms -->
    <path d="M172 148 Q150 165 150 195" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round"/>
    <path d="M228 148 Q255 130 262 105" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round"/>
    <circle cx="150" cy="198" r="9" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="2.5"/>
    <circle cx="264" cy="100" r="10" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="200" cy="100" r="42" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="3.5"/>
    <!-- Hair -->
    <path d="M160 92 Q160 55 200 55 Q240 55 240 92 Q225 72 200 72 Q175 72 160 92 Z" fill="#5c3310" stroke="#3d2109" stroke-width="2.5"/>
    <!-- Ears -->
    <circle cx="160" cy="102" r="8" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="2"/>
    <circle cx="240" cy="102" r="8" fill="url(#boy-skin)" stroke="#d4a574" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="185" cy="98" r="6" fill="#1e293b"/>
    <circle cx="215" cy="98" r="6" fill="#1e293b"/>
    <circle cx="187" cy="96" r="2" fill="#ffffff"/>
    <circle cx="217" cy="96" r="2" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M182 118 Q200 132 218 118" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="172" cy="112" rx="8" ry="5" fill="#fca5a5" opacity="0.4"/>
    <ellipse cx="228" cy="112" rx="8" ry="5" fill="#fca5a5" opacity="0.4"/>
  </g>
</svg>
