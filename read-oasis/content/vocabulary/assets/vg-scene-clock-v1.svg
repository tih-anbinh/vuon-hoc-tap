<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-clock desc-clock">
  <title id="title-clock">Clock - Round wall clock</title>
  <desc id="desc-clock">A friendly round wall clock with numbered hour marks and hour and minute hands showing 10 past 10.</desc>
  <defs>
    <linearGradient id="clock-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="clock-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="60" y1="270" x2="340" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="100" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="clock-figure" filter="url(#soft-shadow)">
    <!-- Outer rim -->
    <circle cx="200" cy="150" r="110" fill="url(#clock-rim)" stroke="#1e3a8a" stroke-width="3.5"/>
    <!-- Inner face -->
    <circle cx="200" cy="150" r="95" fill="url(#clock-face)" stroke="#1e3a8a" stroke-width="2.5"/>
    <!-- Hour mark dots (12, 3, 6, 9 bigger) -->
    <circle cx="200" cy="65" r="6" fill="#1e3a8a"/>
    <circle cx="285" cy="150" r="6" fill="#1e3a8a"/>
    <circle cx="200" cy="235" r="6" fill="#1e3a8a"/>
    <circle cx="115" cy="150" r="6" fill="#1e3a8a"/>
    <!-- Smaller hour marks -->
    <circle cx="242" cy="76" r="3.5" fill="#1e3a8a"/>
    <circle cx="274" cy="108" r="3.5" fill="#1e3a8a"/>
    <circle cx="274" cy="192" r="3.5" fill="#1e3a8a"/>
    <circle cx="242" cy="224" r="3.5" fill="#1e3a8a"/>
    <circle cx="158" cy="224" r="3.5" fill="#1e3a8a"/>
    <circle cx="126" cy="192" r="3.5" fill="#1e3a8a"/>
    <circle cx="126" cy="108" r="3.5" fill="#1e3a8a"/>
    <circle cx="158" cy="76" r="3.5" fill="#1e3a8a"/>
    <!-- Number 12 (using shape as it's a numeral - use lines to form 12) -->
    <!-- Since text is disallowed, use decorative shapes as hour indicators only -->
    <!-- Inner decorative ring -->
    <circle cx="200" cy="150" r="80" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
    <!-- Hour hand (pointing to 10) -->
    <line x1="200" y1="150" x2="153" y2="118" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
    <!-- Minute hand (pointing to 2 = 10 min) -->
    <line x1="200" y1="150" x2="255" y2="115" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <!-- Second hand -->
    <line x1="200" y1="150" x2="210" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Center cap -->
    <circle cx="200" cy="150" r="10" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
    <circle cx="200" cy="150" r="4" fill="#dc2626"/>
    <!-- Clock hook (top) -->
    <path d="M200 40 Q200 30 208 30 Q216 30 216 40" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <!-- Face highlight -->
    <ellipse cx="170" cy="105" rx="30" ry="20" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>