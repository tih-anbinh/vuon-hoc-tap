<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-giraffe desc-giraffe">
  <title id="title-giraffe">Giraffe - Tall friendly giraffe</title>
  <desc id="desc-giraffe">A tall yellow giraffe with brown patches, a very long neck, two small horns, and a gentle smiling face.</desc>
  <defs>
    <linearGradient id="giraffe-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="40" y1="275" x2="360" y2="275" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Shadow -->
  <ellipse cx="220" cy="275" rx="80" ry="8" fill="#0f172a" opacity="0.12"/>

  <!-- Small grass tufts -->
  <path d="M80 275 C82 268 86 268 88 275" fill="#86efac" stroke="none"/>
  <path d="M320 275 C322 268 326 268 328 275" fill="#86efac" stroke="none"/>

  <!-- GIRAFFE -->
  <g id="giraffe-figure" filter="url(#soft-shadow)">
    <!-- Tail -->
    <path d="M155 155 C140 165 130 185 135 200" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="135" cy="204" rx="4" ry="7" fill="#92400e"/>

    <!-- Rear legs -->
    <rect x="175" y="195" width="18" height="75" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    <rect x="175" y="262" width="18" height="10" rx="4" fill="#78350f"/>

    <rect x="200" y="195" width="16" height="75" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <rect x="200" y="262" width="16" height="10" rx="4" fill="#78350f"/>

    <!-- Front legs -->
    <rect x="250" y="195" width="18" height="75" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    <rect x="250" y="262" width="18" height="10" rx="4" fill="#78350f"/>

    <rect x="275" y="195" width="16" height="75" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <rect x="275" y="262" width="16" height="10" rx="4" fill="#78350f"/>

    <!-- Body -->
    <ellipse cx="235" cy="175" rx="65" ry="40" fill="url(#giraffe-body)" stroke="#92400e" stroke-width="3.5"/>

    <!-- Body patches -->
    <ellipse cx="210" cy="165" rx="12" ry="10" fill="#92400e" opacity="0.6"/>
    <ellipse cx="240" cy="155" rx="10" ry="8" fill="#92400e" opacity="0.6"/>
    <ellipse cx="260" cy="170" rx="11" ry="9" fill="#92400e" opacity="0.6"/>
    <ellipse cx="225" cy="185" rx="9" ry="7" fill="#92400e" opacity="0.6"/>
    <ellipse cx="250" cy="190" rx="8" ry="6" fill="#92400e" opacity="0.5"/>

    <!-- Long Neck -->
    <path d="M275 155 C280 130 285 90 280 55" fill="none" stroke="url(#giraffe-body)" stroke-width="30" stroke-linecap="round"/>
    <path d="M275 155 C280 130 285 90 280 55" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck patches -->
    <ellipse cx="278" cy="130" rx="8" ry="7" fill="#92400e" opacity="0.6"/>
    <ellipse cx="282" cy="105" rx="7" ry="6" fill="#92400e" opacity="0.6"/>
    <ellipse cx="280" cy="80" rx="8" ry="6" fill="#92400e" opacity="0.6"/>

    <!-- Mane (short dark line along neck) -->
    <path d="M268 140 L265 120 L267 100 L265 80 L268 60" fill="none" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="280" cy="42" rx="22" ry="18" fill="url(#giraffe-body)" stroke="#92400e" stroke-width="3"/>

    <!-- Horns (ossicones) -->
    <line x1="272" y1="28" x2="270" y2="14" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="270" cy="12" r="4" fill="#78350f"/>

    <line x1="290" y1="28" x2="292" y2="14" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="292" cy="12" r="4" fill="#78350f"/>

    <!-- Ears -->
    <ellipse cx="262" cy="32" rx="8" ry="5" fill="#f59e0b" stroke="#92400e" stroke-width="2" transform="rotate(-20 262 32)"/>
    <ellipse cx="300" cy="32" rx="8" ry="5" fill="#f59e0b" stroke="#92400e" stroke-width="2" transform="rotate(20 300 32)"/>

    <!-- Eyes -->
    <circle cx="273" cy="40" r="5" fill="#1e293b"/>
    <circle cx="271" cy="38" r="2" fill="#ffffff"/>

    <circle cx="289" cy="40" r="5" fill="#1e293b"/>
    <circle cx="287" cy="38" r="2" fill="#ffffff"/>

    <!-- Eyelashes -->
    <path d="M268 36 L265 33" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M294 36 L297 33" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nostrils -->
    <circle cx="277" cy="48" r="2" fill="#92400e"/>
    <circle cx="284" cy="48" r="2" fill="#92400e"/>

    <!-- Smile -->
    <path d="M274 52 Q280 58 286 52" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>