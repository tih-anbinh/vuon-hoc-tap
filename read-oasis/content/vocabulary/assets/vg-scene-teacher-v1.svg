<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-teacher desc-teacher">
  <title id="title-teacher">Teacher - Teacher at the board with pointer</title>
  <desc id="desc-teacher">A friendly teacher standing at a green chalkboard holding a pointer stick and a book, teaching shapes drawn on the board to pupils at a desk.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#tc-bg)"/>
  <!-- floor -->
  <rect x="0" y="250" width="400" height="50" fill="#e8b478"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#a16207" stroke-width="3.5"/>
  <!-- chalkboard -->
  <g filter="url(#soft-shadow)">
    <rect x="26" y="34" width="220" height="140" rx="8" fill="#166534" stroke="#78350f" stroke-width="6"/>
    <!-- board drawings: shapes and sums -->
    <g stroke="#f8fafc" stroke-width="3.5" fill="none">
      <circle cx="72" cy="80" r="20"/>
      <rect x="112" y="60" width="40" height="40"/>
      <path d="M180,100 L200,60 L220,100 Z"/>
    </g>
    <!-- chalk squiggle lines -->
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="52" y1="128" x2="130" y2="128"/>
      <line x1="52" y1="148" x2="110" y2="148"/>
    </g>
    <!-- chalk tray -->
    <rect x="40" y="174" width="190" height="10" rx="3" fill="#92400e" stroke="#78350f" stroke-width="2.5"/>
    <rect x="60" y="169" width="24" height="6" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <!-- teacher -->
  <g filter="url(#soft-shadow)">
    <!-- hair bun -->
    <circle cx="300" cy="62" r="13" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <path d="M270,102 Q268,64 300,62 Q332,64 330,102 L324,110 Q300,88 276,110 Z" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- head -->
    <circle cx="300" cy="108" r="28" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <!-- glasses -->
    <circle cx="290" cy="104" r="9" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="312" cy="104" r="9" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="299" y1="104" x2="303" y2="104" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="290" cy="104" r="3" fill="#0f172a"/>
    <circle cx="312" cy="104" r="3" fill="#0f172a"/>
    <!-- warm smile -->
    <path d="M290,122 Q300,130 310,122" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- blouse/dress -->
    <path d="M280,134 L320,134 L336,240 L264,240 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3.5"/>
    <!-- collar -->
    <path d="M288,134 L300,146 L312,134" fill="none" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- arm with pointer toward board -->
    <path d="M282,148 Q252,140 234,124" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <line x1="234" y1="124" x2="180" y2="86" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <!-- arm holding book -->
    <path d="M318,148 Q340,158 344,176" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <rect x="330" y="172" width="40" height="30" rx="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" transform="rotate(-10 350 187)"/>
    <line x1="336" y1="192" x2="366" y2="186" stroke="#fecaca" stroke-width="3"/>
    <!-- legs -->
    <line x1="288" y1="240" x2="286" y2="268" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <line x1="312" y1="240" x2="314" y2="268" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="284" cy="273" rx="12" ry="6" fill="#4c1d95"/>
    <ellipse cx="316" cy="273" rx="12" ry="6" fill="#4c1d95"/>
  </g>
  <!-- pupil at small desk -->
  <g filter="url(#soft-shadow)">
    <rect x="48" y="228" width="100" height="12" rx="4" fill="#d6a05c" stroke="#92400e" stroke-width="3"/>
    <rect x="56" y="240" width="10" height="34" fill="#92400e" stroke="#78350f" stroke-width="2.5"/>
    <rect x="130" y="240" width="10" height="34" fill="#92400e" stroke="#78350f" stroke-width="2.5"/>
    <!-- pupil -->
    <circle cx="98" cy="204" r="15" fill="#f5c19b" stroke="#78350f" stroke-width="3"/>
    <path d="M84,198 Q90,187 106,190 L111,200 Q100,192 86,202 Z" fill="#0f172a"/>
    <circle cx="93" cy="203" r="2.2" fill="#0f172a"/>
    <circle cx="103" cy="203" r="2.2" fill="#0f172a"/>
    <path d="M93,211 Q98,214 103,211" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M86,219 L110,219 L113,228 L83,228 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
    <!-- open book on desk -->
    <path d="M70,228 L96,222 L96,228 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
