<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-lemon d-lemon">
  <title id="t-lemon">Lemon</title>
  <desc id="d-lemon">A bright yellow lemon with pointed tips and a green leaf, next to a cut lemon half showing juicy segments.</desc>
  <defs>
    <radialGradient id="lm-body" cx="40%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="lm-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#fefce8"/>
  <ellipse cx="200" cy="252" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <!-- Cut half (right, behind) -->
  <g filter="url(#lm-sh)" stroke="#ca8a04" stroke-width="4">
    <circle cx="296" cy="178" r="54" fill="#fef9c3"/>
    <circle cx="296" cy="178" r="54" fill="none" stroke="#facc15" stroke-width="8"/>
    <g stroke="#eab308" stroke-width="3" fill="#fef08a">
      <path d="M296 178 L296 128 A50 50 0 0 1 332 148 Z"/>
      <path d="M296 178 L332 148 A50 50 0 0 1 344 190 Z"/>
      <path d="M296 178 L344 190 A50 50 0 0 1 318 222 Z"/>
      <path d="M296 178 L318 222 A50 50 0 0 1 276 224 Z"/>
      <path d="M296 178 L276 224 A50 50 0 0 1 250 190 Z"/>
      <path d="M296 178 L250 190 A50 50 0 0 1 260 148 Z"/>
      <path d="M296 178 L260 148 A50 50 0 0 1 296 128 Z"/>
    </g>
    <circle cx="296" cy="178" r="6" fill="#fde047"/>
  </g>

  <!-- Whole lemon (left, front) -->
  <g filter="url(#lm-sh)" stroke="#a16207" stroke-width="5">
    <path d="M96 158
             C96 122 132 110 168 118
             C210 128 224 158 224 182
             C224 214 190 230 156 226
             C112 220 96 190 96 158 Z" fill="url(#lm-body)"/>
    <!-- pointed tips -->
    <path d="M96 158 q-14 0 -18 8 q14 4 20 2 Z" fill="url(#lm-body)"/>
    <path d="M222 176 q14 -2 20 6 q-14 6 -22 2 Z" fill="url(#lm-body)"/>
    <!-- highlight -->
    <ellipse cx="128" cy="146" rx="18" ry="12" fill="#fef9c3" opacity="0.7" stroke="none" transform="rotate(-24 128 146)"/>
  </g>
  <!-- leaf -->
  <path d="M150 110 Q182 78 220 92 Q192 118 154 120 Z" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
  <path d="M158 114 Q188 104 214 94" fill="none" stroke="#15803d" stroke-width="3"/>
</svg>
