<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sofa desc-sofa">
  <title id="title-sofa">Sofa - Big comfy sofa with cushions</title>
  <desc id="desc-sofa">A large green three-seat sofa with soft cushions and round armrests in a cozy living room, with a cat sleeping on one cushion.</desc>
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="sf-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#sf-bg)"/>
  <!-- wall detail: picture -->
  <rect x="60" y="35" width="60" height="46" rx="4" fill="#ffffff" stroke="#92400e" stroke-width="4"/>
  <circle cx="90" cy="58" r="12" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
  <path d="M64,76 L82,62 L98,76 Z" fill="#22c55e"/>
  <!-- window -->
  <rect x="290" y="30" width="80" height="70" rx="5" fill="#bae6fd" stroke="#78350f" stroke-width="4"/>
  <line x1="330" y1="30" x2="330" y2="100" stroke="#78350f" stroke-width="3"/>
  <line x1="290" y1="65" x2="370" y2="65" stroke="#78350f" stroke-width="3"/>
  <!-- floor -->
  <rect x="0" y="240" width="400" height="60" fill="#e8b478"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#a16207" stroke-width="3.5"/>
  <ellipse cx="200" cy="262" rx="170" ry="14" fill="#0f172a" opacity="0.2"/>
  <!-- sofa (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- backrest -->
    <rect x="60" y="105" width="280" height="95" rx="18" fill="url(#sf-body)" stroke="#14532d" stroke-width="4.5"/>
    <!-- back cushion seams -->
    <line x1="153" y1="112" x2="153" y2="195" stroke="#14532d" stroke-width="3" opacity="0.7"/>
    <line x1="247" y1="112" x2="247" y2="195" stroke="#14532d" stroke-width="3" opacity="0.7"/>
    <!-- seat base -->
    <rect x="52" y="185" width="296" height="58" rx="14" fill="#22c55e" stroke="#14532d" stroke-width="4.5"/>
    <!-- seat cushions -->
    <rect x="66" y="178" width="86" height="34" rx="12" fill="#4ade80" stroke="#14532d" stroke-width="3.5"/>
    <rect x="158" y="178" width="86" height="34" rx="12" fill="#4ade80" stroke="#14532d" stroke-width="3.5"/>
    <rect x="250" y="178" width="86" height="34" rx="12" fill="#4ade80" stroke="#14532d" stroke-width="3.5"/>
    <!-- armrests -->
    <rect x="28" y="140" width="48" height="103" rx="22" fill="#16a34a" stroke="#14532d" stroke-width="4.5"/>
    <rect x="324" y="140" width="48" height="103" rx="22" fill="#16a34a" stroke="#14532d" stroke-width="4.5"/>
    <!-- throw pillow -->
    <rect x="78" y="130" width="52" height="52" rx="10" fill="#f472b6" stroke="#be185d" stroke-width="3.5" transform="rotate(-8 104 156)"/>
    <!-- legs -->
    <rect x="58" y="243" width="14" height="16" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
    <rect x="328" y="243" width="14" height="16" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
  </g>
  <!-- sleeping cat on cushion -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="285" cy="168" rx="36" ry="20" fill="#f59e0b" stroke="#92400e" stroke-width="3.5"/>
    <circle cx="315" cy="158" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="3.5"/>
    <path d="M304,148 L306,136 L314,146 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    <path d="M318,145 L324,134 L328,146 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    <path d="M308,158 Q312,161 316,158" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <path d="M306,154 L310,155 M318,155 L322,154" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <path d="M252,175 Q238,182 244,192" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
    <!-- zzz -->
    <g stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M338,128 L348,128 L338,138 L348,138"/>
      <path d="M352,112 L360,112 L352,120 L360,120"/>
    </g>
  </g>
</svg>
