<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-player d-player">
  <title id="t-player">Player</title>
  <desc id="d-player">A soccer player standing proudly in a striped jersey with a number, resting one foot on top of a soccer ball on the grass.</desc>
  <defs>
    <linearGradient id="ply-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="ply-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#ply-bg)"/>
  <ellipse cx="200" cy="278" rx="140" ry="12" fill="#0f172a" opacity="0.12"/>

  <!-- Player standing (facing front) -->
  <g filter="url(#ply-sh)" stroke="#0f172a" stroke-width="4">
    <!-- head -->
    <circle cx="180" cy="76" r="30" fill="#fcc79a"/>
    <path d="M150 72 C154 42 206 42 210 72 C198 54 162 54 150 72 Z" fill="#78350f"/>
    <circle cx="170" cy="76" r="4.5" fill="#0f172a"/>
    <circle cx="190" cy="76" r="4.5" fill="#0f172a"/>
    <path d="M170 90 Q180 98 190 90" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="162" cy="86" r="6" fill="#fb7185" opacity="0.35"/>
    <!-- striped jersey with number -->
    <path d="M148 116 Q180 104 212 116 L216 188 Q180 198 144 188 Z" fill="#ef4444"/>
    <g fill="#fff">
      <path d="M158 112 L166 112 L172 192 L162 194 Z"/>
      <path d="M186 110 L194 110 L200 192 L190 194 Z"/>
    </g>
    <!-- number badge -->
    <circle cx="180" cy="150" r="17" fill="#fff" stroke="#0f172a" stroke-width="3"/>
    <path d="M176 140 L184 140 L184 160 M180 140 L180 160" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M150 124 Q120 140 116 172" fill="none" stroke="#fcc79a" stroke-width="13" stroke-linecap="round"/>
    <path d="M210 124 Q240 140 244 172" fill="none" stroke="#fcc79a" stroke-width="13" stroke-linecap="round"/>
    <!-- shorts -->
    <path d="M148 186 L212 186 L216 214 L184 210 L182 214 L144 214 Z" fill="#1d4ed8"/>
    <!-- standing leg -->
    <path d="M164 214 L160 256" stroke="#fcc79a" stroke-width="14" stroke-linecap="round"/>
    <rect x="146" y="252" width="34" height="16" rx="6" fill="#0f172a" stroke="none"/>
    <!-- foot-on-ball leg -->
    <path d="M198 214 Q214 236 232 240" stroke="#fcc79a" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Soccer ball under the foot -->
  <g filter="url(#ply-sh)">
    <circle cx="248" cy="252" r="30" fill="#fff" stroke="#0f172a" stroke-width="4"/>
    <path d="M248 234 l12 9 -4 15 -16 0 -4 -15 Z" fill="#0f172a"/>
    <path d="M248 234 l0 -12 M260 243 l12 -5 M244 258 l-11 7 M252 258 l11 7 M236 243 l-12 -5" stroke="#0f172a" stroke-width="3"/>
  </g>
  <!-- boot resting on ball -->
  <rect x="228" y="234" width="34" height="14" rx="6" fill="#0f172a" transform="rotate(-8 245 241)"/>
</svg>
