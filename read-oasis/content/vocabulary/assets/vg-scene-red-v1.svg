<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-red desc-red">
  <title id="title-red">red</title>
  <desc id="desc-red">A collection of red things: a red apple, a red heart, and a red flower.</desc>
  <rect width="400" height="300" rx="20" fill="#FFEBEE"/>
  <!-- Red apple -->
  <g transform="translate(100, 130)">
    <path d="M0,-30 Q-30,-28 -30,5 Q-30,30 0,35 Q30,30 30,5 Q30,-28 0,-30" fill="#EF5350" stroke="#D32F2F" stroke-width="2"/>
    <path d="M0,-30 Q-2,-40 3,-42" fill="none" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
    <path d="M3,-40 Q12,-45 15,-38" fill="#66BB6A" stroke="#43A047" stroke-width="1"/>
    <circle cx="-10" cy="-10" r="4" fill="white" opacity="0.2"/>
  </g>
  <!-- Red heart -->
  <g transform="translate(200, 120)">
    <path d="M0,30 Q-35,10 -30,-10 Q-28,-25 -15,-25 Q-5,-25 0,-15 Q5,-25 15,-25 Q28,-25 30,-10 Q35,10 0,30" fill="#EF5350" stroke="#D32F2F" stroke-width="2"/>
    <circle cx="-10" cy="-10" r="5" fill="white" opacity="0.2"/>
  </g>
  <!-- Red flower -->
  <g transform="translate(300, 140)">
    <line x1="0" y1="15" x2="0" y2="50" stroke="#66BB6A" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#EF5350"/>
    <circle cx="-12" cy="-8" r="10" fill="#E53935"/>
    <circle cx="12" cy="-8" r="10" fill="#E53935"/>
    <circle cx="-12" cy="8" r="10" fill="#EF5350"/>
    <circle cx="12" cy="8" r="10" fill="#EF5350"/>
    <circle cx="0" cy="0" r="6" fill="#FDD835"/>
  </g>
  <!-- Label -->
  <text x="200" y="230" font-family="sans-serif" font-size="32" font-weight="bold" fill="#D32F2F" text-anchor="middle">red</text>
</svg>
