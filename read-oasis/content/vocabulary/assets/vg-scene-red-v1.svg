<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-red desc-red">
  <title id="title-red">Red - Vibrant red paint splash</title>
  <desc id="desc-red">A large glossy crimson red paint splash with flying droplets created by an artist paintbrush dipped in rich red paint, occupying the center of the frame.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7f1d1d" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="270" x2="370" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- TARGET OBJECT: RED PAINT SPLAT & BRUSH (Occupying 75% canvas) -->
  <g id="red-figure" filter="url(#soft-shadow)">
    <!-- Giant Vibrant Red Paint Splash (The primary focus) -->
    <path d="M190 70
             C240 60 270 90 290 120
             C315 150 330 180 305 215
             C285 245 250 255 200 255
             C145 255 105 240 85 205
             C65 170 85 130 115 100
             C145 70 160 75 190 70 Z"
          fill="url(#red-grad)" stroke="#991b1b" stroke-width="4.5"/>

    <!-- Dynamic Splash Droplets & Blobs around the main splat -->
    <circle cx="325" cy="115" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <circle cx="345" cy="155" r="9" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
    <circle cx="320" cy="245" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
    <circle cx="75" cy="225" r="12" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <circle cx="65" cy="140" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
    <circle cx="105" cy="70" r="13" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>

    <!-- Glossy Highlights on Red Paint Splash -->
    <path d="M135 110 C165 85 210 82 245 95 C220 102 175 102 145 125 Z" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="120" cy="145" rx="10" ry="25" fill="#ffffff" opacity="0.35" transform="rotate(-25 120 145)"/>
    <circle cx="280" cy="195" r="8" fill="#ffffff" opacity="0.4"/>
    <circle cx="103" cy="67" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="322" cy="111" r="3.5" fill="#ffffff" opacity="0.6"/>

    <!-- Artist Paintbrush Dipping into the Red Paint -->
    <g id="paint-brush" transform="translate(260, 40) rotate(35)">
      <!-- Long Wooden Handle -->
      <path d="M-12 -120 L12 -120 L8 0 L-8 0 Z" fill="#d97706" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
      <line x1="0" y1="-115" x2="0" y2="-5" stroke="#fef3c7" stroke-width="2" opacity="0.5"/>
      <!-- Metallic Ferrule -->
      <rect x="-9" y="0" width="18" height="22" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <line x1="-9" y1="11" x2="9" y2="11" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Brush Bristles Coated in Red Paint -->
      <path d="M-9 22 C-9 42 0 52 0 52 C0 52 9 42 9 22 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2.5"/>
      <!-- Dripping paint drop from brush -->
      <circle cx="0" cy="62" r="5" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    </g>
  </g>
</svg>