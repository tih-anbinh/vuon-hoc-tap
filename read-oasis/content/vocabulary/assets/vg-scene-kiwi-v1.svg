<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-kiwi desc-kiwi">
  <title id="title-kiwi">Kiwi - Kiwi fruit whole and cut in half</title>
  <desc id="desc-kiwi">A brown fuzzy whole kiwi fruit next to a cut half showing bright green flesh, a pale center and a ring of small black seeds.</desc>
  <defs>
    <linearGradient id="kw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="kw-flesh" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="30%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </radialGradient>
    <radialGradient id="kw-skin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#kw-bg)"/>
  <!-- table -->
  <rect x="0" y="230" width="400" height="70" fill="#e8b478"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#a16207" stroke-width="3.5"/>
  <ellipse cx="200" cy="240" rx="160" ry="12" fill="#0f172a" opacity="0.2"/>
  <!-- whole kiwi -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="115" cy="175" rx="72" ry="62" fill="url(#kw-skin)" stroke="#451a03" stroke-width="4"/>
    <!-- fuzz -->
    <g stroke="#854d0e" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="52" y1="140" x2="46" y2="134"/>
      <line x1="70" y1="120" x2="65" y2="112"/>
      <line x1="100" y1="112" x2="98" y2="103"/>
      <line x1="135" y1="114" x2="139" y2="106"/>
      <line x1="163" y1="130" x2="170" y2="124"/>
      <line x1="182" y1="160" x2="190" y2="156"/>
      <line x1="180" y1="195" x2="188" y2="199"/>
      <line x1="160" y1="222" x2="166" y2="229"/>
      <line x1="55" y1="205" x2="47" y2="210"/>
      <line x1="45" y1="172" x2="36" y2="172"/>
    </g>
    <ellipse cx="90" cy="150" rx="20" ry="13" fill="#ca8a04" opacity="0.5"/>
  </g>
  <!-- half kiwi -->
  <g filter="url(#soft-shadow)">
    <circle cx="285" cy="165" r="75" fill="url(#kw-skin)" stroke="#451a03" stroke-width="4"/>
    <circle cx="285" cy="165" r="66" fill="url(#kw-flesh)" stroke="#4d7c0f" stroke-width="3"/>
    <!-- pale center -->
    <ellipse cx="285" cy="165" rx="20" ry="24" fill="#fef9c3" stroke="#a3e635" stroke-width="2.5"/>
    <!-- radiating lines -->
    <g stroke="#d9f99d" stroke-width="2.5" opacity="0.9">
      <line x1="285" y1="141" x2="285" y2="105"/>
      <line x1="285" y1="189" x2="285" y2="225"/>
      <line x1="265" y1="165" x2="225" y2="165"/>
      <line x1="305" y1="165" x2="345" y2="165"/>
      <line x1="271" y1="148" x2="245" y2="122"/>
      <line x1="299" y1="148" x2="325" y2="122"/>
      <line x1="271" y1="182" x2="245" y2="208"/>
      <line x1="299" y1="182" x2="325" y2="208"/>
    </g>
    <!-- seeds ring -->
    <g fill="#0f172a">
      <ellipse cx="285" cy="130" rx="3" ry="5"/>
      <ellipse cx="285" cy="200" rx="3" ry="5"/>
      <ellipse cx="250" cy="165" rx="5" ry="3"/>
      <ellipse cx="320" cy="165" rx="5" ry="3"/>
      <ellipse cx="260" cy="140" rx="4" ry="4" transform="rotate(45 260 140)"/>
      <ellipse cx="310" cy="140" rx="4" ry="4" transform="rotate(-45 310 140)"/>
      <ellipse cx="260" cy="190" rx="4" ry="4" transform="rotate(-45 260 190)"/>
      <ellipse cx="310" cy="190" rx="4" ry="4" transform="rotate(45 310 190)"/>
      <ellipse cx="270" cy="128" rx="3" ry="4"/>
      <ellipse cx="300" cy="128" rx="3" ry="4"/>
      <ellipse cx="270" cy="202" rx="3" ry="4"/>
      <ellipse cx="300" cy="202" rx="3" ry="4"/>
    </g>
  </g>
</svg>
