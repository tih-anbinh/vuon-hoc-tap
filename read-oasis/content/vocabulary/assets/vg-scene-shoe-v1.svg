<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shoe desc-shoe">
  <title id="title-shoe">Shoe - Sneaker</title>
  <desc id="desc-shoe">A colourful red sneaker with white laces and a rubber sole, seen from the side.</desc>
  <defs>
    <linearGradient id="shoe-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="40" y1="265" x2="360" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="130" ry="8" fill="#0f172a" opacity="0.1"/>
  <g id="shoe-figure" filter="url(#soft-shadow)">
    <!-- Sole -->
    <path d="M60 230 Q55 250 70 255 L330 255 Q350 250 345 230 L60 230 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="3"/>
    <!-- Sole tread -->
    <line x1="100" y1="250" x2="100" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <line x1="140" y1="250" x2="140" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <line x1="180" y1="250" x2="180" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <line x1="220" y1="250" x2="220" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <line x1="260" y1="250" x2="260" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <line x1="300" y1="250" x2="300" y2="255" stroke="#d6d3d1" stroke-width="3"/>
    <!-- Midsole -->
    <path d="M60 220 L60 230 L345 230 L345 220 Q300 215 60 220 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2"/>
    <!-- Shoe body -->
    <path d="M80 220 L80 140 Q80 100 120 90 L200 80 Q240 85 260 100 L280 120 Q350 180 345 220 Z" fill="url(#shoe-red)" stroke="#b91c1c" stroke-width="3.5"/>
    <!-- Toe cap -->
    <path d="M300 180 Q340 190 345 220 L280 220 Q290 195 300 180 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2.5"/>
    <!-- Heel counter -->
    <path d="M80 140 L80 220 L120 220 L120 140 Q100 135 80 140 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
    <!-- Tongue -->
    <path d="M180 90 Q200 60 220 90" fill="#fca5a5" stroke="#b91c1c" stroke-width="2.5"/>
    <!-- Eyelet row and laces -->
    <circle cx="155" cy="110" r="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"/>
    <circle cx="185" cy="105" r="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"/>
    <circle cx="215" cy="105" r="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"/>
    <circle cx="245" cy="110" r="4" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"/>
    <!-- Laces -->
    <path d="M155 110 L185 105 L215 105 L245 110" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M155 110 L215 105" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M185 105 L245 110" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Lace bow -->
    <ellipse cx="200" cy="85" rx="12" ry="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <ellipse cx="215" cy="82" rx="10" ry="5" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <!-- Nike-style swoosh decoration -->
    <path d="M100 190 Q180 150 280 170" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Heel tab -->
    <rect x="82" y="130" width="15" height="20" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  </g>
</svg>