<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-balcony desc-balcony">
  <title id="title-balcony">Balcony - Balcony with railing and flower pots</title>
  <desc id="desc-balcony">A house wall with a balcony sticking out, with iron railings, flower pots, and a child standing on the balcony waving, under a sunny sky.</desc>
  <defs>
    <linearGradient id="bc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bc-sky)"/>
  <circle cx="52" cy="48" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="96" cy="70" rx="30" ry="11" fill="#ffffff" opacity="0.95"/>

  <!-- ===== BUILDING WALL (flat facade, left/back plane) ===== -->
  <rect x="0" y="0" width="250" height="300" fill="url(#bc-wall)" stroke="#b45309" stroke-width="4"/>
  <!-- upper window on the facade -->
  <rect x="40" y="34" width="52" height="48" rx="4" fill="#bae6fd" stroke="#b45309" stroke-width="3.5"/>
  <line x1="66" y1="34" x2="66" y2="82" stroke="#b45309" stroke-width="2.5"/>
  <line x1="40" y1="58" x2="92" y2="58" stroke="#b45309" stroke-width="2.5"/>
  <!-- balcony door set INTO the wall, opening onto the platform -->
  <rect x="120" y="70" width="86" height="120" rx="5" fill="#78350f" stroke="#451a03" stroke-width="4"/>
  <rect x="128" y="80" width="32" height="54" rx="3" fill="#bae6fd" stroke="#451a03" stroke-width="3"/>
  <rect x="166" y="80" width="32" height="54" rx="3" fill="#bae6fd" stroke="#451a03" stroke-width="3"/>
  <circle cx="196" cy="150" r="4" fill="#fbbf24"/>

  <!-- ===== BALCONY PLATFORM JUTTING OUT toward the viewer (right, 3/4 view) ===== -->
  <g filter="url(#soft-shadow)">
    <!-- projecting floor slab: top face (parallelogram) shows it sticking OUT from the wall -->
    <path d="M120,196 L360,196 L396,224 L156,224 Z"
          fill="#cbd5e1" stroke="#475569" stroke-width="4" stroke-linejoin="round"/>
    <!-- slab front edge (thickness) -->
    <path d="M156,224 L396,224 L396,240 L156,240 Z"
          fill="#94a3b8" stroke="#475569" stroke-width="4" stroke-linejoin="round"/>
    <!-- under-support brackets showing it hangs off the wall -->
    <path d="M180,240 L206,284 L214,240 Z" fill="#64748b" stroke="#475569" stroke-width="3"/>
    <path d="M330,240 L356,284 L364,240 Z" fill="#64748b" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- railing sitting ON TOP of the projecting slab (waist-high, front edge) -->
  <g filter="url(#soft-shadow)">
    <!-- top rail follows the front edge of the slab -->
    <path d="M156,168 L396,168 L396,178 L156,178 Z" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <g stroke="#334155" stroke-width="5" stroke-linecap="round">
      <line x1="164" y1="178" x2="164" y2="224"/>
      <line x1="196" y1="178" x2="200" y2="224"/>
      <line x1="228" y1="178" x2="236" y2="224"/>
      <line x1="260" y1="178" x2="272" y2="224"/>
      <line x1="292" y1="178" x2="308" y2="224"/>
      <line x1="324" y1="178" x2="344" y2="224"/>
      <line x1="356" y1="178" x2="380" y2="224"/>
      <line x1="388" y1="178" x2="394" y2="224"/>
    </g>
  </g>

  <!-- child STANDING ON the balcony, waving -->
  <g filter="url(#soft-shadow)">
    <path d="M250,120 Q248,98 270,96 Q292,98 290,120 L285,126 Q270,110 255,126 Z" fill="#451a03" stroke="#1c1917" stroke-width="2.5"/>
    <circle cx="270" cy="128" r="20" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <circle cx="263" cy="125" r="2.8" fill="#0f172a"/>
    <circle cx="277" cy="125" r="2.8" fill="#0f172a"/>
    <path d="M262,136 Q270,142 278,136" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- body (torso ends just above rail so child clearly stands behind/on the balcony) -->
    <path d="M256,146 L284,146 L290,196 L250,196 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <!-- waving arm -->
    <path d="M282,152 Q302,136 306,116" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="308" cy="112" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M320,104 Q326,112 324,122"/>
      <path d="M330,96 Q340,108 336,122"/>
    </g>
    <!-- other arm resting on rail -->
    <path d="M258,152 Q244,162 242,172" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- flower pots ON the balcony slab -->
  <g filter="url(#soft-shadow)">
    <path d="M330,196 L360,196 L356,174 L336,174 Z" fill="#f97316" stroke="#7c2d12" stroke-width="3"/>
    <circle cx="338" cy="166" r="7" fill="#fb923c" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="352" cy="166" r="7" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
    <circle cx="345" cy="158" r="7" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
  </g>

  <!-- ground/street far below (emphasises the balcony is up high & sticking out) -->
  <rect x="0" y="284" width="400" height="16" fill="#86efac"/>
  <line x1="0" y1="284" x2="400" y2="284" stroke="#15803d" stroke-width="3"/>
</svg>
