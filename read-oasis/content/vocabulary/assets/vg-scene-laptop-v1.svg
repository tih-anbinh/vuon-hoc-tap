<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-laptop desc-laptop">
  <title id="title-laptop">Laptop - An open laptop computer</title>
  <desc id="desc-laptop">A big open laptop computer on a desk, with a bright screen showing a picture of a sun over hills, a keyboard and touchpad below.</desc>
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="lp-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#lp-bg)"/>
  <!-- desk -->
  <rect x="0" y="232" width="400" height="68" fill="#b45309"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#78350f" stroke-width="4"/>
  <path d="M20,252 Q120,246 220,252 M180,270 Q260,264 380,270" stroke="#92400e" stroke-width="3" fill="none" opacity="0.6"/>
  <ellipse cx="200" cy="240" rx="160" ry="12" fill="#0f172a" opacity="0.18"/>
  <!-- LAPTOP (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- screen lid -->
    <rect x="92" y="44" width="216" height="150" rx="12" fill="#334155" stroke="#0f172a" stroke-width="5"/>
    <rect x="106" y="58" width="188" height="122" rx="6" fill="url(#lp-screen)" stroke="#0f172a" stroke-width="3"/>
    <!-- picture on screen: sun over hills -->
    <circle cx="252" cy="92" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
      <line x1="252" y1="64" x2="252" y2="56"/>
      <line x1="278" y1="92" x2="286" y2="92"/>
      <line x1="270" y1="74" x2="276" y2="68"/>
    </g>
    <path d="M106,158 Q150,118 194,158 L194,180 L106,180 Z" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
    <path d="M158,164 Q210,126 294,166 L294,180 L158,180 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
    <ellipse cx="140" cy="84" rx="20" ry="8" fill="#ffffff" opacity="0.95"/>
    <!-- camera dot -->
    <circle cx="200" cy="51" r="3" fill="#94a3b8"/>
    <!-- keyboard base (perspective) -->
    <path d="M68,242 L92,196 L308,196 L332,242 Q334,250 324,250 L76,250 Q66,250 68,242 Z"
          fill="#64748b" stroke="#0f172a" stroke-width="5"/>
    <!-- keys: 3 rows -->
    <g fill="#e2e8f0" stroke="#334155" stroke-width="2">
      <rect x="102" y="204" width="18" height="9" rx="2"/>
      <rect x="124" y="204" width="18" height="9" rx="2"/>
      <rect x="146" y="204" width="18" height="9" rx="2"/>
      <rect x="168" y="204" width="18" height="9" rx="2"/>
      <rect x="190" y="204" width="18" height="9" rx="2"/>
      <rect x="212" y="204" width="18" height="9" rx="2"/>
      <rect x="234" y="204" width="18" height="9" rx="2"/>
      <rect x="256" y="204" width="18" height="9" rx="2"/>
      <rect x="278" y="204" width="18" height="9" rx="2"/>
      <rect x="97" y="217" width="19" height="9" rx="2"/>
      <rect x="120" y="217" width="19" height="9" rx="2"/>
      <rect x="143" y="217" width="19" height="9" rx="2"/>
      <rect x="166" y="217" width="19" height="9" rx="2"/>
      <rect x="189" y="217" width="19" height="9" rx="2"/>
      <rect x="212" y="217" width="19" height="9" rx="2"/>
      <rect x="235" y="217" width="19" height="9" rx="2"/>
      <rect x="258" y="217" width="19" height="9" rx="2"/>
      <rect x="281" y="217" width="20" height="9" rx="2"/>
      <rect x="130" y="230" width="140" height="9" rx="2"/>
    </g>
  </g>
  <!-- mug beside laptop -->
  <g filter="url(#soft-shadow)">
    <rect x="344" y="196" width="34" height="38" rx="6" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <path d="M378,204 Q392,206 390,218 Q388,228 376,226" fill="none" stroke="#7f1d1d" stroke-width="3.5"/>
    <g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M352,188 Q355,182 352,176"/>
      <path d="M364,188 Q367,182 364,176"/>
    </g>
  </g>
  <!-- pencil -->
  <g filter="url(#soft-shadow)" transform="rotate(-12 44 216)">
    <rect x="16" y="210" width="52" height="10" rx="2" fill="#fbbf24" stroke="#a16207" stroke-width="2.5"/>
    <path d="M68,210 L80,215 L68,220 Z" fill="#fcd9b6" stroke="#a16207" stroke-width="2.5"/>
    <rect x="10" y="210" width="8" height="10" rx="2" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
  </g>
  <!-- sparkles -->
  <g fill="#818cf8" stroke="#4338ca" stroke-width="2">
    <path d="M48,70 L52,80 L62,82 L54,89 L56,100 L48,94 L40,100 L42,89 L34,82 L44,80 Z"/>
    <path d="M352,110 L355,117 L362,118 L357,123 L358,131 L352,127 L346,131 L347,123 L342,118 L349,117 Z"/>
  </g>
</svg>
