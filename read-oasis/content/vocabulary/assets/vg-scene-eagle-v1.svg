<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-eagle d-eagle">
  <title id="t-eagle">Eagle</title>
  <desc id="d-eagle">A bald eagle with a white head, hooked yellow beak, brown body and broad spread wings, flying in the sky.</desc>
  <defs>
    <linearGradient id="eg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="eg-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#eg-sky)"/>
  <g fill="#fff" opacity="0.8"><ellipse cx="90" cy="70" rx="30" ry="15"/><ellipse cx="320" cy="230" rx="34" ry="16"/></g>

  <g filter="url(#eg-sh)" stroke="#0f172a" stroke-width="4">
    <!-- Spread wings with feather tips -->
    <path d="M200 150
             C150 108 96 96 44 108
             C70 118 78 126 70 138
             C96 132 110 138 108 150
             C132 142 150 150 158 162 Z" fill="#7c4a1e"/>
    <path d="M200 150
             C250 108 304 96 356 108
             C330 118 322 126 330 138
             C304 132 290 138 292 150
             C268 142 250 150 242 162 Z" fill="#7c4a1e"/>
    <!-- feather separators -->
    <g stroke="#5a3415" stroke-width="2.5" fill="none">
      <path d="M70 120 L108 142"/><path d="M104 130 L140 152"/>
      <path d="M330 120 L292 142"/><path d="M296 130 L260 152"/>
    </g>
    <!-- Body -->
    <path d="M176 148 Q200 140 224 148 L214 216 Q200 226 186 216 Z" fill="#8b5a2b"/>
    <!-- Tail (white) -->
    <path d="M186 214 L200 250 L214 214 Z" fill="#f8fafc"/>
    <!-- White head -->
    <circle cx="200" cy="128" r="30" fill="#f8fafc"/>
    <!-- Hooked yellow beak -->
    <path d="M200 132 L176 138 Q168 142 176 148 Q190 146 200 142 Z" fill="#f59e0b"/>
    <path d="M176 138 Q166 140 170 150" fill="none" stroke="#d97706" stroke-width="3"/>
    <!-- eye + brow (fierce) -->
    <circle cx="204" cy="122" r="5" fill="#0f172a"/>
    <path d="M196 116 Q208 112 216 118" fill="none" stroke="#78350f" stroke-width="3"/>
    <!-- Talons -->
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <path d="M190 222 l-6 12 M196 224 l0 14 M204 224 l0 14 M210 222 l6 12"/>
    </g>
  </g>
</svg>
