<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-costume desc-costume">
  <title id="title-costume">Costume</title>
  <desc id="desc-costume">A superhero costume on a hanger with a cape, mask, and a star emblem on the chest.</desc>
  <defs>
    <linearGradient id="costume-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="costume-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#costume-bg)"/>

  <g filter="url(#soft-shadow)">
    <!-- Hanger -->
    <path d="M200 45 a10 10 0 1 1 8 15" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 100 L200 62 L280 100" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- Cape -->
    <path d="M135 100 Q110 200 130 260 L200 235 L270 260 Q290 200 265 100 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3.5"/>
    <!-- Body suit -->
    <path d="M150 100 Q200 88 250 100 L245 130 L275 145 L262 175 L245 165 L245 250 L155 250 L155 165 L138 175 L125 145 L155 130 Z" fill="url(#costume-body)" stroke="#1e3a8a" stroke-width="3.5"/>
    <!-- Star emblem -->
    <path d="M200 125 l9 19 l21 2 l-15 14 l4 21 l-19 -11 l-19 11 l4 -21 l-15 -14 l21 -2 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2.5"/>
    <!-- Mask -->
    <path d="M285 75 q35 5 35 25 q0 20 -35 25 q10 -25 0 -50 Z" fill="#1e293b"/>
    <ellipse cx="300" cy="95" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="314" cy="98" rx="6" ry="4" fill="#fff"/>
  </g>
</svg>
