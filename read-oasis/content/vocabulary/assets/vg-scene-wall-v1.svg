<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-wall desc-wall">
  <title id="title-wall">Wall - Brick wall with cat on top</title>
  <desc id="desc-wall">A big red brick wall across a garden with a cat sitting on top, flowers growing at its base, and a ladder leaning against it.</desc>
  <defs>
    <linearGradient id="wl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="wl-brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#wl-sky)"/>
  <circle cx="55" cy="46" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="320" cy="42" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- grass -->
  <rect x="0" y="252" width="400" height="48" fill="#4ade80"/>
  <line x1="0" y1="252" x2="400" y2="252" stroke="#15803d" stroke-width="3.5"/>
  <!-- brick wall (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- coping stone top -->
    <rect x="8" y="118" width="384" height="16" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="3.5"/>
    <!-- wall body -->
    <rect x="16" y="134" width="368" height="118" fill="url(#wl-brick)" stroke="#7f1d1d" stroke-width="4.5"/>
    <!-- mortar lines: horizontal -->
    <g stroke="#fecaca" stroke-width="3">
      <line x1="16" y1="158" x2="384" y2="158"/>
      <line x1="16" y1="182" x2="384" y2="182"/>
      <line x1="16" y1="206" x2="384" y2="206"/>
      <line x1="16" y1="230" x2="384" y2="230"/>
    </g>
    <!-- mortar lines: vertical staggered -->
    <g stroke="#fecaca" stroke-width="3">
      <line x1="76" y1="134" x2="76" y2="158"/>
      <line x1="150" y1="134" x2="150" y2="158"/>
      <line x1="224" y1="134" x2="224" y2="158"/>
      <line x1="298" y1="134" x2="298" y2="158"/>
      <line x1="40" y1="158" x2="40" y2="182"/>
      <line x1="114" y1="158" x2="114" y2="182"/>
      <line x1="188" y1="158" x2="188" y2="182"/>
      <line x1="262" y1="158" x2="262" y2="182"/>
      <line x1="336" y1="158" x2="336" y2="182"/>
      <line x1="76" y1="182" x2="76" y2="206"/>
      <line x1="150" y1="182" x2="150" y2="206"/>
      <line x1="224" y1="182" x2="224" y2="206"/>
      <line x1="298" y1="182" x2="298" y2="206"/>
      <line x1="40" y1="206" x2="40" y2="230"/>
      <line x1="114" y1="206" x2="114" y2="230"/>
      <line x1="188" y1="206" x2="188" y2="230"/>
      <line x1="262" y1="206" x2="262" y2="230"/>
      <line x1="336" y1="206" x2="336" y2="230"/>
      <line x1="76" y1="230" x2="76" y2="252"/>
      <line x1="150" y1="230" x2="150" y2="252"/>
      <line x1="224" y1="230" x2="224" y2="252"/>
      <line x1="298" y1="230" x2="298" y2="252"/>
    </g>
  </g>
  <!-- cat sitting on wall -->
  <g filter="url(#soft-shadow)">
    <path d="M110,118 Q106,86 128,84 Q124,70 134,74 Q140,60 146,74 Q156,70 152,84 Q172,88 168,118 Z" fill="#334155" stroke="#0f172a" stroke-width="3.5"/>
    <ellipse cx="139" cy="96" rx="16" ry="14" fill="#334155"/>
    <circle cx="132" cy="92" r="3.5" fill="#4ade80"/>
    <circle cx="146" cy="92" r="3.5" fill="#4ade80"/>
    <path d="M136,100 L139,103 L142,100" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round">
      <line x1="124" y1="98" x2="112" y2="96"/>
      <line x1="154" y1="98" x2="166" y2="96"/>
    </g>
    <!-- tail hanging down -->
    <path d="M164,118 Q184,132 178,156" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- ladder leaning on wall -->
  <g filter="url(#soft-shadow)" stroke="#92400e" stroke-width="6" stroke-linecap="round">
    <line x1="290" y1="272" x2="322" y2="122"/>
    <line x1="330" y1="272" x2="362" y2="122"/>
    <line x1="300" y1="244" x2="340" y2="244"/>
    <line x1="306" y1="216" x2="346" y2="216"/>
    <line x1="312" y1="188" x2="352" y2="188"/>
    <line x1="318" y1="160" x2="358" y2="160"/>
  </g>
  <!-- flowers at wall base -->
  <g>
    <g stroke="#15803d" stroke-width="3.5" fill="none">
      <line x1="50" y1="272" x2="50" y2="252"/>
      <line x1="80" y1="276" x2="80" y2="256"/>
      <line x1="210" y1="274" x2="210" y2="254"/>
    </g>
    <circle cx="50" cy="248" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
    <circle cx="50" cy="248" r="3.5" fill="#fde047"/>
    <circle cx="80" cy="252" r="9" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="80" cy="252" r="3.5" fill="#fde047"/>
    <circle cx="210" cy="250" r="9" fill="#fb923c" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="210" cy="250" r="3.5" fill="#fde047"/>
  </g>
</svg>
