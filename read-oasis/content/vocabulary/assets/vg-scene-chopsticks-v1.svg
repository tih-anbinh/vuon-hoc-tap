<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-chopsticks desc-chopsticks">
  <title id="title-chopsticks">Chopsticks</title>
  <desc id="desc-chopsticks">A pair of wooden chopsticks holding a dumpling above a small round bowl.</desc>
  <defs>
    <linearGradient id="chopsticks-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="chopsticks-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#chopsticks-bg)"/>
  <ellipse cx="200" cy="262" rx="130" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Chopsticks -->
    <rect x="120" y="55" width="12" height="150" rx="5" fill="url(#chopsticks-wood)" stroke="#7c2d12" stroke-width="2.5" transform="rotate(12 126 130)"/>
    <rect x="150" y="55" width="12" height="150" rx="5" fill="url(#chopsticks-wood)" stroke="#7c2d12" stroke-width="2.5" transform="rotate(20 156 130)"/>
    <!-- Dumpling held -->
    <ellipse cx="185" cy="150" rx="38" ry="30" fill="#fde68a" stroke="#ca8a04" stroke-width="3.5"/>
    <path d="M155 138 Q185 122 215 138" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <path d="M160 150 Q170 143 180 150 Q190 143 200 150 Q210 143 218 150" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
  </g>

  <!-- Bowl -->
  <g filter="url(#soft-shadow)">
    <path d="M230 210 A55 32 0 0 0 340 210 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <ellipse cx="285" cy="210" rx="55" ry="16" fill="#f1f5f9" stroke="#1e293b" stroke-width="4"/>
    <path d="M245 210 A40 12 0 0 0 325 210" fill="none" stroke="#3b82f6" stroke-width="3"/>
  </g>
</svg>
