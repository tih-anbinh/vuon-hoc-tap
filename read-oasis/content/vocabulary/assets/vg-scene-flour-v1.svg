<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-flour desc-flour">
  <title id="title-flour">Flour</title>
  <desc id="desc-flour">An open paper bag of white flour with a scoop and a small pile of flour spilled beside it.</desc>
  <defs>
    <linearGradient id="flour-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="flour-bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e7d5a8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#flour-bg)"/>
  <ellipse cx="200" cy="258" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Bag -->
    <path d="M110 110 L230 110 L240 250 L100 250 Z" fill="url(#flour-bag)" stroke="#a16207" stroke-width="4"/>
    <!-- Rolled-open top -->
    <path d="M108 110 Q120 92 145 100 Q170 90 195 100 Q220 90 232 110 Z" fill="#d6c08a" stroke="#a16207" stroke-width="3.5"/>
    <!-- Flour visible inside -->
    <ellipse cx="170" cy="112" rx="48" ry="10" fill="#f8fafc"/>
    <!-- Wheat symbol -->
    <path d="M170 155 L170 210 M170 165 q-14 -6 -20 6 M170 165 q14 -6 20 6 M170 180 q-14 -6 -20 6 M170 180 q14 -6 20 6" fill="none" stroke="#a16207" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Spilled flour pile -->
  <g filter="url(#soft-shadow)">
    <path d="M245 250 Q285 220 325 250 Q305 258 245 250 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <!-- Scoop -->
  <g filter="url(#soft-shadow)">
    <path d="M285 210 A24 24 0 0 0 285 250 L305 250 A24 24 0 0 1 305 210 Z" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <rect x="298" y="185" width="8" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <ellipse cx="295" cy="222" rx="18" ry="6" fill="#f8fafc"/>
  </g>
</svg>
