<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ice-skates desc-ice-skates">
  <title id="title-ice-skates">Ice skates - A pair of white ice skates</title>
  <desc id="desc-ice-skates">A pair of white ice skating boots with shiny silver blades and laces, standing on sparkling ice with snowflakes around.</desc>
  <defs>
    <linearGradient id="ik-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="ik-boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#ik-bg)"/>
  <!-- ice floor -->
  <rect x="0" y="228" width="400" height="72" fill="#bfdbfe"/>
  <line x1="0" y1="228" x2="400" y2="228" stroke="#60a5fa" stroke-width="4"/>
  <g stroke="#93c5fd" stroke-width="2.5" fill="none">
    <path d="M30,252 L70,244 L96,256"/>
    <path d="M310,248 L346,258 L378,246"/>
  </g>
  <ellipse cx="200" cy="262" rx="150" ry="13" fill="#0f172a" opacity="0.13"/>
  <!-- PAIR OF SKATES (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- back skate -->
    <g transform="translate(96,60)">
      <path d="M30,0 L86,0 L88,80 Q130,84 148,102 Q156,112 148,122 L18,122 Q10,122 10,112 L26,10 Q26,0 30,0 Z"
            fill="url(#ik-boot)" stroke="#334155" stroke-width="4.5"/>
      <!-- cuff -->
      <rect x="24" y="-6" width="66" height="16" rx="7" fill="#93c5fd" stroke="#1e40af" stroke-width="3.5"/>
      <!-- laces -->
      <g stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M40,22 L76,30"/>
        <path d="M76,22 L40,30"/>
        <path d="M38,42 L74,50"/>
        <path d="M74,42 L38,50"/>
        <path d="M36,62 L72,70"/>
        <path d="M72,62 L36,70"/>
      </g>
      <!-- blade holder -->
      <rect x="16" y="122" width="136" height="10" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
      <!-- blade -->
      <path d="M12,140 Q10,132 20,132 L150,132 Q162,132 158,142 Q154,148 142,148 L28,148 Q16,148 12,140 Z"
            fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
      <path d="M22,140 L146,140" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- front skate -->
    <g transform="translate(196,92)">
      <path d="M30,0 L86,0 L88,80 Q130,84 148,102 Q156,112 148,122 L18,122 Q10,122 10,112 L26,10 Q26,0 30,0 Z"
            fill="url(#ik-boot)" stroke="#334155" stroke-width="4.5"/>
      <rect x="24" y="-6" width="66" height="16" rx="7" fill="#f9a8d4" stroke="#9d174d" stroke-width="3.5"/>
      <g stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M40,22 L76,30"/>
        <path d="M76,22 L40,30"/>
        <path d="M38,42 L74,50"/>
        <path d="M74,42 L38,50"/>
        <path d="M36,62 L72,70"/>
        <path d="M72,62 L36,70"/>
      </g>
      <rect x="16" y="122" width="136" height="10" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
      <path d="M12,140 Q10,132 20,132 L150,132 Q162,132 158,142 Q154,148 142,148 L28,148 Q16,148 12,140 Z"
            fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
      <path d="M22,140 L146,140" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- snowflakes -->
  <g stroke="#818cf8" stroke-width="3" stroke-linecap="round">
    <g transform="translate(52,52)">
      <line x1="-11" y1="0" x2="11" y2="0"/><line x1="0" y1="-11" x2="0" y2="11"/>
      <line x1="-8" y1="-8" x2="8" y2="8"/><line x1="-8" y1="8" x2="8" y2="-8"/>
    </g>
    <g transform="translate(348,52)">
      <line x1="-11" y1="0" x2="11" y2="0"/><line x1="0" y1="-11" x2="0" y2="11"/>
      <line x1="-8" y1="-8" x2="8" y2="8"/><line x1="-8" y1="8" x2="8" y2="-8"/>
    </g>
    <g transform="translate(370,140)">
      <line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <g transform="translate(36,150)">
      <line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
  </g>
  <!-- sparkle on blade -->
  <g fill="#ffffff" stroke="#a5b4fc" stroke-width="2">
    <path d="M330,236 L334,245 L344,247 L336,253 L338,263 L330,258 L322,263 L324,253 L316,247 L326,245 Z"/>
  </g>
</svg>
