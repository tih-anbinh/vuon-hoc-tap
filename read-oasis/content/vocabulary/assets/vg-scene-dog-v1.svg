<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-dog desc-dog">
  <title id="title-dog">Dog - Happy sitting puppy</title>
  <desc id="desc-dog">A joyful domestic dog with floppy ears, a wagging tail, open happy mouth with tongue out, and red collar, occupying the center of the frame.</desc>
  <defs>
    <linearGradient id="dog-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="40" y1="265" x2="360" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Shadow -->
  <ellipse cx="205" cy="265" rx="85" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: DOG (Occupying 70% canvas) -->
  <g id="dog-figure" filter="url(#soft-shadow)">
    <!-- Happy Wagging Tail (with motion lines) -->
    <path d="M130 220 C85 200 65 150 90 120" fill="none" stroke="#d97706" stroke-width="18" stroke-linecap="round"/>
    <path d="M130 220 C85 200 65 150 90 120" fill="none" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Wag motion arcs -->
    <path d="M60 125 Q75 110 95 110" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 145 Q85 130 105 130" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Dog Body (sitting) -->
    <ellipse cx="200" cy="195" rx="68" ry="62" fill="url(#dog-gold)" stroke="#92400e" stroke-width="4"/>

    <!-- Light belly patch -->
    <ellipse cx="200" cy="205" rx="42" ry="45" fill="#fef3c7"/>

    <!-- Red Collar with Gold Medallion Tag -->
    <path d="M165 148 Q200 162 235 148" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    <circle cx="200" cy="164" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>

    <!-- Dog Head -->
    <circle cx="200" cy="105" r="48" fill="url(#dog-gold)" stroke="#92400e" stroke-width="4"/>

    <!-- Floppy Left Ear -->
    <path d="M160 85 C130 90 120 140 145 165 C155 170 168 150 164 125 Z" fill="#b45309" stroke="#78350f" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Floppy Right Ear -->
    <path d="M240 85 C270 90 280 140 255 165 C245 170 232 150 236 125 Z" fill="#b45309" stroke="#78350f" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Eyes (Big, friendly, soulful) -->
    <circle cx="180" cy="98" r="9" fill="#1e293b"/>
    <circle cx="177" cy="95" r="3" fill="#ffffff"/>
    <circle cx="220" cy="98" r="9" fill="#1e293b"/>
    <circle cx="217" cy="95" r="3" fill="#ffffff"/>

    <!-- Eyebrows (expressive puppy eyes) -->
    <ellipse cx="180" cy="85" rx="6" ry="3" fill="#92400e"/>
    <ellipse cx="220" cy="85" rx="6" ry="3" fill="#92400e"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="200" cy="118" rx="22" ry="16" fill="#fef3c7" stroke="#92400e" stroke-width="2.5"/>

    <!-- Big shiny black nose -->
    <path d="M190 110 Q200 106 210 110 Q200 122 190 110 Z" fill="#1e293b"/>
    <circle cx="196" cy="110" r="2" fill="#ffffff"/>

    <!-- Open Happy Mouth with Tongue Panting -->
    <path d="M192 120 Q200 126 208 120" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M194 122 Q200 142 206 122 Z" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
    <line x1="200" y1="122" x2="200" y2="135" stroke="#be123c" stroke-width="1.5"/>

    <!-- Front Paws standing on floor -->
    <ellipse cx="175" cy="254" rx="18" ry="12" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <line x1="170" y1="250" x2="170" y2="260" stroke="#92400e" stroke-width="2"/>
    <line x1="180" y1="250" x2="180" y2="260" stroke="#92400e" stroke-width="2"/>

    <ellipse cx="225" cy="254" rx="18" ry="12" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <line x1="220" y1="250" x2="220" y2="260" stroke="#92400e" stroke-width="2"/>
    <line x1="230" y1="250" x2="230" y2="260" stroke="#92400e" stroke-width="2"/>
  </g>
</svg>