<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-meatballs d-meatballs">
  <title id="t-meatballs">Meatballs</title>
  <desc id="d-meatballs">A white plate of round brown meatballs in red tomato sauce, topped with green basil leaves.</desc>
  <defs>
    <radialGradient id="mb-ball" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#b5764a"/>
      <stop offset="70%" stop-color="#8a4f28"/>
      <stop offset="100%" stop-color="#5c3216"/>
    </radialGradient>
    <filter id="mb-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#fef9c3"/>
  <ellipse cx="200" cy="246" rx="150" ry="20" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#mb-sh)">
    <!-- plate -->
    <ellipse cx="200" cy="188" rx="150" ry="56" fill="#f8fafc" stroke="#cbd5e1" stroke-width="5"/>
    <ellipse cx="200" cy="184" rx="120" ry="42" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- tomato sauce pool -->
    <ellipse cx="200" cy="186" rx="104" ry="34" fill="#dc2626"/>
    <ellipse cx="200" cy="182" rx="104" ry="34" fill="#ef4444"/>
  </g>

  <!-- meatballs -->
  <g stroke="#4a2810" stroke-width="3">
    <circle cx="150" cy="176" r="26" fill="url(#mb-ball)"/>
    <circle cx="204" cy="168" r="27" fill="url(#mb-ball)"/>
    <circle cx="256" cy="178" r="25" fill="url(#mb-ball)"/>
    <circle cx="176" cy="200" r="25" fill="url(#mb-ball)"/>
    <circle cx="230" cy="200" r="24" fill="url(#mb-ball)"/>
  </g>
  <!-- shine dots -->
  <g fill="#e0b48c" opacity="0.7"><circle cx="142" cy="166" r="5"/><circle cx="196" cy="158" r="5"/><circle cx="248" cy="168" r="4"/></g>
  <!-- basil leaves -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="2">
    <path d="M200 150 Q212 134 226 148 Q212 158 200 150 Z"/>
    <path d="M188 152 Q176 136 162 150 Q176 160 188 152 Z"/>
  </g>
</svg>
