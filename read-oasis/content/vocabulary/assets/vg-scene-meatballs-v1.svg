<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-meatballs desc-meatballs">
  <title id="title-meatballs">Meatballs - Plate of meatballs</title>
  <desc id="desc-meatballs">Several round brown meatballs on a white plate with red tomato sauce and a green basil leaf.</desc>
  <defs>
    <linearGradient id="mball-brown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="40" y1="260" x2="360" y2="260" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="260" rx="100" ry="8" fill="#0f172a" opacity="0.1"/>

  <g id="meatballs-figure" filter="url(#soft-shadow)">
    <!-- Plate -->
    <ellipse cx="200" cy="200" rx="130" ry="48" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="200" cy="200" rx="110" ry="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Tomato sauce pool -->
    <ellipse cx="200" cy="195" rx="85" ry="30" fill="#ef4444" opacity="0.6"/>
    <ellipse cx="200" cy="195" rx="70" ry="25" fill="#dc2626" opacity="0.4"/>

    <!-- Meatballs (back row) -->
    <circle cx="160" cy="175" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="155" cy="168" r="5" fill="#b45309" opacity="0.4"/>

    <circle cx="210" cy="170" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="205" cy="163" r="5" fill="#b45309" opacity="0.4"/>

    <circle cx="255" cy="178" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="250" cy="171" r="5" fill="#b45309" opacity="0.4"/>

    <!-- Meatballs (front row) -->
    <circle cx="140" cy="205" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="135" cy="198" r="5" fill="#b45309" opacity="0.4"/>

    <circle cx="190" cy="208" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="185" cy="201" r="5" fill="#b45309" opacity="0.4"/>

    <circle cx="240" cy="210" r="22" fill="url(#mball-brown)" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="235" cy="203" r="5" fill="#b45309" opacity="0.4"/>

    <!-- Sauce drips on meatballs -->
    <path d="M155 185 C158 190 162 192 160 188" fill="#dc2626" opacity="0.5"/>
    <path d="M205 180 C208 185 212 187 210 183" fill="#dc2626" opacity="0.5"/>
    <path d="M235 218 C238 222 242 224 240 220" fill="#dc2626" opacity="0.5"/>

    <!-- Basil leaf garnish -->
    <path d="M270 185 C280 170 295 165 300 172 C295 182 282 188 270 185 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M270 185 C282 175 293 170 298 173" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small basil leaf -->
    <path d="M275 190 C282 180 290 178 292 183 C288 190 280 192 275 190 Z" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  </g>
</svg>