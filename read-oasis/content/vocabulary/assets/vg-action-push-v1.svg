<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-push desc-push">
  <title id="title-push">Push</title>
  <desc id="desc-push">A child leaning forward and pushing a big box, with motion lines showing it sliding forward.</desc>
  <defs>
    <linearGradient id="push-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="push-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="push-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6a860"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#push-bg)"/>
  <rect x="0" y="250" width="400" height="10" fill="#22c55e" opacity="0.5"/>
  <ellipse cx="200" cy="265" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Box being pushed -->
    <rect x="240" y="160" width="110" height="95" rx="6" fill="url(#push-box)" stroke="#78350f" stroke-width="4"/>
    <path d="M240 160 L295 145 L350 160" fill="none" stroke="#78350f" stroke-width="3"/>
    <line x1="295" y1="145" x2="295" y2="160" stroke="#78350f" stroke-width="3"/>
    <path d="M245 200 L345 200 M245 215 L345 215" stroke="#78350f" stroke-width="2" opacity="0.5"/>

    <!-- Leaning-forward body -->
    <path d="M100 250 Q92 190 130 172 Q165 165 172 185 L160 245 Z" fill="#f97316" stroke="#c2410c" stroke-width="4" transform="rotate(14 135 210)"/>
    <!-- Legs braced back -->
    <path d="M110 240 L80 268" stroke="url(#push-skin)" stroke-width="15" stroke-linecap="round"/>
    <path d="M148 245 L155 272" stroke="url(#push-skin)" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="74" cy="270" rx="16" ry="8" fill="#1e293b"/>
    <ellipse cx="158" cy="275" rx="16" ry="8" fill="#1e293b"/>

    <!-- Head (leaning forward) -->
    <circle cx="140" cy="130" r="38" fill="url(#push-skin)" stroke="#d4a574" stroke-width="4"/>
    <path d="M106 122 Q108 92 140 92 Q172 92 174 122 Q158 102 140 102 Q122 102 106 122 Z" fill="#3d2109" stroke="#2a1607" stroke-width="2.5"/>
    <circle cx="152" cy="128" r="4.5" fill="#1e293b"/>
    <circle cx="132" cy="128" r="4.5" fill="#1e293b"/>
    <path d="M130 146 Q140 140 150 146" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Arms pushing box -->
    <path d="M165 180 Q205 175 238 180" fill="none" stroke="url(#push-skin)" stroke-width="13" stroke-linecap="round"/>
    <path d="M160 200 Q205 190 238 200" fill="none" stroke="url(#push-skin)" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- Motion lines behind box -->
  <g stroke="#ef4444" stroke-width="5" stroke-linecap="round">
    <line x1="356" y1="180" x2="386" y2="180"/>
    <line x1="356" y1="205" x2="392" y2="205"/>
    <line x1="356" y1="230" x2="386" y2="230"/>
  </g>
</svg>
