<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-rabbit desc-rabbit">
  <title id="title-rabbit">Rabbit</title>
  <desc id="desc-rabbit">A fluffy white rabbit with long ears, a pink nose, and a round cotton tail nibbling a carrot.</desc>
  <defs>
    <linearGradient id="rabbit-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#rabbit-bg)"/>
  <ellipse cx="200" cy="270" rx="120" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Ears -->
    <ellipse cx="172" cy="80" rx="16" ry="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3.5"/>
    <ellipse cx="172" cy="82" rx="7" ry="40" fill="#fbcfe8"/>
    <ellipse cx="215" cy="85" rx="16" ry="52" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3.5" transform="rotate(10 215 85)"/>
    <ellipse cx="217" cy="88" rx="7" ry="38" fill="#fbcfe8" transform="rotate(10 217 88)"/>

    <!-- Body -->
    <ellipse cx="200" cy="210" rx="62" ry="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Cotton tail -->
    <circle cx="255" cy="225" r="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Feet -->
    <ellipse cx="175" cy="258" rx="20" ry="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="220" cy="258" rx="20" ry="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Head -->
    <circle cx="195" cy="150" r="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="180" cy="145" r="7" fill="#1e293b"/>
    <circle cx="212" cy="145" r="7" fill="#1e293b"/>
    <circle cx="178" cy="143" r="2.5" fill="#f8fafc"/>
    <circle cx="210" cy="143" r="2.5" fill="#f8fafc"/>
    <!-- Nose -->
    <path d="M190 162 L204 162 L197 170 Z" fill="#f472b6"/>
    <path d="M197 170 L197 178 M197 178 Q188 182 182 178 M197 178 Q206 182 212 178" fill="none" stroke="#be185d" stroke-width="2"/>
    <!-- Teeth -->
    <rect x="192" y="178" width="10" height="8" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cheeks -->
    <circle cx="162" cy="160" r="8" fill="#fca5a5" opacity="0.5"/>
    <circle cx="228" cy="160" r="8" fill="#fca5a5" opacity="0.5"/>
    <!-- Whiskers -->
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="150" y1="165" x2="115" y2="160"/>
      <line x1="150" y1="172" x2="118" y2="175"/>
      <line x1="240" y1="165" x2="275" y2="160"/>
      <line x1="240" y1="172" x2="272" y2="175"/>
    </g>
  </g>

  <!-- Carrot -->
  <g filter="url(#soft-shadow)">
    <path d="M150 200 L110 250 L118 258 L160 210 Z" fill="#f97316" stroke="#c2410c" stroke-width="3"/>
    <g stroke="#166534" stroke-width="4" stroke-linecap="round">
      <line x1="150" y1="202" x2="140" y2="185"/>
      <line x1="155" y1="205" x2="158" y2="186"/>
      <line x1="158" y1="208" x2="172" y2="192"/>
    </g>
  </g>
</svg>
