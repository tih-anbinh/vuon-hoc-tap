<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shelf desc-shelf">
  <title id="title-shelf">Shelf</title>
  <desc id="desc-shelf">A wooden wall shelf holding a row of colorful books, a plant, and a clock.</desc>
  <defs>
    <linearGradient id="shelf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="shelf-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#shelf-bg)"/>

  <g filter="url(#soft-shadow)">
    <!-- Items on shelf -->
    <!-- Books -->
    <g stroke="#1e293b" stroke-width="3">
      <rect x="95" y="120" width="18" height="80" fill="#ef4444"/>
      <rect x="113" y="115" width="18" height="85" fill="#3b82f6"/>
      <rect x="131" y="125" width="18" height="75" fill="#22c55e"/>
      <rect x="149" y="118" width="18" height="82" fill="#f59e0b"/>
    </g>
    <!-- Plant -->
    <rect x="195" y="165" width="40" height="35" rx="4" fill="#c2410c" stroke="#7c2d12" stroke-width="3"/>
    <g fill="#22c55e" stroke="#15803d" stroke-width="2">
      <path d="M215 165 Q195 130 210 118 Q222 140 218 165 Z"/>
      <path d="M215 165 Q235 130 220 118 Q212 140 216 165 Z"/>
      <path d="M215 165 Q215 125 215 115"/>
    </g>
    <!-- Clock -->
    <circle cx="290" cy="160" r="32" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
    <line x1="290" y1="160" x2="290" y2="140" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="290" y1="160" x2="306" y2="168" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="290" cy="160" r="3" fill="#1e293b"/>

    <!-- Shelf plank -->
    <rect x="70" y="200" width="260" height="20" rx="4" fill="url(#shelf-wood)" stroke="#78350f" stroke-width="4"/>
    <!-- Brackets -->
    <path d="M95 220 L95 245 L80 220 Z" fill="#78350f"/>
    <path d="M305 220 L305 245 L320 220 Z" fill="#78350f"/>
  </g>
</svg>
