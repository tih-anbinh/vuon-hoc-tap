<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-mouse-mice desc-mouse-mice">
  <title id="title-mouse-mice">Mouse and mice - One mouse and three mice</title>
  <desc id="desc-mouse-mice">One grey mouse with big round ears on the left, and three small mice together near a piece of cheese on the right, showing singular and plural.</desc>
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#mc-bg)"/>
  <rect x="0" y="235" width="400" height="65" fill="#d6a35c" opacity="0.6"/>
  <line x1="0" y1="235" x2="400" y2="235" stroke="#a16207" stroke-width="3"/>
  <!-- divider -->
  <line x1="165" y1="30" x2="165" y2="270" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10,8"/>
  <ellipse cx="85" cy="245" rx="65" ry="8" fill="#0f172a" opacity="0.2"/>
  <ellipse cx="285" cy="248" rx="100" ry="8" fill="#0f172a" opacity="0.2"/>
  <!-- single big mouse (left) -->
  <g filter="url(#soft-shadow)">
    <!-- tail -->
    <path d="M128,215 Q160,220 158,185 Q157,165 144,162" fill="none" stroke="#f9a8d4" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="85" cy="195" rx="52" ry="45" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
    <!-- ears -->
    <circle cx="52" cy="128" r="26" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
    <circle cx="52" cy="128" r="14" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
    <circle cx="116" cy="128" r="26" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
    <circle cx="116" cy="128" r="14" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
    <!-- head -->
    <ellipse cx="84" cy="158" rx="38" ry="32" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
    <circle cx="72" cy="152" r="5" fill="#0f172a"/>
    <circle cx="96" cy="152" r="5" fill="#0f172a"/>
    <circle cx="74" cy="150" r="1.8" fill="#ffffff"/>
    <circle cx="98" cy="150" r="1.8" fill="#ffffff"/>
    <!-- nose -->
    <ellipse cx="84" cy="172" rx="7" ry="5" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
    <!-- whiskers -->
    <g stroke="#475569" stroke-width="1.8" stroke-linecap="round">
      <line x1="66" y1="170" x2="42" y2="166"/>
      <line x1="66" y1="176" x2="43" y2="180"/>
      <line x1="102" y1="170" x2="126" y2="166"/>
      <line x1="102" y1="176" x2="125" y2="180"/>
    </g>
    <path d="M78,182 Q84,187 90,182" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="62" cy="238" rx="12" ry="6" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
    <ellipse cx="105" cy="238" rx="12" ry="6" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
  </g>
  <!-- cheese wedge -->
  <g filter="url(#soft-shadow)">
    <path d="M215,235 L290,192 L290,235 Z" fill="#fbbf24" stroke="#b45309" stroke-width="3.5"/>
    <circle cx="270" cy="222" r="6" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
    <circle cx="252" cy="230" r="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  </g>
  <!-- three small mice (right) -->
  <g filter="url(#soft-shadow)">
    <!-- mouse A -->
    <path d="M228,268 Q250,272 250,252" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="205" cy="258" rx="26" ry="20" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <circle cx="188" cy="230" r="12" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <circle cx="188" cy="230" r="6" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <circle cx="215" cy="230" r="12" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <circle cx="215" cy="230" r="6" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <ellipse cx="201" cy="244" rx="17" ry="14" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <circle cx="196" cy="241" r="2.5" fill="#0f172a"/>
    <circle cx="207" cy="241" r="2.5" fill="#0f172a"/>
    <ellipse cx="201" cy="250" rx="3.5" ry="2.5" fill="#ec4899"/>
    <!-- mouse B -->
    <path d="M330,268 Q352,272 352,252" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="308" cy="258" rx="26" ry="20" fill="#78716c" stroke="#44403c" stroke-width="3"/>
    <circle cx="291" cy="230" r="12" fill="#78716c" stroke="#44403c" stroke-width="3"/>
    <circle cx="291" cy="230" r="6" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <circle cx="318" cy="230" r="12" fill="#78716c" stroke="#44403c" stroke-width="3"/>
    <circle cx="318" cy="230" r="6" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <ellipse cx="304" cy="244" rx="17" ry="14" fill="#a8a29e" stroke="#44403c" stroke-width="3"/>
    <circle cx="299" cy="241" r="2.5" fill="#0f172a"/>
    <circle cx="310" cy="241" r="2.5" fill="#0f172a"/>
    <ellipse cx="304" cy="250" rx="3.5" ry="2.5" fill="#ec4899"/>
    <!-- mouse C (top, on cheese side) -->
    <path d="M366,205 Q384,208 383,190" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="345" cy="196" rx="24" ry="18" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <circle cx="330" cy="171" r="11" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <circle cx="330" cy="171" r="5.5" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <circle cx="354" cy="171" r="11" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <circle cx="354" cy="171" r="5.5" fill="#f9a8d4" stroke="#be185d" stroke-width="1.8"/>
    <ellipse cx="341" cy="184" rx="15" ry="13" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="336" cy="181" r="2.5" fill="#0f172a"/>
    <circle cx="347" cy="181" r="2.5" fill="#0f172a"/>
    <ellipse cx="341" cy="190" rx="3.5" ry="2.5" fill="#ec4899"/>
  </g>
</svg>
