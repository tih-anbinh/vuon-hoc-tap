<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-neck desc-neck">
  <title id="title-neck">Neck</title>
  <desc id="desc-neck">A cartoon child's head and shoulders with an arrow pointing to the neck between them.</desc>
  <defs>
    <linearGradient id="neck-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="neck-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#neck-bg)"/>
  <ellipse cx="190" cy="282" rx="120" ry="12" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Shoulders/shirt -->
    <path d="M110 300 Q110 230 190 218 Q270 230 270 300 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4"/>
    <!-- Neck (highlighted) -->
    <rect x="168" y="150" width="44" height="72" rx="10" fill="url(#neck-skin)" stroke="#d4a574" stroke-width="4"/>
    <!-- Head -->
    <circle cx="190" cy="105" r="58" fill="url(#neck-skin)" stroke="#d4a574" stroke-width="4"/>
    <path d="M136 96 Q138 52 190 52 Q242 52 244 96 Q220 68 190 68 Q160 68 136 96 Z" fill="#5b3a1a" stroke="#3d2109" stroke-width="3"/>
    <circle cx="172" cy="102" r="6" fill="#1e293b"/>
    <circle cx="208" cy="102" r="6" fill="#1e293b"/>
    <path d="M174 128 Q190 140 206 128" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Highlight ring on neck -->
  <rect x="162" y="168" width="56" height="40" rx="12" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Arrow pointing to neck -->
  <g stroke="#ef4444" stroke-width="6" stroke-linecap="round" fill="#ef4444">
    <line x1="320" y1="190" x2="238" y2="188"/>
    <path d="M238 188 L258 176 L258 200 Z" stroke="none"/>
  </g>
</svg>
