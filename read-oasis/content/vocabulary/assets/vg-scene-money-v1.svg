<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-money desc-money">
  <title id="title-money">Money</title>
  <desc id="desc-money">A stack of green paper banknotes and several shiny gold coins.</desc>
  <defs>
    <linearGradient id="money-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="money-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#money-bg)"/>
  <ellipse cx="200" cy="260" rx="160" ry="16" fill="#0f172a" opacity="0.12"/>

  <!-- Banknote stack -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="150" width="180" height="90" rx="8" fill="#4ade80" stroke="#15803d" stroke-width="4" transform="rotate(-4 150 195)"/>
    <rect x="70" y="140" width="180" height="90" rx="8" fill="#86efac" stroke="#15803d" stroke-width="4" transform="rotate(1 160 185)"/>
    <rect x="65" y="128" width="180" height="90" rx="8" fill="#4ade80" stroke="#166534" stroke-width="4"/>
    <!-- Note detail -->
    <circle cx="155" cy="173" r="24" fill="#bbf7d0" stroke="#166534" stroke-width="3"/>
    <path d="M155 160 c-6 -8 -16 -2 -16 5 c0 7 10 12 16 17 c6 -5 16 -10 16 -17 c0 -7 -10 -13 -16 -5 Z" fill="#15803d"/>
    <rect x="80" y="140" width="20" height="14" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <rect x="210" y="192" width="20" height="14" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  </g>

  <!-- Coins -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="290" cy="225" rx="34" ry="12" fill="#b45309"/>
    <circle cx="290" cy="205" r="34" fill="url(#money-coin)" stroke="#92400e" stroke-width="4"/>
    <circle cx="290" cy="205" r="24" fill="none" stroke="#a16207" stroke-width="2.5"/>
    <path d="M290 190 l4 12 l12 0 l-10 8 l4 12 l-10 -7 l-10 7 l4 -12 l-10 -8 l12 0 Z" fill="#fef9c3"/>
    <ellipse cx="325" cy="160" rx="28" ry="10" fill="#b45309"/>
    <circle cx="325" cy="145" r="28" fill="url(#money-coin)" stroke="#92400e" stroke-width="4"/>
  </g>
</svg>
