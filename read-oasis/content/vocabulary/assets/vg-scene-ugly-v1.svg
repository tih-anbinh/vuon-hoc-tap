<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ugly desc-ugly">
  <title id="title-ugly">Ugly - Silly ugly monster with warts</title>
  <desc id="desc-ugly">A comically ugly green monster with a crooked face, mismatched eyes, crooked teeth, warts and messy hair, next to a cracked mirror it just looked into.</desc>
  <defs>
    <linearGradient id="ug-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
    <linearGradient id="ug-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#ug-bg)"/>
  <!-- ground -->
  <rect x="0" y="245" width="400" height="55" fill="#65a30d"/>
  <line x1="0" y1="245" x2="400" y2="245" stroke="#3f6212" stroke-width="3.5"/>
  <ellipse cx="170" cy="262" rx="130" ry="13" fill="#0f172a" opacity="0.25"/>
  <!-- ugly monster (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- messy hair tufts -->
    <g stroke="#365314" stroke-width="6" stroke-linecap="round">
      <path d="M110,72 Q100,52 112,40"/>
      <path d="M140,62 Q140,40 128,32"/>
      <path d="M170,58 Q176,38 190,34"/>
      <path d="M200,64 Q214,48 228,50"/>
    </g>
    <!-- lumpy head -->
    <path d="M92,150 Q80,92 130,70 Q152,58 180,64 Q222,60 234,100 Q248,128 232,158 Q240,178 220,190 Q200,206 162,202 Q120,206 102,180 Q84,170 92,150 Z" fill="url(#ug-skin)" stroke="#365314" stroke-width="4.5"/>
    <!-- mismatched eyes: one big one small -->
    <circle cx="136" cy="118" r="20" fill="#ffffff" stroke="#365314" stroke-width="3.5"/>
    <circle cx="140" cy="122" r="8" fill="#0f172a"/>
    <circle cx="196" cy="108" r="11" fill="#ffffff" stroke="#365314" stroke-width="3.5"/>
    <circle cx="194" cy="110" r="5" fill="#0f172a"/>
    <!-- crooked uni-brow -->
    <path d="M112,96 Q140,84 162,96 Q184,80 214,92" fill="none" stroke="#365314" stroke-width="5" stroke-linecap="round"/>
    <!-- big crooked nose -->
    <path d="M158,124 Q146,150 164,158 Q176,162 178,150" fill="#65a30d" stroke="#365314" stroke-width="3.5"/>
    <circle cx="170" cy="154" r="2.5" fill="#365314"/>
    <!-- crooked mouth with uneven teeth -->
    <path d="M118,168 Q150,192 186,178 Q206,170 216,158" fill="none" stroke="#365314" stroke-width="4" stroke-linecap="round"/>
    <path d="M132,172 L134,184 L144,182 L142,172 Z" fill="#fef9c3" stroke="#365314" stroke-width="2.5"/>
    <path d="M168,180 L168,192 L178,190 L177,178 Z" fill="#fef9c3" stroke="#365314" stroke-width="2.5"/>
    <path d="M200,166 L204,176 L212,171 L208,162 Z" fill="#fef9c3" stroke="#365314" stroke-width="2.5"/>
    <!-- warts -->
    <g fill="#a3e635" stroke="#365314" stroke-width="2.5">
      <circle cx="110" cy="146" r="6"/>
      <circle cx="222" cy="132" r="6"/>
      <circle cx="150" cy="88" r="5"/>
      <circle cx="204" cy="188" r="5"/>
    </g>
    <g fill="#365314">
      <circle cx="110" cy="146" r="1.8"/>
      <circle cx="222" cy="132" r="1.8"/>
    </g>
    <!-- droopy ears -->
    <path d="M92,130 Q70,132 74,156 Q78,170 92,162" fill="#84cc16" stroke="#365314" stroke-width="3.5"/>
    <path d="M234,116 Q256,114 254,140 Q252,156 236,148" fill="#84cc16" stroke="#365314" stroke-width="3.5"/>
    <!-- stubby body -->
    <path d="M128,202 L196,202 L206,256 L118,256 Z" fill="#84cc16" stroke="#365314" stroke-width="4"/>
    <!-- patched shirt -->
    <rect x="146" y="218" width="22" height="18" fill="#f59e0b" stroke="#92400e" stroke-width="2.5" transform="rotate(8 157 227)"/>
    <!-- stubby feet -->
    <ellipse cx="140" cy="260" rx="18" ry="8" fill="#65a30d" stroke="#365314" stroke-width="3"/>
    <ellipse cx="184" cy="260" rx="18" ry="8" fill="#65a30d" stroke="#365314" stroke-width="3"/>
  </g>
  <!-- cracked mirror -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="322" cy="150" rx="48" ry="66" fill="#e0f2fe" stroke="#92400e" stroke-width="6"/>
    <!-- crack lines from looking at monster -->
    <g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M322,96 L312,128 L326,150 L310,178 L320,204"/>
      <path d="M312,128 L292,138"/>
      <path d="M326,150 L350,158"/>
      <path d="M310,178 L292,186"/>
    </g>
    <!-- mirror stand -->
    <rect x="314" y="214" width="16" height="30" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <rect x="296" y="242" width="52" height="12" rx="5" fill="#92400e" stroke="#78350f" stroke-width="3"/>
  </g>
  <!-- fly buzzing around monster -->
  <g>
    <circle cx="86" cy="82" r="5" fill="#334155"/>
    <ellipse cx="81" cy="78" rx="5" ry="3" fill="#cbd5e1" opacity="0.9" transform="rotate(-25 81 78)"/>
    <ellipse cx="91" cy="78" rx="5" ry="3" fill="#cbd5e1" opacity="0.9" transform="rotate(25 91 78)"/>
    <path d="M84,90 Q72,98 76,108 Q82,116 92,110" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,4"/>
  </g>
</svg>
