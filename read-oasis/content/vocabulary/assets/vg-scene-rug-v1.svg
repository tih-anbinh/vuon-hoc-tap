<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-rug desc-rug">
  <title id="title-rug">Rug - Colorful patterned rug on the floor</title>
  <desc id="desc-rug">A big colorful oval rug with rings of red, yellow and teal and fringe at the ends, lying on a wooden floor with a cat napping on it.</desc>
  <defs>
    <linearGradient id="rg-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b478"/>
      <stop offset="100%" stop-color="#d6a35c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- wall hint -->
  <rect x="0" y="0" width="400" height="70" fill="#fef3c7"/>
  <line x1="0" y1="70" x2="400" y2="70" stroke="#a16207" stroke-width="3"/>
  <!-- wooden floor -->
  <rect x="0" y="70" width="400" height="230" fill="url(#rg-floor)"/>
  <g stroke="#a16207" stroke-width="2" opacity="0.6">
    <line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="155" x2="400" y2="155"/>
    <line x1="0" y1="205" x2="400" y2="205"/>
    <line x1="0" y1="255" x2="400" y2="255"/>
    <line x1="120" y1="70" x2="120" y2="110"/>
    <line x1="280" y1="110" x2="280" y2="155"/>
    <line x1="90" y1="155" x2="90" y2="205"/>
    <line x1="310" y1="205" x2="310" y2="255"/>
  </g>
  <!-- rug -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="200" cy="185" rx="160" ry="78" fill="#dc2626" stroke="#7f1d1d" stroke-width="4.5"/>
    <ellipse cx="200" cy="185" rx="128" ry="61" fill="#fbbf24" stroke="#b45309" stroke-width="3.5"/>
    <ellipse cx="200" cy="185" rx="96" ry="45" fill="#0d9488" stroke="#134e4a" stroke-width="3.5"/>
    <ellipse cx="200" cy="185" rx="64" ry="30" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <!-- diamond motifs on middle ring -->
    <g fill="#7f1d1d">
      <path d="M200,112 L208,122 L200,132 L192,122 Z"/>
      <path d="M200,238 L208,248 L200,258 L192,248 Z"/>
      <path d="M78,180 L88,185 L78,192 L70,185 Z"/>
      <path d="M322,180 L332,185 L322,192 L314,185 Z"/>
    </g>
    <!-- fringe at both ends -->
    <g stroke="#78350f" stroke-width="3.5" stroke-linecap="round">
      <line x1="38" y1="168" x2="24" y2="164"/>
      <line x1="36" y1="180" x2="21" y2="179"/>
      <line x1="36" y1="192" x2="21" y2="193"/>
      <line x1="40" y1="204" x2="26" y2="208"/>
      <line x1="362" y1="168" x2="376" y2="164"/>
      <line x1="364" y1="180" x2="379" y2="179"/>
      <line x1="364" y1="192" x2="379" y2="193"/>
      <line x1="360" y1="204" x2="374" y2="208"/>
    </g>
  </g>
  <!-- cat napping on rug -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="200" cy="185" rx="34" ry="22" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
    <circle cx="172" cy="176" r="15" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
    <path d="M161,166 L158,152 L170,162 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
    <path d="M182,164 L186,151 L174,160 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
    <!-- closed sleeping eyes -->
    <path d="M165,176 Q168,179 171,176" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <path d="M175,176 Q178,179 181,176" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <!-- tail curled -->
    <path d="M232,192 Q252,196 250,180 Q248,170 236,172" fill="none" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
    <!-- stripes -->
    <g stroke="#c2410c" stroke-width="2.5" stroke-linecap="round">
      <path d="M195,168 Q200,172 205,168"/>
      <path d="M208,175 Q213,179 218,175"/>
    </g>
  </g>
  <!-- zzz -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M150,140 L162,140 L150,152 L162,152"/>
    <path d="M170,122 L179,122 L170,131 L179,131"/>
  </g>
</svg>
