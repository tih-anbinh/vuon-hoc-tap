<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-father desc-father">
  <title id="title-father">father</title>
  <desc id="desc-father">A tall man (father) standing with a warm smile.</desc>
  <rect width="400" height="300" rx="20" fill="#FFF8E1"/>
  <rect y="240" width="400" height="60" rx="0" fill="#C8E6C9"/>
  <g transform="translate(200, 30)">
    <!-- Legs -->
    <rect x="-14" y="130" width="12" height="55" rx="5" fill="#455A64"/>
    <rect x="2" y="130" width="12" height="55" rx="5" fill="#455A64"/>
    <!-- Shoes -->
    <ellipse cx="-8" cy="188" rx="12" ry="6" fill="#37474F"/>
    <ellipse cx="8" cy="188" rx="12" ry="6" fill="#37474F"/>
    <!-- Body (shirt) -->
    <ellipse cx="0" cy="95" rx="28" ry="42" fill="#66BB6A" stroke="#43A047" stroke-width="2"/>
    <!-- Collar -->
    <path d="M-8,58 L0,68 L8,58" fill="none" stroke="#43A047" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-14" y1="70" x2="-35" y2="110" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
    <line x1="14" y1="70" x2="35" y2="110" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="-37" cy="112" r="6" fill="#FFCC80"/>
    <circle cx="37" cy="112" r="6" fill="#FFCC80"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="28" fill="#FFCC80" stroke="#F9A825" stroke-width="2"/>
    <!-- Hair (short, neat) -->
    <path d="M-22,10 Q-18,-8 0,-10 Q18,-8 22,10" fill="#4E342E" stroke="#3E2723" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="-8" cy="24" r="3.5" fill="#4E342E"/>
    <circle cx="8" cy="24" r="3.5" fill="#4E342E"/>
    <circle cx="-7" cy="23" r="1.2" fill="white"/>
    <circle cx="9" cy="23" r="1.2" fill="white"/>
    <path d="M-6,36 Q0,42 6,36" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <!-- Glasses -->
    <circle cx="-8" cy="24" r="7" fill="none" stroke="#795548" stroke-width="1.5"/>
    <circle cx="8" cy="24" r="7" fill="none" stroke="#795548" stroke-width="1.5"/>
    <line x1="-1" y1="24" x2="1" y2="24" stroke="#795548" stroke-width="1.5"/>
  </g>
</svg>
