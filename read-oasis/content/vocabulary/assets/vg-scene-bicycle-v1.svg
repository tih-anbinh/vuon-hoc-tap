<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bicycle desc-bicycle">
  <title id="title-bicycle">Bicycle</title>
  <desc id="desc-bicycle">A red bicycle with two spoked wheels, a frame, handlebars, a seat, and pedals.</desc>
  <defs>
    <linearGradient id="bicycle-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#bicycle-bg)"/>
  <ellipse cx="200" cy="255" rx="160" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Wheels -->
    <circle cx="105" cy="200" r="58" fill="none" stroke="#1f2937" stroke-width="9"/>
    <circle cx="105" cy="200" r="52" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="295" cy="200" r="58" fill="none" stroke="#1f2937" stroke-width="9"/>
    <circle cx="295" cy="200" r="52" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <!-- Spokes -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="105" y1="148" x2="105" y2="252"/>
      <line x1="53" y1="200" x2="157" y2="200"/>
      <line x1="68" y1="163" x2="142" y2="237"/>
      <line x1="142" y1="163" x2="68" y2="237"/>
      <line x1="295" y1="148" x2="295" y2="252"/>
      <line x1="243" y1="200" x2="347" y2="200"/>
      <line x1="258" y1="163" x2="332" y2="237"/>
      <line x1="332" y1="163" x2="258" y2="237"/>
    </g>
    <circle cx="105" cy="200" r="8" fill="#6b7280" stroke="#1e293b" stroke-width="2"/>
    <circle cx="295" cy="200" r="8" fill="#6b7280" stroke="#1e293b" stroke-width="2"/>
    <!-- Frame -->
    <g stroke="#dc2626" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="105" y1="200" x2="200" y2="200"/>
      <line x1="200" y1="200" x2="160" y2="120"/>
      <line x1="105" y1="200" x2="160" y2="120"/>
      <line x1="200" y1="200" x2="250" y2="120"/>
      <line x1="250" y1="120" x2="295" y2="200"/>
    </g>
    <!-- Handlebar -->
    <line x1="250" y1="120" x2="270" y2="105" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
    <line x1="255" y1="102" x2="285" y2="102" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    <!-- Seat -->
    <ellipse cx="155" cy="115" rx="20" ry="8" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <!-- Pedals -->
    <circle cx="200" cy="200" r="12" fill="#374151" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="200" y1="200" x2="215" y2="220" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <rect x="210" y="218" width="16" height="6" rx="2" fill="#1f2937"/>
  </g>
</svg>
