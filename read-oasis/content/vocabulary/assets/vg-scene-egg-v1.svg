<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-egg desc-egg">
  <title id="title-egg">Egg - Whole egg and golden yolk</title>
  <desc id="desc-egg">A smooth brown egg in an egg cup next to a cracked egg shell displaying a bright golden yolk, occupying the center of the frame.</desc>
  <defs>
    <radialGradient id="egg-shell" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba462"/>
    </radialGradient>
    <radialGradient id="yolk-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadows -->
  <ellipse cx="140" cy="265" rx="55" ry="10" fill="#0f172a" opacity="0.15"/>
  <ellipse cx="275" cy="265" rx="75" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: EGG (Occupying 70% canvas) -->
  <g id="egg-figure" filter="url(#soft-shadow)">
    <!-- WHOLE EGG IN CERAMIC CUP -->
    <!-- Upright Whole Egg -->
    <path d="M140 60 C180 60 190 145 185 180 C180 205 100 205 95 180 C90 145 100 60 140 60 Z" fill="url(#egg-shell)" stroke="#ea580c" stroke-width="3.5"/>
    <!-- Egg gentle highlight -->
    <path d="M125 80 C115 100 112 135 115 155" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Ceramic Egg Cup -->
    <path d="M92 175 C92 165 188 165 188 175 C188 215 160 230 148 240 L155 255 L125 255 L132 240 C120 230 92 215 92 175 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3.5"/>
    <ellipse cx="140" cy="175" rx="48" ry="10" fill="#7dd3fc" stroke="#0284c7" stroke-width="3"/>
    <ellipse cx="140" cy="255" rx="25" ry="6" fill="#0284c7"/>

    <!-- CRACKED EGG WITH GOLDEN YOLK (Beside it) -->
    <!-- Egg White / Albumen Pool -->
    <path d="M225 240 C200 245 210 262 235 260 C260 258 290 265 320 260 C345 255 355 240 335 235 C310 230 280 232 260 230 C240 228 235 238 225 240 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Bright Round Golden Yolk -->
    <circle cx="280" cy="225" r="32" fill="url(#yolk-grad)" stroke="#c2410c" stroke-width="3"/>
    <circle cx="270" cy="215" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="288" cy="235" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Cracked Half Shell Beside It -->
    <path d="M310 185 L320 170 L330 190 L345 168 L355 195 C365 215 350 245 325 245 C305 245 295 220 310 185 Z" fill="url(#egg-shell)" stroke="#ea580c" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M318 182 L324 176 L332 188 L342 174 L348 190" fill="none" stroke="#fff7ed" stroke-width="2"/>
  </g>
</svg>