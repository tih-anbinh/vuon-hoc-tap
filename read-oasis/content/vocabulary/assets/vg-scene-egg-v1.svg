<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-egg d-egg">
  <title id="t-egg">Egg</title>
  <desc id="d-egg">One large smooth white egg standing upright in the centre of the card.</desc>
  <defs>
    <radialGradient id="egg-body" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fdf2e3"/>
      <stop offset="100%" stop-color="#f5d9b0"/>
    </radialGradient>
    <filter id="egg-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#fef3c7"/>
  <ellipse cx="200" cy="258" rx="90" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#egg-sh)">
    <!-- Egg: narrower top, rounder bottom -->
    <path d="M200 52
             C150 52 118 132 118 178
             C118 222 154 256 200 256
             C246 256 282 222 282 178
             C282 132 250 52 200 52 Z"
          fill="url(#egg-body)" stroke="#d6ad78" stroke-width="5"/>
    <!-- soft highlight -->
    <ellipse cx="172" cy="120" rx="24" ry="38" fill="#ffffff" opacity="0.55" transform="rotate(-18 172 120)"/>
  </g>
</svg>
