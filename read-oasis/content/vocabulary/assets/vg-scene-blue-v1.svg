<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-blue desc-blue">
  <title id="title-blue">Blue</title>
  <desc id="desc-blue">A wooden artist palette with a large dominant blue paint blob and a brush loaded with blue paint, teaching the colour blue.</desc>
  <defs>
    <radialGradient id="blue-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <linearGradient id="blue-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="blue-blob" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#blue-bg)"/>
  <ellipse cx="200" cy="272" rx="140" ry="18" fill="#0f172a" opacity="0.1"/>

  <g id="palette" filter="url(#soft-shadow)">
    <!-- Wooden palette -->
    <path d="M96 96 C160 60 260 60 316 104 C356 136 356 196 300 214 C280 220 268 206 250 210 C222 216 214 244 176 250 C120 258 66 224 62 168 C60 134 72 112 96 96 Z"
          fill="url(#blue-wood)" stroke="#92400e" stroke-width="5" stroke-linejoin="round"/>
    <!-- Thumb hole -->
    <ellipse cx="150" cy="210" rx="22" ry="16" fill="#eab308" stroke="#92400e" stroke-width="4"/>
    <!-- Small daubs of other colours around edge -->
    <circle cx="130" cy="120" r="15" fill="#ef4444"/>
    <circle cx="190" cy="104" r="15" fill="#facc15"/>
    <circle cx="252" cy="112" r="15" fill="#22c55e"/>
    <circle cx="300" cy="160" r="14" fill="#a855f7"/>

    <!-- DOMINANT BLUE BLOB -->
    <ellipse cx="200" cy="175" rx="70" ry="54" fill="url(#blue-blob)" stroke="#1e3a8a" stroke-width="4.5"/>
    <ellipse cx="182" cy="158" rx="22" ry="14" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Brush loaded with blue -->
  <g id="brush" filter="url(#soft-shadow)" transform="translate(300 210) rotate(38)">
    <rect x="-9" y="-150" width="18" height="120" rx="8" fill="#d97706" stroke="#92400e" stroke-width="3"/>
    <rect x="-11" y="-32" width="22" height="20" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <path d="M-11 -12 C-11 20 0 34 0 34 C0 34 11 20 11 -12 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2.5"/>
  </g>
</svg>
