<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hotel desc-hotel">
  <title id="title-hotel">Hotel</title>
  <desc id="desc-hotel">A tall hotel building with many balcony windows, a red entrance awning, and a star sign.</desc>
  <defs>
    <linearGradient id="hotel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="hotel-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e7d5a8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#hotel-bg)"/>
  <circle cx="345" cy="50" r="22" fill="#fde047"/>
  <rect x="0" y="270" width="400" height="30" fill="#94a3b8"/>

  <g filter="url(#soft-shadow)">
    <!-- Building -->
    <rect x="110" y="55" width="180" height="215" fill="url(#hotel-body)" stroke="#1e293b" stroke-width="4"/>
    <!-- Roof line -->
    <rect x="104" y="45" width="192" height="14" rx="3" fill="#b45309" stroke="#1e293b" stroke-width="3"/>
    <!-- Star sign -->
    <path d="M200 30 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <!-- Windows grid -->
    <g fill="#60a5fa" stroke="#1e293b" stroke-width="2.5">
      <rect x="128" y="75" width="30" height="26"/>
      <rect x="185" y="75" width="30" height="26"/>
      <rect x="242" y="75" width="30" height="26"/>
      <rect x="128" y="120" width="30" height="26"/>
      <rect x="185" y="120" width="30" height="26"/>
      <rect x="242" y="120" width="30" height="26"/>
      <rect x="128" y="165" width="30" height="26"/>
      <rect x="185" y="165" width="30" height="26"/>
      <rect x="242" y="165" width="30" height="26"/>
    </g>
    <!-- Balcony rails -->
    <g stroke="#78350f" stroke-width="2.5">
      <line x1="124" y1="106" x2="162" y2="106"/>
      <line x1="181" y1="106" x2="219" y2="106"/>
      <line x1="238" y1="106" x2="276" y2="106"/>
    </g>
    <!-- Entrance -->
    <rect x="175" y="225" width="50" height="45" fill="#78350f" stroke="#1e293b" stroke-width="3"/>
    <!-- Awning -->
    <path d="M160 215 L240 215 L250 235 L150 235 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <g fill="#f8fafc">
      <path d="M158 235 l14 0 l-7 8 Z"/>
      <path d="M186 235 l14 0 l-7 8 Z"/>
      <path d="M214 235 l14 0 l-7 8 Z"/>
      <path d="M242 235 l-14 0 l7 8 Z"/>
    </g>
  </g>
</svg>
