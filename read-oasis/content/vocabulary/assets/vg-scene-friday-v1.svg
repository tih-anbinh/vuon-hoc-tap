<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-friday desc-friday">
  <title id="title-friday">Friday - Fifth day of the week on the calendar</title>
  <desc id="desc-friday">A wall calendar showing a week of seven day squares with the fifth day circled in red and marked with five dots and a star, while a happy child celebrates because the weekend is coming.</desc>
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#fr-bg)"/>
  <rect x="0" y="252" width="400" height="48" fill="#fbbf24"/>
  <line x1="0" y1="252" x2="400" y2="252" stroke="#b45309" stroke-width="3.5"/>
  <!-- THE CALENDAR (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- board -->
    <rect x="36" y="36" width="328" height="160" rx="12" fill="#ffffff" stroke="#334155" stroke-width="5"/>
    <!-- header band -->
    <rect x="36" y="36" width="328" height="34" rx="12" fill="#3b82f6" stroke="#334155" stroke-width="5"/>
    <rect x="36" y="56" width="328" height="14" fill="#3b82f6"/>
    <!-- hanging rings -->
    <circle cx="110" cy="36" r="8" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="290" cy="36" r="8" fill="none" stroke="#334155" stroke-width="4"/>
    <!-- sun icon in header -->
    <circle cx="200" cy="53" r="9" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <g stroke="#fde047" stroke-width="2.5" stroke-linecap="round">
      <line x1="200" y1="38" x2="200" y2="42"/>
      <line x1="200" y1="64" x2="200" y2="68"/>
      <line x1="186" y1="53" x2="182" y2="53"/>
      <line x1="214" y1="53" x2="218" y2="53"/>
    </g>
    <!-- 7 day squares -->
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="3">
      <rect x="48" y="86" width="38" height="52" rx="5"/>
      <rect x="92" y="86" width="38" height="52" rx="5"/>
      <rect x="136" y="86" width="38" height="52" rx="5"/>
      <rect x="180" y="86" width="38" height="52" rx="5"/>
      <rect x="224" y="86" width="38" height="52" rx="5" fill="#fef08a"/>
      <rect x="268" y="86" width="38" height="52" rx="5" fill="#e0f2fe"/>
      <rect x="312" y="86" width="38" height="52" rx="5" fill="#e0f2fe"/>
    </g>
    <!-- day-count dots: 1..7 -->
    <g fill="#475569">
      <circle cx="67" cy="106" r="4"/>
      <circle cx="105" cy="106" r="4"/><circle cx="117" cy="106" r="4"/>
      <circle cx="147" cy="106" r="4"/><circle cx="155" cy="106" r="4"/><circle cx="163" cy="106" r="4"/>
      <circle cx="189" cy="106" r="4"/><circle cx="197" cy="106" r="4"/><circle cx="189" cy="118" r="4"/><circle cx="197" cy="118" r="4"/>
    </g>
    <!-- FRIDAY: five dots + star -->
    <g fill="#b45309">
      <circle cx="233" cy="102" r="4"/><circle cx="243" cy="102" r="4"/><circle cx="253" cy="102" r="4"/>
      <circle cx="238" cy="114" r="4"/><circle cx="248" cy="114" r="4"/>
    </g>
    <path d="M243,120 L246,128 L254,128 L248,133 L250,141 L243,136 L236,141 L238,133 L232,128 L240,128 Z" fill="#f59e0b" stroke="#a16207" stroke-width="2"/>
    <!-- weekend days: 6 and 7 dots -->
    <g fill="#0284c7">
      <circle cx="279" cy="102" r="3.5"/><circle cx="288" cy="102" r="3.5"/><circle cx="297" cy="102" r="3.5"/>
      <circle cx="279" cy="113" r="3.5"/><circle cx="288" cy="113" r="3.5"/><circle cx="297" cy="113" r="3.5"/>
      <circle cx="323" cy="102" r="3.5"/><circle cx="331" cy="102" r="3.5"/><circle cx="339" cy="102" r="3.5"/>
      <circle cx="323" cy="113" r="3.5"/><circle cx="331" cy="113" r="3.5"/><circle cx="339" cy="113" r="3.5"/>
      <circle cx="331" cy="124" r="3.5"/>
    </g>
    <!-- big red circle around Friday -->
    <ellipse cx="243" cy="112" rx="30" ry="38" fill="none" stroke="#dc2626" stroke-width="5"/>
    <!-- checkmarks on past days -->
    <g stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56,124 L63,131 L78,116"/>
      <path d="M100,124 L107,131 L122,116"/>
      <path d="M144,124 L151,131 L166,116"/>
      <path d="M188,128 L193,133 L206,122"/>
    </g>
  </g>
  <!-- celebrating child -->
  <g filter="url(#soft-shadow)">
    <circle cx="110" cy="216" r="22" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M90,208 Q90,190 110,188 Q130,190 130,208 L124,212 Q110,198 96,212 Z" fill="#451a03" stroke="#1c1917" stroke-width="2.5"/>
    <circle cx="103" cy="213" r="2.8" fill="#0f172a"/>
    <circle cx="117" cy="213" r="2.8" fill="#0f172a"/>
    <path d="M101,222 Q110,230 119,222" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M94,238 L126,238 L132,278 L88,278 Z" fill="#ec4899" stroke="#831843" stroke-width="3.5"/>
    <!-- arms raised in joy -->
    <path d="M96,244 Q76,228 72,208" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <path d="M124,244 Q144,228 148,208" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="72" cy="204" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="148" cy="204" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
  </g>
  <!-- celebration sparks -->
  <g fill="#f472b6" stroke="#be185d" stroke-width="2">
    <path d="M170,218 L173,226 L181,228 L173,230 L170,238 L167,230 L159,228 L167,226 Z"/>
    <path d="M56,182 L58,188 L64,190 L58,192 L56,198 L54,192 L48,190 L54,188 Z"/>
  </g>
</svg>
