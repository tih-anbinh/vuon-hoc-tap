<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-friday desc-friday">
  <title id="title-friday">Friday - The last school day before the weekend</title>
  <desc id="desc-friday">A weekly strip of seven day cards. Four school days are already ticked, the fifth card is the big highlighted day with a happy face, and the last two weekend cards show a sun and a ball. A cheering child stands beside it.</desc>
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="fr-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#fr-bg)"/>
  <rect x="0" y="256" width="400" height="44" fill="#fbbf24"/>
  <line x1="0" y1="256" x2="400" y2="256" stroke="#b45309" stroke-width="3.5"/>

  <!-- Week strip of 7 day cards (position, not counting) -->
  <g filter="url(#fr-sh)">
    <rect x="24" y="70" width="352" height="96" rx="12" fill="#ffffff" stroke="#334155" stroke-width="5"/>
  </g>
  <!-- 5 weekday cards (grey), 4 already ticked -->
  <g stroke="#64748b" stroke-width="3">
    <rect x="36"  y="82" width="44" height="72" rx="6" fill="#e2e8f0"/>
    <rect x="86"  y="82" width="44" height="72" rx="6" fill="#e2e8f0"/>
    <rect x="136" y="82" width="44" height="72" rx="6" fill="#e2e8f0"/>
    <rect x="186" y="82" width="44" height="72" rx="6" fill="#e2e8f0"/>
    <!-- FRIDAY: the big highlighted 5th weekday -->
    <rect x="236" y="76" width="48" height="84" rx="7" fill="#fde047" stroke="#dc2626" stroke-width="5"/>
    <!-- 2 weekend cards (blue) -->
    <rect x="290" y="82" width="40" height="72" rx="6" fill="#bae6fd"/>
    <rect x="336" y="82" width="40" height="72" rx="6" fill="#bae6fd"/>
  </g>
  <!-- ticks on the 4 finished weekdays -->
  <g stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46,118 L54,127 L70,108"/>
    <path d="M96,118 L104,127 L120,108"/>
    <path d="M146,118 L154,127 L170,108"/>
    <path d="M196,118 L204,127 L220,108"/>
  </g>
  <!-- Friday card: big happy face (this is the day!) -->
  <g>
    <circle cx="260" cy="112" r="20" fill="#fbbf24" stroke="#a16207" stroke-width="3"/>
    <circle cx="253" cy="108" r="2.8" fill="#0f172a"/>
    <circle cx="267" cy="108" r="2.8" fill="#0f172a"/>
    <path d="M250,118 Q260,128 270,118" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- weekend icons: sun + play ball (fun is coming) -->
  <g>
    <circle cx="310" cy="112" r="12" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="310" y1="94" x2="310" y2="88"/><line x1="310" y1="130" x2="310" y2="136"/>
      <line x1="292" y1="112" x2="286" y2="112"/><line x1="328" y1="112" x2="334" y2="112"/>
    </g>
    <circle cx="356" cy="114" r="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <path d="M356,101 L356,127 M343,114 L369,114" stroke="#7f1d1d" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- arrow from Friday toward the weekend (fun soon) -->
  <path d="M262,182 Q300,196 330,186" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  <path d="M330,186 l-12,-4 M330,186 l-8,10" stroke="#ec4899" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- celebrating child -->
  <g filter="url(#fr-sh)">
    <circle cx="96" cy="216" r="22" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M76,208 Q76,190 96,188 Q116,190 116,208 L110,212 Q96,198 82,212 Z" fill="#451a03" stroke="#1c1917" stroke-width="2.5"/>
    <circle cx="89" cy="213" r="2.8" fill="#0f172a"/>
    <circle cx="103" cy="213" r="2.8" fill="#0f172a"/>
    <path d="M87,222 Q96,231 105,222" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M80,238 L112,238 L118,282 L74,282 Z" fill="#ec4899" stroke="#831843" stroke-width="3.5"/>
    <path d="M82,244 Q62,228 58,208" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <path d="M110,244 Q130,228 134,208" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="58" cy="204" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="134" cy="204" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
  </g>
  <g fill="#f472b6" stroke="#be185d" stroke-width="2">
    <path d="M150,214 L153,222 L161,224 L153,226 L150,234 L147,226 L139,224 L147,222 Z"/>
    <path d="M44,182 L46,188 L52,190 L46,192 L44,198 L42,192 L36,190 L42,188 Z"/>
  </g>
</svg>
