<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-jump desc-jump">
  <title id="title-jump">Jump - Child leaping in mid-air</title>
  <desc id="desc-jump">A joyful child leaping high in the air with arms raised and knees bent, casting a detached shadow below with upward motion lines.</desc>
  <defs>
    <linearGradient id="shirt-jump" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- DETACHED GROUND SHADOW (Crucial cue: shows kid is high off the floor) -->
  <ellipse cx="200" cy="265" rx="45" ry="10" fill="#0f172a" opacity="0.2"/>

  <!-- Upward motion burst lines showing leap from ground -->
  <g id="jump-motion-lines" stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <!-- Center upward energy rays -->
    <line x1="200" y1="245" x2="200" y2="215" stroke-width="4"/>
    <line x1="170" y1="248" x2="160" y2="220"/>
    <line x1="230" y1="248" x2="240" y2="220"/>
    <!-- Spring wind marks -->
    <path d="M140 250 Q130 235 140 220" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M260 250 Q270 235 260 220" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  </g>

  <!-- TARGET CHARACTER: Mo jumping high in air (occupying 65% canvas) -->
  <g id="jumping-child" filter="url(#soft-shadow)">
    <!-- Left Leg (bent up in mid-air leap) -->
    <path d="M185 145 L160 170 L175 195" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Sneaker -->
    <path d="M175 195 L160 205 L185 210 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Right Leg (bent up in mid-air leap) -->
    <path d="M215 145 L240 170 L225 195" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Sneaker -->
    <path d="M225 195 L240 205 L215 210 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Shorts -->
    <path d="M175 125 L225 125 L230 155 L205 155 L200 148 L195 155 L170 155 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Torso / Shirt -->
    <rect x="175" y="85" width="50" height="45" rx="8" fill="url(#shirt-jump)" stroke="#d97706" stroke-width="3.5"/>

    <!-- Left Arm (raised high in the air \o ) -->
    <path d="M175 95 L140 65 L130 40" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand open joyfully -->
    <circle cx="128" cy="36" r="10" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>

    <!-- Right Arm (raised high in the air o/ ) -->
    <path d="M225 95 L260 65 L270 40" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand open joyfully -->
    <circle cx="272" cy="36" r="10" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>

    <!-- Head -->
    <circle cx="200" cy="58" r="28" fill="#fed7aa" stroke="#c2410c" stroke-width="3.5"/>

    <!-- Cap / Hair -->
    <path d="M180 50 C180 32 220 32 220 50 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <path d="M210 48 Q235 46 242 54 Q226 56 214 54" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>

    <!-- Face: Joyful closed curve eyes, laughing mouth -->
    <path d="M188 56 Q194 50 198 56" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M204 56 Q210 50 214 56" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="184" cy="62" r="5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="216" cy="62" r="5" fill="#fca5a5" opacity="0.6"/>
    <!-- Big joyful smile -->
    <path d="M192 64 Q201 76 210 64 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M196 66 Q201 70 206 66" fill="#ffffff"/>
  </g>
</svg>