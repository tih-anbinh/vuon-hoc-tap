<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-crayon desc-crayon">
  <title id="title-crayon">Crayon - Wax crayon</title>
  <desc id="desc-crayon">A bright orange wax crayon with a paper wrapper, a sharp tip, and a small colourful scribble beside it.</desc>
  <defs>
    <linearGradient id="crayon-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="crayon-tip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="60" y1="265" x2="340" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="130" ry="8" fill="#0f172a" opacity="0.1"/>
  <g id="crayon-figure" filter="url(#soft-shadow)" transform="rotate(-15 200 170)">
    <!-- Back (flat) end -->
    <ellipse cx="65" cy="170" rx="8" ry="22" fill="#c2410c" stroke="#7c2d12" stroke-width="2.5"/>
    <!-- Wrapper body -->
    <rect x="65" y="148" width="235" height="44" fill="url(#crayon-body)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Wrapper top edge decoration -->
    <rect x="65" y="148" width="235" height="8" fill="#c2410c" stroke="#7c2d12" stroke-width="2"/>
    <!-- Wrapper bottom edge decoration -->
    <rect x="65" y="184" width="235" height="8" fill="#c2410c" stroke="#7c2d12" stroke-width="2"/>
    <!-- Wrapper diagonal stripes -->
    <line x1="100" y1="156" x2="105" y2="184" stroke="#7c2d12" stroke-width="1.5" opacity="0.4"/>
    <line x1="140" y1="156" x2="145" y2="184" stroke="#7c2d12" stroke-width="1.5" opacity="0.4"/>
    <line x1="180" y1="156" x2="185" y2="184" stroke="#7c2d12" stroke-width="1.5" opacity="0.4"/>
    <line x1="220" y1="156" x2="225" y2="184" stroke="#7c2d12" stroke-width="1.5" opacity="0.4"/>
    <line x1="260" y1="156" x2="265" y2="184" stroke="#7c2d12" stroke-width="1.5" opacity="0.4"/>
    <!-- Wax tip (exposed wax cone) -->
    <path d="M300 148 L340 170 L300 192 Z" fill="url(#crayon-tip)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Highlight on tip -->
    <path d="M305 155 L325 168" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Body shine -->
    <path d="M75 158 L295 158" fill="none" stroke="#fdba74" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Scribble made by the crayon (rotated back to normal) -->
  <path d="M120 90 Q140 70 160 90 Q180 110 200 90 Q220 70 240 90" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M130 105 Q150 85 170 105 Q190 125 210 105 Q230 85 250 105" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>