<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-backpack desc-backpack">
  <title id="title-backpack">Backpack</title>
  <desc id="desc-backpack">A blue school backpack with shoulder straps, a front pocket, and a zipper.</desc>
  <defs>
    <linearGradient id="backpack-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="backpack-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#backpack-bg)"/>
  <ellipse cx="200" cy="270" rx="120" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Straps -->
    <path d="M150 90 Q130 150 145 230" fill="none" stroke="#1e40af" stroke-width="16" stroke-linecap="round"/>
    <path d="M250 90 Q270 150 255 230" fill="none" stroke="#1e40af" stroke-width="16" stroke-linecap="round"/>
    <!-- Main body -->
    <rect x="120" y="80" width="160" height="180" rx="34" fill="url(#backpack-body)" stroke="#1e293b" stroke-width="4"/>
    <!-- Top handle -->
    <path d="M180 80 Q200 55 220 80" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- Front pocket -->
    <path d="M135 170 L265 170 L265 230 Q265 248 247 248 L153 248 Q135 248 135 230 Z" fill="#60a5fa" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Zipper -->
    <path d="M135 165 Q200 150 265 165" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <path d="M135 165 Q200 150 265 165" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="200" cy="157" r="8" fill="#facc15" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Pocket zipper -->
    <path d="M148 178 Q200 170 252 178" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="174" r="6" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
