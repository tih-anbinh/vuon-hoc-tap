<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-river desc-river">
  <title id="title-river">River</title>
  <desc id="desc-river">A winding blue river flowing through green grassy banks between rolling hills.</desc>
  <defs>
    <linearGradient id="river-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="river-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="130" fill="url(#river-sky)"/>
  <circle cx="330" cy="50" r="28" fill="#fde047" stroke="#f59e0b" stroke-width="3"/>
  <!-- Hills -->
  <path d="M0 130 Q80 80 160 130 Z" fill="#4ade80"/>
  <path d="M120 130 Q210 70 300 130 Z" fill="#22c55e"/>
  <path d="M260 130 Q340 85 400 130 Z" fill="#4ade80"/>

  <!-- Grass -->
  <rect x="0" y="120" width="400" height="180" fill="#65a30d"/>

  <!-- River winding -->
  <g filter="url(#soft-shadow)">
    <path d="M170 120 Q150 170 210 200 Q270 230 200 260 Q150 285 190 300 L250 300 Q220 280 265 255 Q320 225 250 195 Q200 170 225 120 Z" fill="url(#river-water)" stroke="#0369a1" stroke-width="3"/>
  </g>
  <!-- Water ripples -->
  <g fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M185 150 q15 -6 28 4"/>
    <path d="M215 210 q15 -6 28 4"/>
    <path d="M195 265 q15 -6 28 4"/>
  </g>

  <!-- Reeds -->
  <g stroke="#166534" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="200" x2="90" y2="160"/>
    <line x1="98" y1="205" x2="100" y2="170"/>
    <line x1="320" y1="230" x2="320" y2="190"/>
    <line x1="328" y1="235" x2="330" y2="200"/>
  </g>
</svg>
