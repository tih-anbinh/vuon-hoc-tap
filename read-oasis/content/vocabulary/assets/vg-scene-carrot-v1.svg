<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-carrot desc-carrot">
  <title id="title-carrot">Carrot - Fresh orange carrot</title>
  <desc id="desc-carrot">A large bright orange carrot with a pointed tip, horizontal lines, and bushy green leaves on top.</desc>
  <defs>
    <linearGradient id="carrot-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="60" y1="270" x2="340" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="50" ry="6" fill="#0f172a" opacity="0.1"/>

  <g id="carrot-figure" filter="url(#soft-shadow)">
    <!-- Green leafy top -->
    <path d="M200 75 C180 40 150 25 160 15 C170 5 185 20 200 45" fill="#22c55e" stroke="#16a34a" stroke-width="2.5"/>
    <path d="M200 75 C200 35 195 10 210 5 C225 0 220 25 200 55" fill="#4ade80" stroke="#16a34a" stroke-width="2.5"/>
    <path d="M200 75 C220 40 250 30 240 18 C230 6 215 22 200 50" fill="#22c55e" stroke="#16a34a" stroke-width="2.5"/>
    <!-- Smaller leaves -->
    <path d="M200 80 C175 55 155 50 165 40" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 80 C225 55 245 52 235 42" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

    <!-- Carrot body (tapered cone shape) -->
    <path d="M165 85 Q200 80 235 85 L210 260 Q200 270 190 260 Z" fill="url(#carrot-orange)" stroke="#c2410c" stroke-width="3.5"/>

    <!-- Highlight stripe -->
    <path d="M195 90 Q200 85 205 90 L202 250 Q200 255 198 250 Z" fill="#fdba74" opacity="0.5"/>

    <!-- Horizontal lines (texture) -->
    <line x1="172" y1="110" x2="228" y2="110" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="175" y1="135" x2="225" y2="135" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="178" y1="160" x2="222" y2="160" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="182" y1="185" x2="218" y2="185" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="186" y1="210" x2="214" y2="210" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="190" y1="235" x2="210" y2="235" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Small root hairs near tip -->
    <path d="M195 250 C190 255 188 258 192 260" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M205 248 C210 253 212 256 208 258" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>