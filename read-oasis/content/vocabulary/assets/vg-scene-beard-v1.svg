<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-beard desc-beard">
  <title id="title-beard">Beard - Man with a big brown beard</title>
  <desc id="desc-beard">A close-up of a happy man's face with a large bushy brown beard covering his chin and cheeks, with an arrow highlighting the beard.</desc>
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="bd-beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bd-bg)"/>
  <ellipse cx="200" cy="280" rx="130" ry="12" fill="#0f172a" opacity="0.15"/>
  <!-- man's head, large close-up -->
  <g filter="url(#soft-shadow)">
    <!-- shoulders -->
    <path d="M96,300 Q100,244 152,236 L248,236 Q300,244 304,300 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="4"/>
    <!-- neck -->
    <rect x="176" y="216" width="48" height="30" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <!-- face -->
    <ellipse cx="200" cy="130" rx="76" ry="86" fill="#fcd9b6" stroke="#78350f" stroke-width="4"/>
    <!-- hair -->
    <path d="M126,116 Q118,44 200,38 Q282,44 274,116 Q276,92 258,76 Q252,94 238,84 Q230,98 214,88 Q204,100 188,90 Q176,102 162,90 Q150,100 142,92 Q128,100 126,116 Z"
          fill="#92400e" stroke="#451a03" stroke-width="3.5"/>
    <!-- ears -->
    <ellipse cx="122" cy="136" rx="11" ry="16" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <ellipse cx="278" cy="136" rx="11" ry="16" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <!-- eyebrows -->
    <path d="M152,106 Q166,98 180,104" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <path d="M220,104 Q234,98 248,106" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="168" cy="122" r="7" fill="#0f172a"/>
    <circle cx="232" cy="122" r="7" fill="#0f172a"/>
    <circle cx="170" cy="120" r="2.4" fill="#ffffff"/>
    <circle cx="234" cy="120" r="2.4" fill="#ffffff"/>
    <!-- nose -->
    <path d="M200,130 Q206,148 198,156" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <!-- THE BEARD (hero element) -->
    <path d="M128,140 Q124,206 156,232 Q178,252 200,252 Q222,252 244,232 Q276,206 272,140
             Q268,168 254,178 Q258,196 244,206 Q246,218 230,222 Q226,232 212,230 Q206,238 200,238
             Q194,238 188,230 Q174,232 170,222 Q154,218 156,206 Q142,196 146,178 Q132,168 128,140 Z"
          fill="url(#bd-beard)" stroke="#451a03" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- beard texture curls -->
    <g stroke="#451a03" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M160,190 Q166,198 160,206"/>
      <path d="M186,200 Q192,208 186,216"/>
      <path d="M214,200 Q220,208 214,216"/>
      <path d="M240,190 Q246,198 240,206"/>
      <path d="M200,214 Q206,222 200,230"/>
      <path d="M172,214 Q178,220 172,226"/>
      <path d="M228,214 Q234,220 228,226"/>
    </g>
    <!-- moustache part -->
    <path d="M164,166 Q182,158 200,166 Q218,158 236,166 Q228,180 200,176 Q172,180 164,166 Z"
          fill="#92400e" stroke="#451a03" stroke-width="3.5"/>
    <!-- smiling mouth peeking through -->
    <path d="M182,182 Q200,196 218,182" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- rosy cheeks -->
    <ellipse cx="146" cy="150" rx="10" ry="7" fill="#fb7185" opacity="0.5"/>
    <ellipse cx="254" cy="150" rx="10" ry="7" fill="#fb7185" opacity="0.5"/>
  </g>
  <!-- highlight arrow pointing at beard -->
  <g stroke="#0d9488" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M330,240 Q296,238 268,222"/>
    <path d="M280,214 L264,220 L272,236"/>
  </g>
  <circle cx="344" cy="242" r="10" fill="#0d9488" stroke="#134e4a" stroke-width="3"/>
</svg>
