<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-finger d-finger">
  <title id="t-finger">Finger</title>
  <desc id="d-finger">An open friendly hand with all five fingers spread, and one finger highlighted with a red dashed ring to point out a single finger.</desc>
  <defs>
    <filter id="fg-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#e0f2fe"/>
  <ellipse cx="200" cy="278" rx="104" ry="13" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#fg-sh)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- sleeve / wrist at the bottom -->
    <path d="M164 282 L236 282 L230 250 L170 250 Z" fill="#3b82f6"/>

    <!-- FIVE FINGERS (drawn behind the palm, spread out like a wave) -->
    <g fill="#fcc79a">
      <!-- pinky -->
      <path d="M138 176 Q131 150 138 138 Q147 130 154 140 Q160 156 158 180 Z"/>
      <!-- ring -->
      <path d="M162 168 Q158 128 166 112 Q176 103 184 114 Q189 138 186 172 Z"/>
      <!-- MIDDLE (tallest) -->
      <path d="M190 166 Q188 116 196 96 Q206 86 215 98 Q221 122 218 170 Z"/>
      <!-- index (highlighted one) -->
      <path d="M222 168 Q222 120 232 106 Q242 97 250 110 Q254 136 248 174 Z"/>
      <!-- thumb (angled out to the right) -->
      <path d="M250 196 Q272 176 288 178 Q300 184 293 197 Q278 214 254 216 Z"/>
    </g>

    <!-- PALM -->
    <path d="M150 178 Q146 236 190 250 L214 250 Q262 240 258 182 Q210 168 150 178 Z" fill="#fcc79a"/>

    <!-- finger-base creases on the palm -->
    <g fill="none" stroke="#e8a06e" stroke-width="2.5">
      <path d="M150 188 Q156 194 162 190"/>
      <path d="M176 184 Q184 190 192 184"/>
      <path d="M202 182 Q210 188 220 182"/>
      <path d="M232 186 Q242 192 252 186"/>
      <!-- palm curve -->
      <path d="M168 214 Q200 228 236 212"/>
    </g>
  </g>

  <!-- Red dashed highlight ring on ONE finger (the index) -->
  <ellipse cx="238" cy="138" rx="26" ry="46" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="11 8" transform="rotate(8 238 138)"/>
</svg>
