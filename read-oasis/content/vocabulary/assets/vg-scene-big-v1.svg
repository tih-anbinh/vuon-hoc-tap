<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-big desc-big">
  <title id="title-big">Big - A big elephant next to a tiny mouse</title>
  <desc id="desc-big">A large friendly elephant standing beside a tiny mouse, showing the concept of big by size contrast.</desc>
  <defs>
    <linearGradient id="big-eleph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="big-mouse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="180" cy="265" rx="130" ry="8" fill="#0f172a" opacity="0.15"/>
  <ellipse cx="335" cy="265" rx="20" ry="3" fill="#0f172a" opacity="0.15"/>

  <!-- BIG "up arrow" indicating largeness -->
  <g stroke="#22c55e" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75">
    <line x1="60" y1="220" x2="60" y2="80"/>
    <line x1="50" y1="95" x2="60" y2="80"/>
    <line x1="70" y1="95" x2="60" y2="80"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- BIG elephant -->
    <!-- Body -->
    <ellipse cx="180" cy="180" rx="105" ry="65" fill="url(#big-eleph)" stroke="#292524" stroke-width="4"/>
    <!-- Head -->
    <circle cx="90" cy="165" r="60" fill="url(#big-eleph)" stroke="#292524" stroke-width="4"/>
    <!-- Trunk -->
    <path d="M55 175 Q30 200 40 235 Q50 250 65 240 Q70 225 60 215" fill="url(#big-eleph)" stroke="#292524" stroke-width="4"/>
    <!-- Ear -->
    <ellipse cx="120" cy="130" rx="35" ry="45" fill="url(#big-eleph)" stroke="#292524" stroke-width="3.5" transform="rotate(-20 120 130)"/>
    <ellipse cx="120" cy="135" rx="22" ry="30" fill="#a8a29e" opacity="0.6" transform="rotate(-20 120 135)"/>
    <!-- Legs -->
    <rect x="115" y="230" width="28" height="35" rx="4" fill="url(#big-eleph)" stroke="#292524" stroke-width="3"/>
    <rect x="160" y="240" width="28" height="25" rx="4" fill="url(#big-eleph)" stroke="#292524" stroke-width="3"/>
    <rect x="210" y="240" width="28" height="25" rx="4" fill="url(#big-eleph)" stroke="#292524" stroke-width="3"/>
    <rect x="255" y="230" width="28" height="35" rx="4" fill="url(#big-eleph)" stroke="#292524" stroke-width="3"/>
    <!-- Tusks -->
    <path d="M63 195 L45 210" stroke="#fef9c3" stroke-width="6" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="82" cy="150" r="5" fill="#ffffff" stroke="#0c0a09" stroke-width="2"/>
    <circle cx="83" cy="151" r="3" fill="#0c0a09"/>
    <!-- Friendly smile -->
    <path d="M65 195 Q75 202 85 195" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M285 180 Q305 178 305 200" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round"/>

    <!-- TINY mouse for contrast (bottom right, small) -->
    <ellipse cx="335" cy="255" rx="18" ry="10" fill="url(#big-mouse)" stroke="#44403c" stroke-width="2"/>
    <circle cx="320" cy="250" r="9" fill="url(#big-mouse)" stroke="#44403c" stroke-width="2"/>
    <!-- Mouse ears -->
    <circle cx="316" cy="242" r="4" fill="#fbcfe8" stroke="#44403c" stroke-width="1.5"/>
    <circle cx="324" cy="240" r="4" fill="#fbcfe8" stroke="#44403c" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="317" cy="250" r="1.5" fill="#0c0a09"/>
    <!-- Nose -->
    <circle cx="313" cy="252" r="1" fill="#f472b6"/>
    <!-- Tail -->
    <path d="M352 258 Q365 258 362 268" fill="none" stroke="#44403c" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>