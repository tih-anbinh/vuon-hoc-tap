<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-pencil desc-pencil">
  <title id="title-pencil">Pencil - Wooden pencil</title>
  <desc id="desc-pencil">A yellow wooden pencil with a sharp graphite tip, a metal ferrule, and a pink eraser on the end.</desc>
  <defs>
    <linearGradient id="pencil-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pencil-tip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="60" y1="265" x2="340" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="140" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="pencil-figure" filter="url(#soft-shadow)" transform="rotate(-10 200 170)">
    <!-- Eraser -->
    <rect x="60" y="155" width="30" height="30" rx="3" fill="#f9a8d4" stroke="#9d174d" stroke-width="3"/>
    <!-- Eraser highlight -->
    <rect x="64" y="158" width="6" height="24" fill="#fbcfe8" opacity="0.7"/>
    <!-- Metal ferrule -->
    <rect x="90" y="152" width="40" height="36" fill="#a8a29e" stroke="#525252" stroke-width="3"/>
    <!-- Ferrule ridges -->
    <line x1="98" y1="152" x2="98" y2="188" stroke="#78716c" stroke-width="1.5" opacity="0.6"/>
    <line x1="108" y1="152" x2="108" y2="188" stroke="#78716c" stroke-width="1.5" opacity="0.6"/>
    <line x1="118" y1="152" x2="118" y2="188" stroke="#78716c" stroke-width="1.5" opacity="0.6"/>
    <!-- Yellow wooden body -->
    <rect x="130" y="150" width="185" height="40" fill="url(#pencil-body)" stroke="#78350f" stroke-width="3.5"/>
    <!-- Body top edge highlight -->
    <line x1="135" y1="155" x2="310" y2="155" stroke="#fef9c3" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Body bottom edge shadow -->
    <line x1="135" y1="185" x2="310" y2="185" stroke="#a16207" stroke-width="2" opacity="0.5"/>
    <!-- Wooden sharpened cone -->
    <path d="M315 150 L345 165 L345 175 L315 190 Z" fill="url(#pencil-tip)" stroke="#78350f" stroke-width="3"/>
    <!-- Wood grain on cone -->
    <line x1="320" y1="160" x2="340" y2="168" stroke="#a16207" stroke-width="1" opacity="0.5"/>
    <line x1="320" y1="180" x2="340" y2="172" stroke="#a16207" stroke-width="1" opacity="0.5"/>
    <!-- Graphite point -->
    <path d="M345 165 L365 170 L345 175 Z" fill="#1c1917" stroke="#0c0a09" stroke-width="2"/>
    <!-- Body branding stripe -->
    <rect x="180" y="165" width="90" height="10" fill="#ca8a04" opacity="0.5"/>
  </g>
  <!-- Drawn pencil line -->
  <path d="M120 235 Q180 245 240 235 Q290 226 320 235" fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>