<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bat desc-bat">
  <title id="title-bat">Bat - Wooden bat hitting a ball</title>
  <desc id="desc-bat">A big wooden baseball bat swinging and hitting a red ball, with motion lines showing the swing.</desc>
  <defs>
    <linearGradient id="bt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bt-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd9a5"/>
      <stop offset="55%" stop-color="#d9a25f"/>
      <stop offset="100%" stop-color="#a9702f"/>
    </linearGradient>
    <radialGradient id="bt-ball" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bt-sky)"/>
  <!-- grass ground -->
  <rect x="0" y="248" width="400" height="52" fill="#4ade80"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#15803d" stroke-width="3"/>
  <ellipse cx="200" cy="270" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- swing motion arc behind the bat -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55" stroke-dasharray="4 14">
    <path d="M96,232 Q120,120 250,96"/>
  </g>

  <!-- big wooden bat (dominant, angled swing) -->
  <g filter="url(#soft-shadow)" transform="rotate(-32 210 170)">
    <!-- barrel to handle -->
    <path d="M118,150
             Q116,138 128,136
             L292,150
             Q312,151 312,166
             Q312,181 292,182
             L128,196
             Q116,194 118,182 Z"
          fill="url(#bt-wood)" stroke="#7c4a1e" stroke-width="5" stroke-linejoin="round"/>
    <!-- knob at the handle end (thin end) -->
    <ellipse cx="120" cy="166" rx="12" ry="18" fill="#c98a4b" stroke="#7c4a1e" stroke-width="5"/>
    <!-- grip tape lines on handle -->
    <g stroke="#7c4a1e" stroke-width="3" opacity="0.7">
      <line x1="140" y1="150" x2="140" y2="182"/>
      <line x1="152" y1="149" x2="152" y2="183"/>
      <line x1="164" y1="149" x2="164" y2="184"/>
    </g>
    <!-- wood grain on barrel -->
    <g stroke="#a9702f" stroke-width="2.5" fill="none" opacity="0.55">
      <path d="M210,146 Q250,150 300,152"/>
      <path d="M210,166 Q250,166 302,166"/>
      <path d="M210,186 Q250,182 300,180"/>
    </g>
  </g>

  <!-- red ball being hit (top-right) -->
  <g filter="url(#soft-shadow)">
    <circle cx="300" cy="96" r="26" fill="url(#bt-ball)" stroke="#7f1d1d" stroke-width="4"/>
    <path d="M286,80 Q300,90 288,110" fill="none" stroke="#7f1d1d" stroke-width="2.5" opacity="0.7"/>
    <path d="M314,82 Q302,92 314,112" fill="none" stroke="#7f1d1d" stroke-width="2.5" opacity="0.7"/>
    <circle cx="292" cy="88" r="4" fill="#ffffff" opacity="0.85"/>
  </g>
  <!-- impact sparkle where bat meets ball -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="270" y1="96" x2="256" y2="96"/>
    <line x1="276" y1="78" x2="268" y2="66"/>
    <line x1="276" y1="114" x2="268" y2="126"/>
  </g>
</svg>
