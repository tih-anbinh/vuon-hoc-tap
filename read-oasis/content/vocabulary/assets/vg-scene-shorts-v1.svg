<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shorts desc-shorts">
  <title id="title-shorts">Shorts - Casual shorts</title>
  <desc id="desc-shorts">A pair of orange casual shorts with an elastic waistband, pockets, and a drawstring.</desc>
  <defs>
    <linearGradient id="shorts-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="80" y1="265" x2="320" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="85" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="shorts-figure" filter="url(#soft-shadow)">
    <!-- Left leg -->
    <path d="M110 60 L100 250 L190 250 L195 60" fill="url(#shorts-orange)" stroke="#c2410c" stroke-width="3.5"/>
    <!-- Right leg -->
    <path d="M205 60 L210 250 L300 250 L290 60" fill="url(#shorts-orange)" stroke="#c2410c" stroke-width="3.5"/>
    <!-- Crotch -->
    <path d="M195 60 L195 150 Q200 165 205 150 L205 60" fill="url(#shorts-orange)" stroke="#c2410c" stroke-width="2"/>
    <!-- Waistband -->
    <rect x="105" y="50" width="190" height="22" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="3"/>
    <!-- Elastic texture -->
    <line x1="120" y1="56" x2="120" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <line x1="140" y1="56" x2="140" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="56" x2="160" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <line x1="240" y1="56" x2="240" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <line x1="260" y1="56" x2="260" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <line x1="280" y1="56" x2="280" y2="66" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
    <!-- Drawstring -->
    <path d="M185 55 Q180 40 175 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M215 55 Q220 40 225 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Left pocket -->
    <path d="M120 75 L120 120 Q140 130 160 120 L160 75" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- Right pocket -->
    <path d="M240 75 L240 120 Q260 130 280 120 L280 75" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- Side stripes -->
    <line x1="110" y1="72" x2="100" y2="248" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
    <line x1="290" y1="72" x2="300" y2="248" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
    <!-- Hem -->
    <line x1="100" y1="248" x2="190" y2="248" stroke="#c2410c" stroke-width="3"/>
    <line x1="210" y1="248" x2="300" y2="248" stroke="#c2410c" stroke-width="3"/>
  </g>
</svg>