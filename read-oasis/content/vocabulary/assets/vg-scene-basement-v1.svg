<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-basement desc-basement">
  <title id="title-basement">Basement - Room below the house with stairs going down</title>
  <desc id="desc-basement">A cutaway view of a house showing an underground basement room with stairs going down, storage boxes, a shelf and a hanging light bulb.</desc>
  <defs>
    <linearGradient id="bm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bm-under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- sky -->
  <rect x="0" y="0" width="400" height="110" fill="url(#bm-sky)"/>
  <circle cx="352" cy="36" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <!-- house above ground -->
  <g>
    <path d="M60,70 L200,18 L340,70 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <rect x="80" y="70" width="240" height="40" fill="#fde68a" stroke="#b45309" stroke-width="4"/>
    <rect x="182" y="80" width="36" height="30" rx="3" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <rect x="102" y="80" width="30" height="22" rx="3" fill="#bae6fd" stroke="#b45309" stroke-width="3"/>
    <rect x="268" y="80" width="30" height="22" rx="3" fill="#bae6fd" stroke="#b45309" stroke-width="3"/>
  </g>
  <!-- ground line -->
  <rect x="0" y="110" width="400" height="12" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
  <!-- earth around basement -->
  <rect x="0" y="122" width="400" height="178" fill="url(#bm-under)"/>
  <g fill="#854d0e" opacity="0.7">
    <circle cx="34" cy="160" r="7"/>
    <circle cx="52" cy="230" r="9"/>
    <circle cx="24" cy="272" r="6"/>
    <circle cx="372" cy="170" r="8"/>
    <circle cx="356" cy="250" r="7"/>
    <circle cx="382" cy="212" r="5"/>
  </g>
  <!-- basement room (dominant) -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="130" width="256" height="150" fill="#cbd5e1" stroke="#334155" stroke-width="5"/>
    <!-- floor -->
    <rect x="72" y="262" width="256" height="18" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
    <!-- stairs going down from house -->
    <g fill="#e2e8f0" stroke="#334155" stroke-width="3">
      <rect x="86" y="130" width="52" height="16"/>
      <rect x="98" y="146" width="52" height="16"/>
      <rect x="110" y="162" width="52" height="16"/>
      <rect x="122" y="178" width="52" height="16"/>
      <rect x="134" y="194" width="52" height="16"/>
      <rect x="146" y="210" width="52" height="16"/>
      <rect x="158" y="226" width="52" height="16"/>
      <rect x="170" y="242" width="52" height="20"/>
    </g>
    <!-- hanging light bulb -->
    <line x1="266" y1="130" x2="266" y2="160" stroke="#0f172a" stroke-width="3"/>
    <circle cx="266" cy="172" r="13" fill="#fde047" stroke="#a16207" stroke-width="3"/>
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="266" y1="192" x2="266" y2="200"/>
      <line x1="248" y1="186" x2="242" y2="192"/>
      <line x1="284" y1="186" x2="290" y2="192"/>
    </g>
    <!-- shelf with jars -->
    <rect x="240" y="212" width="76" height="7" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <rect x="248" y="194" width="14" height="18" rx="3" fill="#86efac" stroke="#166534" stroke-width="2.5"/>
    <rect x="270" y="196" width="14" height="16" rx="3" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2.5"/>
    <rect x="292" y="194" width="14" height="18" rx="3" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <!-- storage boxes -->
    <rect x="232" y="234" width="46" height="30" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <line x1="232" y1="248" x2="278" y2="248" stroke="#78350f" stroke-width="2.5"/>
    <rect x="284" y="240" width="36" height="24" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <rect x="246" y="212" width="0" height="0" fill="none"/>
    <!-- old bicycle wheel leaning -->
    <circle cx="98" cy="246" r="17" fill="none" stroke="#334155" stroke-width="4"/>
    <line x1="98" y1="229" x2="98" y2="263" stroke="#334155" stroke-width="2.5"/>
    <line x1="81" y1="246" x2="115" y2="246" stroke="#334155" stroke-width="2.5"/>
  </g>
  <!-- arrow showing "down" -->
  <g stroke="#fde047" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M52,140 L52,196"/>
    <path d="M38,182 L52,198 L66,182"/>
  </g>
</svg>
