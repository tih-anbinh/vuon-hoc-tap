<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-lamp desc-lamp">
  <title id="title-lamp">Lamp - Table lamp</title>
  <desc id="desc-lamp">A warm table lamp with a fabric shade, a slender stand, a heavy base, and a warm glow of light.</desc>
  <defs>
    <linearGradient id="lamp-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lamp-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="60" y1="265" x2="340" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="90" ry="7" fill="#0f172a" opacity="0.15"/>
  <!-- Light glow (behind shade) -->
  <ellipse cx="200" cy="120" rx="130" ry="80" fill="url(#lamp-glow)"/>
  <g id="lamp-figure" filter="url(#soft-shadow)">
    <!-- Shade (trapezoid) -->
    <path d="M145 55 L255 55 L280 155 L120 155 Z" fill="url(#lamp-shade)" stroke="#78350f" stroke-width="3.5"/>
    <!-- Shade top rim -->
    <ellipse cx="200" cy="55" rx="55" ry="8" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <!-- Shade bottom rim -->
    <ellipse cx="200" cy="155" rx="80" ry="10" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <!-- Shade highlight -->
    <path d="M160 65 L155 145" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <!-- Shade fabric texture -->
    <path d="M170 70 L165 145" fill="none" stroke="#a16207" stroke-width="1" opacity="0.3"/>
    <path d="M200 68 L200 150" fill="none" stroke="#a16207" stroke-width="1" opacity="0.3"/>
    <path d="M230 70 L235 145" fill="none" stroke="#a16207" stroke-width="1" opacity="0.3"/>
    <!-- Stand (pole) -->
    <rect x="196" y="155" width="8" height="80" fill="#525252" stroke="#292524" stroke-width="2"/>
    <!-- Base decoration knob -->
    <circle cx="200" cy="165" r="7" fill="#a8a29e" stroke="#525252" stroke-width="2"/>
    <!-- Base -->
    <ellipse cx="200" cy="240" rx="45" ry="10" fill="url(#lamp-base)" stroke="#0c0a09" stroke-width="3"/>
    <rect x="155" y="225" width="90" height="18" rx="4" fill="url(#lamp-base)" stroke="#0c0a09" stroke-width="3"/>
    <ellipse cx="200" cy="225" rx="45" ry="8" fill="#525252" stroke="#292524" stroke-width="2"/>
    <!-- Base highlight -->
    <ellipse cx="180" cy="223" rx="10" ry="3" fill="#a8a29e" opacity="0.6"/>
    <!-- Pull cord -->
    <line x1="255" y1="130" x2="270" y2="180" stroke="#a8a29e" stroke-width="1.5"/>
    <circle cx="271" cy="183" r="3" fill="#fbbf24" stroke="#a16207" stroke-width="1"/>
  </g>
  <!-- Small light rays -->
  <g opacity="0.5">
    <line x1="90" y1="80" x2="110" y2="105" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <line x1="310" y1="80" x2="290" y2="105" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="120" x2="95" y2="130" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="120" x2="305" y2="130" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="30" x2="200" y2="15" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>