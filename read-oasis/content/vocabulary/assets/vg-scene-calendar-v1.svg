<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-calendar desc-calendar">
  <title id="title-calendar">Calendar</title>
  <desc id="desc-calendar">A wall calendar with a red header, hanging rings, and a grid of day squares with one circled.</desc>
  <defs>
    <linearGradient id="calendar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#calendar-bg)"/>
  <ellipse cx="200" cy="272" rx="130" ry="14" fill="#0f172a" opacity="0.1"/>

  <!-- Hanging rings -->
  <g stroke="#94a3b8" stroke-width="4" fill="none">
    <path d="M150 55 Q150 40 160 40"/>
    <path d="M250 55 Q250 40 240 40"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <rect x="95" y="55" width="210" height="200" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <!-- Red header -->
    <rect x="95" y="55" width="210" height="45" rx="8" fill="#ef4444" stroke="#1e293b" stroke-width="4"/>
    <rect x="95" y="88" width="210" height="12" fill="#ef4444"/>
    <!-- Day grid -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="95" y1="140" x2="305" y2="140"/>
      <line x1="95" y1="180" x2="305" y2="180"/>
      <line x1="95" y1="220" x2="305" y2="220"/>
      <line x1="130" y1="100" x2="130" y2="255"/>
      <line x1="165" y1="100" x2="165" y2="255"/>
      <line x1="200" y1="100" x2="200" y2="255"/>
      <line x1="235" y1="100" x2="235" y2="255"/>
      <line x1="270" y1="100" x2="270" y2="255"/>
    </g>
    <!-- Circled day -->
    <circle cx="217" cy="160" r="16" fill="none" stroke="#ef4444" stroke-width="4"/>
  </g>
</svg>
