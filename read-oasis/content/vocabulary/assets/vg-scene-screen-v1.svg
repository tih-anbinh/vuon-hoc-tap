<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-screen desc-screen">
  <title id="title-screen">Screen</title>
  <desc id="desc-screen">A large flat monitor screen on a stand showing a bright colorful picture.</desc>
  <defs>
    <linearGradient id="screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="screen-display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#screen-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="16" fill="#0f172a" opacity="0.14"/>

  <g filter="url(#soft-shadow)">
    <!-- Bezel -->
    <rect x="80" y="55" width="240" height="160" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <!-- Display (highlighted) -->
    <rect x="95" y="70" width="210" height="130" rx="4" fill="url(#screen-display)"/>
    <!-- Picture on screen -->
    <circle cx="255" cy="105" r="18" fill="#fde047"/>
    <path d="M95 175 L150 130 L190 165 L240 120 L305 175 Z" fill="#4ade80" opacity="0.9"/>
    <path d="M95 190 L120 168 L150 190 Z" fill="#22c55e" opacity="0.9"/>

    <!-- Stand -->
    <rect x="188" y="215" width="24" height="35" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <rect x="150" y="248" width="100" height="16" rx="6" fill="#475569" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Sparkle -->
  <g fill="#fef9c3" opacity="0.9"><circle cx="115" cy="90" r="4"/><circle cx="130" cy="82" r="2.5"/></g>
</svg>
