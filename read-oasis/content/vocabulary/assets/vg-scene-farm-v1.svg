<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-farm desc-farm">
  <title id="title-farm">Farm - Farm with barn, fields and animals</title>
  <desc id="desc-farm">A farm scene with a red barn, a windmill, fenced green fields, a cow, a sheep and hay bales under a sunny sky.</desc>
  <defs>
    <linearGradient id="fa-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="fa-barn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#fa-sky)"/>
  <circle cx="52" cy="46" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="310" cy="42" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- fields -->
  <rect x="0" y="170" width="400" height="130" fill="#4ade80"/>
  <line x1="0" y1="170" x2="400" y2="170" stroke="#15803d" stroke-width="3.5"/>
  <path d="M0,240 Q200,222 400,240 L400,300 L0,300 Z" fill="#22c55e"/>
  <!-- barn -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="110" width="130" height="80" fill="url(#fa-barn)" stroke="#7f1d1d" stroke-width="4.5"/>
    <path d="M50,110 L125,66 L200,110 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="4.5"/>
    <!-- barn door -->
    <rect x="102" y="140" width="46" height="50" rx="4" fill="#78350f" stroke="#451a03" stroke-width="3.5"/>
    <line x1="102" y1="140" x2="148" y2="190" stroke="#451a03" stroke-width="3"/>
    <line x1="148" y1="140" x2="102" y2="190" stroke="#451a03" stroke-width="3"/>
    <!-- hayloft window -->
    <circle cx="125" cy="98" r="12" fill="#fde68a" stroke="#7f1d1d" stroke-width="3.5"/>
    <!-- white trim -->
    <line x1="60" y1="110" x2="190" y2="110" stroke="#fef2f2" stroke-width="4"/>
  </g>
  <!-- windmill -->
  <g filter="url(#soft-shadow)">
    <path d="M282,120 L294,120 L300,190 L276,190 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3.5"/>
    <circle cx="288" cy="116" r="6" fill="#475569"/>
    <g stroke="#475569" stroke-width="4" fill="#f1f5f9">
      <path d="M288,116 L288,74 L298,80 Z"/>
      <path d="M288,116 L330,116 L324,126 Z"/>
      <path d="M288,116 L288,158 L278,152 Z"/>
      <path d="M288,116 L246,116 L252,106 Z"/>
    </g>
  </g>
  <!-- fence -->
  <g stroke="#92400e" stroke-width="5" stroke-linecap="round">
    <line x1="20" y1="206" x2="20" y2="234"/>
    <line x1="70" y1="206" x2="70" y2="234"/>
    <line x1="120" y1="206" x2="120" y2="234"/>
    <line x1="10" y1="214" x2="130" y2="214"/>
    <line x1="10" y1="228" x2="130" y2="228"/>
  </g>
  <!-- cow -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="200" cy="240" rx="42" ry="26" fill="#f8fafc" stroke="#334155" stroke-width="3.5"/>
    <path d="M172,232 Q160,224 166,214 Q176,220 180,228 Z" fill="#334155"/>
    <ellipse cx="222" cy="248" rx="13" ry="10" fill="#334155"/>
    <circle cx="238" cy="226" r="15" fill="#f8fafc" stroke="#334155" stroke-width="3.5"/>
    <ellipse cx="240" cy="234" rx="9" ry="6" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
    <circle cx="233" cy="221" r="2.5" fill="#0f172a"/>
    <circle cx="243" cy="221" r="2.5" fill="#0f172a"/>
    <path d="M228,214 L224,204 L234,210 Z" fill="#fcd34d" stroke="#a16207" stroke-width="2"/>
    <path d="M248,214 L252,204 L242,210 Z" fill="#fcd34d" stroke="#a16207" stroke-width="2"/>
    <line x1="180" y1="262" x2="180" y2="278" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="220" y1="262" x2="220" y2="278" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- sheep -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="320" cy="252" rx="30" ry="20" fill="#f1f5f9" stroke="#64748b" stroke-width="3.5"/>
    <g fill="#f8fafc" stroke="#64748b" stroke-width="2.5">
      <circle cx="298" cy="242" r="9"/>
      <circle cx="314" cy="236" r="9"/>
      <circle cx="332" cy="238" r="9"/>
      <circle cx="344" cy="248" r="9"/>
    </g>
    <circle cx="348" cy="256" r="11" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="352" cy="253" r="2" fill="#ffffff"/>
    <line x1="306" y1="270" x2="306" y2="282" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="332" y1="270" x2="332" y2="282" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- hay bales -->
  <g filter="url(#soft-shadow)">
    <circle cx="46" cy="266" r="18" fill="#fbbf24" stroke="#a16207" stroke-width="3.5"/>
    <circle cx="46" cy="266" r="10" fill="none" stroke="#a16207" stroke-width="2.5"/>
    <circle cx="46" cy="266" r="4" fill="none" stroke="#a16207" stroke-width="2"/>
  </g>
  <!-- birds -->
  <path d="M180,50 Q187,43 194,50 M194,50 Q201,43 208,50" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
</svg>
