<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-flag desc-flag">
  <title id="title-flag">Flag</title>
  <desc id="desc-flag">A bright red flag with a yellow star, waving on a tall pole with a gold top.</desc>
  <defs>
    <linearGradient id="flag-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#flag-bg)"/>
  <ellipse cx="140" cy="272" rx="80" ry="12" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Pole -->
    <rect x="130" y="55" width="10" height="210" rx="4" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="135" cy="52" r="10" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
    <!-- Waving flag -->
    <path d="M140 70 Q210 55 270 78 Q320 95 340 75 L340 160 Q320 180 270 163 Q210 140 140 155 Z" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
    <!-- Star -->
    <path d="M235 90 l8 18 l20 2 l-15 13 l4 20 l-17 -10 l-17 10 l4 -20 l-15 -13 l20 -2 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  </g>
</svg>
