<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-umbrella desc-umbrella">
  <title id="title-umbrella">Umbrella - Colorful open umbrella</title>
  <desc id="desc-umbrella">A bright open umbrella with rainbow colored canopy panels, wooden J-hook handle, and gentle falling raindrops, occupying the center of the frame.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Gentle falling raindrops for weather context -->
  <g id="raindrops" opacity="0.65">
    <line x1="60" y1="50" x2="50" y2="75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="25" x2="90" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="330" y1="40" x2="320" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="365" y1="70" x2="355" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="180" x2="60" y2="205" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="190" x2="330" y2="215" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- TARGET OBJECT: UMBRELLA (Occupying 70% canvas) -->
  <g id="umbrella-figure" filter="url(#soft-shadow)">
    <!-- Top Pointed Metal Ferrule (Tip) -->
    <polygon points="196,48 200,32 204,48" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="200" cy="32" r="3.5" fill="#e2e8f0"/>

    <!-- Central Shaft (Rod) -->
    <line x1="200" y1="45" x2="200" y2="225" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

    <!-- Umbrella Canopy Panels (4 scalloped panels) -->
    <!-- Panel 1: Far Left (Sky Blue) -->
    <path d="M200 48 C140 55 70 100 55 155 Q90 148 125 155 C150 110 180 65 200 48 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
    <!-- Panel 2: Center Left (Warm Amber/Yellow) -->
    <path d="M200 48 C180 65 150 110 125 155 Q165 148 200 155 C200 105 200 65 200 48 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <!-- Panel 3: Center Right (Crimson Red) -->
    <path d="M200 48 C200 65 200 105 200 155 Q235 148 275 155 C250 110 220 65 200 48 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <!-- Panel 4: Far Right (Bright Green) -->
    <path d="M200 48 C220 65 250 110 275 155 Q310 148 345 155 C330 100 260 55 200 48 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

    <!-- Outer Canopy Outline -->
    <path d="M55 155 C70 100 140 55 200 48 C260 55 330 100 345 155 Q310 148 275 155 Q235 148 200 155 Q165 148 125 155 Q90 148 55 155 Z" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Panel Rib Lines -->
    <path d="M200 48 C180 65 150 110 125 155" fill="none" stroke="#1e293b" stroke-width="3"/>
    <line x1="200" y1="48" x2="200" y2="155" stroke="#1e293b" stroke-width="3"/>
    <path d="M200 48 C220 65 250 110 275 155" fill="none" stroke="#1e293b" stroke-width="3"/>

    <!-- Canopy Rib Tips (Little rounded beads at scallop points) -->
    <circle cx="55" cy="155" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="125" cy="155" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="200" cy="155" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="275" cy="155" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="345" cy="155" r="3.5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Wooden J-Hook Curved Handle -->
    <path d="M200 220 L200 240 C200 265 170 265 170 245 C170 235 178 235 178 245 C178 253 190 253 190 240 L190 220 Z" fill="#92400e" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>