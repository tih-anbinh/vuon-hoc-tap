<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-metal desc-metal">
  <title id="title-metal">Metal</title>
  <desc id="desc-metal">A shiny silver metal bar and a big steel bolt and nut showing hard, gray metal material.</desc>
  <defs>
    <linearGradient id="metal-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="metal-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="metal-bolt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#metal-bg)"/>
  <ellipse cx="200" cy="252" rx="150" ry="16" fill="#0f172a" opacity="0.14"/>

  <g filter="url(#soft-shadow)">
    <!-- Metal bar (3D) -->
    <path d="M60 150 L250 130 L280 155 L90 175 Z" fill="url(#metal-bar)" stroke="#475569" stroke-width="3.5"/>
    <path d="M90 175 L280 155 L280 210 L90 230 Z" fill="#94a3b8" stroke="#475569" stroke-width="3.5"/>
    <path d="M60 150 L90 175 L90 230 L60 205 Z" fill="#64748b" stroke="#475569" stroke-width="3.5"/>
    <!-- Shine highlight -->
    <path d="M110 165 L200 155" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Steel bolt + nut -->
  <g filter="url(#soft-shadow)">
    <!-- Hex nut -->
    <path d="M300 190 L325 176 L350 190 L350 218 L325 232 L300 218 Z" fill="url(#metal-bolt)" stroke="#334155" stroke-width="3.5"/>
    <circle cx="325" cy="204" r="12" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
  </g>
</svg>
