<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-tv-television desc-tv-television">
  <title id="title-tv-television">TV / Television - Child watching TV on the sofa</title>
  <desc id="desc-tv-television">A child sitting on a red sofa watching a big television showing a colorful cartoon rocket flying among stars, in a cozy evening room.</desc>
  <defs>
    <linearGradient id="tvb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="tvb-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#tvb-bg)"/>
  <!-- floor -->
  <rect x="0" y="238" width="400" height="62" fill="#e8b478"/>
  <line x1="0" y1="238" x2="400" y2="238" stroke="#a16207" stroke-width="3.5"/>
  <!-- TV on stand (dominant, left) -->
  <g filter="url(#soft-shadow)">
    <rect x="30" y="180" width="180" height="16" rx="5" fill="#b45309" stroke="#78350f" stroke-width="3.5"/>
    <rect x="48" y="196" width="14" height="42" rx="4" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <rect x="178" y="196" width="14" height="42" rx="4" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <rect x="26" y="40" width="188" height="140" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <rect x="40" y="54" width="160" height="108" rx="6" fill="url(#tvb-screen)" stroke="#0f172a" stroke-width="3"/>
    <!-- cartoon rocket on screen -->
    <g transform="rotate(-20 120 108)">
      <path d="M120,70 Q140,92 138,124 L102,124 Q100,92 120,70 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
      <circle cx="120" cy="102" r="10" fill="#bae6fd" stroke="#7f1d1d" stroke-width="2.5"/>
      <path d="M102,116 L88,136 L104,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
      <path d="M138,116 L152,136 L136,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
      <path d="M112,126 Q120,146 128,126" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    </g>
    <!-- stars on screen -->
    <g fill="#fde047">
      <path d="M60,70 L63,77 L70,80 L63,83 L60,90 L57,83 L50,80 L57,77 Z"/>
      <path d="M176,64 L178,70 L184,72 L178,74 L176,80 L174,74 L168,72 L174,70 Z"/>
      <circle cx="66" cy="140" r="3"/>
      <circle cx="180" cy="128" r="3"/>
    </g>
    <!-- power light -->
    <circle cx="200" cy="172" r="4" fill="#4ade80" stroke="#14532d" stroke-width="1.5"/>
  </g>
  <!-- glow from screen -->
  <path d="M214,60 L288,140 L288,230 L214,168 Z" fill="#fef9c3" opacity="0.25"/>
  <!-- sofa with child -->
  <g filter="url(#soft-shadow)">
    <!-- sofa -->
    <rect x="252" y="132" width="130" height="72" rx="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="4"/>
    <rect x="244" y="188" width="146" height="46" rx="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <rect x="238" y="150" width="26" height="82" rx="12" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3.5"/>
    <rect x="370" y="150" width="26" height="82" rx="12" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3.5"/>
  </g>
  <!-- child sitting cross-legged watching -->
  <g filter="url(#soft-shadow)">
    <path d="M296,128 Q296,104 320,104 Q344,104 344,128 L339,134 Q320,118 301,134 Z" fill="#451a03" stroke="#1c1917" stroke-width="3"/>
    <circle cx="320" cy="136" r="22" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <!-- eyes looking left toward TV -->
    <circle cx="310" cy="133" r="3.5" fill="#0f172a"/>
    <circle cx="324" cy="133" r="3.5" fill="#0f172a"/>
    <path d="M311,146 Q318,150 325,146" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- body -->
    <path d="M304,156 L336,156 L342,202 L298,202 Z" fill="#f59e0b" stroke="#92400e" stroke-width="3.5"/>
    <!-- arms resting -->
    <path d="M304,164 Q290,176 294,190" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <path d="M336,164 Q350,176 346,190" fill="none" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    <!-- crossed legs -->
    <path d="M300,202 Q320,216 342,202" fill="none" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- popcorn bowl -->
  <g filter="url(#soft-shadow)">
    <path d="M270,262 L316,262 L308,286 L278,286 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3.5"/>
    <g fill="#fef9c3" stroke="#d6a05c" stroke-width="2">
      <circle cx="280" cy="258" r="6"/>
      <circle cx="293" cy="254" r="6"/>
      <circle cx="306" cy="258" r="6"/>
      <circle cx="288" cy="262" r="6"/>
      <circle cx="300" cy="263" r="6"/>
    </g>
  </g>
</svg>
