<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-goat d-goat">
  <title id="t-goat">Goat</title>
  <desc id="d-goat">A friendly white goat with curved horns, a beard, floppy ears and a short tail, standing on green grass.</desc>
  <defs>
    <radialGradient id="gt-body" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>
    <filter id="gt-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#dcfce7"/>
  <!-- grass -->
  <g fill="#4ade80"><path d="M20 262 q10 -18 20 0 q10 -18 20 0 q10 -18 20 0 q10 -18 20 0"/></g>
  <ellipse cx="200" cy="262" rx="140" ry="14" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#gt-sh)" stroke="#0f172a" stroke-width="4">
    <!-- legs -->
    <rect x="130" y="200" width="16" height="58" rx="7" fill="#f1f5f9"/>
    <rect x="164" y="204" width="16" height="54" rx="7" fill="#e2e8f0"/>
    <rect x="234" y="200" width="16" height="58" rx="7" fill="#f1f5f9"/>
    <rect x="268" y="204" width="16" height="54" rx="7" fill="#e2e8f0"/>
    <g fill="#0f172a" stroke="none"><rect x="128" y="252" width="20" height="8" rx="3"/><rect x="162" y="252" width="20" height="8" rx="3"/><rect x="232" y="252" width="20" height="8" rx="3"/><rect x="266" y="252" width="20" height="8" rx="3"/></g>
    <!-- body -->
    <ellipse cx="206" cy="176" rx="90" ry="52" fill="url(#gt-body)"/>
    <!-- tail -->
    <path d="M292 158 l22 -8 -8 20 Z" fill="#f1f5f9"/>
    <!-- neck + head -->
    <path d="M124 176 Q96 150 92 116 Q112 108 130 130 Q140 152 150 168 Z" fill="url(#gt-body)"/>
    <ellipse cx="92" cy="112" rx="30" ry="26" fill="url(#gt-body)"/>
    <!-- snout -->
    <ellipse cx="66" cy="118" rx="20" ry="15" fill="#f8fafc"/>
    <ellipse cx="54" cy="118" rx="5" ry="4" fill="#0f172a"/>
    <!-- curved horns -->
    <path d="M96 90 Q104 64 92 54 Q104 62 110 84" fill="none" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
    <path d="M110 90 Q120 66 110 56 Q122 64 126 86" fill="none" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
    <!-- floppy ear -->
    <path d="M108 116 Q136 112 144 130 Q124 132 110 126 Z" fill="#e2e8f0"/>
    <!-- eye -->
    <circle cx="86" cy="106" r="5" fill="#0f172a"/>
    <!-- beard -->
    <path d="M62 132 Q66 156 58 168 Q52 152 54 132 Z" fill="#f1f5f9"/>
  </g>
</svg>
