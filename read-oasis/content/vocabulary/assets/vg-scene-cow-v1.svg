<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-cow desc-cow">
  <title id="title-cow">Cow - Spotted dairy cow</title>
  <desc id="desc-cow">A black-and-white spotted dairy cow with gentle curved horns, pink muzzle, and bell collar standing proudly, occupying the center of the frame.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="265" rx="120" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: COW (Occupying 70% canvas) -->
  <g id="cow-figure" filter="url(#soft-shadow)">
    <!-- Tail with bushy tuft -->
    <path d="M100 170 C75 185 65 210 70 235" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="72" cy="238" rx="8" ry="12" fill="#1e293b"/>

    <!-- Back Legs -->
    <!-- Rear Left Leg -->
    <rect x="110" y="180" width="22" height="78" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="110" y="248" width="22" height="12" rx="3" fill="#1e293b"/>
    <!-- Rear Right Leg -->
    <rect x="145" y="175" width="20" height="83" rx="6" fill="#e2e8f0" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="145" y="248" width="20" height="12" rx="3" fill="#1e293b"/>

    <!-- Front Legs -->
    <!-- Front Left Leg -->
    <rect x="250" y="175" width="20" height="83" rx="6" fill="#e2e8f0" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="250" y="248" width="20" height="12" rx="3" fill="#1e293b"/>
    <!-- Front Right Leg -->
    <rect x="280" y="180" width="22" height="78" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="280" y="248" width="22" height="12" rx="3" fill="#1e293b"/>

    <!-- Cow Udder -->
    <path d="M135 190 Q150 215 165 190 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="2"/>
    <line x1="145" y1="205" x2="145" y2="212" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="205" x2="155" y2="212" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>

    <!-- Cow Body (Sturdy white barrel shape) -->
    <rect x="95" y="120" width="205" height="85" rx="35" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

    <!-- Black Patches on Body (Iconic Holstein spots) -->
    <path d="M120 120 C130 145 160 140 165 120 Z" fill="#1e293b"/>
    <path d="M185 140 C210 135 220 170 195 180 C175 185 170 155 185 140 Z" fill="#1e293b"/>
    <path d="M230 120 C245 140 270 130 275 120 Z" fill="#1e293b"/>
    <path d="M110 165 C130 170 125 195 105 190 Z" fill="#1e293b"/>

    <!-- Cow Neck & Bell Collar -->
    <path d="M275 135 Q295 150 290 180" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <!-- Golden Bell -->
    <polygon points="288,180 298,180 302,194 284,194" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="293" cy="196" r="3" fill="#d97706"/>

    <!-- Cow Head -->
    <ellipse cx="310" cy="115" rx="36" ry="42" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
    <!-- Head black patch -->
    <path d="M285 90 C300 80 325 80 335 100 C325 110 300 110 285 90 Z" fill="#1e293b"/>

    <!-- Gentle Horns -->
    <path d="M290 85 C285 65 275 60 270 65 C280 75 285 85 290 85 Z" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
    <path d="M330 85 C335 65 345 60 350 65 C340 75 335 85 330 85 Z" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>

    <!-- Ears sticking out sideways -->
    <path d="M280 100 C255 100 250 115 275 118 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
    <path d="M276 103 C262 103 260 112 274 114 Z" fill="#fbcfe8"/>

    <path d="M340 100 C365 100 370 115 345 118 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
    <path d="M344 103 C358 103 360 112 346 114 Z" fill="#fbcfe8"/>

    <!-- Eyes (Gentle, friendly) -->
    <circle cx="296" cy="108" r="6" fill="#1e293b"/>
    <circle cx="294" cy="106" r="2" fill="#ffffff"/>
    <circle cx="324" cy="108" r="6" fill="#1e293b"/>
    <circle cx="322" cy="106" r="2" fill="#ffffff"/>

    <!-- Big Pink Muzzle / Snout -->
    <ellipse cx="310" cy="138" rx="26" ry="18" fill="#fbcfe8" stroke="#f472b6" stroke-width="3"/>
    <!-- Nostrils -->
    <ellipse cx="300" cy="136" rx="4" ry="5" fill="#db2777"/>
    <ellipse cx="320" cy="136" rx="4" ry="5" fill="#db2777"/>
    <!-- Smile -->
    <path d="M304 146 Q310 150 316 146" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>