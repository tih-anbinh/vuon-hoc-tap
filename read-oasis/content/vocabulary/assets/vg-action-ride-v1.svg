<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-ride d-ride">
  <title id="t-ride">Ride</title>
  <desc id="d-ride">A smiling child sitting on the back of a friendly brown horse and holding the reins, showing riding a horse.</desc>
  <defs>
    <radialGradient id="ride-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="ride-sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#ride-bg)"/>
  <ellipse cx="210" cy="274" rx="160" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Horse -->
  <g filter="url(#ride-sh)" stroke="#0f172a" stroke-width="4">
    <!-- back legs -->
    <rect x="272" y="196" width="18" height="66" rx="8" fill="#a16207"/>
    <rect x="300" y="200" width="18" height="62" rx="8" fill="#8a4f18"/>
    <!-- front legs -->
    <rect x="120" y="196" width="18" height="66" rx="8" fill="#a16207"/>
    <rect x="148" y="200" width="18" height="62" rx="8" fill="#8a4f18"/>
    <!-- hooves -->
    <g fill="#3b2410" stroke="none"><rect x="118" y="256" width="22" height="10" rx="3"/><rect x="146" y="256" width="22" height="10" rx="3"/><rect x="270" y="256" width="22" height="10" rx="3"/><rect x="298" y="256" width="22" height="10" rx="3"/></g>
    <!-- body -->
    <path d="M120 160 Q210 132 300 160 Q318 184 300 208 Q210 224 120 208 Q104 184 120 160 Z" fill="#b45309"/>
    <!-- chest/rump shading -->
    <path d="M120 160 Q140 150 158 158 L158 206 Q136 210 120 208 Q108 184 120 160 Z" fill="#a16207"/>
    <!-- tail -->
    <path d="M298 172 Q336 176 340 224 Q328 200 300 202 Z" fill="#78350f"/>
    <!-- neck up to head (front-left) -->
    <path d="M124 168 Q98 132 96 100 L120 92 Q136 128 150 158 Z" fill="#b45309"/>
    <!-- head -->
    <path d="M92 104 Q78 96 82 80 Q98 68 118 84 Q120 98 108 108 Z" fill="#a16207"/>
    <!-- muzzle -->
    <ellipse cx="88" cy="98" rx="12" ry="10" fill="#8a4f18"/>
    <circle cx="84" cy="98" r="2.5" fill="#0f172a" stroke="none"/>
    <!-- ear -->
    <path d="M112 80 L118 62 L126 82 Z" fill="#a16207"/>
    <!-- mane -->
    <path d="M104 86 Q126 112 150 158 L162 152 Q138 108 118 84 Z" fill="#5c3410"/>
    <!-- eye -->
    <circle cx="102" cy="90" r="3.5" fill="#0f172a" stroke="none"/>
    <!-- reins -->
    <path d="M86 100 Q130 120 176 122" fill="none" stroke="#3b2410" stroke-width="4"/>
  </g>

  <!-- Child rider on top -->
  <g filter="url(#ride-sh)" stroke="#0f172a" stroke-width="4">
    <!-- leg over side of horse -->
    <path d="M200 150 Q186 186 182 212" fill="none" stroke="#1d4ed8" stroke-width="15" stroke-linecap="round"/>
    <rect x="172" y="206" width="26" height="12" rx="5" fill="#0f172a" stroke="none"/>
    <!-- torso -->
    <path d="M182 98 Q214 90 226 108 L216 156 Q192 162 176 150 Z" fill="#ef4444"/>
    <!-- head -->
    <circle cx="198" cy="76" r="24" fill="#fcc79a"/>
    <path d="M174 74 C178 48 222 48 222 74 C212 60 184 60 174 74 Z" fill="#78350f"/>
    <circle cx="190" cy="76" r="4.5" fill="#0f172a"/>
    <circle cx="208" cy="76" r="4.5" fill="#0f172a"/>
    <path d="M190 88 Q199 96 208 88" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="184" cy="84" r="5" fill="#fb7185" stroke="none" opacity="0.35"/>
    <!-- arm holding reins -->
    <path d="M188 116 Q150 118 178 122" fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <circle cx="178" cy="122" r="9" fill="#fcc79a"/>
  </g>
</svg>
