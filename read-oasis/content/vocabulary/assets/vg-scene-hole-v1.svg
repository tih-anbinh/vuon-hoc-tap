<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hole desc-hole">
  <title id="title-hole">Hole</title>
  <desc id="desc-hole">A deep dark hole dug in the green ground, with a pile of dug-out soil and a shovel beside it.</desc>
  <defs>
    <linearGradient id="hole-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="hole-fill" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#0f0800"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="150" fill="url(#hole-bg)"/>
  <rect x="0" y="140" width="400" height="160" fill="#4ade80"/>
  <rect x="0" y="140" width="400" height="14" fill="#22c55e"/>

  <g filter="url(#soft-shadow)">
    <!-- The hole -->
    <ellipse cx="180" cy="200" rx="90" ry="55" fill="url(#hole-fill)" stroke="#78350f" stroke-width="5"/>
    <ellipse cx="180" cy="200" rx="90" ry="55" fill="none" stroke="#a16207" stroke-width="8" opacity="0.4"/>
    <!-- Inner depth ring -->
    <ellipse cx="180" cy="212" rx="55" ry="30" fill="#000000" opacity="0.5"/>

    <!-- Soil pile -->
    <path d="M290 240 Q320 195 350 240 Q330 255 290 240 Z" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    <g fill="#78350f">
      <circle cx="305" cy="235" r="5"/>
      <circle cx="325" cy="228" r="6"/>
      <circle cx="340" cy="238" r="5"/>
    </g>

    <!-- Shovel -->
    <line x1="330" y1="215" x2="360" y2="120" stroke="#a16207" stroke-width="7" stroke-linecap="round"/>
    <path d="M358 110 a12 12 0 0 1 8 22 l-16 -8 Z" fill="#78350f"/>
    <path d="M320 218 Q310 235 328 245 L345 232 Z" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  </g>
</svg>
