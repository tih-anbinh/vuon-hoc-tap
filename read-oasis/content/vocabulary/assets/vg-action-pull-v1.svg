<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-pull d-pull">
  <title id="t-pull">Pull</title>
  <desc id="d-pull">A child leaning far back and gripping a rope with both hands, straining to pull it toward the left, with a large heavy box on the right.</desc>
  <defs>
    <radialGradient id="pl-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#pl-bg)"/>
  <ellipse cx="200" cy="272" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Heavy box being pulled (right) -->
  <g stroke="#0f172a" stroke-width="4">
    <path d="M270 200 L358 200 L358 262 L270 262 Z" fill="#d97706"/>
    <path d="M270 200 L292 176 L380 176 L358 200 Z" fill="#f59e0b"/>
    <path d="M358 200 L380 176 L380 238 L358 262 Z" fill="#b45309"/>
    <line x1="270" y1="230" x2="358" y2="230" stroke="#92400e" stroke-width="3"/>
    <line x1="314" y1="200" x2="314" y2="262" stroke="#92400e" stroke-width="3"/>
  </g>

  <!-- Rope from child's hands to the box -->
  <path d="M126 168 Q210 178 276 226" fill="none" stroke="#a16207" stroke-width="7" stroke-linecap="round"/>
  <path d="M126 168 Q210 178 276 226" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Child leaning back to pull -->
  <g stroke="#0f172a" stroke-width="4">
    <!-- back planted legs (braced) -->
    <path d="M108 200 Q86 226 70 250" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round"/>
    <rect x="56" y="246" width="30" height="14" rx="6" fill="#0f172a" stroke="none"/>
    <path d="M118 202 Q120 232 126 252" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round"/>
    <rect x="116" y="248" width="30" height="14" rx="6" fill="#0f172a" stroke="none"/>
    <!-- torso leaning back to the left -->
    <path d="M92 128 Q124 118 138 138 L128 200 Q104 206 88 190 Z" fill="#22c55e" transform="rotate(-16 116 160)"/>
    <!-- head -->
    <circle cx="96" cy="108" r="26" fill="#fcc79a" transform="rotate(-16 116 160)"/>
    <path d="M70 104 C74 78 118 78 122 104 C112 88 80 88 70 104 Z" fill="#78350f" transform="rotate(-16 116 160)"/>
    <g transform="rotate(-16 116 160)">
      <circle cx="106" cy="108" r="4" fill="#0f172a" stroke="none"/>
      <path d="M100 120 Q108 124 116 118" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- both arms gripping rope -->
    <path d="M120 150 Q124 160 126 168" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
    <path d="M108 160 Q116 164 124 170" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
    <circle cx="126" cy="168" r="11" fill="#fcc79a"/>
  </g>

  <!-- Effort/motion lines pulling to the LEFT (direction of pull) -->
  <g stroke="#ef4444" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="150" x2="34" y2="150"/>
    <line x1="66" y1="176" x2="40" y2="180"/>
  </g>
</svg>
