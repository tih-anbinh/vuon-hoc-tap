<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-pull desc-pull">
  <title id="title-pull">Pull</title>
  <desc id="desc-pull">A child leaning back and pulling hard on a rope, with motion lines showing the pulling force.</desc>
  <defs>
    <linearGradient id="pull-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="pull-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#pull-bg)"/>
  <rect x="0" y="250" width="400" height="10" fill="#22c55e" opacity="0.5"/>
  <ellipse cx="160" cy="265" rx="120" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Rope going off to the right -->
  <path d="M155 155 Q280 150 390 145" fill="none" stroke="#a16207" stroke-width="8" stroke-linecap="round"/>

  <g filter="url(#soft-shadow)">
    <!-- Leaning-back body -->
    <path d="M110 250 Q95 185 135 165 Q170 155 175 175 L165 245 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="4" transform="rotate(-14 140 205)"/>
    <!-- Back leg braced -->
    <path d="M120 240 L95 270" stroke="url(#pull-skin)" stroke-width="15" stroke-linecap="round"/>
    <path d="M150 245 L160 275" stroke="url(#pull-skin)" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="88" cy="272" rx="16" ry="8" fill="#1e293b"/>
    <ellipse cx="164" cy="278" rx="16" ry="8" fill="#1e293b"/>

    <!-- Head (leaning back) -->
    <circle cx="118" cy="120" r="38" fill="url(#pull-skin)" stroke="#d4a574" stroke-width="4"/>
    <path d="M84 112 Q86 82 118 82 Q150 82 152 112 Q136 92 118 92 Q100 92 84 112 Z" fill="#5b3a1a" stroke="#3d2109" stroke-width="2.5"/>
    <circle cx="128" cy="118" r="4.5" fill="#1e293b"/>
    <circle cx="108" cy="118" r="4.5" fill="#1e293b"/>
    <!-- Straining mouth -->
    <path d="M108 138 Q118 132 128 138" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Arms gripping rope -->
    <path d="M150 165 Q165 158 175 158" fill="none" stroke="url(#pull-skin)" stroke-width="13" stroke-linecap="round"/>
    <path d="M140 185 Q158 168 170 160" fill="none" stroke="url(#pull-skin)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="176" cy="158" r="9" fill="url(#pull-skin)" stroke="#d4a574" stroke-width="2"/>
  </g>

  <!-- Motion/force lines (pulling direction) -->
  <g stroke="#ef4444" stroke-width="5" stroke-linecap="round">
    <line x1="250" y1="120" x2="215" y2="128"/>
    <line x1="270" y1="145" x2="235" y2="150"/>
    <line x1="255" y1="175" x2="220" y2="172"/>
  </g>
</svg>
