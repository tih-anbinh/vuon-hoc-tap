<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-machine desc-machine">
  <title id="title-machine">Machine - A fun machine with gears and buttons</title>
  <desc id="desc-machine">A big friendly factory machine with turning gears, colourful buttons, a lever, dials, a funnel on top and a conveyor belt with a toy coming out.</desc>
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="mc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#mc-bg)"/>
  <rect x="0" y="248" width="400" height="52" fill="#94a3b8"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#475569" stroke-width="4"/>
  <ellipse cx="190" cy="256" rx="160" ry="12" fill="#0f172a" opacity="0.15"/>
  <!-- MACHINE (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- main body -->
    <rect x="70" y="98" width="200" height="150" rx="14" fill="url(#mc-body)" stroke="#1e293b" stroke-width="5"/>
    <!-- funnel on top -->
    <path d="M120,98 L110,54 L186,54 L176,98 Z" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
    <ellipse cx="148" cy="54" rx="38" ry="10" fill="#fbbf24" stroke="#78350f" stroke-width="3.5"/>
    <!-- chimney pipe -->
    <rect x="218" y="58" width="24" height="40" rx="6" fill="#64748b" stroke="#1e293b" stroke-width="4"/>
    <!-- steam puffs -->
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" opacity="0.95">
      <circle cx="230" cy="42" r="10"/>
      <circle cx="242" cy="28" r="8"/>
      <circle cx="254" cy="16" r="6"/>
    </g>
    <!-- big gear -->
    <g transform="translate(122,160)">
      <g fill="#fbbf24" stroke="#78350f" stroke-width="3.5">
        <rect x="-6" y="-36" width="12" height="14" rx="3"/>
        <rect x="-6" y="22" width="12" height="14" rx="3"/>
        <rect x="-36" y="-6" width="14" height="12" rx="3"/>
        <rect x="22" y="-6" width="14" height="12" rx="3"/>
        <rect x="-6" y="-36" width="12" height="14" rx="3" transform="rotate(45)"/>
        <rect x="-6" y="22" width="12" height="14" rx="3" transform="rotate(45)"/>
        <rect x="-36" y="-6" width="14" height="12" rx="3" transform="rotate(45)"/>
        <rect x="22" y="-6" width="14" height="12" rx="3" transform="rotate(45)"/>
      </g>
      <circle r="26" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
      <circle r="10" fill="#fef3c7" stroke="#78350f" stroke-width="3"/>
    </g>
    <!-- small gear -->
    <g transform="translate(180,196)">
      <g fill="#38bdf8" stroke="#0c4a6e" stroke-width="3">
        <rect x="-5" y="-26" width="10" height="11" rx="2.5"/>
        <rect x="-5" y="15" width="10" height="11" rx="2.5"/>
        <rect x="-26" y="-5" width="11" height="10" rx="2.5"/>
        <rect x="15" y="-5" width="11" height="10" rx="2.5"/>
        <rect x="-5" y="-26" width="10" height="11" rx="2.5" transform="rotate(45)"/>
        <rect x="-5" y="15" width="10" height="11" rx="2.5" transform="rotate(45)"/>
        <rect x="-26" y="-5" width="11" height="10" rx="2.5" transform="rotate(45)"/>
        <rect x="15" y="-5" width="11" height="10" rx="2.5" transform="rotate(45)"/>
      </g>
      <circle r="18" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="3.5"/>
      <circle r="7" fill="#e0f2fe" stroke="#0c4a6e" stroke-width="2.5"/>
    </g>
    <!-- control panel -->
    <rect x="214" y="112" width="46" height="70" rx="8" fill="#334155" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="228" cy="128" r="7" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
    <circle cx="248" cy="128" r="7" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
    <circle cx="228" cy="150" r="7" fill="#fbbf24" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="248" cy="150" r="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
    <!-- dial -->
    <circle cx="238" cy="170" r="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="238" y1="170" x2="243" y2="164" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- lever on side -->
    <rect x="262" y="196" width="26" height="12" rx="4" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <line x1="284" y1="200" x2="306" y2="176" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="310" cy="172" r="9" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <!-- output slot + conveyor -->
    <rect x="270" y="224" width="60 " height="24" rx="4" fill="#334155" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="288" y="240" width="96" height="14" rx="7" fill="#475569" stroke="#1e293b" stroke-width="3.5"/>
    <circle cx="300" cy="247" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
    <circle cx="332" cy="247" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
    <circle cx="364" cy="247" r="5" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
    <!-- toy duck coming out -->
    <g transform="translate(344,222)">
      <ellipse cx="0" cy="6" rx="14" ry="9" fill="#fde047" stroke="#a16207" stroke-width="3"/>
      <circle cx="10" cy="-4" r="8" fill="#fde047" stroke="#a16207" stroke-width="3"/>
      <path d="M17,-3 Q24,-2 20,2 Q17,1 16,-1 Z" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
      <circle cx="12" cy="-6" r="2" fill="#0f172a"/>
    </g>
  </g>
  <!-- sparks/energy -->
  <g stroke="#f59e0b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46,120 L54,108 L46,100 L54,88"/>
    <path d="M312,96 L318,86 L312,80 L318,70"/>
  </g>
</svg>
