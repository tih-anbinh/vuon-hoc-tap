<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-board desc-board">
  <title id="title-board">Board - Classroom whiteboard with drawings</title>
  <desc id="desc-board">A large classroom whiteboard on a wall with simple drawings of a sun, a house and a flower, plus markers on the tray below.</desc>
  <defs>
    <linearGradient id="bo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bo-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bo-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b478"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bo-bg)"/>
  <rect x="0" y="262" width="400" height="38" fill="#a16207"/>
  <!-- board -->
  <g filter="url(#soft-shadow)">
    <!-- frame -->
    <rect x="55" y="40" width="290" height="190" rx="10" fill="url(#bo-frame)" stroke="#78350f" stroke-width="4"/>
    <!-- surface -->
    <rect x="72" y="56" width="256" height="158" rx="5" fill="url(#bo-surface)" stroke="#94a3b8" stroke-width="2"/>
    <!-- drawing: sun -->
    <circle cx="120" cy="95" r="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <g stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round">
      <line x1="120" y1="68" x2="120" y2="60"/>
      <line x1="120" y1="122" x2="120" y2="130"/>
      <line x1="93" y1="95" x2="85" y2="95"/>
      <line x1="147" y1="95" x2="155" y2="95"/>
      <line x1="101" y1="76" x2="95" y2="70"/>
      <line x1="139" y1="76" x2="145" y2="70"/>
    </g>
    <!-- drawing: house -->
    <rect x="185" y="130" width="60" height="50" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <path d="M178,130 L215,98 L252,130" fill="none" stroke="#ef4444" stroke-width="4" stroke-linejoin="round"/>
    <rect x="205" y="150" width="18" height="30" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    <!-- drawing: flower -->
    <path d="M295,180 Q294,160 295,148" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="295" cy="135" r="8" fill="none" stroke="#ec4899" stroke-width="3.5"/>
    <g fill="none" stroke="#ec4899" stroke-width="3.5">
      <circle cx="284" cy="128" r="6"/>
      <circle cx="306" cy="128" r="6"/>
      <circle cx="284" cy="143" r="6"/>
      <circle cx="306" cy="143" r="6"/>
    </g>
    <!-- marker tray -->
    <rect x="100" y="230" width="200" height="12" rx="4" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <!-- markers -->
    <rect x="130" y="222" width="40" height="9" rx="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="185" y="222" width="40" height="9" rx="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="240" y="222" width="40" height="9" rx="4" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  </g>
</svg>
