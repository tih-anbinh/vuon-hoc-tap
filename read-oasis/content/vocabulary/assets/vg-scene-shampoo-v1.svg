<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shampoo desc-shampoo">
  <title id="title-shampoo">Shampoo</title>
  <desc id="desc-shampoo">A pump bottle of shampoo with soapy bubbles beside it for washing hair.</desc>
  <defs>
    <linearGradient id="shampoo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="shampoo-bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#shampoo-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Bottle body -->
    <path d="M150 130 Q150 115 165 115 L235 115 Q250 115 250 130 L250 250 Q250 262 238 262 L162 262 Q150 262 150 250 Z" fill="url(#shampoo-bottle)" stroke="#5b21b6" stroke-width="4"/>
    <!-- Neck -->
    <rect x="185" y="90" width="30" height="28" fill="#8b5cf6" stroke="#5b21b6" stroke-width="3"/>
    <!-- Pump head -->
    <path d="M180 90 L220 90 L220 78 L195 78 L195 65 L165 65 L165 78 L180 78 Z" fill="#c4b5fd" stroke="#5b21b6" stroke-width="3"/>
    <!-- Label -->
    <rect x="162" y="160" width="76" height="70" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/>
    <ellipse cx="200" cy="185" rx="22" ry="10" fill="#a78bfa"/>
    <path d="M175 205 L225 205 M175 216 L215 216" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bubbles -->
  <g fill="#ffffff" opacity="0.85" stroke="#a5f3fc" stroke-width="2">
    <circle cx="290" cy="120" r="20"/>
    <circle cx="315" cy="150" r="14"/>
    <circle cx="285" cy="165" r="12"/>
    <circle cx="105" cy="140" r="16"/>
    <circle cx="90" cy="175" r="11"/>
  </g>
  <g fill="#ffffff" opacity="0.6"><circle cx="284" cy="114" r="5"/><circle cx="99" cy="134" r="4"/></g>
</svg>
