<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-happy desc-happy">
  <title id="title-happy">Happy - A smiling face with sparkles of joy</title>
  <desc id="desc-happy">A cheerful round face with a big open smile, sparkling eyes, and colourful hearts and stars showing joy.</desc>
  <defs>
    <linearGradient id="happy-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <line x1="30" y1="270" x2="370" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="100" ry="7" fill="#0f172a" opacity="0.12"/>

  <!-- Radiating joy lines -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="200" y1="45" x2="200" y2="25"/>
    <line x1="130" y1="60" x2="115" y2="45"/>
    <line x1="270" y1="60" x2="285" y2="45"/>
    <line x1="90" y1="120" x2="70" y2="115"/>
    <line x1="310" y1="120" x2="330" y2="115"/>
    <line x1="95" y1="180" x2="75" y2="185"/>
    <line x1="305" y1="180" x2="325" y2="185"/>
  </g>

  <!-- Hearts floating -->
  <g filter="url(#soft-shadow)">
    <path d="M100 70 Q90 55 80 65 Q73 75 100 95 Q127 75 120 65 Q110 55 100 70 Z" fill="#f43f5e" stroke="#881337" stroke-width="2.5"/>
    <path d="M300 75 Q292 62 285 70 Q280 78 300 92 Q320 78 315 70 Q308 62 300 75 Z" fill="#f43f5e" stroke="#881337" stroke-width="2.5"/>
  </g>

  <!-- Stars -->
  <path d="M55 155 L59 165 L69 168 L59 171 L55 181 L51 171 L41 168 L51 165 Z" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <path d="M345 160 L349 170 L359 173 L349 176 L345 186 L341 176 L331 173 L341 170 Z" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <path d="M60 220 L63 227 L70 230 L63 233 L60 240 L57 233 L50 230 L57 227 Z" fill="#fb7185" stroke="#9f1239" stroke-width="1.5"/>
  <path d="M340 230 L343 237 L350 240 L343 243 L340 250 L337 243 L330 240 L337 237 Z" fill="#a855f7" stroke="#6b21a8" stroke-width="1.5"/>

  <g filter="url(#soft-shadow)">
    <!-- Face circle -->
    <circle cx="200" cy="155" r="95" fill="url(#happy-face)" stroke="#78350f" stroke-width="5"/>

    <!-- Sparkly eyes (curved happy shape - "^^") -->
    <path d="M155 140 Q170 118 185 140" fill="none" stroke="#0c0a09" stroke-width="5" stroke-linecap="round"/>
    <path d="M215 140 Q230 118 245 140" fill="none" stroke="#0c0a09" stroke-width="5" stroke-linecap="round"/>

    <!-- Sparkles on eyes -->
    <circle cx="163" cy="128" r="2.5" fill="#ffffff"/>
    <circle cx="223" cy="128" r="2.5" fill="#ffffff"/>

    <!-- Big open smile -->
    <path d="M140 175 Q200 240 260 175 Q200 210 140 175 Z" fill="#7c2d12" stroke="#0c0a09" stroke-width="4"/>
    <!-- Tongue -->
    <path d="M175 195 Q200 220 225 195 Q200 208 175 195 Z" fill="#f472b6" stroke="#9f1239" stroke-width="2"/>
    <!-- Teeth line -->
    <path d="M155 180 Q200 195 245 180" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <ellipse cx="130" cy="175" rx="14" ry="10" fill="#fb7185" opacity="0.7"/>
    <ellipse cx="270" cy="175" rx="14" ry="10" fill="#fb7185" opacity="0.7"/>
  </g>
</svg>