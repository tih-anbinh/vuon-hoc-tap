<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-net desc-net">
  <title id="title-net">Net</title>
  <desc id="desc-net">A butterfly catching net with a long handle and a round mesh hoop.</desc>
  <defs>
    <linearGradient id="net-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#net-bg)"/>
  <ellipse cx="210" cy="272" rx="130" ry="14" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Handle -->
    <rect x="70" y="200" width="180" height="14" rx="7" fill="#a16207" stroke="#78350f" stroke-width="3.5" transform="rotate(-30 160 207)"/>
    <!-- Hoop ring -->
    <circle cx="255" cy="105" r="70" fill="rgba(191,219,254,0.35)" stroke="#2563eb" stroke-width="6"/>
  </g>

  <!-- Mesh net (inside hoop) -->
  <g stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.85">
    <line x1="200" y1="90" x2="310" y2="90"/>
    <line x1="192" y1="105" x2="318" y2="105"/>
    <line x1="198" y1="120" x2="312" y2="120"/>
    <line x1="210" y1="135" x2="300" y2="135"/>
    <line x1="228" y1="150" x2="282" y2="150"/>
    <line x1="215" y1="45" x2="215" y2="160"/>
    <line x1="235" y1="40" x2="235" y2="168"/>
    <line x1="255" y1="38" x2="255" y2="172"/>
    <line x1="275" y1="40" x2="275" y2="168"/>
    <line x1="295" y1="45" x2="295" y2="160"/>
  </g>

  <!-- Butterfly being caught -->
  <g filter="url(#soft-shadow)">
    <path d="M255 100 c-16 -20 -40 -14 -40 6 c0 16 24 18 40 10 Z" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
    <path d="M255 100 c16 -20 40 -14 40 6 c0 16 -24 18 -40 10 Z" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
    <rect x="252" y="96" width="6" height="24" rx="3" fill="#1e293b"/>
  </g>
</svg>
