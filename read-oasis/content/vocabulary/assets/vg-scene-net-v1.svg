<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-net d-net">
  <title id="t-net">Net</title>
  <desc id="d-net">A white soccer goal net with a red-and-white ball flying into it, showing the ball going into the net.</desc>
  <defs>
    <pattern id="net-mesh" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 H20 M0 0 V20" stroke="#cbd5e1" stroke-width="1.8" fill="none"/>
    </pattern>
    <radialGradient id="net-ball" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="net-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="#bbf7d0"/>
  <rect x="0" y="232" width="400" height="68" fill="#4ade80"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#15803d" stroke-width="3"/>
  <ellipse cx="200" cy="262" rx="170" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- ===== GOAL with net (dominant) ===== -->
  <g filter="url(#net-sh)">
    <!-- net mesh panel filling the goal mouth -->
    <path d="M70,80 L330,80 L330,232 L70,232 Z" fill="url(#net-mesh)"/>
    <!-- side/top depth mesh -->
    <path d="M330,80 L360,64 L360,216 L330,232 Z" fill="url(#net-mesh)" opacity="0.75"/>
    <path d="M70,80 L100,64 L360,64 L330,80 Z" fill="url(#net-mesh)" opacity="0.6"/>
  </g>
  <!-- goal frame posts (drawn on top so they read as the goal) -->
  <g stroke="#f1f5f9" stroke-width="10" stroke-linecap="round" filter="url(#net-sh)">
    <line x1="70" y1="80" x2="70" y2="232"/>
    <line x1="330" y1="80" x2="330" y2="232"/>
    <line x1="70" y1="80" x2="330" y2="80"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <line x1="330" y1="80" x2="360" y2="64"/>
    <line x1="70" y1="80" x2="100" y2="64"/>
  </g>

  <!-- ball flying INTO the net -->
  <g filter="url(#net-sh)">
    <!-- motion streaks -->
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <line x1="150" y1="150" x2="120" y2="150"/>
      <line x1="150" y1="168" x2="126" y2="172"/>
      <line x1="150" y1="132" x2="126" y2="126"/>
    </g>
    <circle cx="200" cy="150" r="30" fill="url(#net-ball)" stroke="#0f172a" stroke-width="3.5"/>
    <!-- classic soccer-ball black pentagon patches -->
    <path d="M200,134 L214,144 L208,161 L192,161 L186,144 Z" fill="#1e293b"/>
    <path d="M200,127 L200,134 M214,144 L226,140 M208,161 L216,173 M192,161 L184,173 M186,144 L174,140"
          stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
