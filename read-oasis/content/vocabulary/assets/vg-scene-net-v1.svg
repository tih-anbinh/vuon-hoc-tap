<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-net d-net">
  <title id="t-net">Net</title>
  <desc id="d-net">A butterfly net with a long wooden handle and a round hoop filled with a fine diamond mesh, catching a butterfly.</desc>
  <defs>
    <pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 H18 M0 0 V18" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
    </pattern>
    <filter id="net-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#e0f2fe"/>
  <ellipse cx="240" cy="272" rx="120" ry="13" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#net-sh)">
    <!-- Handle -->
    <rect x="70" y="190" width="150" height="16" rx="8" fill="#a16207" stroke="#78350f" stroke-width="4" transform="rotate(28 145 198)"/>
    <!-- Mesh bag (cone) -->
    <path d="M232 92 Q300 96 316 156 Q296 210 236 214 Q214 154 232 92 Z" fill="url(#mesh)" stroke="#64748b" stroke-width="3"/>
    <path d="M232 92 Q300 96 316 156 Q296 210 236 214 Q214 154 232 92 Z" fill="#e0f2fe" opacity="0.25"/>
    <!-- Hoop ring (thick) -->
    <ellipse cx="256" cy="120" rx="58" ry="46" fill="none" stroke="#0ea5e9" stroke-width="10" transform="rotate(-18 256 120)"/>
    <!-- ring-to-handle joint -->
    <path d="M210 150 L232 168" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Butterfly inside -->
  <g stroke="#0f172a" stroke-width="3">
    <path d="M256 120 Q232 96 236 128 Q248 136 256 120 Z" fill="#f472b6"/>
    <path d="M256 120 Q280 96 276 128 Q264 136 256 120 Z" fill="#a855f7"/>
    <line x1="256" y1="108" x2="256" y2="134" stroke-width="4"/>
    <path d="M256 108 l-6 -8 M256 108 l6 -8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
