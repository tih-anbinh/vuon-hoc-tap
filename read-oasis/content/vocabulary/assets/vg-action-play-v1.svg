<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-play desc-play">
  <title id="title-play">Play - Children playing with toys</title>
  <desc id="desc-play">A happy child playing with blocks and a ball, surrounded by scattered toys and sparkles of fun.</desc>
  <defs>
    <linearGradient id="play-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="play-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="150" ry="7" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Building blocks (stack on left) -->
    <rect x="45" y="220" width="35" height="35" rx="3" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
    <rect x="55" y="185" width="35" height="35" rx="3" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
    <rect x="45" y="150" width="35" height="35" rx="3" fill="#22c55e" stroke="#166534" stroke-width="2.5"/>
    <!-- Block letter shapes (as decoration, not text) -->
    <circle cx="62" cy="237" r="4" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
    <path d="M67 200 L72 210 L77 200" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <rect x="57" y="163" width="10" height="10" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>

    <!-- Ball (bottom right) -->
    <circle cx="320" cy="235" r="25" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <path d="M296 230 Q320 220 344 230" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M296 240 Q320 250 344 240" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="320" cy="225" r="4" fill="#ffffff"/>

    <!-- Teddy bear (small, right side) -->
    <circle cx="280" cy="220" r="15" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="272" cy="210" r="6" fill="#a16207" stroke="#78350f" stroke-width="2"/>
    <circle cx="288" cy="210" r="6" fill="#a16207" stroke="#78350f" stroke-width="2"/>
    <circle cx="276" cy="218" r="1.5" fill="#0c0a09"/>
    <circle cx="284" cy="218" r="1.5" fill="#0c0a09"/>
    <ellipse cx="280" cy="225" rx="3" ry="2" fill="#0c0a09"/>

    <!-- Body/torso of child -->
    <path d="M150 175 Q185 168 220 175 L228 265 L142 265 Z" fill="url(#play-shirt)" stroke="#78350f" stroke-width="3"/>
    <!-- Neck -->
    <rect x="177" y="145" width="20" height="18" fill="url(#play-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Left arm (reaching down toward a block) -->
    <path d="M155 180 Q125 190 105 210" fill="none" stroke="url(#play-shirt)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="102" cy="212" r="10" fill="url(#play-skin)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Small block in hand -->
    <rect x="95" y="220" width="18" height="18" rx="2" fill="#a855f7" stroke="#6b21a8" stroke-width="2"/>

    <!-- Right arm (raised in play) -->
    <path d="M215 180 Q245 165 250 140" fill="none" stroke="url(#play-shirt)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="252" cy="135" r="10" fill="url(#play-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="187" cy="115" r="33" fill="url(#play-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Hair (pigtails) -->
    <path d="M158 105 Q160 78 187 72 Q214 78 216 105 Q207 85 187 82 Q167 85 158 105 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="156" cy="115" rx="7" ry="14" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="218" cy="115" rx="7" ry="14" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Big happy eyes -->
    <circle cx="177" cy="112" r="4" fill="#ffffff" stroke="#0c0a09" stroke-width="1.5"/>
    <circle cx="197" cy="112" r="4" fill="#ffffff" stroke="#0c0a09" stroke-width="1.5"/>
    <circle cx="178" cy="113" r="2" fill="#0c0a09"/>
    <circle cx="198" cy="113" r="2" fill="#0c0a09"/>
    <!-- Big smile -->
    <path d="M175 130 Q187 142 199 130" fill="none" stroke="#0c0a09" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="165" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="209" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
  </g>

  <!-- Fun sparkles -->
  <g>
    <path d="M100 80 L104 90 L114 94 L104 98 L100 108 L96 98 L86 94 L96 90 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
    <path d="M320 100 L323 108 L330 110 L323 112 L320 120 L317 112 L310 110 L317 108 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
    <path d="M60 100 L62 106 L68 108 L62 110 L60 116 L58 110 L52 108 L58 106 Z" fill="#fb7185" stroke="#9f1239" stroke-width="1.5"/>
    <circle cx="360" cy="150" r="4" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
    <circle cx="30" cy="180" r="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
  </g>
</svg>