<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-afternoon desc-afternoon">
  <title id="title-afternoon">Afternoon - Sun low in a warm sky</title>
  <desc id="desc-afternoon">A warm golden sun sitting low above a hill in the afternoon sky, casting a long shadow.</desc>
  <defs>
    <linearGradient id="aft-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8b0"/>
      <stop offset="60%" stop-color="#fbc678"/>
      <stop offset="100%" stop-color="#f59e5a"/>
    </linearGradient>
    <radialGradient id="aft-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c2"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="aft-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- sky -->
  <rect x="0" y="0" width="400" height="240" fill="url(#aft-sky)"/>
  <!-- distant hill -->
  <path d="M0,240 Q120,150 260,190 Q340,220 400,180 L400,240 Z" fill="#65a30d" opacity="0.55"/>
  <!-- ground -->
  <rect x="0" y="240" width="400" height="60" fill="url(#aft-hill)"/>
  <!-- soft cloud -->
  <ellipse cx="90" cy="70" rx="42" ry="14" fill="#fff5df" opacity="0.75"/>
  <ellipse cx="120" cy="66" rx="30" ry="12" fill="#fff5df" opacity="0.75"/>
  <!-- sun low on horizon -->
  <g filter="url(#soft-shadow)">
    <circle cx="290" cy="180" r="55" fill="url(#aft-sun)" stroke="#78350f" stroke-width="3.5"/>
    <!-- sun rays -->
    <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <line x1="290" y1="105" x2="290" y2="88"/>
      <line x1="365" y1="180" x2="382" y2="180"/>
      <line x1="215" y1="180" x2="198" y2="180"/>
      <line x1="343" y1="127" x2="356" y2="114"/>
      <line x1="237" y1="127" x2="224" y2="114"/>
    </g>
  </g>
  <!-- little tree with long shadow -->
  <g filter="url(#soft-shadow)">
    <rect x="80" y="215" width="10" height="30" fill="#78350f"/>
    <circle cx="85" cy="210" r="20" fill="#65a30d" stroke="#3f6212" stroke-width="3"/>
  </g>
  <!-- long slanted shadow of tree pointing away from sun -->
  <ellipse cx="45" cy="255" rx="55" ry="6" fill="#0f172a" opacity="0.28" transform="rotate(-8 45 255)"/>
</svg>
