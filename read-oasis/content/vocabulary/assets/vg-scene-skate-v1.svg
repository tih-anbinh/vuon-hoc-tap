<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-skate desc-skate">
  <title id="title-skate">Skate</title>
  <desc id="desc-skate">A white ice skate boot with a shiny silver blade, laced up ready for skating.</desc>
  <defs>
    <linearGradient id="skate-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="skate-boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#skate-bg)"/>
  <ellipse cx="200" cy="272" rx="130" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Boot -->
    <path d="M130 70 Q135 60 150 60 L175 60 Q185 60 188 75 L195 175 Q200 200 250 205 L280 205 Q292 205 292 218 L110 218 Q108 200 118 190 Q128 160 128 110 Z" fill="url(#skate-boot)" stroke="#64748b" stroke-width="4"/>
    <!-- Tongue -->
    <path d="M150 62 Q145 110 155 160 L172 158 Q168 108 172 62 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Laces -->
    <g stroke="#334155" stroke-width="3.5" stroke-linecap="round">
      <line x1="140" y1="80" x2="182" y2="90"/>
      <line x1="140" y1="100" x2="182" y2="110"/>
      <line x1="142" y1="120" x2="184" y2="130"/>
      <line x1="145" y1="140" x2="186" y2="150"/>
    </g>
    <g fill="#64748b"><circle cx="140" cy="80" r="3"/><circle cx="140" cy="100" r="3"/><circle cx="142" cy="120" r="3"/><circle cx="182" cy="90" r="3"/><circle cx="182" cy="110" r="3"/><circle cx="184" cy="130" r="3"/></g>

    <!-- Blade holder -->
    <rect x="112" y="218" width="180" height="12" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <!-- Blade -->
    <path d="M105 232 Q100 245 118 246 L288 246 Q306 245 300 232 Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <line x1="118" y1="239" x2="288" y2="239" stroke="#f8fafc" stroke-width="2"/>
  </g>

  <!-- Ice shine -->
  <g fill="#ffffff" opacity="0.7"><circle cx="150" cy="262" r="4"/><circle cx="240" cy="264" r="3"/></g>
</svg>
