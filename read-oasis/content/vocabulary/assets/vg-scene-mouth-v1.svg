<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-mouth desc-mouth">
  <title id="title-mouth">Mouth</title>
  <desc id="desc-mouth">A friendly child's face with a big smiling open mouth highlighted by a bright ring, clearly pointing out the mouth on the face.</desc>
  <defs>
    <radialGradient id="mouth-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <linearGradient id="mouth-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="mouth-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#mouth-bg)"/>
  <ellipse cx="200" cy="272" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="face" filter="url(#soft-shadow)">
    <ellipse cx="200" cy="160" rx="92" ry="102" fill="url(#mouth-skin)" stroke="#c2762e" stroke-width="4"/>
    <path d="M112 128 C120 78 280 78 288 128 C270 108 250 118 232 106 C214 122 186 122 168 106 C150 118 130 108 112 128 Z" fill="url(#mouth-hair)"/>
    <ellipse cx="112" cy="168" rx="16" ry="24" fill="url(#mouth-skin)" stroke="#c2762e" stroke-width="4"/>
    <ellipse cx="288" cy="168" rx="16" ry="24" fill="url(#mouth-skin)" stroke="#c2762e" stroke-width="4"/>

    <ellipse cx="162" cy="150" rx="14" ry="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="164" cy="152" r="7" fill="#5b3a1e"/>
    <circle cx="161" cy="149" r="2.5" fill="#ffffff"/>
    <ellipse cx="238" cy="150" rx="14" ry="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="240" cy="152" r="7" fill="#5b3a1e"/>
    <circle cx="237" cy="149" r="2.5" fill="#ffffff"/>
    <path d="M148 130 Q162 122 178 130" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M224 130 Q238 122 252 130" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M196 172 C204 186 210 196 206 202 C202 208 194 208 190 202 C186 196 190 186 196 172 Z" fill="#f7b98a" stroke="#b5651d" stroke-width="3" stroke-linejoin="round"/>

    <circle cx="138" cy="200" r="14" fill="#fb7185" opacity="0.35"/>
    <circle cx="262" cy="200" r="14" fill="#fb7185" opacity="0.35"/>

    <!-- TARGET: MOUTH (big open smile with teeth + tongue) -->
    <path d="M158 218 Q200 232 242 218 Q236 262 200 262 Q164 262 158 218 Z"
          fill="#9f1239" stroke="#7f1d1d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M166 221 Q200 231 234 221 Q230 236 200 236 Q170 236 166 221 Z" fill="#ffffff"/>
    <ellipse cx="200" cy="252" rx="20" ry="11" fill="#fb7185"/>
  </g>

  <ellipse cx="200" cy="238" rx="56" ry="40" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 7"/>
</svg>
