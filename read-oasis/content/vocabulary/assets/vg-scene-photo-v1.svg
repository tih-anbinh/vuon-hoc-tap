<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-photo desc-photo">
  <title id="title-photo">Photo - Framed photograph of a family</title>
  <desc id="desc-photo">A large photograph with a white border showing a smiling family in front of their house, with a camera beside it flashing.</desc>
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ph-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#ph-bg)"/>
  <ellipse cx="200" cy="272" rx="150" ry="12" fill="#0f172a" opacity="0.18"/>
  <!-- photo with white border, slightly tilted -->
  <g filter="url(#soft-shadow)" transform="rotate(-4 185 150)">
    <rect x="65" y="45" width="240" height="210" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="3.5"/>
    <!-- photo image area -->
    <g>
      <rect x="80" y="60" width="210" height="155" fill="url(#ph-sky)" stroke="#64748b" stroke-width="2.5"/>
      <!-- tiny scene inside photo: sun, house, family -->
      <circle cx="265" cy="82" r="13" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
      <rect x="80" y="185" width="210" height="30" fill="#65a30d"/>
      <!-- house -->
      <rect x="98" y="130" width="62" height="56" fill="#fef3c7" stroke="#78350f" stroke-width="2.5"/>
      <path d="M92,132 L129,102 L166,132 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
      <rect x="120" y="158" width="18" height="28" fill="#78350f"/>
      <rect x="104" y="140" width="14" height="12" fill="#bae6fd" stroke="#78350f" stroke-width="1.5"/>
      <!-- family stick-ish figures -->
      <circle cx="205" cy="145" r="10" fill="#fcd9b6" stroke="#78350f" stroke-width="2"/>
      <path d="M198,156 L212,156 L215,186 L195,186 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="237" cy="150" r="9" fill="#fcd9b6" stroke="#78350f" stroke-width="2"/>
      <path d="M231,160 L243,160 L246,186 L228,186 Z" fill="#ec4899" stroke="#9d174d" stroke-width="2"/>
      <circle cx="222" cy="166" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2"/>
      <path d="M217,174 L227,174 L229,186 L215,186 Z" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
      <!-- smiles -->
      <path d="M201,147 Q205,150 209,147" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M233,152 Q237,155 241,152" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M219,168 Q222,170 225,168" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- corner tape -->
    <rect x="58" y="52" width="34" height="14" rx="3" fill="#fde047" opacity="0.85" transform="rotate(-38 75 59)"/>
    <rect x="280" y="52" width="34" height="14" rx="3" fill="#fde047" opacity="0.85" transform="rotate(38 297 59)"/>
  </g>
  <!-- camera -->
  <g filter="url(#soft-shadow)">
    <rect x="300" y="195" width="88" height="62" rx="10" fill="#334155" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="315" y="185" width="30" height="14" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="344" cy="226" r="20" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="344" cy="226" r="12" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2.5"/>
    <circle cx="339" cy="221" r="4" fill="#dbeafe"/>
    <circle cx="374" cy="207" r="5" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
  </g>
  <!-- flash sparkle -->
  <g stroke="#fde047" stroke-width="3.5" stroke-linecap="round">
    <line x1="374" y1="188" x2="374" y2="176"/>
    <line x1="386" y1="193" x2="394" y2="185"/>
    <line x1="362" y1="193" x2="354" y2="185"/>
  </g>
</svg>
