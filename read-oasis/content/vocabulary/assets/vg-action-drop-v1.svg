<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-drop desc-drop">
  <title id="title-drop">Drop</title>
  <desc id="desc-drop">A hand letting go of a ball that is falling down, shown with motion lines toward the ground.</desc>
  <defs>
    <linearGradient id="drop-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="drop-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <radialGradient id="drop-ball" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#drop-bg)"/>
  <rect x="0" y="258" width="400" height="42" fill="#86efac"/>
  <ellipse cx="200" cy="265" rx="60" ry="12" fill="#0f172a" opacity="0.18"/>

  <g filter="url(#soft-shadow)">
    <!-- Open hand at top letting go -->
    <path d="M155 70 Q200 55 245 70 L240 95 Q200 82 160 95 Z" fill="url(#drop-skin)" stroke="#d4a574" stroke-width="3.5"/>
    <path d="M165 90 l-6 22 M185 92 l-3 26 M215 92 l3 26 M235 90 l6 22" stroke="url(#drop-skin)" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="175" y1="130" x2="175" y2="155"/>
    <line x1="225" y1="130" x2="225" y2="155"/>
    <line x1="185" y1="165" x2="185" y2="185"/>
    <line x1="215" y1="165" x2="215" y2="185"/>
  </g>

  <!-- Falling ball -->
  <g filter="url(#soft-shadow)">
    <circle cx="200" cy="215" r="34" fill="url(#drop-ball)" stroke="#991b1b" stroke-width="4"/>
    <path d="M166 215 L234 215 M200 181 L200 249" stroke="#991b1b" stroke-width="3" opacity="0.5"/>
    <ellipse cx="188" cy="200" rx="9" ry="6" fill="#fff" opacity="0.4"/>
  </g>
</svg>
