<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-tennis desc-tennis">
  <title id="title-tennis">Tennis - Child playing tennis on a court</title>
  <desc id="desc-tennis">A child swinging a tennis racket to hit a yellow ball over the net on a green tennis court with white lines.</desc>
  <defs>
    <linearGradient id="tn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="tn-court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#tn-sky)"/>
  <circle cx="55" cy="46" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="320" cy="45" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- court -->
  <rect x="0" y="180" width="400" height="120" fill="url(#tn-court)"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#14532d" stroke-width="3.5"/>
  <!-- court lines -->
  <g stroke="#ffffff" stroke-width="4" opacity="0.9">
    <line x1="30" y1="292" x2="370" y2="292"/>
    <line x1="60" y1="215" x2="340" y2="215"/>
    <line x1="60" y1="215" x2="30" y2="292"/>
    <line x1="340" y1="215" x2="370" y2="292"/>
    <line x1="200" y1="215" x2="200" y2="292"/>
  </g>
  <!-- net across right -->
  <g filter="url(#soft-shadow)">
    <line x1="288" y1="150" x2="288" y2="230" stroke="#334155" stroke-width="5"/>
    <line x1="396" y1="145" x2="396" y2="222" stroke="#334155" stroke-width="5"/>
    <rect x="288" y="150" width="108" height="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <path d="M288,160 L288,228 L396,220 L396,160 Z" fill="#e2e8f0" opacity="0.6" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#64748b" stroke-width="1.5" opacity="0.8">
      <line x1="288" y1="176" x2="396" y2="172"/>
      <line x1="288" y1="192" x2="396" y2="188"/>
      <line x1="288" y1="208" x2="396" y2="204"/>
      <line x1="310" y1="160" x2="310" y2="226"/>
      <line x1="332" y1="160" x2="332" y2="225"/>
      <line x1="354" y1="160" x2="354" y2="223"/>
      <line x1="376" y1="160" x2="376" y2="221"/>
    </g>
  </g>
  <!-- ball flying over net -->
  <circle cx="300" cy="98" r="12" fill="#bef264" stroke="#4d7c0f" stroke-width="3.5"/>
  <path d="M291,90 Q300,98 291,106 M309,90 Q300,98 309,106" fill="none" stroke="#4d7c0f" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="274" y1="94" x2="260" y2="92"/>
    <line x1="276" y1="106" x2="262" y2="108"/>
  </g>
  <!-- child swinging racket -->
  <g filter="url(#soft-shadow)">
    <!-- racket swung high -->
    <g transform="rotate(-30 150 78)">
      <ellipse cx="150" cy="62" rx="26" ry="34" fill="#fef3c7" stroke="#b45309" stroke-width="4.5"/>
      <g stroke="#b45309" stroke-width="1.6" opacity="0.85">
        <line x1="136" y1="40" x2="136" y2="84"/>
        <line x1="150" y1="30" x2="150" y2="94"/>
        <line x1="164" y1="40" x2="164" y2="84"/>
        <line x1="126" y1="52" x2="174" y2="52"/>
        <line x1="124" y1="66" x2="176" y2="66"/>
        <line x1="128" y1="80" x2="172" y2="80"/>
      </g>
      <line x1="150" y1="96" x2="150" y2="128" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- head -->
    <circle cx="180" cy="140" r="24" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M158,132 Q164,114 186,118 L194,130 Q180,120 160,138 Z" fill="#451a03"/>
    <circle cx="174" cy="138" r="3" fill="#0f172a"/>
    <circle cx="188" cy="138" r="3" fill="#0f172a"/>
    <path d="M174,149 Q181,154 188,149" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- body -->
    <path d="M164,162 L196,162 L204,222 L156,222 Z" fill="#f97316" stroke="#c2410c" stroke-width="3.5"/>
    <!-- arm up to racket -->
    <path d="M170,166 Q152,140 142,116" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- other arm out -->
    <path d="M196,172 Q222,180 234,172" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- shorts + legs -->
    <rect x="158" y="222" width="46" height="16" rx="5" fill="#1e3a8a" stroke="#0f172a" stroke-width="3"/>
    <path d="M168,238 L162,266" stroke="#fcd9b6" stroke-width="11" stroke-linecap="round"/>
    <path d="M194,238 L202,264" stroke="#fcd9b6" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="160" cy="272" rx="13" ry="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <ellipse cx="205" cy="270" rx="13" ry="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  </g>
</svg>
