<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-swim d-swim">
  <title id="t-swim">Swim</title>
  <desc id="d-swim">A child in blue water doing front-crawl, one arm reaching forward over the head and legs kicking behind, with splashes, showing swimming.</desc>
  <defs>
    <linearGradient id="sw-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#e0f2fe"/>
  <!-- Water pool -->
  <path d="M8 150 Q80 132 160 150 T312 150 T392 148 L392 284 Q392 292 384 292 L16 292 Q8 292 8 284 Z" fill="url(#sw-water)"/>
  <!-- Wave lines -->
  <g fill="none" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M30 178 q20 -10 40 0 t40 0 t40 0"/>
    <path d="M180 200 q20 -10 40 0 t40 0 t40 0"/>
    <path d="M60 224 q20 -10 40 0 t40 0"/>
  </g>

  <!-- Swimmer (front crawl, body along the surface) -->
  <g stroke="#0f172a" stroke-width="4">
    <!-- back leg kicking -->
    <path d="M300 176 Q332 170 352 150" fill="none" stroke="#f59e0b" stroke-width="15" stroke-linecap="round"/>
    <!-- front leg kicking -->
    <path d="M300 186 Q334 190 356 178" fill="none" stroke="#f59e0b" stroke-width="15" stroke-linecap="round"/>
    <!-- torso along surface -->
    <path d="M150 168 Q230 152 306 178 Q234 196 152 188 Z" fill="#ef4444"/>
    <!-- trailing arm along body -->
    <path d="M232 178 Q260 190 288 182" fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <!-- reaching arm forward over head -->
    <path d="M168 170 Q120 152 92 128" fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <circle cx="90" cy="126" r="11" fill="#fcc79a"/>
    <!-- head turned to breathe, above water -->
    <circle cx="150" cy="150" r="26" fill="#fcc79a"/>
    <!-- swim cap -->
    <path d="M126 148 A26 26 0 0 1 176 144 L174 138 Q150 128 128 140 Z" fill="#22c55e"/>
    <circle cx="158" cy="150" r="4" fill="#0f172a" stroke="none"/>
    <path d="M156 162 Q164 168 172 160" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Splashes -->
  <g fill="#fff" opacity="0.9">
    <circle cx="86" cy="118" r="6"/><circle cx="98" cy="106" r="4"/><circle cx="76" cy="128" r="4"/>
    <circle cx="360" cy="156" r="6"/><circle cx="368" cy="170" r="4"/>
  </g>
</svg>
