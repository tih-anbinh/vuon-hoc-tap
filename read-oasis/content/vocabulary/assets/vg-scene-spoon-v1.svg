<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-spoon desc-spoon">
  <title id="title-spoon">Spoon</title>
  <desc id="desc-spoon">A shiny silver spoon with a rounded scoop bowl and a long handle, lying on a table.</desc>
  <defs>
    <linearGradient id="spoon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="spoon-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#spoon-bg)"/>
  <ellipse cx="200" cy="265" rx="140" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)" transform="rotate(-25 200 150)">
    <!-- Bowl of spoon -->
    <ellipse cx="200" cy="90" rx="52" ry="70" fill="url(#spoon-metal)" stroke="#475569" stroke-width="4"/>
    <ellipse cx="200" cy="90" rx="36" ry="52" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Shine -->
    <ellipse cx="185" cy="70" rx="10" ry="22" fill="#ffffff" opacity="0.6"/>
    <!-- Handle -->
    <path d="M188 155 Q185 220 195 280 Q200 290 205 280 Q215 220 212 155 Z" fill="url(#spoon-metal)" stroke="#475569" stroke-width="4"/>
  </g>
</svg>
