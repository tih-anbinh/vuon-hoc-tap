<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hospital desc-hospital">
  <title id="title-hospital">Hospital - A big white hospital building</title>
  <desc id="desc-hospital">A large white hospital building with a red cross sign, many windows, an entrance with doors, and an ambulance parked in front.</desc>
  <defs>
    <linearGradient id="hp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="hp-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#hp-sky)"/>
  <circle cx="48" cy="46" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="330" cy="44" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- ground -->
  <rect x="0" y="240" width="400" height="60" fill="#94a3b8"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#475569" stroke-width="3.5"/>
  <!-- HOSPITAL BUILDING (hero element) -->
  <g filter="url(#soft-shadow)">
    <rect x="70" y="70" width="260" height="170" fill="url(#hp-wall)" stroke="#334155" stroke-width="4.5"/>
    <rect x="60" y="56" width="280" height="18" rx="4" fill="#64748b" stroke="#1e293b" stroke-width="3.5"/>
    <!-- red cross sign -->
    <rect x="172" y="84" width="56" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3.5"/>
    <path d="M192,94 L208,94 L208,104 L218,104 L218,120 L208,120 L208,130 L192,130 L192,120 L182,120 L182,104 L192,104 Z"
          fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
    <!-- windows -->
    <g fill="#7dd3fc" stroke="#0c4a6e" stroke-width="3">
      <rect x="88" y="90" width="30" height="26" rx="3"/>
      <rect x="88" y="130" width="30" height="26" rx="3"/>
      <rect x="282" y="90" width="30" height="26" rx="3"/>
      <rect x="282" y="130" width="30" height="26" rx="3"/>
      <rect x="88" y="170" width="30" height="26" rx="3"/>
      <rect x="282" y="170" width="30" height="26" rx="3"/>
      <rect x="134" y="152" width="30" height="26" rx="3"/>
      <rect x="236" y="152" width="30" height="26" rx="3"/>
    </g>
    <!-- entrance -->
    <rect x="172" y="176" width="56" height="64" fill="#38bdf8" stroke="#0c4a6e" stroke-width="4"/>
    <line x1="200" y1="176" x2="200" y2="240" stroke="#0c4a6e" stroke-width="3.5"/>
    <circle cx="192" cy="210" r="3" fill="#0c4a6e"/>
    <circle cx="208" cy="210" r="3" fill="#0c4a6e"/>
    <rect x="164" y="164" width="72" height="12" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
  </g>
  <!-- ambulance -->
  <g filter="url(#soft-shadow)">
    <rect x="252" y="232" width="118 " height="42" rx="8" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <path d="M252,246 L232,246 Q224,246 222,256 L222,274 L252,274 Z" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>
    <rect x="228" y="250" width="18" height="12" rx="3" fill="#7dd3fc" stroke="#0c4a6e" stroke-width="2.5"/>
    <!-- red cross on side -->
    <path d="M300,240 L310,240 L310,247 L317,247 L317,257 L310,257 L310,264 L300,264 L300,257 L293,257 L293,247 L300,247 Z"
          fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    <!-- siren light -->
    <rect x="266" y="222" width="20" height="10" rx="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
    <g stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round">
      <line x1="264" y1="214" x2="260" y2="208"/>
      <line x1="276" y1="212" x2="276" y2="205"/>
      <line x1="288" y1="214" x2="292" y2="208"/>
    </g>
    <!-- wheels -->
    <circle cx="250" cy="276" r="12" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="250" cy="276" r="5" fill="#94a3b8"/>
    <circle cx="344" cy="276" r="12" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="344" cy="276" r="5" fill="#94a3b8"/>
  </g>
  <!-- tree -->
  <g filter="url(#soft-shadow)">
    <rect x="30" y="204" width="12" height="38" rx="4" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <circle cx="36" cy="186" r="28" fill="#22c55e" stroke="#15803d" stroke-width="3.5"/>
  </g>
</svg>
