<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-climb desc-climb">
  <title id="title-climb">Climb - Child climbing a ladder</title>
  <desc id="desc-climb">A cheerful child climbing up a tall ladder, one hand and foot reaching upward.</desc>
  <defs>
    <linearGradient id="climb-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="climb-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="150" ry="6" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Ladder posts -->
    <rect x="130" y="20" width="12" height="245" rx="4" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <rect x="255" y="20" width="12" height="245" rx="4" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <!-- Ladder rungs -->
    <rect x="130" y="55" width="137" height="10" rx="2" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <rect x="130" y="100" width="137" height="10" rx="2" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <rect x="130" y="145" width="137" height="10" rx="2" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <rect x="130" y="190" width="137" height="10" rx="2" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <rect x="130" y="235" width="137" height="10" rx="2" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>

    <!-- Child body (behind ladder, climbing) -->
    <!-- Legs -->
    <!-- Left leg (bent, on rung 2) -->
    <path d="M180 220 L165 200 L150 202" fill="none" stroke="#1e40af" stroke-width="18" stroke-linecap="round"/>
    <!-- Right leg (straight, on rung 3) -->
    <path d="M215 220 L225 195 L228 165" fill="none" stroke="#1e40af" stroke-width="18" stroke-linecap="round"/>
    <!-- Left shoe -->
    <ellipse cx="150" cy="205" rx="12" ry="6" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <!-- Right shoe -->
    <ellipse cx="228" cy="163" rx="12" ry="6" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>

    <!-- Torso -->
    <path d="M175 155 Q195 145 220 148 L225 220 Q200 225 175 220 Z" fill="url(#climb-shirt)" stroke="#166534" stroke-width="3"/>

    <!-- Right arm (reaching UP) -->
    <path d="M215 155 Q225 120 220 90" fill="none" stroke="url(#climb-shirt)" stroke-width="18" stroke-linecap="round"/>
    <!-- Right hand grabbing top rung -->
    <circle cx="218" cy="85" r="10" fill="url(#climb-skin)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Fingers wrapping rung -->
    <path d="M212 78 Q218 76 224 78" fill="none" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left arm (holding lower rung) -->
    <path d="M180 155 Q175 130 165 115" fill="none" stroke="url(#climb-shirt)" stroke-width="18" stroke-linecap="round"/>
    <!-- Left hand -->
    <circle cx="162" cy="110" r="10" fill="url(#climb-skin)" stroke="#a16207" stroke-width="2.5"/>
    <path d="M156 103 Q162 101 168 103" fill="none" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="200" cy="115" r="28" fill="url(#climb-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Hair -->
    <path d="M175 105 Q180 82 200 78 Q220 82 225 105 Q220 92 200 88 Q180 92 175 105 Z" fill="#451a03" stroke="#27150a" stroke-width="2"/>
    <!-- Face (looking up) -->
    <circle cx="190" cy="110" r="2.5" fill="#0c0a09"/>
    <circle cx="210" cy="110" r="2.5" fill="#0c0a09"/>
    <path d="M192 122 Q200 128 208 122" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="183" cy="118" r="4" fill="#fca5a5" opacity="0.5"/>
    <circle cx="217" cy="118" r="4" fill="#fca5a5" opacity="0.5"/>
  </g>

  <!-- Upward motion arrows -->
  <g stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M300 130 L300 100"/>
    <path d="M295 108 L300 100 L305 108"/>
    <path d="M85 130 L85 100"/>
    <path d="M80 108 L85 100 L90 108"/>
  </g>
</svg>