<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-duck desc-duck">
  <title id="title-duck">duck</title>
  <desc id="desc-duck">A yellow duck swimming on a pond with ripples in the water.</desc>
  <rect width="400" height="300" rx="20" fill="#E3F2FD"/>
  <!-- Pond water -->
  <ellipse cx="200" cy="210" rx="170" ry="60" fill="#81D4FA"/>
  <ellipse cx="200" cy="210" rx="170" ry="60" fill="none" stroke="#4FC3F7" stroke-width="2"/>
  <!-- Ripples -->
  <path d="M130,230 Q145,225 160,230" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.5"/>
  <path d="M220,235 Q240,230 260,235" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.5"/>
  <!-- Grass banks -->
  <rect y="250" width="400" height="50" rx="0" fill="#A5D6A7"/>
  <g transform="translate(200, 130)">
    <!-- Tail feathers -->
    <path d="M30,30 Q50,15 45,35 Q55,20 48,40" fill="#FDD835" stroke="#F9A825" stroke-width="1.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="40" ry="25" fill="#FDD835" stroke="#F9A825" stroke-width="2.5"/>
    <!-- Wing -->
    <path d="M10,28 Q25,20 30,35 Q20,40 5,35" fill="#FBC02D" stroke="#F9A825" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M-25,25 Q-30,5 -20,-5" fill="none" stroke="#FDD835" stroke-width="18"/>
    <!-- Head -->
    <circle cx="-20" cy="-10" r="18" fill="#FDD835" stroke="#F9A825" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="-26" cy="-14" r="4" fill="white" stroke="#37474F" stroke-width="1.5"/>
    <circle cx="-27" cy="-14" r="2" fill="#37474F"/>
    <!-- Beak -->
    <path d="M-38,-8 L-52,-6 L-38,-2" fill="#FF8F00" stroke="#EF6C00" stroke-width="1.5"/>
    <!-- Water line -->
    <path d="M-40,50 Q-20,45 0,50 Q20,55 40,50" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
