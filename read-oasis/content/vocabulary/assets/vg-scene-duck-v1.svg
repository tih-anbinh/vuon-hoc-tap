<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-duck d-duck">
  <title id="t-duck">Duck</title>
  <desc id="d-duck">A cheerful white duck with an orange bill, round eye, curled tail and orange webbed feet, standing on the ground.</desc>
  <defs>
    <radialGradient id="dk-body" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>
    <filter id="dk-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#dcfce7"/>
  <ellipse cx="200" cy="262" rx="130" ry="14" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#dk-sh)" stroke="#0f172a" stroke-width="4">
    <!-- webbed feet -->
    <path d="M168 244 L152 268 L188 268 L182 244 Z" fill="#f59e0b"/>
    <path d="M214 244 L200 268 L236 268 L228 244 Z" fill="#f59e0b"/>
    <!-- body -->
    <ellipse cx="198" cy="196" rx="96" ry="60" fill="url(#dk-body)"/>
    <!-- wing -->
    <path d="M150 176 Q210 160 262 190 Q214 202 156 200 Z" fill="#f1f5f9"/>
    <path d="M180 182 Q220 176 250 190" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <!-- curled tail -->
    <path d="M104 178 Q76 168 70 148 Q92 160 108 166 Z" fill="#ffffff"/>
    <!-- neck + head -->
    <path d="M258 176 Q270 130 258 104 Q286 92 300 116 Q306 150 288 178 Z" fill="url(#dk-body)"/>
    <circle cx="288" cy="100" r="34" fill="url(#dk-body)"/>
    <!-- bill -->
    <path d="M312 96 L360 90 Q372 96 360 104 L314 108 Z" fill="#f59e0b"/>
    <path d="M314 102 L358 98" stroke="#c2740a" stroke-width="2.5"/>
    <!-- eye -->
    <circle cx="292" cy="90" r="6" fill="#0f172a"/>
    <circle cx="294" cy="88" r="2" fill="#fff" stroke="none"/>
  </g>
</svg>
