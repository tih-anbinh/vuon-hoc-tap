<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-white desc-white">
  <title id="title-white">White - White things: snowman, sheep, milk and cloud</title>
  <desc id="desc-white">A central white paint splash surrounded by white things: a snowman, a fluffy sheep, a glass of milk and a cloud, all on a colorful background.</desc>
  <defs>
    <linearGradient id="wh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#wh-bg)"/>
  <!-- central white paint splash -->
  <g filter="url(#soft-shadow)">
    <path d="M200,90 Q228,96 240,118 Q268,116 270,142 Q288,158 272,176 Q280,200 254,206 Q246,228 220,220 Q200,236 180,220 Q152,228 146,204 Q122,198 130,174 Q114,158 132,142 Q132,116 160,118 Q172,96 200,90 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
    <!-- paint drips -->
    <path d="M170,218 Q168,238 174,248 Q180,240 178,222 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <path d="M228,216 Q230,232 224,242 Q220,232 222,218 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <!-- paintbrush -->
    <g transform="rotate(35 262 96)">
      <rect x="254" y="40" width="16" height="52" rx="5" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
      <rect x="252" y="88" width="20" height="10" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <path d="M254,98 Q262,116 270,98 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    </g>
  </g>
  <!-- snowman bottom-left -->
  <g filter="url(#soft-shadow)">
    <circle cx="70" cy="248" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="3.5"/>
    <circle cx="70" cy="204" r="21" fill="#ffffff" stroke="#94a3b8" stroke-width="3.5"/>
    <circle cx="64" cy="200" r="2.8" fill="#0f172a"/>
    <circle cx="76" cy="200" r="2.8" fill="#0f172a"/>
    <path d="M70,206 L80,209 L70,212 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <path d="M64,216 Q70,220 76,216" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <rect x="54" y="178" width="32" height="7" rx="3" fill="#1e293b"/>
    <rect x="60" y="162" width="20" height="18" fill="#1e293b"/>
    <g fill="#0f172a">
      <circle cx="70" cy="238" r="2.8"/>
      <circle cx="70" cy="252" r="2.8"/>
    </g>
  </g>
  <!-- sheep bottom-right -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="322" cy="242" rx="44" ry="30" fill="#ffffff" stroke="#94a3b8" stroke-width="3.5"/>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="2.5">
      <circle cx="286" cy="226" r="12"/>
      <circle cx="308" cy="216" r="13"/>
      <circle cx="334" cy="215" r="13"/>
      <circle cx="356" cy="226" r="12"/>
    </g>
    <ellipse cx="282" cy="248" rx="15" ry="17" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="277" cy="244" r="3" fill="#ffffff"/>
    <circle cx="287" cy="244" r="3" fill="#ffffff"/>
    <path d="M279,255 Q282,258 285,255" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M268,236 Q260,230 262,222" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#334155" stroke-width="6" stroke-linecap="round">
      <line x1="300" y1="270" x2="300" y2="286"/>
      <line x1="340" y1="270" x2="340" y2="286"/>
    </g>
  </g>
  <!-- glass of milk top-left -->
  <g filter="url(#soft-shadow)">
    <path d="M48,60 L92,60 L86,132 L54,132 Z" fill="#e0f2fe" stroke="#475569" stroke-width="3.5" opacity="0.95"/>
    <path d="M52,78 L88,78 L84,128 L56,128 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="70" cy="78" rx="18" ry="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <!-- cloud top-right -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="330" cy="52" rx="40" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="312" cy="42" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="340" cy="38" r="17" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <path d="M296,52 Q312,32 340,34 Q362,36 368,52" fill="#ffffff"/>
  </g>
  <!-- snowflakes decorating -->
  <g stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round">
    <g transform="translate(140,60)">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <g transform="translate(370,150)">
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="-5" y1="5" x2="5" y2="-5"/>
    </g>
    <g transform="translate(30,150)">
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
    </g>
  </g>
</svg>
