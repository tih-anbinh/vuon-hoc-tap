<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-insect desc-insect">
  <title id="title-insect">Insect</title>
  <desc id="desc-insect">A friendly red ladybug insect with black spots, six legs, and two antennae on a green leaf.</desc>
  <defs>
    <linearGradient id="insect-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <radialGradient id="insect-body" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#insect-bg)"/>

  <!-- Leaf under -->
  <path d="M60 250 Q200 200 340 250 Q200 285 60 250 Z" fill="#4ade80" stroke="#166534" stroke-width="3"/>
  <path d="M60 250 Q200 245 340 250" fill="none" stroke="#166534" stroke-width="2.5"/>

  <g filter="url(#soft-shadow)">
    <!-- Legs -->
    <g stroke="#1e293b" stroke-width="5" stroke-linecap="round">
      <line x1="150" y1="185" x2="120" y2="220"/>
      <line x1="145" y1="160" x2="108" y2="165"/>
      <line x1="152" y1="135" x2="122" y2="110"/>
      <line x1="250" y1="185" x2="280" y2="220"/>
      <line x1="255" y1="160" x2="292" y2="165"/>
      <line x1="248" y1="135" x2="278" y2="110"/>
    </g>
    <!-- Body -->
    <ellipse cx="200" cy="160" rx="70" ry="62" fill="url(#insect-body)" stroke="#991b1b" stroke-width="4"/>
    <!-- Split line -->
    <line x1="200" y1="98" x2="200" y2="222" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Spots -->
    <g fill="#1e293b">
      <circle cx="168" cy="135" r="12"/>
      <circle cx="232" cy="135" r="12"/>
      <circle cx="160" cy="180" r="11"/>
      <circle cx="240" cy="180" r="11"/>
      <circle cx="185" cy="205" r="9"/>
      <circle cx="215" cy="205" r="9"/>
    </g>
    <!-- Head -->
    <ellipse cx="200" cy="100" rx="30" ry="24" fill="#1e293b"/>
    <circle cx="188" cy="98" r="6" fill="#f8fafc"/>
    <circle cx="212" cy="98" r="6" fill="#f8fafc"/>
    <circle cx="188" cy="98" r="3" fill="#1e293b"/>
    <circle cx="212" cy="98" r="3" fill="#1e293b"/>
    <!-- Antennae -->
    <path d="M186 82 Q178 62 168 60" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M214 82 Q222 62 232 60" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="167" cy="59" r="4" fill="#1e293b"/>
    <circle cx="233" cy="59" r="4" fill="#1e293b"/>
  </g>
</svg>
