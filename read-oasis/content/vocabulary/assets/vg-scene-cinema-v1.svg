<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-cinema desc-cinema">
  <title id="title-cinema">Cinema - Watching a film on a big screen</title>
  <desc id="desc-cinema">Inside a dark cinema, a big bright screen shows a rocket film while children sit in red seats eating popcorn.</desc>
  <defs>
    <linearGradient id="cn-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cn-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#cn-room)"/>
  <!-- light beam from projector -->
  <path d="M200,8 L60,120 L340,120 Z" fill="#fef9c3" opacity="0.12"/>
  <!-- THE SCREEN (hero element) -->
  <g filter="url(#soft-shadow)">
    <rect x="52" y="36" width="296" height="150" rx="8" fill="url(#cn-screen)" stroke="#f8fafc" stroke-width="6"/>
    <!-- film content: rocket flying to stars -->
    <g>
      <circle cx="310" cy="70" r="18" fill="#fde047" stroke="#a16207" stroke-width="3"/>
      <path d="M96,150 Q120,108 160,96" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7,6"/>
      <!-- rocket -->
      <g>
        <path d="M176,60 Q196,72 200,100 L160,116 Q152,88 164,68 Q170,60 176,60 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
        <circle cx="178" cy="86" r="8" fill="#bae6fd" stroke="#7f1d1d" stroke-width="2.5"/>
        <path d="M162,112 Q148,118 146,132 Q158,128 166,122 Z" fill="#f97316" stroke="#7c2d12" stroke-width="2.5"/>
        <path d="M198,96 Q212,96 220,106 Q208,112 198,110 Z" fill="#f97316" stroke="#7c2d12" stroke-width="2.5"/>
        <path d="M152,124 Q140,136 142,150 Q130,142 134,128 Q142,120 152,124 Z" fill="#fbbf24" stroke="#a16207" stroke-width="2.5"/>
      </g>
      <path d="M250,58 L253,66 L261,66 L255,71 L257,79 L250,74 L243,79 L245,71 L239,66 L247,66 Z" fill="#f59e0b"/>
      <circle cx="92" cy="64" r="4" fill="#f59e0b"/>
      <circle cx="126" cy="52" r="3" fill="#f59e0b"/>
      <circle cx="272" cy="130" r="3.5" fill="#f59e0b"/>
    </g>
  </g>
  <!-- red curtains at sides -->
  <g>
    <path d="M30,20 Q46,100 34,200 L18,200 Q28,100 14,20 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <path d="M370,20 Q354,100 366,200 L382,200 Q372,100 386,20 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
  </g>
  <!-- rows of seats with viewers -->
  <g filter="url(#soft-shadow)">
    <!-- back row seats -->
    <g fill="#b91c1c" stroke="#7f1d1d" stroke-width="3.5">
      <path d="M52,236 Q52,214 74,214 Q96,214 96,236 L96,258 L52,258 Z"/>
      <path d="M118,236 Q118,214 140,214 Q162,214 162,236 L162,258 L118,258 Z"/>
      <path d="M238,236 Q238,214 260,214 Q282,214 282,236 L282,258 L238,258 Z"/>
      <path d="M304,236 Q304,214 326,214 Q348,214 348,236 L348,258 L304,258 Z"/>
    </g>
    <!-- child 1 watching -->
    <g>
      <circle cx="140" cy="206" r="16" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
      <path d="M126,200 Q126,188 140,188 Q154,188 154,200 L150,204 Q140,192 130,204 Z" fill="#451a03" stroke="#1c1917" stroke-width="2.5"/>
      <!-- popcorn box -->
      <path d="M124,232 L148,232 L144,258 L128,258 Z" fill="#fef9c3" stroke="#b91c1c" stroke-width="3"/>
      <line x1="130" y1="233" x2="131" y2="257" stroke="#b91c1c" stroke-width="2.5"/>
      <line x1="141" y1="233" x2="140" y2="257" stroke="#b91c1c" stroke-width="2.5"/>
      <g fill="#fde047" stroke="#a16207" stroke-width="1.8">
        <circle cx="129" cy="228" r="4.5"/>
        <circle cx="138" cy="225" r="4.5"/>
        <circle cx="146" cy="229" r="4.5"/>
      </g>
    </g>
    <!-- child 2 watching -->
    <g>
      <circle cx="260" cy="206" r="16" fill="#f5c19b" stroke="#78350f" stroke-width="3"/>
      <circle cx="248" cy="196" r="8" fill="#1c1917"/>
      <circle cx="272" cy="196" r="8" fill="#1c1917"/>
      <path d="M246,192 Q246,184 260,184 Q274,184 274,192 L270,196 Q260,188 250,196 Z" fill="#1c1917"/>
      <!-- drink cup -->
      <path d="M290,232 L308,232 L305,258 L293,258 Z" fill="#f97316" stroke="#7c2d12" stroke-width="3"/>
      <line x1="299" y1="232" x2="304" y2="214" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- floor -->
  <rect x="0" y="258" width="400" height="42" fill="#1e1b4b"/>
  <line x1="0" y1="258" x2="400" y2="258" stroke="#0f172a" stroke-width="3"/>
</svg>
