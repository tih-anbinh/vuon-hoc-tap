<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-circle desc-circle">
  <title id="title-circle">Circle</title>
  <desc id="desc-circle">A large bright blue circle shape centred on a plain light background.</desc>
  <defs>
    <linearGradient id="circle-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="circle-fill" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#circle-bg)"/>
  <ellipse cx="200" cy="255" rx="110" ry="18" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <circle cx="200" cy="145" r="105" fill="url(#circle-fill)" stroke="#1e3a8a" stroke-width="5"/>
    <ellipse cx="168" cy="110" rx="30" ry="20" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
