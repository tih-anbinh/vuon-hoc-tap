<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-clown desc-clown">
  <title id="title-clown">Clown - Funny clown with red nose juggling balls</title>
  <desc id="desc-clown">A happy circus clown with a red nose, colourful curly hair, a pointed hat and big shoes, juggling three colourful balls.</desc>
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#cw-bg)"/>
  <!-- bunting -->
  <g stroke="#881337" stroke-width="2.5">
    <path d="M0,20 Q200,44 400,20" fill="none"/>
    <path d="M40,25 L52,44 L64,27 Z" fill="#fde047"/>
    <path d="M110,31 L122,50 L134,33 Z" fill="#38bdf8"/>
    <path d="M190,34 L202,53 L214,34 Z" fill="#4ade80"/>
    <path d="M266,31 L278,50 L290,33 Z" fill="#a78bfa"/>
    <path d="M336,25 L348,44 L360,27 Z" fill="#fb923c"/>
  </g>
  <!-- circus floor -->
  <rect x="0" y="252" width="400" height="48" fill="#fbbf24"/>
  <line x1="0" y1="252" x2="400" y2="252" stroke="#b45309" stroke-width="4"/>
  <ellipse cx="200" cy="268" rx="130" ry="12" fill="#0f172a" opacity="0.18"/>
  <!-- juggling balls -->
  <g filter="url(#soft-shadow)">
    <circle cx="132" cy="72" r="15" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <circle cx="200" cy="50" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3.5"/>
    <circle cx="268" cy="72" r="15" fill="#22c55e" stroke="#14532d" stroke-width="3.5"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5,5" fill="none" opacity="0.8">
    <path d="M140,86 Q166,60 192,54"/>
    <path d="M208,54 Q234,60 260,86"/>
  </g>
  <!-- THE CLOWN (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- pointed hat -->
    <path d="M172,96 L200,40 L228,96 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="4"/>
    <circle cx="200" cy="40" r="8" fill="#fde047" stroke="#a16207" stroke-width="3"/>
    <!-- curly hair both sides -->
    <g fill="#f97316" stroke="#7c2d12" stroke-width="3">
      <circle cx="158" cy="108" r="14"/>
      <circle cx="150" cy="126" r="12"/>
      <circle cx="242" cy="108" r="14"/>
      <circle cx="250" cy="126" r="12"/>
    </g>
    <!-- face -->
    <circle cx="200" cy="124" r="42" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
    <!-- eyes with painted diamonds -->
    <circle cx="184" cy="114" r="5.5" fill="#0f172a"/>
    <circle cx="216" cy="114" r="5.5" fill="#0f172a"/>
    <path d="M184,98 L189,106 L184,110 L179,106 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2"/>
    <path d="M216,98 L221,106 L216,110 L211,106 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2"/>
    <!-- big red nose -->
    <circle cx="200" cy="130" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <circle cx="196" cy="126" r="3.5" fill="#fca5a5"/>
    <!-- big painted smile -->
    <path d="M172,140 Q200,166 228,140" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M176,142 Q200,160 224,142" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- ruffle collar -->
    <g fill="#fde047" stroke="#a16207" stroke-width="3">
      <circle cx="172" cy="170" r="11"/>
      <circle cx="192" cy="176" r="11"/>
      <circle cx="212" cy="176" r="11"/>
      <circle cx="230" cy="170" r="11"/>
    </g>
    <!-- polka-dot suit -->
    <path d="M166,180 L234,180 L246,244 L154,244 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="4"/>
    <g fill="#fde047">
      <circle cx="184" cy="200" r="6"/>
      <circle cx="216" cy="200" r="6"/>
      <circle cx="200" cy="222" r="6"/>
      <circle cx="172" cy="228" r="6"/>
      <circle cx="228" cy="228" r="6"/>
    </g>
    <!-- big buttons -->
    <circle cx="200" cy="192" r="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <circle cx="200" cy="208" r="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <!-- arms up juggling -->
    <path d="M168,186 Q144,150 138,96" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M232,186 Q256,150 262,96" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="138" cy="92" r="9" fill="#ffffff" stroke="#0c4a6e" stroke-width="3"/>
    <circle cx="262" cy="92" r="9" fill="#ffffff" stroke="#0c4a6e" stroke-width="3"/>
    <!-- legs -->
    <line x1="182" y1="244" x2="178" y2="262" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
    <line x1="218" y1="244" x2="222" y2="262" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
    <!-- big shoes -->
    <ellipse cx="162" cy="266" rx="24" ry="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <ellipse cx="238" cy="266" rx="24" ry="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
  </g>
</svg>
