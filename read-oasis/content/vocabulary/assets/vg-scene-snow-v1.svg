<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-snow desc-snow">
  <title id="title-snow">Snow</title>
  <desc id="desc-snow">White snowflakes falling from a grey sky onto snow-covered ground and a little pine tree.</desc>
  <defs>
    <linearGradient id="snow-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#snow-bg)"/>
  <!-- snow ground -->
  <path d="M0 220 Q120 195 220 215 Q320 230 400 210 L400 300 L0 300 Z" fill="#ffffff"/>

  <g filter="url(#soft-shadow)">
    <!-- Pine tree -->
    <rect x="192" y="215" width="16" height="30" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <path d="M200 100 L155 170 L245 170 Z" fill="#166534" stroke="#052e16" stroke-width="3.5"/>
    <path d="M200 130 L150 200 L250 200 Z" fill="#15803d" stroke="#052e16" stroke-width="3.5"/>
    <path d="M200 160 L145 225 L255 225 Z" fill="#16a34a" stroke="#052e16" stroke-width="3.5"/>
    <!-- snow caps on tree -->
    <path d="M175 165 Q200 155 225 165" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M168 195 Q200 185 232 195" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Snowflakes -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <g transform="translate(70 70)"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/><line x1="-7" y1="-7" x2="7" y2="7"/><line x1="-7" y1="7" x2="7" y2="-7"/></g>
    <g transform="translate(320 90)"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/><line x1="-7" y1="-7" x2="7" y2="7"/><line x1="-7" y1="7" x2="7" y2="-7"/></g>
    <g transform="translate(110 150)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(300 170)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
  </g>
  <g fill="#ffffff"><circle cx="50" cy="130" r="5"/><circle cx="350" cy="140" r="5"/><circle cx="150" cy="90" r="4"/><circle cx="260" cy="60" r="4"/></g>
</svg>
