<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-cross desc-cross">
  <title id="title-cross">Cross - Walking across a zebra crossing</title>
  <desc id="desc-cross">A child striding carefully across bold white pedestrian zebra stripes on a road, demonstrating the action of crossing.</desc>
  <defs>
    <linearGradient id="road-asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cross-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ASPHALT ROAD SURFACE -->
  <rect x="20" y="160" width="360" height="115" rx="12" fill="url(#road-asphalt)" stroke="#1e293b" stroke-width="3.5"/>

  <!-- PEDESTRIAN ZEBRA CROSSING STRIPES (Bold, unmistakable crossing cue) -->
  <g id="zebra-stripes">
    <!-- Stripe 1 -->
    <rect x="45" y="172" width="45" height="92" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Stripe 2 -->
    <rect x="110" y="172" width="45" height="92" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Stripe 3 -->
    <rect x="175" y="172" width="45" height="92" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Stripe 4 -->
    <rect x="240" y="172" width="45" height="92" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Stripe 5 -->
    <rect x="305" y="172" width="45" height="92" rx="4" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Green Walk Signal Badge (top right visual affirmation) -->
  <g id="pedestrian-signal" filter="url(#soft-shadow)">
    <circle cx="340" cy="55" r="24" fill="#16a34a" stroke="#15803d" stroke-width="3"/>
    <!-- White walking person silhouette icon inside badge -->
    <circle cx="340" cy="42" r="4.5" fill="#ffffff"/>
    <path d="M340 48 L340 58 M340 58 L334 68 M340 58 L346 68 M340 52 L332 56 M340 52 L348 54" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Walking Direction Arrow across the road -->
  <g id="cross-arrow">
    <line x1="60" y1="135" x2="260" y2="135" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6"/>
    <polygon points="260,127 274,135 260,143" fill="#f59e0b"/>
  </g>

  <!-- Ground Shadows of pedestrian feet on the zebra stripe -->
  <ellipse cx="170" cy="246" rx="20" ry="6" fill="#0f172a" opacity="0.25"/>
  <ellipse cx="230" cy="242" rx="20" ry="6" fill="#0f172a" opacity="0.25"/>

  <!-- TARGET CHARACTER: Child crossing road with safe walking stride -->
  <g id="crossing-child" filter="url(#soft-shadow)">
    <!-- Back Leg (stepping forward onto white stripe) -->
    <path d="M190 150 L170 190 L165 240" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="165" cy="244" rx="16" ry="9" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>

    <!-- Front Leg (stepping forward in stride) -->
    <path d="M210 150 L225 190 L235 238" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="238" cy="240" rx="16" ry="9" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>

    <!-- Navy shorts -->
    <path d="M180 135 L220 135 L230 160 L170 160 Z" fill="#1e3a8a" stroke="#172554" stroke-width="3" stroke-linejoin="round"/>

    <!-- Green backpack on back -->
    <rect x="165" y="80" width="18" height="45" rx="6" fill="#eab308" stroke="#ca8a04" stroke-width="3"/>

    <!-- Torso / Green Shirt -->
    <rect x="180" y="75" width="42" height="65" rx="10" fill="url(#cross-shirt)" stroke="#047857" stroke-width="3.5"/>

    <!-- Left Arm swinging with stride -->
    <path d="M185 85 L165 115 L155 125" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="152" cy="125" r="7" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="210" cy="48" r="26" fill="#fed7aa" stroke="#c2410c" stroke-width="3.5"/>

    <!-- Hair -->
    <path d="M188 44 C188 24 230 24 232 44 C220 38 200 38 188 44 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <circle cx="198" cy="28" r="12" fill="#78350f"/>
    <circle cx="216" cy="28" r="12" fill="#78350f"/>

    <!-- Attentive Face looking right/forward across the street -->
    <circle cx="222" cy="46" r="4.5" fill="#1e293b"/>
    <circle cx="220" cy="44" r="1.5" fill="#ffffff"/>
    <path d="M218 39 Q224 37 228 40" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="214" cy="54" r="5" fill="#fca5a5" opacity="0.6"/>
    <!-- Confident smile -->
    <path d="M222 54 Q228 58 224 62" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Arm swinging forward -->
    <path d="M215 85 L235 110 L248 105" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="105" r="7" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
  </g>
</svg>