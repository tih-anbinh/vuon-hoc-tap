<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bread desc-bread">
  <title id="title-bread">bread</title>
  <desc id="desc-bread">A loaf of golden brown bread on a cutting board.</desc>
  <rect width="400" height="300" rx="20" fill="#EFEBE9"/>
  <!-- Cutting board -->
  <rect x="80" y="180" width="240" height="20" rx="6" fill="#A1887F" stroke="#8D6E63" stroke-width="2"/>
  <rect x="85" y="195" width="230" height="4" rx="2" fill="#8D6E63" opacity="0.3"/>
  <g transform="translate(200, 130)">
    <!-- Bread loaf -->
    <path d="M-70,40 Q-75,10 -60,-15 Q-40,-35 0,-38 Q40,-35 60,-15 Q75,10 70,40 Z" fill="#FFB74D" stroke="#F57C00" stroke-width="2.5"/>
    <!-- Top crust (darker) -->
    <path d="M-60,-15 Q-40,-35 0,-38 Q40,-35 60,-15 Q40,-20 0,-22 Q-40,-20 -60,-15" fill="#EF6C00" opacity="0.3"/>
    <!-- Score marks -->
    <path d="M-30,-20 Q-25,-28 -15,-22" fill="none" stroke="#EF6C00" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M0,-25 Q5,-32 15,-25" fill="none" stroke="#EF6C00" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M25,-18 Q30,-26 40,-18" fill="none" stroke="#EF6C00" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <!-- Highlight -->
    <ellipse cx="-15" cy="-5" rx="20" ry="12" fill="white" opacity="0.1"/>
    <!-- Steam -->
    <path d="M-10,-45 Q-15,-55 -8,-60" fill="none" stroke="#BDBDBD" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M10,-48 Q5,-58 12,-65" fill="none" stroke="#BDBDBD" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  </g>
</svg>
