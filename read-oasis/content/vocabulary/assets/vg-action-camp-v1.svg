<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-camp desc-camp">
  <title id="title-camp">Camp</title>
  <desc id="desc-camp">A camping tent beside a campfire and pine trees at night with stars.</desc>
  <defs>
    <linearGradient id="camp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#camp-bg)"/>
  <g fill="#fde047">
    <circle cx="60" cy="50" r="3"/>
    <circle cx="120" cy="80" r="2.5"/>
    <circle cx="340" cy="60" r="3"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="200" cy="40" r="2.5"/>
  </g>
  <rect x="0" y="245" width="400" height="55" fill="#15803d"/>
  <ellipse cx="200" cy="252" rx="170" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- Pine trees -->
  <g fill="#166534" stroke="#14532d" stroke-width="2">
    <path d="M60 245 L80 200 L100 245 Z"/>
    <path d="M65 225 L80 190 L95 225 Z"/>
    <path d="M320 245 L340 195 L360 245 Z"/>
    <path d="M325 222 L340 185 L355 222 Z"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- Tent -->
    <path d="M120 245 L200 120 L280 245 Z" fill="#f97316" stroke="#1e293b" stroke-width="4"/>
    <path d="M200 120 L200 245" stroke="#c2410c" stroke-width="3"/>
    <!-- Tent door -->
    <path d="M200 245 L175 180 L200 155 L225 180 Z" fill="#7c2d12" stroke="#1e293b" stroke-width="3"/>
    <!-- Pole tip -->
    <line x1="200" y1="120" x2="200" y2="105" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M200 108 L215 100 L200 96 Z" fill="#ef4444"/>
  </g>

  <!-- Campfire -->
  <g filter="url(#soft-shadow)">
    <path d="M310 240 L340 220 M340 240 L310 220" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M325 235 C315 220 335 210 325 195 C345 205 340 230 325 235 Z" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <path d="M325 232 C320 222 330 216 325 206 C336 214 332 228 325 232 Z" fill="#fde047"/>
  </g>
</svg>
