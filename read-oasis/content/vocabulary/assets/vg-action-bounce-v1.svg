<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bounce desc-bounce">
  <title id="title-bounce">Bounce - A bouncing ball with motion trails</title>
  <desc id="desc-bounce">A colourful ball bouncing up and down showing motion arcs and squish on the ground.</desc>
  <defs>
    <radialGradient id="ball-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Ground -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="245" rx="150" ry="6" fill="#0f172a" opacity="0.1"/>
  <!-- Motion arc trail (dashed arc showing bounce path) -->
  <path d="M60 240 Q130 80 200 240 Q270 80 340 240" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round" opacity="0.55"/>
  <!-- Speed lines behind the ball -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="160" y1="150" x2="140" y2="140"/>
    <line x1="165" y1="165" x2="145" y2="160"/>
    <line x1="170" y1="180" x2="150" y2="180"/>
  </g>
  <g filter="url(#soft-shadow)">
    <!-- Faded ball copy #1 (at start of arc, low) -->
    <circle cx="60" cy="225" r="15" fill="url(#ball-grad)" stroke="#7f1d1d" stroke-width="2" opacity="0.35"/>
    <!-- Faded ball copy #2 (at peak, high) -->
    <circle cx="130" cy="110" r="18" fill="url(#ball-grad)" stroke="#7f1d1d" stroke-width="2" opacity="0.5"/>
    <!-- Main ball (mid-arc, biggest and clearest) -->
    <circle cx="200" cy="150" r="30" fill="url(#ball-grad)" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Ball highlights -->
    <ellipse cx="188" cy="140" rx="9" ry="6" fill="#ffffff" opacity="0.6"/>
    <!-- Ball pattern (curved bands) -->
    <path d="M175 155 Q200 148 225 155" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <path d="M175 165 Q200 175 225 165" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.6"/>
    <!-- Faded ball copy #3 (peak right) -->
    <circle cx="270" cy="110" r="18" fill="url(#ball-grad)" stroke="#7f1d1d" stroke-width="2" opacity="0.5"/>
    <!-- Squished ball (impact on ground) -->
    <ellipse cx="340" cy="235" rx="24" ry="12" fill="url(#ball-grad)" stroke="#7f1d1d" stroke-width="2.5"/>
    <!-- Impact lines around squished ball -->
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
      <line x1="315" y1="222" x2="305" y2="215"/>
      <line x1="365" y1="222" x2="375" y2="215"/>
      <line x1="340" y1="215" x2="340" y2="205"/>
      <line x1="325" y1="218" x2="318" y2="210"/>
      <line x1="355" y1="218" x2="362" y2="210"/>
    </g>
  </g>
  <!-- Small "boing" arrows -->
  <g stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M240 190 Q245 175 258 172"/>
    <path d="M255 175 L258 172 L258 178"/>
  </g>
</svg>