<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-flower desc-flower">
  <title id="title-flower">Flower - Blooming daisy</title>
  <desc id="desc-flower">A cheerful pink daisy flower with a smiling yellow centre, green stem and two leaves on grass.</desc>
  <defs>
    <linearGradient id="petal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Ground / grass -->
  <path d="M0 260 Q100 250 200 260 Q300 250 400 260 L400 300 L0 300 Z" fill="#4ade80" stroke="#166534" stroke-width="2"/>
  <path d="M40 258 L42 245 L44 258 M60 260 L62 248 L64 260 M100 258 L102 244 L104 258 M340 258 L342 244 L344 258 M360 260 L362 248 L364 260" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="100" ry="6" fill="#0f172a" opacity="0.1"/>
  <g id="flower-figure" filter="url(#soft-shadow)">
    <!-- Stem -->
    <path d="M200 260 Q195 200 200 130" fill="none" stroke="url(#stem-grad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M198 200 Q160 180 130 200 Q150 220 198 210 Z" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/>
    <path d="M140 205 Q160 205 190 205" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.6"/>
    <!-- Right leaf -->
    <path d="M202 175 Q240 155 270 175 Q250 195 202 185 Z" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/>
    <path d="M210 180 Q230 180 260 180" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.6"/>
    <!-- Petals (8 petals around center) -->
    <ellipse cx="200" cy="60" rx="18" ry="35" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5"/>
    <ellipse cx="200" cy="130" rx="18" ry="35" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5"/>
    <ellipse cx="165" cy="95" rx="35" ry="18" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5"/>
    <ellipse cx="235" cy="95" rx="35" ry="18" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5"/>
    <ellipse cx="175" cy="70" rx="20" ry="32" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5" transform="rotate(-45 175 70)"/>
    <ellipse cx="225" cy="70" rx="20" ry="32" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5" transform="rotate(45 225 70)"/>
    <ellipse cx="175" cy="120" rx="20" ry="32" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5" transform="rotate(45 175 120)"/>
    <ellipse cx="225" cy="120" rx="20" ry="32" fill="url(#petal-grad)" stroke="#be185d" stroke-width="2.5" transform="rotate(-45 225 120)"/>
    <!-- Center of flower -->
    <circle cx="200" cy="95" r="25" fill="url(#center-grad)" stroke="#a16207" stroke-width="3"/>
    <!-- Center texture (dots) -->
    <circle cx="192" cy="88" r="2" fill="#a16207" opacity="0.5"/>
    <circle cx="208" cy="88" r="2" fill="#a16207" opacity="0.5"/>
    <circle cx="200" cy="100" r="2" fill="#a16207" opacity="0.5"/>
    <circle cx="188" cy="100" r="2" fill="#a16207" opacity="0.5"/>
    <circle cx="212" cy="100" r="2" fill="#a16207" opacity="0.5"/>
    <!-- Cute face on center -->
    <circle cx="193" cy="93" r="2" fill="#0c0a09"/>
    <circle cx="207" cy="93" r="2" fill="#0c0a09"/>
    <path d="M192 102 Q200 108 208 102" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>