<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-wave desc-wave">
  <title id="title-wave">Wave - Child waving hello with raised hand</title>
  <desc id="desc-wave">A cheerful child with arm raised high, waving an open hand to say hello, with motion arcs around the hand, greeting a friend across the street.</desc>
  <defs>
    <linearGradient id="wv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#wv-bg)"/>
  <circle cx="345" cy="45" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="90" cy="45" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- ground -->
  <rect x="0" y="240" width="400" height="60" fill="#4ade80"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#15803d" stroke-width="3.5"/>
  <ellipse cx="170" cy="270" rx="90" ry="10" fill="#0f172a" opacity="0.22"/>
  <!-- waving child (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- raised waving arm -->
    <path d="M204,140 Q234,110 246,80" fill="none" stroke="#fcd9b6" stroke-width="13" stroke-linecap="round"/>
    <!-- open hand with fingers -->
    <g>
      <ellipse cx="252" cy="66" rx="17" ry="20" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
      <g stroke="#fcd9b6" stroke-width="8" stroke-linecap="round">
        <line x1="240" y1="52" x2="235" y2="38"/>
        <line x1="249" y1="48" x2="247" y2="32"/>
        <line x1="258" y1="48" x2="260" y2="32"/>
        <line x1="266" y1="53" x2="272" y2="40"/>
      </g>
      <line x1="238" y1="72" x2="228" y2="66" stroke="#fcd9b6" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- wave motion arcs -->
    <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M282,52 Q292,66 288,84"/>
      <path d="M296,42 Q310,62 304,88"/>
      <path d="M222,34 Q214,24 216,12"/>
    </g>
    <!-- hair -->
    <path d="M148,116 Q146,84 178,82 Q210,84 208,116 L202,124 Q178,102 154,124 Z" fill="#451a03" stroke="#1c1917" stroke-width="3"/>
    <!-- head -->
    <circle cx="178" cy="126" r="30" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="168" cy="122" r="3.8" fill="#0f172a"/>
    <circle cx="188" cy="122" r="3.8" fill="#0f172a"/>
    <path d="M166,138 Q178,148 190,138" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="158" cy="134" rx="6" ry="4" fill="#fb7185" opacity="0.55"/>
    <ellipse cx="198" cy="134" rx="6" ry="4" fill="#fb7185" opacity="0.55"/>
    <!-- body -->
    <path d="M158,154 L198,154 L206,226 L150,226 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <!-- other arm relaxed -->
    <path d="M158,164 Q136,182 138,204" fill="none" stroke="#fcd9b6" stroke-width="11" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="166" y1="226" x2="163" y2="262" stroke="#1e3a8a" stroke-width="13" stroke-linecap="round"/>
    <line x1="190" y1="226" x2="193" y2="262" stroke="#1e3a8a" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="161" cy="268" rx="14" ry="7" fill="#0f172a"/>
    <ellipse cx="195" cy="268" rx="14" ry="7" fill="#0f172a"/>
  </g>
  <!-- friend far away waving back (smaller) -->
  <g filter="url(#soft-shadow)">
    <circle cx="345" cy="188" r="13" fill="#f5c19b" stroke="#78350f" stroke-width="2.5"/>
    <path d="M333,183 Q338,172 352,176 L356,185 Q346,178 335,188 Z" fill="#0f172a"/>
    <circle cx="341" cy="187" r="2" fill="#0f172a"/>
    <circle cx="349" cy="187" r="2" fill="#0f172a"/>
    <path d="M341,194 Q345,197 349,194" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M338,202 L352,202 L356,232 L334,232 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
    <path d="M352,206 Q362,196 364,186" fill="none" stroke="#f5c19b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="366" cy="183" r="5" fill="#f5c19b" stroke="#78350f" stroke-width="2"/>
    <line x1="341" y1="232" x2="339" y2="244" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="349" y1="232" x2="351" y2="244" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
