<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-house desc-house">
  <title id="title-house">House - Blue house with red roof</title>
  <desc id="desc-house">A big blue house with a red triangular roof, a brown door, two square windows, a chimney, a fence and a tree beside it.</desc>
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="hs-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hs-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#hs-bg)"/>
  <circle cx="345" cy="52" r="26" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="80" cy="55" rx="34" ry="13" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="110" cy="46" rx="24" ry="10" fill="#ffffff" opacity="0.95"/>
  <rect x="0" y="240" width="400" height="60" fill="#65a30d"/>
  <ellipse cx="185" cy="244" rx="140" ry="8" fill="#0f172a" opacity="0.2"/>
  <!-- tree -->
  <g filter="url(#soft-shadow)">
    <rect x="332" y="185" width="18" height="58" rx="5" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    <circle cx="341" cy="152" r="38" fill="#22c55e" stroke="#15803d" stroke-width="3.5"/>
    <circle cx="318" cy="170" r="24" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
    <circle cx="364" cy="172" r="22" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
  </g>
  <!-- house -->
  <g filter="url(#soft-shadow)">
    <!-- wall -->
    <rect x="85" y="128" width="200" height="115" rx="4" fill="url(#hs-wall)" stroke="#1e3a8a" stroke-width="4"/>
    <!-- roof -->
    <path d="M70,130 L185,48 L300,130 Z" fill="url(#hs-roof)" stroke="#7f1d1d" stroke-width="4" stroke-linejoin="round"/>
    <!-- chimney -->
    <rect x="240" y="66" width="24" height="44" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    <rect x="235" y="58" width="34" height="12" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <!-- windows -->
    <rect x="102" y="148" width="42" height="40" rx="4" fill="#fef9c3" stroke="#1e3a8a" stroke-width="3.5"/>
    <line x1="123" y1="148" x2="123" y2="188" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="102" y1="168" x2="144" y2="168" stroke="#1e3a8a" stroke-width="2.5"/>
    <rect x="226" y="148" width="42" height="40" rx="4" fill="#fef9c3" stroke="#1e3a8a" stroke-width="3.5"/>
    <line x1="247" y1="148" x2="247" y2="188" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="226" y1="168" x2="268" y2="168" stroke="#1e3a8a" stroke-width="2.5"/>
    <!-- attic round window -->
    <circle cx="185" cy="100" r="15" fill="#fef9c3" stroke="#7f1d1d" stroke-width="3"/>
    <line x1="170" y1="100" x2="200" y2="100" stroke="#7f1d1d" stroke-width="2"/>
    <line x1="185" y1="85" x2="185" y2="115" stroke="#7f1d1d" stroke-width="2"/>
    <!-- door -->
    <path d="M165,243 L165,180 Q165,166 185,166 Q205,166 205,180 L205,243 Z" fill="#a16207" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="197" cy="210" r="4" fill="#facc15" stroke="#451a03" stroke-width="1.8"/>
    <!-- doorstep -->
    <rect x="158" y="240" width="54" height="9" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  </g>
  <!-- fence -->
  <g fill="#fef3c7" stroke="#a16207" stroke-width="2.5">
    <path d="M20,215 L32,205 L44,215 L44,245 L20,245 Z"/>
    <path d="M52,215 L64,205 L76,215 L76,245 L52,245 Z"/>
    <rect x="14" y="222" width="68" height="7"/>
  </g>
</svg>
