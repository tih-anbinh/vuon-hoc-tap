<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-arm desc-arm">
  <title id="title-arm">Arm</title>
  <desc id="desc-arm">A friendly child raising one arm high, with the whole arm highlighted by a bright ring from shoulder to hand.</desc>
  <defs>
    <radialGradient id="arm-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <linearGradient id="arm-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="arm-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#arm-bg)"/>
  <ellipse cx="200" cy="284" rx="120" ry="14" fill="#0f172a" opacity="0.12"/>

  <g id="child" filter="url(#soft-shadow)">
    <!-- Head -->
    <ellipse cx="180" cy="80" rx="46" ry="50" fill="url(#arm-skin)" stroke="#c2762e" stroke-width="4"/>
    <path d="M138 66 C146 30 214 30 222 66 C208 52 192 58 180 48 C168 58 152 52 138 66 Z" fill="#5b3a1e"/>
    <ellipse cx="166" cy="78" rx="8" ry="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="167" cy="80" r="4" fill="#5b3a1e"/>
    <ellipse cx="196" cy="78" rx="8" ry="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="197" cy="80" r="4" fill="#5b3a1e"/>
    <circle cx="150" cy="96" r="8" fill="#fb7185" opacity="0.35"/>
    <circle cx="210" cy="96" r="8" fill="#fb7185" opacity="0.35"/>
    <path d="M164 100 Q180 112 196 100" fill="none" stroke="#b5651d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Body / shirt -->
    <path d="M138 150 Q180 132 222 150 L232 250 Q180 262 128 250 Z" fill="url(#arm-shirt)" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
    <!-- Legs -->
    <rect x="150" y="248" width="24" height="34" rx="10" fill="#1e40af"/>
    <rect x="186" y="248" width="24" height="34" rx="10" fill="#1e40af"/>

    <!-- Resting arm (down) -->
    <path d="M138 156 C118 190 118 220 128 244" fill="none" stroke="url(#arm-skin)" stroke-width="22" stroke-linecap="round"/>
    <path d="M138 156 C118 190 118 220 128 244" fill="none" stroke="#c2762e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <circle cx="128" cy="248" r="14" fill="url(#arm-skin)" stroke="#c2762e" stroke-width="3.5"/>

    <!-- TARGET: RAISED ARM (up high) -->
    <path d="M222 150 C258 128 288 96 300 62" fill="none" stroke="url(#arm-skin)" stroke-width="24" stroke-linecap="round"/>
    <path d="M222 150 C258 128 288 96 300 62" fill="none" stroke="#c2762e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Shoulder sleeve -->
    <ellipse cx="224" cy="154" rx="20" ry="18" fill="url(#arm-shirt)" stroke="#b45309" stroke-width="3.5"/>
    <!-- Hand at top -->
    <circle cx="304" cy="56" r="18" fill="url(#arm-skin)" stroke="#c2762e" stroke-width="3.5"/>
    <path d="M294 44 L296 30 M302 42 L305 27 M311 44 L316 31 M318 50 L324 40" stroke="#c2762e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Highlight along whole raised arm -->
  <path d="M224 154 C260 130 290 98 304 58" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/>
  <circle cx="304" cy="56" r="30" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 7"/>
</svg>
