<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hall desc-hall">
  <title id="title-hall">Hall - Entrance hallway with coat hooks and doors</title>
  <desc id="desc-hall">A home entrance hall with a coat rack holding a coat and hat, a small mat by the front door, a mirror, and doors leading to other rooms.</desc>
  <defs>
    <linearGradient id="hl-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="hl-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2955a"/>
      <stop offset="100%" stop-color="#8a5a24"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="230" fill="url(#hl-wall)"/>
  <rect x="0" y="225" width="400" height="75" fill="url(#hl-floor)"/>
  <g stroke="#5c3210" stroke-width="1.5" opacity="0.45">
    <line x1="0" y1="248" x2="400" y2="248"/>
    <line x1="0" y1="272" x2="400" y2="272"/>
  </g>
  <!-- front door (center-left) -->
  <g filter="url(#soft-shadow)">
    <rect x="55" y="55" width="105" height="172" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <rect x="68" y="70" width="79" height="65" rx="4" fill="#bae6fd" stroke="#451a03" stroke-width="2.5"/>
    <line x1="107" y1="70" x2="107" y2="135" stroke="#451a03" stroke-width="2"/>
    <rect x="68" y="148" width="79" height="65" rx="4" fill="none" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="148" cy="145" r="5.5" fill="#facc15" stroke="#451a03" stroke-width="2"/>
  </g>
  <!-- door mat -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="235" width="100" height="24" rx="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="68" y="240" width="84" height="14" rx="4" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,4"/>
  </g>
  <!-- coat rack -->
  <g filter="url(#soft-shadow)">
    <rect x="205" y="80" width="9" height="150" rx="3" fill="#57534e" stroke="#1c1917" stroke-width="2.5"/>
    <path d="M209,80 L185,95 M209,80 L233,95 M209,92 L190,108 M209,92 L228,108" fill="none" stroke="#57534e" stroke-width="5" stroke-linecap="round"/>
    <!-- hat on rack -->
    <ellipse cx="185" cy="92" rx="16" ry="5" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
    <path d="M175,90 Q175,76 185,76 Q195,76 195,90 Z" fill="#d97706" stroke="#78350f" stroke-width="2.5"/>
    <!-- coat hanging -->
    <path d="M228,108 L218,125 L216,190 Q228,196 240,190 L238,125 Z" fill="#0e7490" stroke="#164e63" stroke-width="3"/>
    <path d="M222,125 L212,155 M234,125 L244,155" fill="none" stroke="#164e63" stroke-width="4" stroke-linecap="round"/>
    <!-- rack base -->
    <path d="M192,230 L226,230 L209,215 Z" fill="#57534e" stroke="#1c1917" stroke-width="2.5"/>
  </g>
  <!-- mirror -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="310" cy="110" rx="34" ry="46" fill="#bae6fd" stroke="#78350f" stroke-width="5"/>
    <path d="M295,85 Q305,75 318,80" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- inner room door (right) -->
  <g filter="url(#soft-shadow)">
    <rect x="340" y="150" width="52" height="78" rx="4" fill="#a16207" stroke="#451a03" stroke-width="3.5"/>
    <circle cx="348" cy="192" r="4" fill="#facc15" stroke="#451a03" stroke-width="1.8"/>
  </g>
  <!-- small table with plant -->
  <g filter="url(#soft-shadow)">
    <rect x="255" y="195" width="60" height="8" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <rect x="262" y="203" width="8" height="30" fill="#78350f"/>
    <rect x="300" y="203" width="8" height="30" fill="#78350f"/>
    <path d="M280,195 Q278,180 270,173 M282,195 Q284,178 292,172 M281,195 Q281,182 281,175" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="269" cy="171" rx="5" ry="8" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(-30 269 171)"/>
    <ellipse cx="293" cy="170" rx="5" ry="8" fill="#22c55e" stroke="#15803d" stroke-width="2" transform="rotate(30 293 170)"/>
  </g>
</svg>
