<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-dentist desc-dentist">
  <title id="title-dentist">Dentist - Dentist checking a child's teeth</title>
  <desc id="desc-dentist">A friendly dentist in a white coat and mask holding a small mirror tool, checking the teeth of a child sitting in a dental chair, with a big tooth poster on the wall.</desc>
  <defs>
    <linearGradient id="dt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#dt-bg)"/>
  <rect x="0" y="252" width="400" height="48" fill="#67e8f9"/>
  <line x1="0" y1="252" x2="400" y2="252" stroke="#0e7490" stroke-width="3.5"/>
  <!-- tooth poster on wall -->
  <g filter="url(#soft-shadow)">
    <rect x="30" y="30" width="80" height="96" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="4"/>
    <path d="M52,56 Q52,42 70,42 Q88,42 88,56 Q88,70 82,78 Q80,96 74,96 Q70,96 70,84 Q70,96 66,96 Q60,96 58,78 Q52,70 52,56 Z"
          fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M58,52 Q62,48 66,52" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- sparkle on tooth -->
    <path d="M84,48 L86,54 L92,56 L86,58 L84,64 L82,58 L76,56 L82,54 Z" fill="#38bdf8"/>
    <!-- checkmark under tooth -->
    <path d="M56,108 L64,116 L84,100" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- overhead lamp -->
  <g filter="url(#soft-shadow)">
    <line x1="330" y1="0" x2="330" y2="42" stroke="#64748b" stroke-width="6"/>
    <path d="M300,42 L360,42 L350,66 L310,66 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3.5"/>
    <ellipse cx="330" cy="66" rx="20" ry="6" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <g stroke="#fde047" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="318" y1="76" x2="312" y2="88"/>
      <line x1="330" y1="78" x2="330" y2="90"/>
      <line x1="342" y1="76" x2="348" y2="88"/>
    </g>
  </g>
  <!-- dental chair with child -->
  <g filter="url(#soft-shadow)">
    <!-- chair -->
    <path d="M226,150 Q226,128 250,128 L330,128 Q350,128 350,150 L350,196 L226,196 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="4"/>
    <rect x="216" y="196" width="150" height="22" rx="8" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="4"/>
    <rect x="278" y="218" width="16" height="34" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <rect x="252" y="248" width="70" height="10" rx="4" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <!-- child reclining -->
    <circle cx="256" cy="112" r="22" fill="#f5c19b" stroke="#78350f" stroke-width="3.5"/>
    <path d="M236,104 Q236,86 256,84 Q276,86 276,104 L270,108 Q256,94 242,108 Z" fill="#1c1917" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="249" cy="110" r="2.8" fill="#0f172a"/>
    <circle cx="263" cy="110" r="2.8" fill="#0f172a"/>
    <!-- open mouth showing teeth -->
    <ellipse cx="256" cy="124" rx="9" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="250" y="118" width="12" height="4" rx="1.5" fill="#ffffff"/>
    <!-- body on chair -->
    <path d="M276,128 L320,136 L330,160 L276,152 Z" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
    <path d="M320,150 L344,158 L344,176 L320,170 Z" fill="#1d4ed8" stroke="#172554" stroke-width="3"/>
  </g>
  <!-- DENTIST (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- head with cap -->
    <circle cx="150" cy="96" r="28" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M124,88 Q124,64 150,62 Q176,64 176,88 L170,92 Q150,74 130,92 Z" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="3"/>
    <circle cx="141" cy="92" r="3.2" fill="#0f172a"/>
    <circle cx="159" cy="92" r="3.2" fill="#0f172a"/>
    <!-- face mask -->
    <path d="M132,100 Q150,116 168,100 L168,112 Q150,124 132,112 Z" fill="#bae6fd" stroke="#0c4a6e" stroke-width="3"/>
    <line x1="132" y1="102" x2="122" y2="96" stroke="#0c4a6e" stroke-width="2.5"/>
    <line x1="168" y1="102" x2="178" y2="96" stroke="#0c4a6e" stroke-width="2.5"/>
    <!-- white coat -->
    <path d="M126,124 L174,124 L186,226 L114,226 Z" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
    <line x1="150" y1="126" x2="150" y2="224" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="158" cy="150" r="3" fill="#475569"/>
    <circle cx="158" cy="172" r="3" fill="#475569"/>
    <!-- pocket with pen -->
    <rect x="124" y="180" width="18" height="20" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <line x1="132" y1="174" x2="132" y2="184" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- arm holding mirror tool toward child -->
    <path d="M174,136 Q204,128 226,120" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="230" cy="119" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <!-- mirror tool -->
    <line x1="236" y1="118" x2="250" y2="115" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="254" cy="114" r="5.5" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <!-- other arm -->
    <path d="M126,136 Q108,152 106,170" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="106" cy="174" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <!-- legs -->
    <line x1="134" y1="226" x2="134" y2="250" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round"/>
    <line x1="166" y1="226" x2="166" y2="250" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="132" cy="256" rx="13" ry="6" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <ellipse cx="168" cy="256" rx="13" ry="6" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  </g>
</svg>
