<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-motorbike desc-motorbike">
  <title id="title-motorbike">Motorbike - Red motorbike on the road</title>
  <desc id="desc-motorbike">A shiny red motorbike with two black wheels, handlebars, a headlight and exhaust pipe, parked on a road with motion lines.</desc>
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="mb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#mb-bg)"/>
  <circle cx="60" cy="52" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="320" cy="55" rx="34" ry="13" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="350" cy="46" rx="22" ry="10" fill="#ffffff" opacity="0.95"/>
  <!-- road -->
  <rect x="0" y="230" width="400" height="70" fill="#475569"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#1e293b" stroke-width="3"/>
  <g stroke="#facc15" stroke-width="5" stroke-dasharray="26,20">
    <line x1="0" y1="268" x2="400" y2="268"/>
  </g>
  <ellipse cx="200" cy="242" rx="150" ry="9" fill="#0f172a" opacity="0.3"/>
  <!-- motorbike -->
  <g filter="url(#soft-shadow)">
    <!-- rear wheel -->
    <circle cx="110" cy="205" r="46" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <circle cx="110" cy="205" r="26" fill="#94a3b8" stroke="#334155" stroke-width="3.5"/>
    <g stroke="#334155" stroke-width="3">
      <line x1="110" y1="181" x2="110" y2="229"/>
      <line x1="86" y1="205" x2="134" y2="205"/>
      <line x1="93" y1="188" x2="127" y2="222"/>
      <line x1="93" y1="222" x2="127" y2="188"/>
    </g>
    <circle cx="110" cy="205" r="7" fill="#334155"/>
    <!-- front wheel -->
    <circle cx="300" cy="205" r="46" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <circle cx="300" cy="205" r="26" fill="#94a3b8" stroke="#334155" stroke-width="3.5"/>
    <g stroke="#334155" stroke-width="3">
      <line x1="300" y1="181" x2="300" y2="229"/>
      <line x1="276" y1="205" x2="324" y2="205"/>
      <line x1="283" y1="188" x2="317" y2="222"/>
      <line x1="283" y1="222" x2="317" y2="188"/>
    </g>
    <circle cx="300" cy="205" r="7" fill="#334155"/>
    <!-- exhaust pipe -->
    <path d="M60,215 L118,208 L118,222 L62,226 Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <ellipse cx="58" cy="220" rx="6" ry="8" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <!-- main frame / engine block -->
    <path d="M135,195 L200,195 L215,160 L160,155 Z" fill="#64748b" stroke="#334155" stroke-width="3.5"/>
    <!-- fuel tank -->
    <path d="M150,138 Q195,118 245,138 Q248,155 235,160 L165,158 Q148,152 150,138 Z" fill="url(#mb-body)" stroke="#7f1d1d" stroke-width="4"/>
    <ellipse cx="185" cy="138" rx="16" ry="7" fill="#fca5a5" opacity="0.75"/>
    <!-- seat -->
    <path d="M92,142 Q125,128 152,140 L150,158 Q118,164 96,158 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3.5"/>
    <!-- rear fender -->
    <path d="M70,175 Q80,148 108,148 L100,165 Q86,168 82,182 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <!-- front fork -->
    <line x1="262" y1="120" x2="300" y2="200" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <!-- front fender -->
    <path d="M262,168 Q296,148 330,172 L320,184 Q298,166 274,180 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <!-- handlebars -->
    <path d="M262,122 Q250,102 232,98" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M262,122 Q276,106 292,104" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <circle cx="229" cy="97" r="7" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="295" cy="103" r="7" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- headlight -->
    <circle cx="278" cy="132" r="13" fill="#fef08a" stroke="#d97706" stroke-width="3.5"/>
    <!-- connecting body -->
    <path d="M235,160 L262,150 L268,165 L240,172 Z" fill="url(#mb-body)" stroke="#7f1d1d" stroke-width="3"/>
  </g>
  <!-- motion lines -->
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="18" y1="160" x2="52" y2="160"/>
    <line x1="10" y1="185" x2="44" y2="185"/>
  </g>
  <!-- headlight beam -->
  <path d="M291,126 L345,112 L345,146 L291,140 Z" fill="#fef9c3" opacity="0.6"/>
</svg>
