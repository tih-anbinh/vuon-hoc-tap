<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-green desc-green">
  <title id="title-green">green</title>
  <desc id="desc-green">A collection of green things: grass, a green leaf, and a green frog.</desc>
  <rect width="400" height="300" rx="20" fill="#E8F5E9"/>
  <!-- Grass field -->
  <rect y="200" width="400" height="100" rx="0" fill="#66BB6A"/>
  <!-- Grass blades -->
  <g stroke="#43A047" stroke-width="2" fill="none" opacity="0.5">
    <path d="M30,200 Q28,185 35,180"/>
    <path d="M60,200 Q62,182 55,178"/>
    <path d="M100,200 Q98,188 105,182"/>
    <path d="M300,200 Q302,185 295,180"/>
    <path d="M340,200 Q338,188 345,182"/>
    <path d="M370,200 Q372,185 365,178"/>
  </g>
  <!-- Green leaf -->
  <g transform="translate(120, 120)">
    <path d="M0,0 Q-30,-20 -20,-40 Q-10,-55 10,-40 Q30,-20 0,0" fill="#66BB6A" stroke="#43A047" stroke-width="2"/>
    <line x1="0" y1="0" x2="-5" y2="-30" stroke="#43A047" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Green frog (small) -->
  <g transform="translate(280, 160)">
    <ellipse cx="0" cy="10" rx="18" ry="14" fill="#81C784" stroke="#66BB6A" stroke-width="2"/>
    <circle cx="-8" cy="-2" r="6" fill="white" stroke="#66BB6A" stroke-width="1.5"/>
    <circle cx="8" cy="-2" r="6" fill="white" stroke="#66BB6A" stroke-width="1.5"/>
    <circle cx="-8" cy="-1" r="3" fill="#37474F"/>
    <circle cx="8" cy="-1" r="3" fill="#37474F"/>
    <path d="M-6,14 Q0,18 6,14" fill="none" stroke="#43A047" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Label -->
  <text x="200" y="260" font-family="sans-serif" font-size="32" font-weight="bold" fill="#2E7D32" text-anchor="middle">green</text>
</svg>
