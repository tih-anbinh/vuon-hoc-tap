<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-scarf desc-scarf">
  <title id="title-scarf">Scarf</title>
  <desc id="desc-scarf">A long striped woolly winter scarf wrapped in a loop with fringed tasseled ends.</desc>
  <defs>
    <linearGradient id="scarf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#scarf-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Loop knot -->
    <ellipse cx="200" cy="120" rx="60" ry="45" fill="none" stroke="#dc2626" stroke-width="30"/>
    <ellipse cx="200" cy="120" rx="60" ry="45" fill="none" stroke="#991b1b" stroke-width="2"/>
    <!-- Stripes on loop -->
    <g stroke="#f8fafc" stroke-width="6" opacity="0.8" fill="none">
      <path d="M148 105 A60 45 0 0 1 165 82"/>
      <path d="M245 130 A60 45 0 0 1 232 156"/>
    </g>

    <!-- Hanging ends -->
    <rect x="165" y="150" width="34" height="110" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
    <rect x="205" y="150" width="34" height="120" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
    <!-- Horizontal stripes -->
    <g fill="#f8fafc">
      <rect x="165" y="175" width="34" height="12"/>
      <rect x="165" y="210" width="34" height="12"/>
      <rect x="205" y="180" width="34" height="12"/>
      <rect x="205" y="218" width="34" height="12"/>
    </g>
    <g fill="#1e3a8a">
      <rect x="165" y="192" width="34" height="8"/>
      <rect x="205" y="197" width="34" height="8"/>
    </g>

    <!-- Fringe tassels -->
    <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <line x1="170" y1="260" x2="170" y2="278"/>
      <line x1="180" y1="260" x2="180" y2="280"/>
      <line x1="190" y1="260" x2="190" y2="278"/>
      <line x1="210" y1="270" x2="210" y2="288"/>
      <line x1="222" y1="270" x2="222" y2="290"/>
      <line x1="234" y1="270" x2="234" y2="288"/>
    </g>
  </g>
</svg>
