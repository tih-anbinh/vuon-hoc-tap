<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-balloon desc-balloon">
  <title id="title-balloon">Balloon - Bright red balloon on a string</title>
  <desc id="desc-balloon">A shiny round red balloon floating with a small knot at the bottom and a long curly string trailing below.</desc>
  <defs>
    <radialGradient id="bal-body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="bal-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bal-bg)"/>
  <!-- tiny cloud -->
  <ellipse cx="70" cy="60" rx="30" ry="10" fill="#fff" opacity="0.7"/>
  <ellipse cx="90" cy="56" rx="20" ry="8" fill="#fff" opacity="0.7"/>
  <ellipse cx="340" cy="90" rx="25" ry="9" fill="#fff" opacity="0.6"/>
  <!-- balloon -->
  <g filter="url(#soft-shadow)">
    <!-- body -->
    <ellipse cx="200" cy="120" rx="75" ry="90" fill="url(#bal-body)" stroke="#7f1d1d" stroke-width="4"/>
    <!-- knot -->
    <path d="M190,208 L200,225 L210,208 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2.5"/>
    <!-- highlight -->
    <ellipse cx="175" cy="90" rx="18" ry="26" fill="#fff" opacity="0.4"/>
    <ellipse cx="168" cy="80" rx="6" ry="10" fill="#fff" opacity="0.7"/>
  </g>
  <!-- curly string -->
  <path d="M200,225 Q220,245 195,260 Q170,275 200,285" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
