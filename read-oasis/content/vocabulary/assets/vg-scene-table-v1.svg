<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-table desc-table">
  <title id="title-table">Table - Wooden table with vase and fruit</title>
  <desc id="desc-table">A big brown wooden table with four sturdy legs, holding a vase of flowers and a bowl of fruit, in a warm room.</desc>
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="tb-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6a05c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#tb-bg)"/>
  <!-- window -->
  <rect x="40" y="30" width="76" height="66" rx="5" fill="#bae6fd" stroke="#78350f" stroke-width="4"/>
  <line x1="78" y1="30" x2="78" y2="96" stroke="#78350f" stroke-width="3"/>
  <line x1="40" y1="63" x2="116" y2="63" stroke="#78350f" stroke-width="3"/>
  <!-- picture frame -->
  <rect x="300" y="38" width="58" height="46" rx="4" fill="#ffffff" stroke="#92400e" stroke-width="4"/>
  <path d="M304,78 L322,60 L338,78 Z" fill="#22c55e"/>
  <circle cx="340" cy="52" r="8" fill="#fbbf24"/>
  <!-- floor -->
  <rect x="0" y="250" width="400" height="50" fill="#e8b478"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#a16207" stroke-width="3.5"/>
  <ellipse cx="200" cy="272" rx="160" ry="13" fill="#0f172a" opacity="0.2"/>
  <!-- table (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- tabletop -->
    <rect x="48" y="158" width="304" height="26" rx="8" fill="url(#tb-wood)" stroke="#78350f" stroke-width="4.5"/>
    <!-- wood grain -->
    <g stroke="#92400e" stroke-width="2" opacity="0.6">
      <path d="M70,166 Q120,163 170,167"/>
      <path d="M210,174 Q260,171 320,175"/>
      <path d="M90,178 Q130,176 160,179"/>
    </g>
    <!-- apron -->
    <rect x="66" y="184" width="268" height="14" fill="#a16207" stroke="#78350f" stroke-width="3"/>
    <!-- legs -->
    <rect x="72" y="198" width="20" height="70" rx="4" fill="url(#tb-wood)" stroke="#78350f" stroke-width="3.5"/>
    <rect x="308" y="198" width="20" height="70" rx="4" fill="url(#tb-wood)" stroke="#78350f" stroke-width="3.5"/>
    <rect x="130" y="198" width="18" height="62" rx="4" fill="#b45309" stroke="#78350f" stroke-width="3" opacity="0.9"/>
    <rect x="252" y="198" width="18" height="62" rx="4" fill="#b45309" stroke="#78350f" stroke-width="3" opacity="0.9"/>
  </g>
  <!-- vase of flowers on table -->
  <g filter="url(#soft-shadow)">
    <path d="M118,158 L146,158 Q152,138 144,124 L120,124 Q112,138 118,158 Z" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3.5"/>
    <g stroke="#15803d" stroke-width="3.5" fill="none">
      <line x1="126" y1="124" x2="118" y2="94"/>
      <line x1="132" y1="124" x2="134" y2="88"/>
      <line x1="139" y1="124" x2="148" y2="96"/>
    </g>
    <g>
      <circle cx="116" cy="88" r="10" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
      <circle cx="116" cy="88" r="4" fill="#fde047"/>
      <circle cx="134" cy="80" r="10" fill="#fb923c" stroke="#c2410c" stroke-width="2.5"/>
      <circle cx="134" cy="80" r="4" fill="#fde047"/>
      <circle cx="150" cy="90" r="10" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/>
      <circle cx="150" cy="90" r="4" fill="#fde047"/>
    </g>
  </g>
  <!-- fruit bowl on table -->
  <g filter="url(#soft-shadow)">
    <path d="M220,144 L316,144 Q312,166 268,166 Q224,166 220,144 Z" fill="#f59e0b" stroke="#92400e" stroke-width="3.5"/>
    <!-- fruit -->
    <circle cx="244" cy="136" r="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <line x1="244" y1="123" x2="246" y2="116" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="270" cy="132" r="13" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
    <circle cx="296" cy="136" r="13" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
    <path d="M258,120 Q268,110 282,116" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
