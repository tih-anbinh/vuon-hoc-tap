<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shape desc-shape">
  <title id="title-shape">Shape</title>
  <desc id="desc-shape">A group of colorful basic shapes: a red circle, blue square, yellow triangle, and green star.</desc>
  <defs>
    <linearGradient id="shape-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#shape-bg)"/>
  <ellipse cx="200" cy="272" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Circle -->
    <circle cx="110" cy="110" r="52" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    <!-- Square -->
    <rect x="235" y="60" width="100" height="100" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="4"/>
    <!-- Triangle -->
    <path d="M110 175 L165 265 L55 265 Z" fill="#facc15" stroke="#a16207" stroke-width="4"/>
    <!-- Star -->
    <path d="M285 175 L299 213 L340 213 L307 238 L319 278 L285 253 L251 278 L263 238 L230 213 L271 213 Z" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
  </g>
</svg>
