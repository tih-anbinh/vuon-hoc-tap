<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-clap d-clap">
  <title id="t-clap">Clap</title>
  <desc id="d-clap">A happy child bringing both hands together in front of the chest with a bright burst and sound rays showing a clap.</desc>
  <defs>
    <radialGradient id="clap-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="clap-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#clap-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Sound / motion rays around the clap point -->
  <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="70" x2="200" y2="42"/>
    <line x1="150" y1="88" x2="132" y2="66"/>
    <line x1="250" y1="88" x2="268" y2="66"/>
    <line x1="122" y1="128" x2="96" y2="120"/>
    <line x1="278" y1="128" x2="304" y2="120"/>
  </g>
  <!-- Impact burst where palms meet -->
  <path d="M200 92 l10 26 27 4 -22 17 8 27 -23 -15 -23 15 8 -27 -22 -17 27 -4 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>

  <g filter="url(#clap-sh)">
    <!-- Head -->
    <circle cx="200" cy="150" r="34" fill="#fcc79a" stroke="#0f172a" stroke-width="4"/>
    <path d="M168 138 C172 108 228 108 232 138 C224 122 176 122 168 138 Z" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <circle cx="188" cy="150" r="4.5" fill="#0f172a"/>
    <circle cx="212" cy="150" r="4.5" fill="#0f172a"/>
    <path d="M188 166 Q200 176 212 166" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="176" cy="162" r="6" fill="#fb7185" opacity="0.35"/>
    <circle cx="224" cy="162" r="6" fill="#fb7185" opacity="0.35"/>

    <!-- Body -->
    <path d="M170 196 Q200 186 230 196 L238 262 Q200 272 162 262 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="4"/>

    <!-- Left arm reaching to center clap -->
    <path d="M172 210 Q150 172 186 128" fill="none" stroke="#3b82f6" stroke-width="18" stroke-linecap="round"/>
    <!-- Right arm reaching to center clap -->
    <path d="M228 210 Q250 172 214 128" fill="none" stroke="#3b82f6" stroke-width="18" stroke-linecap="round"/>
    <!-- Two palms meeting at center -->
    <ellipse cx="188" cy="120" rx="15" ry="22" fill="#fcc79a" stroke="#0f172a" stroke-width="4" transform="rotate(18 188 120)"/>
    <ellipse cx="212" cy="120" rx="15" ry="22" fill="#fcc79a" stroke="#0f172a" stroke-width="4" transform="rotate(-18 212 120)"/>
  </g>
</svg>
