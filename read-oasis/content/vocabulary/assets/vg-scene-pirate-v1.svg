<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-pirate d-pirate">
  <title id="t-pirate">Pirate</title>
  <desc id="d-pirate">A friendly cartoon pirate with a black hat bearing a white skull, an eye patch, a red bandana and a red coat.</desc>
  <defs>
    <filter id="pr-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="#bae6fd"/>
  <g fill="#7dd3fc" opacity="0.6"><path d="M8 240 q60 -20 120 0 t120 0 t144 0 v44 h-384 z"/></g>

  <g filter="url(#pr-sh)" stroke="#0f172a" stroke-width="4">
    <!-- coat shoulders -->
    <path d="M92 292 Q98 214 176 202 Q254 214 260 292 Z" fill="#b91c1c"/>
    <path d="M176 206 L152 256 L176 240 Z" fill="#7f1d1d"/>
    <path d="M176 206 L200 256 L176 240 Z" fill="#7f1d1d"/>
    <g fill="#fbbf24" stroke="none"><circle cx="176" cy="230" r="4"/><circle cx="176" cy="250" r="4"/></g>
    <!-- neck + head -->
    <rect x="162" y="182" width="28" height="26" fill="#fcc79a"/>
    <circle cx="176" cy="150" r="40" fill="#fcc79a"/>
    <!-- red bandana -->
    <path d="M138 138 Q176 118 214 138 L214 128 Q176 108 138 128 Z" fill="#dc2626"/>
    <path d="M138 132 l-16 8 8 14 z" fill="#dc2626"/>
    <!-- eye patch -->
    <path d="M158 138 L138 122" stroke="#0f172a" stroke-width="4"/>
    <ellipse cx="162" cy="146" rx="11" ry="12" fill="#0f172a"/>
    <!-- open eye -->
    <circle cx="192" cy="148" r="5" fill="#0f172a"/>
    <!-- smile -->
    <path d="M164 170 Q182 184 200 168" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="150" cy="160" r="6" fill="#fb7185" opacity="0.35"/>
    <!-- hat -->
    <path d="M118 118 Q176 78 234 118 Q214 96 176 92 Q138 96 118 118 Z" fill="#111827"/>
    <path d="M112 118 Q176 104 240 118 L240 126 Q176 114 112 126 Z" fill="#0b1220"/>
    <!-- skull emblem -->
    <circle cx="176" cy="108" r="11" fill="#f8fafc"/>
    <circle cx="172" cy="106" r="2.5" fill="#0f172a"/><circle cx="180" cy="106" r="2.5" fill="#0f172a"/>
    <path d="M172 114 l8 0 M170 100 l12 0" stroke="#94a3b8" stroke-width="2"/>
    <path d="M166 120 l-8 6 M186 120 l8 6" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
