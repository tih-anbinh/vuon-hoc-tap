<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-tomato desc-tomato">
  <title id="title-tomato">Tomato - Big red tomato with green stem</title>
  <desc id="desc-tomato">A large shiny red tomato with a green star-shaped stem, next to a sliced half showing seeds, on a kitchen table.</desc>
  <defs>
    <linearGradient id="tm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="tm-body" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#tm-bg)"/>
  <!-- table -->
  <rect x="0" y="230" width="400" height="70" fill="#e8b478"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#a16207" stroke-width="3.5"/>
  <ellipse cx="200" cy="252" rx="160" ry="14" fill="#0f172a" opacity="0.2"/>
  <!-- big tomato (dominant) -->
  <g filter="url(#soft-shadow)">
    <!-- body: slightly squat sphere with lobes -->
    <path d="M78,160 Q78,88 160,84 Q242,88 242,160 Q242,236 160,240 Q78,236 78,160 Z" fill="url(#tm-body)" stroke="#7f1d1d" stroke-width="4.5"/>
    <!-- lobe creases -->
    <g stroke="#b91c1c" stroke-width="3" fill="none" opacity="0.7">
      <path d="M120,92 Q112,150 122,226"/>
      <path d="M200,92 Q208,150 198,226"/>
    </g>
    <!-- highlight -->
    <ellipse cx="122" cy="122" rx="24" ry="15" fill="#fecaca" opacity="0.8" transform="rotate(-24 122 122)"/>
    <!-- green star calyx -->
    <path d="M160,84 L146,64 L156,80 L148,56 L160,78 L164,52 L166,78 L178,58 L170,80 L186,66 L168,84 Z" fill="#16a34a" stroke="#14532d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M132,90 Q142,78 160,80 Q178,78 188,90 Q176,96 160,94 Q144,96 132,90 Z" fill="#22c55e" stroke="#14532d" stroke-width="3"/>
    <!-- stem -->
    <rect x="156" y="52" width="9" height="18" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2.5"/>
  </g>
  <!-- tomato half slice -->
  <g filter="url(#soft-shadow)">
    <circle cx="316" cy="192" r="52" fill="#f87171" stroke="#7f1d1d" stroke-width="4.5"/>
    <circle cx="316" cy="192" r="42" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/>
    <!-- inner segments -->
    <g fill="#fecaca" stroke="#dc2626" stroke-width="2.5">
      <path d="M316,192 L316,154 A38,38 0 0,1 349,173 Z"/>
      <path d="M316,192 L349,211 A38,38 0 0,1 283,211 Z"/>
      <path d="M316,192 L283,173 A38,38 0 0,1 316,154 Z" fill="#fda4af"/>
      <path d="M316,192 L349,173 A38,38 0 0,1 349,211 Z" fill="#fda4af"/>
      <path d="M316,192 L283,211 A38,38 0 0,1 283,173 Z"/>
    </g>
    <!-- seeds -->
    <g fill="#fde047" stroke="#a16207" stroke-width="1.5">
      <ellipse cx="316" cy="170" rx="4" ry="6"/>
      <ellipse cx="334" cy="184" rx="6" ry="4"/>
      <ellipse cx="330" cy="206" rx="4" ry="6" transform="rotate(40 330 206)"/>
      <ellipse cx="300" cy="206" rx="4" ry="6" transform="rotate(-40 300 206)"/>
      <ellipse cx="298" cy="182" rx="6" ry="4"/>
    </g>
    <circle cx="316" cy="192" r="6" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
  </g>
  <!-- small cherry tomato -->
  <g filter="url(#soft-shadow)">
    <circle cx="48" cy="252" r="18" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <ellipse cx="42" cy="245" rx="6" ry="4" fill="#fecaca" opacity="0.8"/>
    <path d="M48,234 L44,226 M48,234 L54,227" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
