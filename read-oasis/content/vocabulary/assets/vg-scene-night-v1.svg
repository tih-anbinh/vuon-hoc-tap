<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-night desc-night">
  <title id="title-night">Night - Moon and stars over sleeping town</title>
  <desc id="desc-night">A dark blue night sky with a bright crescent moon and many stars over a quiet town with dark houses, one window still glowing, and an owl on a tree branch.</desc>
  <defs>
    <linearGradient id="ni-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="ni-moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#ni-sky)"/>
  <!-- moon glow -->
  <circle cx="310" cy="75" r="85" fill="url(#ni-moonglow)"/>
  <!-- crescent moon -->
  <path d="M340,25 A52,52 0 1,0 340,125 A42,42 0 1,1 340,25 Z" fill="#fde047" stroke="#d97706" stroke-width="3" filter="url(#soft-shadow)"/>
  <!-- stars -->
  <g fill="#fef9c3">
    <path d="M60,40 L64,52 L76,53 L66,61 L69,73 L60,66 L51,73 L54,61 L44,53 L56,52 Z"/>
    <path d="M150,70 L153,78 L161,79 L155,84 L157,92 L150,88 L143,92 L145,84 L139,79 L147,78 Z"/>
    <circle cx="110" cy="35" r="3"/>
    <circle cx="210" cy="50" r="3.5"/>
    <circle cx="250" cy="25" r="2.5"/>
    <circle cx="35" cy="105" r="2.5"/>
    <circle cx="185" cy="110" r="3"/>
    <circle cx="105" cy="130" r="2.5"/>
    <circle cx="380" cy="150" r="2.5"/>
    <circle cx="240" cy="140" r="2"/>
  </g>
  <!-- ground -->
  <rect x="0" y="252" width="400" height="48" fill="#111827"/>
  <!-- dark houses skyline -->
  <g filter="url(#soft-shadow)">
    <!-- house 1 -->
    <rect x="30" y="195" width="85" height="60" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <path d="M22,197 L72,158 L123,197 Z" fill="#374151" stroke="#0f172a" stroke-width="3"/>
    <!-- glowing window -->
    <rect x="55" y="212" width="24" height="22" rx="3" fill="#fbbf24" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="67" y1="212" x2="67" y2="234" stroke="#0f172a" stroke-width="2"/>
    <line x1="55" y1="223" x2="79" y2="223" stroke="#0f172a" stroke-width="2"/>
    <!-- house 2 -->
    <rect x="140" y="205" width="75" height="50" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <path d="M133,207 L177,172 L222,207 Z" fill="#374151" stroke="#0f172a" stroke-width="3"/>
    <rect x="162" y="220" width="20" height="18" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
    <!-- house 3 -->
    <rect x="245" y="212" width="65" height="43" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <path d="M239,214 L277,184 L316,214 Z" fill="#374151" stroke="#0f172a" stroke-width="3"/>
    <rect x="265" y="224" width="18" height="16" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
  </g>
  <!-- tree with owl -->
  <g filter="url(#soft-shadow)">
    <path d="M352,255 L352,190 Q350,170 338,160" fill="none" stroke="#292524" stroke-width="10" stroke-linecap="round"/>
    <line x1="352" y1="205" x2="378" y2="188" stroke="#292524" stroke-width="7" stroke-linecap="round"/>
    <!-- owl on branch -->
    <ellipse cx="376" cy="172" rx="16" ry="19" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="370" cy="166" r="6.5" fill="#fef3c7" stroke="#451a03" stroke-width="1.8"/>
    <circle cx="383" cy="166" r="6.5" fill="#fef3c7" stroke="#451a03" stroke-width="1.8"/>
    <circle cx="370" cy="166" r="3" fill="#0f172a"/>
    <circle cx="383" cy="166" r="3" fill="#0f172a"/>
    <path d="M374,173 L377,177 L380,173 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
    <path d="M364,158 L360,150 L369,155 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
    <path d="M389,158 L393,150 L384,155 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
  </g>
  <!-- zzz from a house -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M175,150 L188,150 L175,163 L188,163"/>
    <path d="M196,132 L206,132 L196,142 L206,142"/>
  </g>
</svg>
