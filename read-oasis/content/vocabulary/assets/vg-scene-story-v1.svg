<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-story desc-story">
  <title id="title-story">Story - Open storybook with castle and dragon</title>
  <desc id="desc-story">A big open storybook with a fairy-tale castle and a friendly dragon popping out of its pages, with stars and a moon showing imagination.</desc>
  <defs>
    <linearGradient id="sy-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="sy-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#sy-bg)"/>
  <!-- moon and stars -->
  <path d="M352,40 A22,22 0 1,0 352,84 A17,17 0 1,1 352,40 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
  <g fill="#fde047">
    <path d="M60,40 L64,50 L74,54 L64,58 L60,68 L56,58 L46,54 L56,50 Z"/>
    <path d="M120,75 L123,82 L130,85 L123,88 L120,95 L117,88 L110,85 L117,82 Z"/>
    <path d="M290,30 L293,37 L300,40 L293,43 L290,50 L287,43 L280,40 L287,37 Z"/>
    <circle cx="35" cy="110" r="3"/>
    <circle cx="375" cy="120" r="3"/>
    <circle cx="180" cy="30" r="3"/>
  </g>
  <!-- open book -->
  <g filter="url(#soft-shadow)">
    <!-- cover -->
    <path d="M40,268 Q40,254 55,252 L200,238 L345,252 Q360,254 360,268 L200,258 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="4"/>
    <!-- left page -->
    <path d="M55,250 Q120,228 200,242 L200,140 Q120,126 55,148 Z" fill="url(#sy-page)" stroke="#a8a29e" stroke-width="3.5"/>
    <!-- right page -->
    <path d="M345,250 Q280,228 200,242 L200,140 Q280,126 345,148 Z" fill="url(#sy-page)" stroke="#a8a29e" stroke-width="3.5"/>
    <!-- page seam -->
    <line x1="200" y1="140" x2="200" y2="242" stroke="#a8a29e" stroke-width="3"/>
    <!-- left page: castle illustration -->
    <g>
      <rect x="95" y="180" width="60" height="42" fill="#a78bfa" stroke="#4c1d95" stroke-width="3"/>
      <rect x="85" y="165" width="20" height="57" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3"/>
      <rect x="145" y="165" width="20" height="57" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3"/>
      <path d="M83,165 L95,145 L107,165 Z" fill="#ec4899" stroke="#831843" stroke-width="2.5"/>
      <path d="M143,165 L155,145 L167,165 Z" fill="#ec4899" stroke="#831843" stroke-width="2.5"/>
      <path d="M118,222 L118,204 Q118,196 125,196 Q132,196 132,204 L132,222 Z" fill="#4c1d95"/>
      <line x1="95" y1="145" x2="95" y2="132" stroke="#4c1d95" stroke-width="2.5"/>
      <path d="M95,132 L110,136 L95,141 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
    </g>
    <!-- right page: text lines -->
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="225" y1="200" x2="325" y2="192"/>
      <line x1="225" y1="214" x2="325" y2="206"/>
      <line x1="225" y1="228" x2="300" y2="222"/>
    </g>
  </g>
  <!-- friendly dragon popping from right page -->
  <g filter="url(#soft-shadow)">
    <!-- neck -->
    <path d="M262,160 Q258,120 280,96" fill="none" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="292" cy="86" rx="30" ry="24" fill="#22c55e" stroke="#14532d" stroke-width="3.5"/>
    <!-- snout -->
    <ellipse cx="318" cy="94" rx="14" ry="10" fill="#4ade80" stroke="#14532d" stroke-width="3"/>
    <circle cx="322" cy="92" r="2.5" fill="#14532d"/>
    <!-- eye -->
    <circle cx="288" cy="78" r="7" fill="#ffffff" stroke="#14532d" stroke-width="2.5"/>
    <circle cx="290" cy="79" r="3" fill="#0f172a"/>
    <!-- horns -->
    <path d="M276,66 L270,50 L284,60 Z" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <path d="M294,62 L294,46 L306,58 Z" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <!-- smile -->
    <path d="M306,102 Q316,108 326,102" fill="none" stroke="#14532d" stroke-width="2.5" stroke-linecap="round"/>
    <!-- belly scales on neck -->
    <g stroke="#bbf7d0" stroke-width="3.5" stroke-linecap="round">
      <path d="M256,150 Q264,148 270,152"/>
      <path d="M258,132 Q266,130 272,134"/>
      <path d="M264,114 Q272,112 278,116"/>
    </g>
    <!-- tiny wing -->
    <path d="M252,128 Q232,112 236,92 Q248,104 258,108 Z" fill="#4ade80" stroke="#14532d" stroke-width="3"/>
    <!-- puff of friendly smoke -->
    <circle cx="342" cy="78" r="6" fill="#e9d5ff" opacity="0.9"/>
    <circle cx="354" cy="66" r="8" fill="#e9d5ff" opacity="0.8"/>
  </g>
  <!-- sparkles rising from book -->
  <g fill="#fde047">
    <path d="M170,110 L173,117 L180,120 L173,123 L170,130 L167,123 L160,120 L167,117 Z"/>
    <path d="M225,95 L227,101 L233,103 L227,105 L225,111 L223,105 L217,103 L223,101 Z"/>
  </g>
</svg>
