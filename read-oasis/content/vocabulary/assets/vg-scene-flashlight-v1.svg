<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-flashlight desc-flashlight">
  <title id="title-flashlight">Flashlight</title>
  <desc id="desc-flashlight">A handheld flashlight shining a bright yellow beam of light out of its lens.</desc>
  <defs>
    <linearGradient id="flashlight-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="flashlight-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#flashlight-bg)"/>

  <!-- Light beam -->
  <path d="M215 130 L390 50 L390 250 L215 170 Z" fill="#fde047" opacity="0.4"/>
  <path d="M215 138 L390 90 L390 210 L215 162 Z" fill="#fef9c3" opacity="0.5"/>

  <g filter="url(#soft-shadow)">
    <g transform="rotate(-12 130 150)">
      <!-- Handle -->
      <rect x="60" y="135" width="120" height="34" rx="10" fill="url(#flashlight-body)" stroke="#7c2d12" stroke-width="4"/>
      <!-- Grip ridges -->
      <line x1="80" y1="138" x2="80" y2="166" stroke="#7c2d12" stroke-width="2.5"/>
      <line x1="95" y1="138" x2="95" y2="166" stroke="#7c2d12" stroke-width="2.5"/>
      <line x1="110" y1="138" x2="110" y2="166" stroke="#7c2d12" stroke-width="2.5"/>
      <!-- Head (reflector) -->
      <path d="M175 120 L215 108 L215 196 L175 184 Z" fill="#334155" stroke="#0f172a" stroke-width="4"/>
      <!-- Lens -->
      <ellipse cx="215" cy="152" rx="8" ry="44" fill="#fef9c3" stroke="#facc15" stroke-width="3"/>
      <!-- Button -->
      <rect x="118" y="128" width="20" height="10" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    </g>
  </g>
</svg>
