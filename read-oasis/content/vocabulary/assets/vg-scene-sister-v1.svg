<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sister desc-sister">
  <title id="title-sister">Sister - Cheerful smiling girl</title>
  <desc id="desc-sister">A happy young girl with pigtails tied with ribbons, wearing a cute pink dress, smiling and waving, occupying the center of the frame.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="270" x2="370" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="270" rx="60" ry="10" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: SISTER (Occupying 75% canvas) -->
  <g id="sister-figure" filter="url(#soft-shadow)">
    <!-- Legs & Cute Shoes -->
    <!-- Left Leg -->
    <rect x="175" y="210" width="18" height="42" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="2.5"/>
    <!-- Left White Sock & Pink Shoe -->
    <rect x="174" y="242" width="20" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="180" cy="256" rx="14" ry="8" fill="#db2777" stroke="#9d174d" stroke-width="2"/>

    <!-- Right Leg -->
    <rect x="207" y="210" width="18" height="42" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="2.5"/>
    <!-- Right White Sock & Pink Shoe -->
    <rect x="206" y="242" width="20" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="218" cy="256" rx="14" ry="8" fill="#db2777" stroke="#9d174d" stroke-width="2"/>

    <!-- Flared A-Line Dress (Vibrant Pink/Coral) -->
    <path d="M172 120 L228 120 L252 215 L148 215 Z" fill="#ec4899" stroke="#be185d" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- White Peter Pan Collar -->
    <path d="M178 120 C178 132 190 136 200 128 C210 136 222 132 222 120 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Cute Daisy Flower Pocket on Dress -->
    <ellipse cx="175" cy="175" rx="14" ry="12" fill="#f472b6" stroke="#db2777" stroke-width="1.5"/>
    <circle cx="175" cy="174" r="5" fill="#facc15"/>

    <!-- Left Arm Resting on Hip -->
    <path d="M172 122 C145 130 135 155 145 175" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
    <path d="M172 122 C145 130 135 155 145 175" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="148" cy="175" r="7" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
    <!-- Puffed Sleeve -->
    <circle cx="166" cy="126" r="12" fill="#ec4899" stroke="#be185d" stroke-width="2"/>

    <!-- Right Arm Waving Cheerfully -->
    <path d="M228 122 C255 110 275 88 285 70" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
    <path d="M228 122 C255 110 275 88 285 70" fill="none" stroke="#fb923c" stroke-width="2.5"/>
    <!-- Puffed Sleeve -->
    <circle cx="234" cy="126" r="12" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
    <!-- Waving Hand -->
    <g id="girl-wave" transform="translate(285, 60)">
      <circle cx="5" cy="5" r="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
      <ellipse cx="3" cy="-3" rx="3" ry="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
      <ellipse cx="8" cy="-4" rx="3" ry="6" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
      <ellipse cx="13" cy="-2" rx="3" ry="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
      <!-- Wave arcs -->
      <path d="M16 -10 C22 -4 22 8 16 14" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Twin Pigtails (Left and Right) -->
    <!-- Left Pigtail -->
    <path d="M162 65 C130 65 110 85 115 115 C122 125 132 110 135 95 C140 80 152 75 162 70 Z" fill="#78350f" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left Ribbon Bow -->
    <circle cx="155" cy="68" r="4" fill="#38bdf8"/>
    <path d="M152 68 C144 60 142 75 152 68 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M156 68 C164 60 166 75 156 68 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Right Pigtail -->
    <path d="M238 65 C270 65 290 85 285 115 C278 125 268 110 265 95 C260 80 248 75 238 70 Z" fill="#78350f" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Ribbon Bow -->
    <circle cx="245" cy="68" r="4" fill="#38bdf8"/>
    <path d="M242 68 C234 60 232 75 242 68 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M246 68 C254 60 256 75 246 68 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Head & Neck -->
    <rect x="192" y="105" width="16" height="18" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
    <circle cx="200" cy="78" r="36" fill="#fed7aa" stroke="#fb923c" stroke-width="3.5"/>

    <!-- Hair Bangs / Fringe -->
    <path d="M165 72 C165 42 235 42 235 72 C230 60 215 56 200 62 C185 56 170 60 165 72 Z" fill="#78350f" stroke="#451a03" stroke-width="3"/>

    <!-- Friendly Ears -->
    <ellipse cx="164" cy="80" rx="5" ry="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
    <ellipse cx="236" cy="80" rx="5" ry="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>

    <!-- Big Sparkling Eyes with Eyelashes -->
    <circle cx="186" cy="78" r="6" fill="#0f172a"/>
    <circle cx="184" cy="76" r="2" fill="#ffffff"/>
    <path d="M180 72 L177 69" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M190 71 L192 68" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="214" cy="78" r="6" fill="#0f172a"/>
    <circle cx="212" cy="76" r="2" fill="#ffffff"/>
    <path d="M210 71 L208 68" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M220 72 L223 69" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M178 70 Q186 66 193 70" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M207 70 Q214 66 222 70" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Button Nose -->
    <circle cx="200" cy="86" r="3" fill="#f97316"/>

    <!-- Sweet Grin & Rosy Cheeks -->
    <circle cx="174" cy="88" r="6" fill="#f43f5e" opacity="0.4"/>
    <circle cx="226" cy="88" r="6" fill="#f43f5e" opacity="0.4"/>
    <path d="M188 93 Q200 105 212 93" fill="#e11d48" stroke="#9f1239" stroke-width="2"/>
    <path d="M192 93 Q200 96 208 93" fill="#ffffff"/>
  </g>
</svg>