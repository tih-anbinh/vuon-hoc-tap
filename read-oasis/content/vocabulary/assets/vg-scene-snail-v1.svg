<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-snail desc-snail">
  <title id="title-snail">Snail</title>
  <desc id="desc-snail">A friendly snail with a spiral swirl shell, two eye stalks, crawling on a green leaf.</desc>
  <defs>
    <linearGradient id="snail-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="snail-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#snail-bg)"/>
  <ellipse cx="200" cy="255" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <!-- Leaf -->
  <path d="M50 230 Q200 200 360 230 Q200 250 50 230 Z" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
  <path d="M60 230 Q200 224 350 230" fill="none" stroke="#15803d" stroke-width="2"/>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <path d="M100 220 Q95 185 130 182 L235 182 Q255 182 255 200 Q255 222 235 222 Z" fill="#bef264" stroke="#4d7c0f" stroke-width="4"/>
    <!-- Head -->
    <path d="M100 218 Q75 216 78 190 Q80 172 100 178 Q110 195 105 218 Z" fill="#bef264" stroke="#4d7c0f" stroke-width="4"/>
    <!-- Eye stalks -->
    <line x1="88" y1="182" x2="78" y2="150" stroke="#4d7c0f" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="180" x2="98" y2="145" stroke="#4d7c0f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="76" cy="146" r="9" fill="#f8fafc" stroke="#4d7c0f" stroke-width="2.5"/>
    <circle cx="98" cy="141" r="9" fill="#f8fafc" stroke="#4d7c0f" stroke-width="2.5"/>
    <circle cx="76" cy="147" r="4" fill="#1e293b"/>
    <circle cx="98" cy="142" r="4" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M82 200 Q92 208 102 200" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-linecap="round"/>

    <!-- Shell (spiral) -->
    <circle cx="195" cy="150" r="62" fill="url(#snail-shell)" stroke="#7c2d12" stroke-width="5"/>
    <path d="M195 150 m0 -44 a44 44 0 1 1 -30 12 a30 30 0 1 0 22 -8 a17 17 0 1 0 -10 6" fill="none" stroke="#7c2d12" stroke-width="5"/>
  </g>
</svg>
