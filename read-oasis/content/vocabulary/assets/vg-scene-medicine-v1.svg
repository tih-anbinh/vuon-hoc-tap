<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-medicine desc-medicine">
  <title id="title-medicine">Medicine</title>
  <desc id="desc-medicine">A bottle of medicine with a red cross label, a measuring spoon, and two round pills.</desc>
  <defs>
    <linearGradient id="medicine-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="medicine-bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#medicine-bg)"/>
  <ellipse cx="200" cy="262" rx="150" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Bottle -->
    <rect x="120" y="110" width="90" height="130" rx="12" fill="url(#medicine-bottle)" stroke="#991b1b" stroke-width="4"/>
    <!-- Cap -->
    <rect x="140" y="88" width="50" height="28" rx="6" fill="#f8fafc" stroke="#991b1b" stroke-width="3.5"/>
    <!-- White label with cross -->
    <rect x="132" y="140" width="66" height="70" rx="6" fill="#f8fafc" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="158" y="152" width="14" height="46" rx="3" fill="#dc2626"/>
    <rect x="142" y="168" width="46" height="14" rx="3" fill="#dc2626"/>
  </g>

  <!-- Pills -->
  <g filter="url(#soft-shadow)">
    <circle cx="255" cy="205" r="24" fill="#fdba74" stroke="#c2410c" stroke-width="3.5"/>
    <line x1="235" y1="205" x2="275" y2="205" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="300" cy="225" r="20" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3.5"/>
    <line x1="284" y1="225" x2="316" y2="225" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>

  <!-- Spoon -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="290" cy="130" rx="34" ry="18" fill="#e2e8f0" stroke="#64748b" stroke-width="3.5"/>
    <ellipse cx="290" cy="130" rx="24" ry="10" fill="#fca5a5"/>
    <rect x="316" y="124" width="52" height="10" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="2.5" transform="rotate(-15 316 129)"/>
  </g>
</svg>
