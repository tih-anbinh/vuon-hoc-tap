<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-cage desc-cage">
  <title id="title-cage">Cage - Bird cage with a little bird inside</title>
  <desc id="desc-cage">A large golden bird cage with vertical bars hanging from a stand, with a happy yellow bird sitting on a perch inside.</desc>
  <defs>
    <linearGradient id="cg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="cg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#cg-bg)"/>
  <rect x="0" y="256" width="400" height="44" fill="#a5b4fc"/>
  <line x1="0" y1="256" x2="400" y2="256" stroke="#4338ca" stroke-width="3.5"/>
  <ellipse cx="200" cy="272" rx="130" ry="10" fill="#0f172a" opacity="0.18"/>
  <!-- hanging hook from top -->
  <g filter="url(#soft-shadow)">
    <line x1="200" y1="0" x2="200" y2="30" stroke="#78350f" stroke-width="5"/>
    <path d="M200,30 Q214,34 214,46 Q214,56 200,56" fill="none" stroke="url(#cg-gold)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- THE CAGE (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- dome top -->
    <path d="M110,140 Q110,56 200,56 Q290,56 290,140 Z" fill="#fef9c3" fill-opacity="0.25" stroke="#b45309" stroke-width="5"/>
    <!-- body -->
    <rect x="110" y="140" width="180" height="100" fill="#fef9c3" fill-opacity="0.2" stroke="#b45309" stroke-width="5"/>
    <!-- vertical bars -->
    <g stroke="url(#cg-gold)" stroke-width="5">
      <line x1="134" y1="96" x2="134" y2="240"/>
      <line x1="160" y1="72" x2="160" y2="240"/>
      <line x1="186" y1="62" x2="186" y2="240"/>
      <line x1="212" y1="62" x2="212" y2="240"/>
      <line x1="238" y1="72" x2="238" y2="240"/>
      <line x1="264" y1="96" x2="264" y2="240"/>
    </g>
    <!-- horizontal ring -->
    <line x1="110" y1="140" x2="290" y2="140" stroke="url(#cg-gold)" stroke-width="6"/>
    <!-- base -->
    <rect x="98" y="240" width="204" height="18" rx="8" fill="url(#cg-gold)" stroke="#92400e" stroke-width="4"/>
    <!-- top knob -->
    <circle cx="200" cy="52" r="9" fill="url(#cg-gold)" stroke="#92400e" stroke-width="3.5"/>
    <!-- little door -->
    <rect x="118" y="156" width="34" height="52" rx="6" fill="none" stroke="#92400e" stroke-width="4"/>
    <circle cx="146" cy="182" r="3.5" fill="#92400e"/>
  </g>
  <!-- perch and bird inside -->
  <g filter="url(#soft-shadow)">
    <line x1="150" y1="188" x2="256" y2="188" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <!-- bird -->
    <ellipse cx="204" cy="164" rx="24" ry="20" fill="#facc15" stroke="#a16207" stroke-width="3.5"/>
    <circle cx="222" cy="150" r="14" fill="#facc15" stroke="#a16207" stroke-width="3.5"/>
    <path d="M234,148 L248,152 L234,157 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="226" cy="146" r="3.5" fill="#0f172a"/>
    <circle cx="227" cy="145" r="1.2" fill="#ffffff"/>
    <!-- wing -->
    <path d="M196,158 Q182,166 188,178 Q198,176 206,168 Z" fill="#f59e0b" stroke="#a16207" stroke-width="2.5"/>
    <!-- tail -->
    <path d="M182,166 Q166,160 160,148 L172,146 Q182,154 188,158 Z" fill="#f59e0b" stroke="#a16207" stroke-width="2.5"/>
    <!-- legs on perch -->
    <line x1="200" y1="182" x2="200" y2="188" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="212" y1="182" x2="212" y2="188" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round"/>
    <!-- music note (singing) -->
    <g fill="#4c1d95">
      <ellipse cx="252" cy="118" rx="5" ry="4"/>
      <rect x="255" y="100" width="3" height="18"/>
      <path d="M255,100 Q264,102 264,108 L258,106 Z"/>
    </g>
  </g>
  <!-- seed cup -->
  <path d="M158,240 L182,240 L178,226 L162,226 Z" fill="#f97316" stroke="#7c2d12" stroke-width="3"/>
  <g fill="#78350f">
    <circle cx="166" cy="226" r="2"/>
    <circle cx="172" cy="224" r="2"/>
    <circle cx="176" cy="227" r="2"/>
  </g>
</svg>
