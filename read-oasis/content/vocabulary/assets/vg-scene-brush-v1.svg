<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-brush desc-brush">
  <title id="title-brush">Brush</title>
  <desc id="desc-brush">A hairbrush with a wooden handle and many bristles, next to a paint brush.</desc>
  <defs>
    <linearGradient id="brush-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="brush-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#brush-bg)"/>
  <ellipse cx="200" cy="255" rx="150" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Hairbrush (tilted) -->
    <g transform="rotate(-20 200 150)">
      <!-- Handle -->
      <rect x="220" y="140" width="120" height="26" rx="13" fill="url(#brush-wood)" stroke="#7c2d12" stroke-width="3.5"/>
      <!-- Head (oval) -->
      <ellipse cx="180" cy="153" rx="70" ry="46" fill="#f59e0b" stroke="#7c2d12" stroke-width="4"/>
      <ellipse cx="180" cy="153" rx="58" ry="36" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
      <!-- Bristles -->
      <g stroke="#1e293b" stroke-width="3" stroke-linecap="round">
        <line x1="140" y1="130" x2="140" y2="112"/>
        <line x1="160" y1="125" x2="160" y2="106"/>
        <line x1="180" y1="123" x2="180" y2="104"/>
        <line x1="200" y1="125" x2="200" y2="106"/>
        <line x1="220" y1="130" x2="220" y2="112"/>
        <line x1="140" y1="176" x2="140" y2="194"/>
        <line x1="160" y1="181" x2="160" y2="200"/>
        <line x1="180" y1="183" x2="180" y2="202"/>
        <line x1="200" y1="181" x2="200" y2="200"/>
        <line x1="220" y1="176" x2="220" y2="194"/>
      </g>
    </g>
  </g>
</svg>
