<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-railway desc-railway">
  <title id="title-railway">Railway</title>
  <desc id="desc-railway">A railway track with two shiny steel rails and wooden sleepers stretching into the distance.</desc>
  <defs>
    <linearGradient id="railway-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="170" fill="url(#railway-bg)"/>
  <circle cx="330" cy="55" r="28" fill="#fde047" stroke="#f59e0b" stroke-width="3"/>
  <!-- Hills -->
  <path d="M0 170 Q100 130 200 170 T400 155 L400 170 Z" fill="#4ade80" opacity="0.6"/>
  <!-- Gravel bed -->
  <rect x="0" y="170" width="400" height="130" fill="#a8a29e"/>

  <!-- Sleepers (converging) -->
  <g fill="#78350f" stroke="#451a03" stroke-width="2">
    <path d="M60 285 L340 285 L320 300 L80 300 Z"/>
    <path d="M95 250 L305 250 L297 262 L103 262 Z"/>
    <path d="M120 222 L280 222 L275 231 L125 231 Z"/>
    <path d="M138 200 L262 200 L259 207 L141 207 Z"/>
    <path d="M152 183 L248 183 L246 189 L154 189 Z"/>
    <path d="M162 170 L238 170 L237 175 L163 175 Z"/>
  </g>

  <!-- Rails (converging to vanishing point) -->
  <g filter="url(#soft-shadow)">
    <path d="M85 300 L175 170 L182 170 L100 300 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <path d="M315 300 L225 170 L218 170 L300 300 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <!-- Rail shine -->
    <line x1="92" y1="300" x2="178" y2="172" stroke="#f8fafc" stroke-width="2" opacity="0.7"/>
    <line x1="308" y1="300" x2="222" y2="172" stroke="#f8fafc" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
