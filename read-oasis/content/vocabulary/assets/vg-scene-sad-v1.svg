<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sad desc-sad">
  <title id="title-sad">Sad - A frowning face with tear drops</title>
  <desc id="desc-sad">A blue-tinted face with a frowning mouth, downturned eyes, tears rolling down, and a rain cloud above.</desc>
  <defs>
    <linearGradient id="sad-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sad-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <line x1="30" y1="270" x2="370" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="100" ry="7" fill="#0f172a" opacity="0.15"/>

  <!-- Rain cloud above -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="200" cy="45" rx="55" ry="20" fill="url(#sad-cloud)" stroke="#1e293b" stroke-width="3"/>
    <ellipse cx="175" cy="38" rx="25" ry="15" fill="url(#sad-cloud)" stroke="#1e293b" stroke-width="3"/>
    <ellipse cx="225" cy="38" rx="25" ry="15" fill="url(#sad-cloud)" stroke="#1e293b" stroke-width="3"/>
    <!-- Rain drops -->
    <path d="M170 75 Q167 82 173 88 Q178 82 175 75 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M195 78 Q192 85 198 91 Q203 85 200 78 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M220 75 Q217 82 223 88 Q228 82 225 75 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M245 78 Q242 85 248 91 Q253 85 250 78 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- Face circle -->
    <circle cx="200" cy="175" r="85" fill="url(#sad-face)" stroke="#1e40af" stroke-width="5"/>

    <!-- Sad eyes (downturned curves, drooping) -->
    <path d="M155 155 Q170 175 185 165" fill="none" stroke="#0c0a09" stroke-width="4" stroke-linecap="round"/>
    <path d="M215 165 Q230 175 245 155" fill="none" stroke="#0c0a09" stroke-width="4" stroke-linecap="round"/>
    <!-- Eye pupils (looking down) -->
    <circle cx="170" cy="170" r="3.5" fill="#0c0a09"/>
    <circle cx="230" cy="170" r="3.5" fill="#0c0a09"/>

    <!-- Sad eyebrows (angled up/inward, worried) -->
    <path d="M148 140 L188 152" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 140 L212 152" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>

    <!-- Tears rolling down -->
    <path d="M170 185 Q167 200 172 215 Q177 200 172 185 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <path d="M228 185 Q225 200 230 215 Q235 200 230 185 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <!-- Tear highlights -->
    <ellipse cx="169" cy="197" rx="1.5" ry="3" fill="#dbeafe" opacity="0.9"/>
    <ellipse cx="227" cy="197" rx="1.5" ry="3" fill="#dbeafe" opacity="0.9"/>

    <!-- Frowning mouth (downturned) -->
    <path d="M160 235 Q200 205 240 235" fill="none" stroke="#0c0a09" stroke-width="5" stroke-linecap="round"/>

    <!-- Blue cheeks (pale/sad) -->
    <ellipse cx="145" cy="205" rx="12" ry="8" fill="#93c5fd" opacity="0.6"/>
    <ellipse cx="255" cy="205" rx="12" ry="8" fill="#93c5fd" opacity="0.6"/>
  </g>

  <!-- Small rain puddles at bottom -->
  <g fill="#60a5fa" stroke="#1e40af" stroke-width="2" opacity="0.85">
    <ellipse cx="120" cy="270" rx="12" ry="3"/>
    <ellipse cx="280" cy="272" rx="14" ry="3"/>
  </g>
</svg>