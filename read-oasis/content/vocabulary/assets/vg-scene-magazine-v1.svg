<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-magazine desc-magazine">
  <title id="title-magazine">Magazine</title>
  <desc id="desc-magazine">An open glossy magazine showing two pages with a photo and columns of text lines.</desc>
  <defs>
    <linearGradient id="magazine-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#magazine-bg)"/>
  <ellipse cx="200" cy="255" rx="160" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Left page -->
    <path d="M50 90 L200 105 L200 240 L50 225 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Right page -->
    <path d="M350 90 L200 105 L200 240 L350 225 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Spine -->
    <line x1="200" y1="105" x2="200" y2="240" stroke="#94a3b8" stroke-width="3"/>

    <!-- Left page photo -->
    <rect x="70" y="105" width="110" height="60" rx="4" fill="#60a5fa" stroke="#1e293b" stroke-width="2"/>
    <circle cx="100" cy="135" r="12" fill="#fde047"/>
    <path d="M70 165 L110 135 L140 155 L180 120 L180 165 Z" fill="#22c55e"/>
    <!-- Left page text lines -->
    <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="185" x2="175" y2="192"/>
      <line x1="70" y1="200" x2="175" y2="207"/>
      <line x1="70" y1="215" x2="150" y2="220"/>
    </g>

    <!-- Right page: two columns of text -->
    <g stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round">
      <line x1="220" y1="120" x2="278" y2="115"/>
      <line x1="220" y1="135" x2="278" y2="130"/>
      <line x1="220" y1="150" x2="278" y2="145"/>
      <line x1="220" y1="165" x2="270" y2="161"/>
      <line x1="290" y1="112" x2="345" y2="108"/>
      <line x1="290" y1="127" x2="345" y2="123"/>
      <line x1="290" y1="142" x2="345" y2="138"/>
      <line x1="290" y1="157" x2="338" y2="153"/>
      <line x1="220" y1="195" x2="345" y2="185"/>
      <line x1="220" y1="210" x2="345" y2="200"/>
      <line x1="220" y1="225" x2="320" y2="217"/>
    </g>
  </g>
</svg>
