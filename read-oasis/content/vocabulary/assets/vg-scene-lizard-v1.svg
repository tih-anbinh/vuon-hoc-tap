<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-lizard desc-lizard">
  <title id="title-lizard">Lizard - Small green lizard on a rock</title>
  <desc id="desc-lizard">A small bright green lizard with a long tail, four splayed legs with tiny toes, and alert round eyes, basking on a warm rock.</desc>
  <defs>
    <linearGradient id="lizard-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="rock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="40" y1="265" x2="360" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="265" rx="100" ry="8" fill="#0f172a" opacity="0.1"/>

  <!-- Rock -->
  <path d="M100 260 C110 220 140 200 200 195 C260 190 300 210 310 260 Z" fill="url(#rock-grad)" stroke="#78716c" stroke-width="3"/>
  <!-- Rock highlight -->
  <path d="M150 225 C170 215 210 210 240 215" fill="none" stroke="#e7e5e4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- LIZARD -->
  <g id="lizard-figure" filter="url(#soft-shadow)">
    <!-- Long tail (curving) -->
    <path d="M120 195 C80 200 50 185 30 170 C20 162 25 155 35 160 C50 170 75 180 115 185" fill="none" stroke="url(#lizard-green)" stroke-width="10" stroke-linecap="round"/>
    <path d="M120 195 C80 200 50 185 30 170" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

    <!-- Rear left leg -->
    <path d="M145 195 C130 210 120 225 115 235" fill="none" stroke="url(#lizard-green)" stroke-width="7" stroke-linecap="round"/>
    <!-- Toes -->
    <line x1="115" y1="235" x2="108" y2="240" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="235" x2="113" y2="242" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="235" x2="120" y2="242" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

    <!-- Rear right leg -->
    <path d="M160 200 C150 215 145 230 140 240" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="240" x2="134" y2="245" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="240" x2="139" y2="247" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="240" x2="145" y2="246" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Front left leg -->
    <path d="M240 185 C255 200 265 215 270 225" fill="none" stroke="url(#lizard-green)" stroke-width="7" stroke-linecap="round"/>
    <line x1="270" y1="225" x2="264" y2="230" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="225" x2="269" y2="232" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="225" x2="276" y2="231" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

    <!-- Front right leg -->
    <path d="M255 190 C268 205 275 218 280 228" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <line x1="280" y1="228" x2="275" y2="233" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="228" x2="280" y2="235" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="228" x2="286" y2="233" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Body (elongated) -->
    <ellipse cx="200" cy="185" rx="65" ry="18" fill="url(#lizard-green)" stroke="#16a34a" stroke-width="3"/>

    <!-- Belly stripe -->
    <ellipse cx="200" cy="192" rx="45" ry="8" fill="#bbf7d0" opacity="0.5"/>

    <!-- Back stripe pattern -->
    <circle cx="160" cy="182" r="3" fill="#16a34a" opacity="0.4"/>
    <circle cx="180" cy="180" r="3" fill="#16a34a" opacity="0.4"/>
    <circle cx="200" cy="179" r="3" fill="#16a34a" opacity="0.4"/>
    <circle cx="220" cy="180" r="3" fill="#16a34a" opacity="0.4"/>
    <circle cx="240" cy="182" r="3" fill="#16a34a" opacity="0.4"/>

    <!-- Head -->
    <ellipse cx="275" cy="175" rx="22" ry="16" fill="url(#lizard-green)" stroke="#16a34a" stroke-width="3"/>

    <!-- Eyes (alert, round) -->
    <circle cx="280" cy="168" r="6" fill="#fef9c3" stroke="#16a34a" stroke-width="2"/>
    <circle cx="281" cy="169" r="3" fill="#1e293b"/>
    <circle cx="279" cy="167" r="1.5" fill="#ffffff"/>

    <circle cx="292" cy="170" r="5" fill="#fef9c3" stroke="#16a34a" stroke-width="2"/>
    <circle cx="293" cy="171" r="2.5" fill="#1e293b"/>
    <circle cx="291" cy="169" r="1.5" fill="#ffffff"/>

    <!-- Nostrils -->
    <circle cx="293" cy="177" r="1.5" fill="#16a34a"/>

    <!-- Mouth line -->
    <path d="M288 180 Q295 183 300 180" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>