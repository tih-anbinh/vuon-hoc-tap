<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-city desc-city">
  <title id="title-city">City</title>
  <desc id="desc-city">A city skyline of tall skyscrapers with many lit windows under a blue sky.</desc>
  <defs>
    <linearGradient id="city-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#city-bg)"/>
  <circle cx="330" cy="55" r="26" fill="#fde047"/>
  <rect x="0" y="255" width="400" height="45" fill="#64748b"/>

  <g filter="url(#soft-shadow)">
    <!-- Buildings -->
    <rect x="40" y="150" width="55" height="105" fill="#60a5fa" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="100" y="100" width="60" height="155" fill="#3b82f6" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="165" y="70" width="55" height="185" fill="#2563eb" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="225" y="120" width="60" height="135" fill="#60a5fa" stroke="#1e293b" stroke-width="3.5"/>
    <rect x="290" y="90" width="55" height="165" fill="#3b82f6" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Windows -->
    <g fill="#fde047">
      <rect x="52" y="165" width="12" height="14"/>
      <rect x="72" y="165" width="12" height="14"/>
      <rect x="52" y="190" width="12" height="14"/>
      <rect x="72" y="190" width="12" height="14"/>
      <rect x="115" y="115" width="12" height="14"/>
      <rect x="135" y="115" width="12" height="14"/>
      <rect x="115" y="145" width="12" height="14"/>
      <rect x="135" y="145" width="12" height="14"/>
      <rect x="115" y="175" width="12" height="14"/>
      <rect x="135" y="175" width="12" height="14"/>
      <rect x="178" y="90" width="12" height="14"/>
      <rect x="196" y="90" width="12" height="14"/>
      <rect x="178" y="120" width="12" height="14"/>
      <rect x="196" y="120" width="12" height="14"/>
      <rect x="178" y="150" width="12" height="14"/>
      <rect x="196" y="150" width="12" height="14"/>
      <rect x="240" y="135" width="12" height="14"/>
      <rect x="260" y="135" width="12" height="14"/>
      <rect x="240" y="165" width="12" height="14"/>
      <rect x="260" y="165" width="12" height="14"/>
      <rect x="303" y="110" width="12" height="14"/>
      <rect x="323" y="110" width="12" height="14"/>
      <rect x="303" y="140" width="12" height="14"/>
      <rect x="323" y="140" width="12" height="14"/>
    </g>
  </g>
</svg>
