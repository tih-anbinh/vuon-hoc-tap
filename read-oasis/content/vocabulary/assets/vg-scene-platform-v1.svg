<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-platform d-platform">
  <title id="t-platform">Platform</title>
  <desc id="d-platform">A raised station platform with a yellow safety line at its edge and a train stopped beside it, where people wait.</desc>
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="pf-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#pf-bg)"/>

  <!-- Train (right side, at the platform edge) -->
  <g filter="url(#pf-sh)" stroke="#0f172a" stroke-width="4">
    <rect x="250" y="96" width="138" height="120" rx="14" fill="#ef4444"/>
    <rect x="266" y="112" width="40" height="40" rx="6" fill="#bae6fd"/>
    <rect x="322" y="112" width="40" height="40" rx="6" fill="#bae6fd"/>
    <!-- open door -->
    <rect x="256" y="120" width="6" height="96" fill="#7f1d1d"/>
    <rect x="262" y="116" width="26" height="100" rx="4" fill="#0f172a" opacity="0.15"/>
    <line x1="250" y1="176" x2="388" y2="176" stroke="#fca5a5" stroke-width="3"/>
  </g>

  <!-- Raised platform slab (the target) -->
  <g filter="url(#pf-sh)" stroke="#0f172a" stroke-width="4">
    <path d="M20 232 L300 232 L300 268 L20 268 Z" fill="#cbd5e1"/>
    <!-- platform top face -->
    <path d="M20 232 L300 232 L300 222 L34 222 Z" fill="#e2e8f0"/>
    <!-- tiles -->
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="80" y1="232" x2="80" y2="268"/><line x1="140" y1="232" x2="140" y2="268"/>
      <line x1="200" y1="232" x2="200" y2="268"/><line x1="260" y1="232" x2="260" y2="268"/>
      <line x1="20" y1="250" x2="300" y2="250"/>
    </g>
    <!-- YELLOW SAFETY LINE at the edge -->
    <rect x="20" y="224" width="280" height="9" fill="#facc15"/>
  </g>

  <!-- A waiting child on the platform -->
  <g filter="url(#pf-sh)" stroke="#0f172a" stroke-width="4">
    <circle cx="120" cy="176" r="22" fill="#fcc79a"/>
    <path d="M96 172 C100 150 140 150 144 172 C134 158 106 158 96 172 Z" fill="#78350f"/>
    <circle cx="128" cy="176" r="3.5" fill="#0f172a"/>
    <path d="M120 186 Q128 192 136 186" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 200 Q120 192 140 200 L144 222 L96 222 Z" fill="#22c55e"/>
  </g>
  <!-- suitcase -->
  <g stroke="#0f172a" stroke-width="3">
    <rect x="150" y="198" width="30" height="24" rx="4" fill="#a855f7"/>
    <rect x="160" y="192" width="10" height="8" rx="2" fill="#7e22ce"/>
  </g>
</svg>
