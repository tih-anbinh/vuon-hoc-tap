<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-yellow desc-yellow">
  <title id="title-yellow">yellow</title>
  <desc id="desc-yellow">A collection of yellow things: a sun, a banana, and a yellow star.</desc>
  <rect width="400" height="300" rx="20" fill="#FFFDE7"/>
  <!-- Yellow sun -->
  <g transform="translate(100, 100)">
    <g stroke="#FBC02D" stroke-width="3" stroke-linecap="round" opacity="0.4">
      <line x1="0" y1="-45" x2="0" y2="-35"/>
      <line x1="0" y1="35" x2="0" y2="45"/>
      <line x1="-45" y1="0" x2="-35" y2="0"/>
      <line x1="35" y1="0" x2="45" y2="0"/>
      <line x1="-30" y1="-30" x2="-24" y2="-24"/>
      <line x1="24" y1="-24" x2="30" y2="-30"/>
      <line x1="-30" y1="30" x2="-24" y2="24"/>
      <line x1="24" y1="24" x2="30" y2="30"/>
    </g>
    <circle cx="0" cy="0" r="25" fill="#FDD835" stroke="#F9A825" stroke-width="2"/>
    <circle cx="-7" cy="-4" r="3" fill="#F57F17"/>
    <circle cx="7" cy="-4" r="3" fill="#F57F17"/>
    <path d="M-6,8 Q0,14 6,8" fill="none" stroke="#F57F17" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Yellow banana -->
  <g transform="translate(280, 110)">
    <path d="M-30,10 Q-35,-15 -15,-25 Q5,-32 25,-22 Q40,-12 35,5 Q32,12 28,10 Q20,-5 5,-15 Q-10,-18 -22,-8 Q-28,0 -25,10 Z" fill="#FDD835" stroke="#F9A825" stroke-width="2"/>
  </g>
  <!-- Yellow star -->
  <g transform="translate(200, 200)">
    <polygon points="0,-35 8,-12 32,-12 14,2 20,25 0,12 -20,25 -14,2 -32,-12 -8,-12" fill="#FDD835" stroke="#F9A825" stroke-width="2"/>
    <polygon points="0,-20 5,-8 18,-8 8,0 12,14 0,7 -12,14 -8,0 -18,-8 -5,-8" fill="#FFEE58" opacity="0.5"/>
  </g>
  <!-- Label -->
  <text x="200" y="270" font-family="sans-serif" font-size="32" font-weight="bold" fill="#F57F17" text-anchor="middle">yellow</text>
</svg>
