<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-yellow desc-yellow">
  <title id="title-yellow">Yellow</title>
  <desc id="desc-yellow">A wooden artist palette with a large dominant yellow paint blob and a brush loaded with yellow paint, teaching the colour yellow.</desc>
  <defs>
    <radialGradient id="yellow-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </radialGradient>
    <linearGradient id="yellow-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d08a"/>
      <stop offset="100%" stop-color="#c2740a"/>
    </linearGradient>
    <radialGradient id="yellow-blob" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#yellow-bg)"/>
  <ellipse cx="200" cy="272" rx="140" ry="18" fill="#0f172a" opacity="0.1"/>

  <g id="palette" filter="url(#soft-shadow)">
    <path d="M96 96 C160 60 260 60 316 104 C356 136 356 196 300 214 C280 220 268 206 250 210 C222 216 214 244 176 250 C120 258 66 224 62 168 C60 134 72 112 96 96 Z"
          fill="url(#yellow-wood)" stroke="#7c4a06" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="150" cy="210" rx="22" ry="16" fill="#d99a12" stroke="#7c4a06" stroke-width="4"/>
    <circle cx="130" cy="120" r="15" fill="#ef4444"/>
    <circle cx="190" cy="104" r="15" fill="#3b82f6"/>
    <circle cx="252" cy="112" r="15" fill="#22c55e"/>
    <circle cx="300" cy="160" r="14" fill="#a855f7"/>

    <!-- DOMINANT YELLOW BLOB -->
    <ellipse cx="200" cy="175" rx="70" ry="54" fill="url(#yellow-blob)" stroke="#a16207" stroke-width="4.5"/>
    <ellipse cx="182" cy="158" rx="22" ry="14" fill="#ffffff" opacity="0.45"/>
  </g>

  <g id="brush" filter="url(#soft-shadow)" transform="translate(300 210) rotate(38)">
    <rect x="-9" y="-150" width="18" height="120" rx="8" fill="#d97706" stroke="#92400e" stroke-width="3"/>
    <rect x="-11" y="-32" width="22" height="20" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <path d="M-11 -12 C-11 20 0 34 0 34 C0 34 11 20 11 -12 Z" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
  </g>
</svg>
