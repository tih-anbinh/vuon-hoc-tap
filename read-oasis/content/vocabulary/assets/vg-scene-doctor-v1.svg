<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-doctor desc-doctor">
  <title id="title-doctor">Doctor - Doctor with stethoscope helping a child</title>
  <desc id="desc-doctor">A kind doctor in a white coat using a stethoscope to listen to a child patient's chest, with a red cross sign and medical bag nearby.</desc>
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#dr-bg)"/>
  <rect x="0" y="250" width="400" height="50" fill="#93c5fd"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#1e40af" stroke-width="3.5"/>
  <ellipse cx="200" cy="264" rx="155" ry="12" fill="#0f172a" opacity="0.15"/>
  <!-- red cross sign -->
  <g filter="url(#soft-shadow)">
    <rect x="316" y="28" width="60" height="60" rx="10" fill="#ffffff" stroke="#7f1d1d" stroke-width="4"/>
    <rect x="338" y="40" width="16" height="36" rx="3" fill="#dc2626"/>
    <rect x="328" y="50" width="36" height="16" rx="3" fill="#dc2626"/>
  </g>
  <!-- THE DOCTOR (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- head -->
    <circle cx="150" cy="92" r="30" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M122,84 Q122,58 150,56 Q178,58 178,84 L172,88 Q150,70 128,88 Z" fill="#374151" stroke="#111827" stroke-width="3"/>
    <circle cx="140" cy="90" r="3.2" fill="#0f172a"/>
    <circle cx="160" cy="90" r="3.2" fill="#0f172a"/>
    <path d="M140,104 Q150,111 160,104" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="132" cy="98" rx="5.5" ry="4" fill="#fb7185" opacity="0.5"/>
    <ellipse cx="168" cy="98" rx="5.5" ry="4" fill="#fb7185" opacity="0.5"/>
    <!-- white coat -->
    <path d="M124,122 L176,122 L190,232 L110,232 Z" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
    <line x1="150" y1="124" x2="150" y2="230" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- shirt under coat -->
    <path d="M140,122 L160,122 L156,142 L144,142 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2.5"/>
    <circle cx="160" cy="158" r="3" fill="#475569"/>
    <circle cx="160" cy="180" r="3" fill="#475569"/>
    <!-- pocket with red cross -->
    <rect x="122" y="186" width="20" height="20" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <rect x="129" y="190" width="6" height="13" fill="#dc2626"/>
    <rect x="125" y="193" width="14" height="6" fill="#dc2626"/>
    <!-- stethoscope around neck -->
    <path d="M136,120 Q136,140 146,152" fill="none" stroke="#334155" stroke-width="4.5"/>
    <path d="M164,120 Q166,142 186,158 Q210,172 234,166" fill="none" stroke="#334155" stroke-width="4.5"/>
    <circle cx="146" cy="156" r="6" fill="#64748b" stroke="#1e293b" stroke-width="2.5"/>
    <!-- arm extending stethoscope chest piece to child -->
    <path d="M176,140 Q212,144 240,158" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="244" cy="160" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="256" cy="168" r="10" fill="#94a3b8" stroke="#1e293b" stroke-width="3.5"/>
    <circle cx="256" cy="168" r="4" fill="#e2e8f0"/>
    <!-- other arm -->
    <path d="M124,140 Q106,158 104,178" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="182" r="7" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <!-- legs -->
    <line x1="134" y1="232" x2="134" y2="254" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <line x1="166" y1="232" x2="166" y2="254" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="132" cy="260" rx="13" ry="6" fill="#334155"/>
    <ellipse cx="168" cy="260" rx="13" ry="6" fill="#334155"/>
  </g>
  <!-- child patient sitting on stool -->
  <g filter="url(#soft-shadow)">
    <!-- stool -->
    <rect x="240" y="226" width="72" height="12" rx="5" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <line x1="252" y1="238" x2="248" y2="260" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="238" x2="304" y2="260" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="276" cy="130" r="24" fill="#f5c19b" stroke="#78350f" stroke-width="3.5"/>
    <path d="M254,122 Q254,102 276,100 Q298,102 298,122 L292,126 Q276,110 260,126 Z" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="268" cy="128" r="3" fill="#0f172a"/>
    <circle cx="284" cy="128" r="3" fill="#0f172a"/>
    <path d="M268,140 Q276,145 284,140" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <!-- open shirt showing chest where stethoscope touches -->
    <path d="M258,154 L294,154 L300,226 L252,226 Z" fill="#fde047" stroke="#a16207" stroke-width="3.5"/>
    <!-- arms -->
    <path d="M260,162 Q246,174 246,190" fill="none" stroke="#f5c19b" stroke-width="8" stroke-linecap="round"/>
    <path d="M292,162 Q306,174 306,190" fill="none" stroke="#f5c19b" stroke-width="8" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="266" y1="226" x2="264" y2="250" stroke="#f5c19b" stroke-width="7" stroke-linecap="round"/>
    <line x1="288" y1="226" x2="290" y2="250" stroke="#f5c19b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="262" cy="256" rx="11" ry="5" fill="#dc2626"/>
    <ellipse cx="292" cy="256" rx="11" ry="5" fill="#dc2626"/>
  </g>
  <!-- medical bag -->
  <g filter="url(#soft-shadow)">
    <rect x="36" y="216" width="58" height="40" rx="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="3.5"/>
    <path d="M52,216 Q52,204 65,204 Q78,204 78,216" fill="none" stroke="#7f1d1d" stroke-width="4"/>
    <rect x="59" y="226" width="12" height="20" rx="2" fill="#ffffff"/>
    <rect x="55" y="232" width="20" height="8" rx="2" fill="#ffffff"/>
  </g>
</svg>
