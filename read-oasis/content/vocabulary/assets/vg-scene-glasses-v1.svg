<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-glasses desc-glasses">
  <title id="title-glasses">Glasses - Pair of eyeglasses</title>
  <desc id="desc-glasses">A pair of round eyeglasses with colourful frames, seen from the front.</desc>
  <defs>
    <linearGradient id="glass-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="80" y1="265" x2="320" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="90" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="glasses-figure" filter="url(#soft-shadow)">
    <!-- Left temple (arm) -->
    <path d="M60 130 L105 140" fill="none" stroke="url(#glass-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Right temple (arm) -->
    <path d="M340 130 L295 140" fill="none" stroke="url(#glass-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Bridge -->
    <path d="M175 145 Q200 135 225 145" fill="none" stroke="url(#glass-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Left lens frame -->
    <circle cx="140" cy="155" r="55" fill="none" stroke="url(#glass-frame)" stroke-width="9"/>
    <!-- Left lens -->
    <circle cx="140" cy="155" r="50" fill="#dbeafe" opacity="0.35"/>
    <!-- Left lens shine -->
    <path d="M115 130 Q125 120 140 125" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Right lens frame -->
    <circle cx="260" cy="155" r="55" fill="none" stroke="url(#glass-frame)" stroke-width="9"/>
    <!-- Right lens -->
    <circle cx="260" cy="155" r="50" fill="#dbeafe" opacity="0.35"/>
    <!-- Right lens shine -->
    <path d="M235 130 Q245 120 260 125" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Nose pads -->
    <ellipse cx="180" cy="165" rx="5" ry="8" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="220" cy="165" rx="5" ry="8" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Temple tips -->
    <path d="M60 130 Q55 135 55 145 Q55 155 60 160" fill="none" stroke="#5b21b6" stroke-width="6" stroke-linecap="round"/>
    <path d="M340 130 Q345 135 345 145 Q345 155 340 160" fill="none" stroke="#5b21b6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>