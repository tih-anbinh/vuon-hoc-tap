<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-funfair desc-funfair">
  <title id="title-funfair">Funfair - Ferris wheel and carousel at the fair</title>
  <desc id="desc-funfair">A colourful funfair with a big Ferris wheel, a striped carousel tent, balloons and bunting flags under a bright sky.</desc>
  <defs>
    <linearGradient id="ff-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#ff-sky)"/>
  <circle cx="48" cy="44" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <!-- grass -->
  <rect x="0" y="248" width="400" height="52" fill="#4ade80"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#15803d" stroke-width="3.5"/>
  <!-- bunting -->
  <g stroke="#831843" stroke-width="2.5">
    <path d="M0,26 Q200,52 400,26" fill="none"/>
    <path d="M50,32 L61,50 L72,34 Z" fill="#fde047"/>
    <path d="M120,39 L131,57 L142,41 Z" fill="#38bdf8"/>
    <path d="M196,42 L207,60 L218,42 Z" fill="#4ade80"/>
    <path d="M270,39 L281,57 L292,41 Z" fill="#a78bfa"/>
    <path d="M338,32 L349,50 L360,34 Z" fill="#fb923c"/>
  </g>
  <!-- FERRIS WHEEL (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- support legs -->
    <path d="M132,248 L200,148 L268,248" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <!-- wheel -->
    <circle cx="200" cy="148" r="88" fill="none" stroke="#ef4444" stroke-width="7"/>
    <circle cx="200" cy="148" r="10" fill="#fde047" stroke="#a16207" stroke-width="3.5"/>
    <!-- spokes -->
    <g stroke="#f87171" stroke-width="4">
      <line x1="200" y1="148" x2="200" y2="60"/>
      <line x1="200" y1="148" x2="262" y2="86"/>
      <line x1="200" y1="148" x2="288" y2="148"/>
      <line x1="200" y1="148" x2="262" y2="210"/>
      <line x1="200" y1="148" x2="200" y2="236"/>
      <line x1="200" y1="148" x2="138" y2="210"/>
      <line x1="200" y1="148" x2="112" y2="148"/>
      <line x1="200" y1="148" x2="138" y2="86"/>
    </g>
    <!-- gondola cabins -->
    <g stroke-width="3">
      <rect x="188" y="52" width="24" height="18" rx="6" fill="#38bdf8" stroke="#0c4a6e"/>
      <rect x="252" y="80" width="24" height="18" rx="6" fill="#4ade80" stroke="#14532d"/>
      <rect x="280" y="140" width="24" height="18" rx="6" fill="#f472b6" stroke="#831843"/>
      <rect x="252" y="202" width="24" height="18" rx="6" fill="#a78bfa" stroke="#4c1d95"/>
      <rect x="188" y="228" width="24" height="18" rx="6" fill="#fb923c" stroke="#7c2d12"/>
      <rect x="126" y="202" width="24" height="18" rx="6" fill="#fde047" stroke="#a16207"/>
      <rect x="96" y="140" width="24" height="18" rx="6" fill="#ef4444" stroke="#7f1d1d"/>
      <rect x="126" y="80" width="24" height="18" rx="6" fill="#22d3ee" stroke="#155e75"/>
    </g>
  </g>
  <!-- carousel tent -->
  <g filter="url(#soft-shadow)">
    <path d="M300,192 L352,148 L400,192 Z" fill="#ec4899" stroke="#831843" stroke-width="4"/>
    <g fill="#fdf2f8">
      <path d="M314,180 L328,158 L336,180 Z"/>
      <path d="M356,180 L370,160 L382,180 Z"/>
    </g>
    <rect x="306" y="192" width="90" height="56 " fill="#f9a8d4" stroke="#831843" stroke-width="4"/>
    <g stroke="#831843" stroke-width="3">
      <line x1="324" y1="192" x2="324" y2="248"/>
      <line x1="352" y1="192" x2="352" y2="248"/>
      <line x1="380" y1="192" x2="380" y2="248"/>
    </g>
    <circle cx="352" cy="142" r="6" fill="#fde047" stroke="#a16207" stroke-width="2.5"/>
    <!-- carousel horse silhouette -->
    <path d="M330,216 Q338,206 348,210 L354,218 Q360,214 362,220 L358,228 Q346,232 336,228 Z" fill="#ffffff" stroke="#831843" stroke-width="2.5"/>
    <line x1="346" y1="200" x2="346" y2="230" stroke="#831843" stroke-width="2.5"/>
  </g>
  <!-- balloons -->
  <g filter="url(#soft-shadow)">
    <circle cx="42" cy="150" r="15" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="66" cy="132" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="52" cy="112" r="15" fill="#fde047" stroke="#a16207" stroke-width="3"/>
    <g stroke="#475569" stroke-width="2" fill="none">
      <path d="M42,165 Q46,200 52,224"/>
      <path d="M66,147 Q60,196 52,224"/>
      <path d="M52,127 Q52,186 52,224"/>
    </g>
  </g>
  <!-- happy child holding balloons -->
  <g filter="url(#soft-shadow)">
    <circle cx="52" cy="238" r="14" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <path d="M40,232 Q40,222 52,222 Q64,222 64,232 L60,235 Q52,226 44,235 Z" fill="#451a03"/>
    <circle cx="47" cy="237" r="2" fill="#0f172a"/>
    <circle cx="57" cy="237" r="2" fill="#0f172a"/>
    <path d="M47,244 Q52,248 57,244" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M44,252 L60,252 L64,282 L40,282 Z" fill="#22d3ee" stroke="#155e75" stroke-width="3"/>
  </g>
</svg>
