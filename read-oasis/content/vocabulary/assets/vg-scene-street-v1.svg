<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-street desc-street">
  <title id="title-street">Street - Street with shops, cars and crossing</title>
  <desc id="desc-street">A town street with colorful shops, a road with a zebra crossing, a car driving by, a streetlamp, and a person walking on the pavement.</desc>
  <defs>
    <linearGradient id="sr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#sr-sky)"/>
  <circle cx="352" cy="42" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <!-- buildings row -->
  <g filter="url(#soft-shadow)">
    <!-- shop 1 -->
    <rect x="18" y="88" width="100" height="102" fill="#f472b6" stroke="#831843" stroke-width="4"/>
    <rect x="10" y="76" width="116" height="18" rx="5" fill="#be185d" stroke="#831843" stroke-width="3"/>
    <rect x="34" y="120" width="30" height="28" fill="#bae6fd" stroke="#831843" stroke-width="3"/>
    <rect x="76" y="120" width="30" height="28" fill="#bae6fd" stroke="#831843" stroke-width="3"/>
    <rect x="52" y="158" width="34" height="32" fill="#7f1d1d" stroke="#450a0a" stroke-width="3"/>
    <!-- shop 2 -->
    <rect x="130" y="70" width="110" height="120" fill="#fbbf24" stroke="#92400e" stroke-width="4"/>
    <path d="M122,70 L185,42 L248,70 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3.5"/>
    <rect x="146" y="94" width="32" height="30" fill="#bae6fd" stroke="#92400e" stroke-width="3"/>
    <rect x="192" y="94" width="32" height="30" fill="#bae6fd" stroke="#92400e" stroke-width="3"/>
    <!-- striped awning -->
    <path d="M138,142 L232,142 L240,160 L130,160 Z" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
    <path d="M148,142 L154,160 M170,142 L176,160 M192,142 L198,160 M214,142 L220,160" stroke="#dc2626" stroke-width="6"/>
    <rect x="166" y="160" width="38" height="30" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- shop 3 -->
    <rect x="252" y="95" width="130" height="95" fill="#60a5fa" stroke="#1e3a8a" stroke-width="4"/>
    <rect x="244" y="83" width="146" height="18" rx="5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="3"/>
    <rect x="268" y="118" width="34" height="30" fill="#fef9c3" stroke="#1e3a8a" stroke-width="3"/>
    <rect x="330" y="118" width="34" height="30" fill="#fef9c3" stroke="#1e3a8a" stroke-width="3"/>
    <rect x="298" y="158" width="36" height="32" fill="#1e3a8a" stroke="#172554" stroke-width="3"/>
  </g>
  <!-- pavement -->
  <rect x="0" y="190" width="400" height="22" fill="#d6d3d1"/>
  <line x1="0" y1="190" x2="400" y2="190" stroke="#78716c" stroke-width="3"/>
  <line x1="0" y1="212" x2="400" y2="212" stroke="#78716c" stroke-width="3"/>
  <!-- road -->
  <rect x="0" y="212" width="400" height="88" fill="#475569"/>
  <g stroke="#facc15" stroke-width="5" stroke-dasharray="24,18">
    <line x1="0" y1="258" x2="400" y2="258"/>
  </g>
  <!-- zebra crossing -->
  <g fill="#f8fafc">
    <rect x="292" y="216" width="18" height="82" transform="skewX(-8)"/>
    <rect x="322" y="216" width="18" height="82" transform="skewX(-8)"/>
    <rect x="352" y="216" width="18" height="82" transform="skewX(-8)"/>
  </g>
  <!-- car on road -->
  <g filter="url(#soft-shadow)">
    <path d="M60,252 Q64,234 84,232 L136,232 Q158,234 164,252 L170,252 Q178,254 178,264 L178,272 L52,272 L52,264 Q52,254 60,252 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
    <path d="M88,234 L92,218 L128,218 L134,234 Z" fill="#bae6fd" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="82" cy="274" r="13" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="82" cy="274" r="5" fill="#94a3b8"/>
    <circle cx="146" cy="274" r="13" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="146" cy="274" r="5" fill="#94a3b8"/>
  </g>
  <!-- streetlamp -->
  <g filter="url(#soft-shadow)">
    <line x1="230" y1="210" x2="230" y2="118" stroke="#334155" stroke-width="6"/>
    <path d="M230,118 Q230,104 246,104" fill="none" stroke="#334155" stroke-width="5"/>
    <circle cx="250" cy="106" r="9" fill="#fef08a" stroke="#a16207" stroke-width="3"/>
    <rect x="222" y="206" width="16" height="8" rx="2" fill="#334155"/>
  </g>
  <!-- person walking on pavement -->
  <g filter="url(#soft-shadow)">
    <circle cx="270" cy="176" r="10" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <path d="M260,172 Q265,163 276,166 L279,174 Q270,169 262,176 Z" fill="#451a03"/>
    <path d="M264,186 L276,186 L279,206 L261,206 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
    <line x1="265" y1="206" x2="261" y2="215" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="275" y1="206" x2="279" y2="215" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
