<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-pancake desc-pancake">
  <title id="title-pancake">Pancake - A stack of pancakes with syrup</title>
  <desc id="desc-pancake">A tall stack of golden pancakes on a plate with butter on top and sweet syrup dripping down the sides, with strawberries and a fork nearby.</desc>
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="pc-cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#pc-bg)"/>
  <!-- table -->
  <rect x="0" y="238" width="400" height="62" fill="#c2712a"/>
  <line x1="0" y1="238" x2="400" y2="238" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="200" cy="256" rx="165" ry="13" fill="#0f172a" opacity="0.18"/>
  <!-- plate -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="200" cy="234" rx="140" ry="26" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
    <ellipse cx="200" cy="230" rx="112" ry="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
  </g>
  <!-- PANCAKE STACK (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- pancake layers bottom to top -->
    <g stroke="#92400e" stroke-width="4">
      <ellipse cx="200" cy="216" rx="104" ry="22" fill="url(#pc-cake)"/>
      <ellipse cx="200" cy="196" rx="100" ry="21" fill="#f59e0b"/>
      <ellipse cx="200" cy="176" rx="96" ry="20" fill="url(#pc-cake)"/>
      <ellipse cx="200" cy="157" rx="92" ry="19" fill="#f59e0b"/>
      <ellipse cx="200" cy="139" rx="88" ry="18" fill="url(#pc-cake)"/>
    </g>
    <!-- syrup pouring over top -->
    <path d="M116,132 Q114,148 126,152 Q134,154 136,146 Q140,160 152,158
             Q158,176 172,168 Q178,182 192,176 Q200,190 214,178 Q226,188 236,176
             Q248,184 256,170 Q268,176 272,162 Q282,164 284,150 Q290,148 288,136
             Q244,116 200,118 Q152,118 116,132 Z"
          fill="#b45309" stroke="#78350f" stroke-width="3.5"/>
    <!-- syrup shine -->
    <path d="M150,132 Q200,122 262,132" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- butter cube on top -->
    <g transform="translate(200,112)">
      <path d="M-22,-4 L14,-10 L26,0 L-10,6 Z" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
      <path d="M-10,6 L26,0 L26,12 L-10,18 Z" fill="#fde047" stroke="#a16207" stroke-width="3"/>
      <path d="M-22,-4 L-10,6 L-10,18 L-22,8 Z" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    </g>
  </g>
  <!-- strawberries on plate -->
  <g filter="url(#soft-shadow)">
    <g transform="translate(86,224)">
      <path d="M0,-12 Q15,-10 13,5 Q10,17 0,21 Q-10,17 -13,5 Q-15,-10 0,-12 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
      <path d="M-8,-11 L0,-18 L8,-11 L3,-7 L0,-12 L-3,-7 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
      <g fill="#fde047">
        <circle cx="-4" cy="2" r="1.6"/>
        <circle cx="4" cy="6" r="1.6"/>
        <circle cx="0" cy="12" r="1.6"/>
      </g>
    </g>
    <g transform="translate(318,222) rotate(12)">
      <path d="M0,-11 Q14,-9 12,4 Q9,15 0,19 Q-9,15 -12,4 Q-14,-9 0,-11 Z" fill="#f87171" stroke="#7f1d1d" stroke-width="3"/>
      <path d="M-7,-10 L0,-16 L7,-10 L3,-6 L0,-11 L-3,-6 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
      <g fill="#fde047">
        <circle cx="-3" cy="2" r="1.5"/>
        <circle cx="4" cy="5" r="1.5"/>
      </g>
    </g>
  </g>
  <!-- fork -->
  <g filter="url(#soft-shadow)" transform="rotate(10 356 190)">
    <rect x="352" y="150" width="9" height="66" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    <g stroke="#475569" stroke-width="3.5" stroke-linecap="round">
      <line x1="348" y1="150" x2="348" y2="128"/>
      <line x1="356" y1="150" x2="356" y2="126"/>
      <line x1="364" y1="150" x2="364" y2="128"/>
    </g>
  </g>
  <!-- steam wafting -->
  <g stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M160,86 Q154,70 162,56 Q168,46 162,32"/>
    <path d="M240,86 Q234,70 242,56 Q248,46 242,32"/>
  </g>
  <!-- sparkles -->
  <g fill="#f59e0b" stroke="#a16207" stroke-width="2">
    <path d="M60,90 L64,100 L74,102 L66,109 L68,120 L60,114 L52,120 L54,109 L46,102 L56,100 Z"/>
    <path d="M340,72 L343,79 L350,80 L345,85 L346,93 L340,89 L334,93 L335,85 L330,80 L337,79 Z"/>
  </g>
</svg>
