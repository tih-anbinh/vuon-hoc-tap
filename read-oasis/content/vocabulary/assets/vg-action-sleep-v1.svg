<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sleep desc-sleep">
  <title id="title-sleep">Sleep - Child sleeping peacefully in bed</title>
  <desc id="desc-sleep">A child sleeping comfortably with eyes closed and head on a soft pillow under a warm blanket, showing sleeping action.</desc>
  <defs>
    <linearGradient id="blanket-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bed-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Bedroom Sleep Cues: Crescent Moon and Stars floating peacefully above -->
  <g id="sleep-cues" filter="url(#soft-shadow)">
    <!-- Crescent Moon -->
    <path d="M320 50 A 24 24 0 0 0 302 82 A 24 24 0 1 1 320 50 Z" fill="#fde047" stroke="#eab308" stroke-width="2.5"/>
    <!-- Sleepy gentle stars -->
    <polygon points="260,45 263,51 269,52 264,56 266,62 260,58 254,62 256,56 251,52 257,51" fill="#fde047"/>
    <polygon points="350,95 352,99 356,100 353,103 354,107 350,104 346,107 347,103 344,100 348,99" fill="#fde047"/>
    <polygon points="280,85 281,88 284,89 282,91 283,94 280,92 277,94 278,91 276,89 279,88" fill="#fde047"/>

    <!-- Gentle sleep breath bubbles floating up (pure vector graphics, zero text) -->
    <circle cx="210" cy="95" r="4" fill="#93c5fd" opacity="0.6"/>
    <circle cx="225" cy="78" r="6" fill="#93c5fd" opacity="0.6"/>
    <circle cx="245" cy="58" r="9" fill="#93c5fd" opacity="0.6"/>
  </g>

  <!-- BED FRAME (Anchor structure occupying 70% canvas) -->
  <!-- Headboard (Left) -->
  <rect x="50" y="100" width="18" height="155" rx="5" fill="url(#bed-wood)" stroke="#451a03" stroke-width="3.5"/>
  <circle cx="59" cy="95" r="9" fill="#d97706" stroke="#451a03" stroke-width="3"/>

  <!-- Footboard (Right) -->
  <rect x="330" y="160" width="18" height="95" rx="5" fill="url(#bed-wood)" stroke="#451a03" stroke-width="3.5"/>
  <circle cx="339" cy="155" r="9" fill="#d97706" stroke="#451a03" stroke-width="3"/>

  <!-- Bed Base Rail -->
  <rect x="55" y="225" width="285" height="16" rx="4" fill="url(#bed-wood)" stroke="#451a03" stroke-width="3.5"/>

  <!-- Fluffy White Pillow -->
  <rect x="75" y="145" width="90" height="45" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- SLEEPING CHILD (Head & Face resting on pillow) -->
  <g id="sleeping-child" filter="url(#soft-shadow)">
    <!-- Hair resting on pillow -->
    <circle cx="120" cy="155" r="32" fill="#78350f" stroke="#451a03" stroke-width="3"/>

    <!-- Face profile/3-quarter -->
    <circle cx="132" cy="160" r="26" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>

    <!-- Peaceful closed eye curves -->
    <path d="M136 158 Q144 165 150 158" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Gentle peaceful smile -->
    <path d="M142 172 Q148 178 152 172" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <circle cx="138" cy="168" r="6" fill="#fca5a5" opacity="0.6"/>

    <!-- Nightcap / hair tuft -->
    <path d="M115 140 C110 125 125 110 145 120" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- WARM BLANKET / DUVET (Foreground covering child's body) -->
  <g id="bed-blanket" filter="url(#soft-shadow)">
    <!-- Duvet Body -->
    <path d="M135 180 Q150 170 180 170 L340 170 L340 230 L75 230 L75 195 Q105 195 135 180 Z" fill="url(#blanket-blue)" stroke="#0284c7" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- White folded duvet top sheet fold -->
    <path d="M130 180 Q160 170 190 175 L190 190 Q160 185 130 195 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Blanket cute decorative stars/dots -->
    <circle cx="225" cy="205" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="265" cy="195" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="305" cy="205" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="245" cy="220" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="285" cy="218" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Child's hand resting peacefully on top of the blanket -->
    <circle cx="165" cy="190" r="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
  </g>
</svg>