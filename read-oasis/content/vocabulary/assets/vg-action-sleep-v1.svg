<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-sleep desc-sleep">
  <title id="title-sleep">sleep</title>
  <desc id="desc-sleep">A child sleeping peacefully in bed with eyes closed and Zzz floating above.</desc>
  <rect width="400" height="300" rx="20" fill="#1A237E" opacity="0.15"/>
  <rect width="400" height="300" rx="20" fill="#E8EAF6"/>
  <!-- Stars -->
  <g fill="#FDD835" opacity="0.4">
    <text x="60" y="50" font-family="sans-serif" font-size="16">★</text>
    <text x="320" y="40" font-family="sans-serif" font-size="12">★</text>
    <text x="280" y="70" font-family="sans-serif" font-size="18">★</text>
    <text x="100" y="80" font-family="sans-serif" font-size="10">★</text>
  </g>
  <!-- Bed -->
  <g transform="translate(80, 140)">
    <rect x="0" y="40" width="240" height="60" rx="8" fill="#BBDEFB" stroke="#64B5F6" stroke-width="2"/>
    <rect x="-5" y="100" width="250" height="14" rx="5" fill="#8D6E63" stroke="#795548" stroke-width="2"/>
    <!-- Headboard -->
    <rect x="-5" y="10" width="14" height="104" rx="5" fill="#A1887F" stroke="#795548" stroke-width="2"/>
    <!-- Footboard -->
    <rect x="231" y="50" width="14" height="64" rx="5" fill="#A1887F" stroke="#795548" stroke-width="2"/>
    <!-- Pillow -->
    <ellipse cx="50" cy="48" rx="36" ry="16" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
    <!-- Blanket -->
    <rect x="20" y="52" width="200" height="44" rx="6" fill="#90CAF9" stroke="#64B5F6" stroke-width="1.5"/>
  </g>
  <!-- Character sleeping -->
  <g transform="translate(160, 148)">
    <!-- Head on pillow -->
    <circle cx="0" cy="30" r="22" fill="#FFCC80" stroke="#F9A825" stroke-width="2"/>
    <!-- Hair -->
    <path d="M-16,14 Q-10,0 0,2 Q10,0 16,14" fill="#5D4037" stroke="#4E342E" stroke-width="1.5"/>
    <!-- Face — sleeping -->
    <path d="M-10,28 Q-7,31 -4,28" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <path d="M4,28 Q7,31 10,28" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <path d="M-3,36 Q0,38 3,36" fill="none" stroke="#4E342E" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Zzz -->
  <g fill="#5C6BC0" font-family="sans-serif" font-weight="bold">
    <text x="200" y="130" font-size="18" opacity="0.7">Z</text>
    <text x="218" y="115" font-size="14" opacity="0.5">z</text>
    <text x="230" y="105" font-size="11" opacity="0.35">z</text>
  </g>
</svg>
