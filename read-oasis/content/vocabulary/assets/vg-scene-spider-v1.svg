<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-spider desc-spider">
  <title id="title-spider">Spider - Cute round spider on a web</title>
  <desc id="desc-spider">A round black spider with eight legs hanging from a silk thread, with a partial web in the corner, friendly big eyes.</desc>
  <defs>
    <linearGradient id="spider-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Partial web in top-right corner -->
  <g opacity="0.25" stroke="#94a3b8" stroke-width="1.5" fill="none">
    <!-- Radial threads -->
    <line x1="380" y1="0" x2="300" y2="120"/>
    <line x1="400" y1="40" x2="280" y2="100"/>
    <line x1="400" y1="0" x2="260" y2="80"/>
    <line x1="340" y1="0" x2="310" y2="110"/>
    <!-- Spiral arcs -->
    <path d="M370 20 Q360 30 365 45"/>
    <path d="M350 40 Q335 55 345 75"/>
    <path d="M330 60 Q310 80 325 100"/>
    <path d="M310 80 Q290 95 305 115"/>
  </g>

  <!-- Silk thread from top -->
  <line x1="200" y1="0" x2="200" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Ground line -->
  <line x1="40" y1="265" x2="360" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="265" rx="60" ry="8" fill="#0f172a" opacity="0.1"/>

  <!-- SPIDER -->
  <g id="spider-figure" filter="url(#soft-shadow)">
    <!-- Eight Legs (4 per side, curved) -->
    <!-- Left legs -->
    <path d="M170 130 C140 110 110 100 90 115 C85 120 95 125 100 120 C115 108 140 115 168 132" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M165 145 C130 135 95 140 80 160 C78 168 88 168 90 162 C100 148 130 142 163 148" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M165 165 C130 170 100 185 90 205 C88 212 98 210 100 205 C108 190 132 178 163 170" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M170 180 C150 195 135 220 140 240 C142 248 150 244 148 238 C145 222 155 202 172 188" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Right legs -->
    <path d="M230 130 C260 110 290 100 310 115 C315 120 305 125 300 120 C285 108 260 115 232 132" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M235 145 C270 135 305 140 320 160 C322 168 312 168 310 162 C300 148 270 142 237 148" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M235 165 C270 170 300 185 310 205 C312 212 302 210 300 205 C292 190 268 178 237 170" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M230 180 C250 195 265 220 260 240 C258 248 250 244 252 238 C255 222 245 202 228 188" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Abdomen (large round) -->
    <ellipse cx="200" cy="175" rx="40" ry="38" fill="url(#spider-body)" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Abdomen pattern -->
    <circle cx="200" cy="168" r="8" fill="#475569" opacity="0.5"/>
    <circle cx="190" cy="182" r="5" fill="#475569" opacity="0.4"/>
    <circle cx="210" cy="182" r="5" fill="#475569" opacity="0.4"/>
    <circle cx="200" cy="195" r="4" fill="#475569" opacity="0.3"/>

    <!-- Cephalothorax (head) -->
    <circle cx="200" cy="120" r="30" fill="url(#spider-body)" stroke="#0f172a" stroke-width="3.5"/>

    <!-- Big friendly eyes -->
    <circle cx="186" cy="112" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="188" cy="114" r="7" fill="#1e293b"/>
    <circle cx="186" cy="110" r="3" fill="#ffffff"/>

    <circle cx="214" cy="112" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="216" cy="114" r="7" fill="#1e293b"/>
    <circle cx="214" cy="110" r="3" fill="#ffffff"/>

    <!-- Small chelicerae (mouth parts) -->
    <ellipse cx="195" cy="135" rx="4" ry="6" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="205" cy="135" rx="4" ry="6" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Cute smile -->
    <path d="M192 128 Q200 134 208 128" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Highlight on head -->
    <circle cx="192" cy="102" r="5" fill="#475569" opacity="0.4"/>
  </g>
</svg>