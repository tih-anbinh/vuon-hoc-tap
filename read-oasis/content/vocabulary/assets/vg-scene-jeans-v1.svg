<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-jeans desc-jeans">
  <title id="title-jeans">Jeans - Blue denim jeans</title>
  <desc id="desc-jeans">A pair of blue denim jeans with pockets, belt loops, and stitching details.</desc>
  <defs>
    <linearGradient id="jeans-denim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="80" y1="270" x2="320" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="85" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="jeans-figure" filter="url(#soft-shadow)">
    <!-- Left leg -->
    <path d="M130 30 L130 120 L115 265 L175 265 L185 120 L185 30" fill="url(#jeans-denim)" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Right leg -->
    <path d="M215 30 L215 120 L225 265 L285 265 L270 120 L270 30" fill="url(#jeans-denim)" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Crotch connection -->
    <path d="M185 30 L185 120 Q200 140 215 120 L215 30" fill="url(#jeans-denim)" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Waistband -->
    <rect x="125" y="25" width="150" height="20" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Belt loops -->
    <rect x="145" y="22" width="8" height="26" rx="2" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="196" y="22" width="8" height="26" rx="2" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="247" y="22" width="8" height="26" rx="2" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
    <!-- Fly -->
    <line x1="200" y1="45" x2="200" y2="100" stroke="#1e3a8a" stroke-width="2.5"/>
    <!-- Button -->
    <circle cx="200" cy="35" r="5" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <!-- Left front pocket -->
    <path d="M135 50 L135 85 Q150 95 170 85 L170 50" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Right front pocket -->
    <path d="M230 50 L230 85 Q245 95 265 85 L265 50" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Left back pocket (stitching) -->
    <rect x="135" y="55" width="35" height="30" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Knee creases -->
    <path d="M130 170 Q150 175 170 170" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4"/>
    <path d="M230 170 Q250 175 270 170" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4"/>
    <!-- Hem folds -->
    <rect x="113" y="258" width="64" height="8" rx="3" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="223" y="258" width="64" height="8" rx="3" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Side seam stitching -->
    <line x1="130" y1="50" x2="115" y2="260" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="270" y1="50" x2="285" y2="260" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
</svg>