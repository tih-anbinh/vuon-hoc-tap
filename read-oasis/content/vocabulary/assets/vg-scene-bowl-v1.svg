<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bowl desc-bowl">
  <title id="title-bowl">Bowl - Big bowl of soup with a spoon</title>
  <desc id="desc-bowl">A large red bowl full of steaming noodle soup with vegetables, a spoon resting beside it on a table mat.</desc>
  <defs>
    <linearGradient id="bw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <radialGradient id="bw-soup" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bw-bg)"/>
  <!-- table -->
  <rect x="0" y="230" width="400" height="70" fill="#d97706"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#92400e" stroke-width="4"/>
  <!-- place mat -->
  <ellipse cx="200" cy="248" rx="165" ry="30" fill="#67e8f9" stroke="#0e7490" stroke-width="4"/>
  <ellipse cx="200" cy="248" rx="140" ry="22" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="8,6"/>
  <!-- steam -->
  <g stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M150,96 Q140,74 152,54 Q162,38 154,20"/>
    <path d="M200,90 Q190,66 202,46 Q212,30 204,12"/>
    <path d="M250,96 Q240,74 252,54 Q262,38 254,20"/>
  </g>
  <!-- THE BOWL (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- bowl body -->
    <path d="M74,140 L326,140 Q322,206 266,228 L134,228 Q78,206 74,140 Z"
          fill="#dc2626" stroke="#7f1d1d" stroke-width="5"/>
    <!-- decorative band -->
    <path d="M86,166 Q200,186 314,166" fill="none" stroke="#fde047" stroke-width="7"/>
    <g fill="#fde047">
      <circle cx="130" cy="192" r="6"/>
      <circle cx="200" cy="200" r="6"/>
      <circle cx="270" cy="192" r="6"/>
    </g>
    <!-- foot -->
    <path d="M158,228 L242,228 L236,244 L164,244 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="4"/>
    <!-- soup surface -->
    <ellipse cx="200" cy="140" rx="126" ry="30" fill="url(#bw-soup)" stroke="#b45309" stroke-width="4"/>
    <!-- noodles -->
    <g stroke="#fef3c7" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M140,136 Q156,148 172,138 Q188,128 204,140"/>
      <path d="M200,146 Q220,134 240,144 Q256,152 272,142"/>
    </g>
    <!-- vegetables in soup -->
    <circle cx="150" cy="132" r="10" fill="#f97316" stroke="#7c2d12" stroke-width="2.5"/>
    <circle cx="252" cy="130" r="10" fill="#f97316" stroke="#7c2d12" stroke-width="2.5"/>
    <ellipse cx="200" cy="128" rx="13" ry="8" fill="#4ade80" stroke="#166534" stroke-width="2.5"/>
    <ellipse cx="292" cy="142" rx="10" ry="6" fill="#4ade80" stroke="#166534" stroke-width="2.5"/>
    <ellipse cx="112" cy="144" rx="10" ry="6" fill="#4ade80" stroke="#166534" stroke-width="2.5"/>
    <!-- egg half -->
    <ellipse cx="228" cy="146" rx="14" ry="9" fill="#fefce8" stroke="#a16207" stroke-width="2.5"/>
    <circle cx="228" cy="146" r="5" fill="#fbbf24"/>
  </g>
  <!-- spoon beside bowl -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="352" cy="216" rx="16" ry="24" fill="#e2e8f0" stroke="#475569" stroke-width="3.5"/>
    <rect x="346" y="118" width="12" height="80" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="3.5"/>
  </g>
  <!-- chopsticks resting on bowl -->
  <g stroke="#92400e" stroke-width="6" stroke-linecap="round">
    <line x1="86" y1="100" x2="182" y2="136"/>
    <line x1="94" y1="88" x2="190" y2="128"/>
  </g>
</svg>
