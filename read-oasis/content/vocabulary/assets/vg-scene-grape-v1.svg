<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-grape desc-grape">
  <title id="title-grape">Grape - Bunch of purple grapes</title>
  <desc id="desc-grape">A bunch of round purple grapes hanging from a green stem with a curly tendril and a green leaf.</desc>
  <defs>
    <linearGradient id="grape-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="60" y1="270" x2="340" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <g id="grape-figure" filter="url(#soft-shadow)">
    <!-- Stem -->
    <line x1="200" y1="30" x2="200" y2="80" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>

    <!-- Curly tendril -->
    <path d="M205 45 C220 40 230 50 225 60 C220 70 235 75 245 65" fill="none" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>

    <!-- Leaf -->
    <path d="M175 55 C150 35 120 40 115 60 C110 80 130 90 155 75 C145 85 140 100 155 95 C170 90 180 70 175 55 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2.5"/>
    <!-- Leaf veins -->
    <path d="M155 75 C145 65 135 60 125 60" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <path d="M155 75 C150 80 148 88 152 92" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Grape bunch (pyramid arrangement) -->
    <!-- Row 1 (top, 2 grapes) -->
    <circle cx="185" cy="95" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="182" cy="90" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="215" cy="95" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="212" cy="90" r="5" fill="#c084fc" opacity="0.5"/>

    <!-- Row 2 (3 grapes) -->
    <circle cx="170" cy="128" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="167" cy="123" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="200" cy="125" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="197" cy="120" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="230" cy="128" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="227" cy="123" r="5" fill="#c084fc" opacity="0.5"/>

    <!-- Row 3 (4 grapes) -->
    <circle cx="158" cy="162" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="155" cy="157" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="188" cy="158" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="185" cy="153" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="218" cy="158" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="215" cy="153" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="245" cy="162" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="242" cy="157" r="5" fill="#c084fc" opacity="0.5"/>

    <!-- Row 4 (3 grapes) -->
    <circle cx="172" cy="195" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="169" cy="190" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="202" cy="192" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="199" cy="187" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="232" cy="195" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="229" cy="190" r="5" fill="#c084fc" opacity="0.5"/>

    <!-- Row 5 (bottom, 2 grapes) -->
    <circle cx="188" cy="225" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="185" cy="220" r="5" fill="#c084fc" opacity="0.5"/>
    <circle cx="218" cy="225" r="18" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="215" cy="220" r="5" fill="#c084fc" opacity="0.5"/>

    <!-- Bottom tip (1 grape) -->
    <circle cx="203" cy="252" r="16" fill="url(#grape-purple)" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="200" cy="247" r="4" fill="#c084fc" opacity="0.5"/>
  </g>
</svg>