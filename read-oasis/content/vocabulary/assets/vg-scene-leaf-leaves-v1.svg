<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-leaf-leaves desc-leaf-leaves">
  <title id="title-leaf-leaves">Leaf and leaves - One leaf, many leaves</title>
  <desc id="desc-leaf-leaves">A split picture: on the left one big green leaf with veins, on the right many colourful autumn leaves falling from a branch.</desc>
  <defs>
    <linearGradient id="lf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="lf-one" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#lf-bg)"/>
  <!-- divider -->
  <line x1="200" y1="20" x2="200" y2="280" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10,8"/>
  <!-- LEFT: ONE LEAF -->
  <g filter="url(#soft-shadow)">
    <!-- single big leaf -->
    <path d="M100,52 Q160,96 152,168 Q146,216 100,236 Q54,216 48,168 Q40,96 100,52 Z"
          fill="url(#lf-one)" stroke="#14532d" stroke-width="5"/>
    <!-- center vein -->
    <path d="M100,60 L100,232" fill="none" stroke="#14532d" stroke-width="4" stroke-linecap="round"/>
    <!-- side veins -->
    <g stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M100,96 Q80,104 66,120"/>
      <path d="M100,96 Q120,104 134,120"/>
      <path d="M100,136 Q78,144 62,160"/>
      <path d="M100,136 Q122,144 138,160"/>
      <path d="M100,176 Q82,184 70,196"/>
      <path d="M100,176 Q118,184 130,196"/>
    </g>
    <!-- stem -->
    <path d="M100,236 Q98,254 92,266" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round"/>
    <!-- one dot marker -->
    <circle cx="100" cy="284" r="8" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  </g>
  <!-- RIGHT: MANY LEAVES falling from branch -->
  <g filter="url(#soft-shadow)">
    <!-- branch -->
    <path d="M216,36 Q290,28 384,44" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
    <path d="M300,38 Q314,50 318,62" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <!-- leaves on branch -->
    <g stroke-width="3">
      <path d="M244,34 Q262,16 278,26 Q270,44 248,44 Z" fill="#22c55e" stroke="#14532d"/>
      <path d="M334,40 Q352,22 368,32 Q360,50 338,50 Z" fill="#4ade80" stroke="#14532d"/>
    </g>
    <!-- falling leaves - varied colors and rotations -->
    <g stroke-width="3.5">
      <g transform="translate(240,96) rotate(-24)">
        <path d="M0,-20 Q16,-6 12,12 Q8,24 0,28 Q-8,24 -12,12 Q-16,-6 0,-20 Z" fill="#f97316" stroke="#7c2d12"/>
        <line x1="0" y1="-14" x2="0" y2="24" stroke="#7c2d12" stroke-width="2.5"/>
      </g>
      <g transform="translate(310,110) rotate(30)">
        <path d="M0,-20 Q16,-6 12,12 Q8,24 0,28 Q-8,24 -12,12 Q-16,-6 0,-20 Z" fill="#facc15" stroke="#a16207"/>
        <line x1="0" y1="-14" x2="0" y2="24" stroke="#a16207" stroke-width="2.5"/>
      </g>
      <g transform="translate(368,150) rotate(-40)">
        <path d="M0,-18 Q14,-5 11,11 Q7,21 0,25 Q-7,21 -11,11 Q-14,-5 0,-18 Z" fill="#dc2626" stroke="#7f1d1d"/>
        <line x1="0" y1="-12" x2="0" y2="21" stroke="#7f1d1d" stroke-width="2.5"/>
      </g>
      <g transform="translate(258,170) rotate(48)">
        <path d="M0,-18 Q14,-5 11,11 Q7,21 0,25 Q-7,21 -11,11 Q-14,-5 0,-18 Z" fill="#22c55e" stroke="#14532d"/>
        <line x1="0" y1="-12" x2="0" y2="21" stroke="#14532d" stroke-width="2.5"/>
      </g>
      <g transform="translate(324,196) rotate(-16)">
        <path d="M0,-18 Q14,-5 11,11 Q7,21 0,25 Q-7,21 -11,11 Q-14,-5 0,-18 Z" fill="#ea580c" stroke="#7c2d12"/>
        <line x1="0" y1="-12" x2="0" y2="21" stroke="#7c2d12" stroke-width="2.5"/>
      </g>
      <g transform="translate(232,232) rotate(20)">
        <path d="M0,-16 Q13,-4 10,10 Q6,19 0,22 Q-6,19 -10,10 Q-13,-4 0,-16 Z" fill="#fbbf24" stroke="#a16207"/>
        <line x1="0" y1="-11" x2="0" y2="19" stroke="#a16207" stroke-width="2.5"/>
      </g>
      <g transform="translate(374,236) rotate(36)">
        <path d="M0,-16 Q13,-4 10,10 Q6,19 0,22 Q-6,19 -10,10 Q-13,-4 0,-16 Z" fill="#84cc16" stroke="#3f6212"/>
        <line x1="0" y1="-11" x2="0" y2="19" stroke="#3f6212" stroke-width="2.5"/>
      </g>
      <g transform="translate(292,252) rotate(-30)">
        <path d="M0,-16 Q13,-4 10,10 Q6,19 0,22 Q-6,19 -10,10 Q-13,-4 0,-16 Z" fill="#ef4444" stroke="#7f1d1d"/>
        <line x1="0" y1="-11" x2="0" y2="19" stroke="#7f1d1d" stroke-width="2.5"/>
      </g>
    </g>
    <!-- drift lines -->
    <g stroke="#a3a3a3" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M270,130 Q276,140 270,150"/>
      <path d="M348,168 Q354,178 348,188"/>
    </g>
    <!-- many dots marker -->
    <g fill="#ea580c" stroke="#7c2d12" stroke-width="2.5">
      <circle cx="272" cy="284" r="7"/>
      <circle cx="296" cy="284" r="7"/>
      <circle cx="320" cy="284" r="7"/>
      <circle cx="344" cy="284" r="7"/>
    </g>
  </g>
</svg>
