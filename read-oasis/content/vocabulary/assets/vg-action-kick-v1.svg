<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-kick d-kick">
  <title id="t-kick">Kick</title>
  <desc id="d-kick">A child swinging one leg to strike a soccer ball that is flying away with a burst at the foot, showing kicking.</desc>
  <defs>
    <radialGradient id="kk-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#kk-bg)"/>
  <ellipse cx="200" cy="272" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Child kicking (leaning back, big swinging leg to the right) -->
  <g stroke="#0f172a" stroke-width="4">
    <!-- head -->
    <circle cx="116" cy="86" r="26" fill="#fcc79a"/>
    <path d="M90 82 C94 56 138 56 142 82 C132 66 100 66 90 82 Z" fill="#78350f"/>
    <circle cx="126" cy="86" r="4" fill="#0f172a" stroke="none"/>
    <path d="M120 98 Q128 104 136 98" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- torso leaning back -->
    <path d="M96 112 Q126 104 140 122 L128 178 Q104 182 90 168 Z" fill="#ef4444"/>
    <!-- back arm out for balance -->
    <path d="M104 128 Q72 120 56 138" fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <!-- front arm -->
    <path d="M132 132 Q160 128 168 150" fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
    <!-- planted leg -->
    <path d="M110 176 Q108 212 118 246" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round"/>
    <rect x="108" y="244" width="30" height="14" rx="6" fill="#0f172a" stroke="none"/>
    <!-- swinging kicking leg toward ball -->
    <path d="M122 172 Q180 176 236 196" fill="none" stroke="#1d4ed8" stroke-width="17" stroke-linecap="round"/>
    <ellipse cx="240" cy="198" rx="16" ry="10" fill="#0f172a" stroke="none" transform="rotate(18 240 198)"/>
  </g>

  <!-- Impact burst at the foot -->
  <path d="M256 190 l9 22 23 3 -18 15 6 23 -20 -13 -20 13 6 -23 -18 -15 23 -3 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>

  <!-- Flying soccer ball -->
  <g>
    <circle cx="316" cy="150" r="34" fill="#fff" stroke="#0f172a" stroke-width="4"/>
    <path d="M316 128 l14 10 -5 17 -18 0 -5 -17 Z" fill="#0f172a"/>
    <path d="M316 128 l0 -14 M330 138 l14 -6 M311 155 l-13 8 M321 155 l13 8 M298 138 l-13 -6" stroke="#0f172a" stroke-width="3"/>
    <!-- motion trail -->
    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="270" y1="176" x2="288" y2="164"/>
      <line x1="262" y1="158" x2="284" y2="150"/>
      <line x1="272" y1="140" x2="290" y2="138"/>
    </g>
  </g>
</svg>
