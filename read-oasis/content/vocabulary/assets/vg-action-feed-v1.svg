<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-feed d-feed">
  <title id="t-feed">Feed</title>
  <desc id="d-feed">A child holding out a bowl of food and a small cat leaning up to eat from it, showing feeding an animal.</desc>
  <defs>
    <radialGradient id="fd-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="fd-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#fd-bg)"/>
  <ellipse cx="200" cy="278" rx="150" ry="12" fill="#0f172a" opacity="0.12"/>

  <!-- Child (left) -->
  <g filter="url(#fd-sh)">
    <!-- head -->
    <circle cx="104" cy="108" r="34" fill="#fcc79a" stroke="#0f172a" stroke-width="4"/>
    <path d="M72 100 C76 70 132 70 136 100 C128 84 80 84 72 100 Z" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <circle cx="112" cy="108" r="4.5" fill="#0f172a"/>
    <path d="M104 122 Q114 129 122 122" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="118" r="6" fill="#fb7185" opacity="0.35"/>
    <!-- body -->
    <path d="M76 148 Q104 138 132 148 L142 240 Q104 250 70 240 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="4"/>
    <!-- arm reaching down to hold the bowl -->
    <path d="M130 168 Q176 178 198 210" fill="none" stroke="#3b82f6" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Bowl held out (center-low) -->
  <g filter="url(#fd-sh)" stroke="#0f172a" stroke-width="4">
    <path d="M180 212 Q220 206 260 212 Q252 236 220 238 Q188 236 180 212 Z" fill="#f59e0b"/>
    <ellipse cx="220" cy="212" rx="40" ry="9" fill="#fde68a" stroke="#0f172a" stroke-width="3"/>
    <circle cx="206" cy="210" r="4" fill="#a16207" stroke="none"/><circle cx="222" cy="212" r="4" fill="#a16207" stroke="none"/><circle cx="236" cy="210" r="4" fill="#a16207" stroke="none"/>
  </g>

  <!-- Cat (right) sitting, leaning to the bowl -->
  <g filter="url(#fd-sh)" stroke="#0f172a" stroke-width="4">
    <!-- sitting body -->
    <path d="M300 246 Q288 196 320 190 Q356 194 352 246 Z" fill="#fb923c"/>
    <!-- front legs -->
    <rect x="304" y="228" width="12" height="24" rx="6" fill="#fb923c"/>
    <rect x="336" y="228" width="12" height="24" rx="6" fill="#fb923c"/>
    <!-- tail curling round -->
    <path d="M350 244 Q384 240 380 210 Q372 228 352 226" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
    <!-- head leaning down to bowl -->
    <circle cx="290" cy="204" r="26" fill="#fb923c"/>
    <path d="M272 186 L266 166 L288 180 Z" fill="#fb923c"/>
    <path d="M308 186 L314 166 L292 180 Z" fill="#fb923c"/>
    <path d="M272 186 L268 172 L282 182 Z" fill="#fdba74" stroke="none"/>
    <path d="M308 186 L312 172 L298 182 Z" fill="#fdba74" stroke="none"/>
    <circle cx="283" cy="202" r="3.5" fill="#0f172a"/>
    <circle cx="297" cy="202" r="3.5" fill="#0f172a"/>
    <path d="M290 210 l-4 4 8 0 z" fill="#7c2d12" stroke="none"/>
    <path d="M283 216 Q290 222 297 216" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#0f172a" stroke-width="2" stroke-linecap="round">
      <line x1="278" y1="210" x2="258" y2="206"/><line x1="278" y1="214" x2="258" y2="216"/>
      <line x1="302" y1="210" x2="322" y2="206"/><line x1="302" y1="214" x2="322" y2="216"/>
    </g>
  </g>
  <!-- little food sparkle between bowl and cat -->
  <g fill="#65a30d"><circle cx="262" cy="204" r="3"/><circle cx="270" cy="214" r="2.5"/></g>
</svg>
