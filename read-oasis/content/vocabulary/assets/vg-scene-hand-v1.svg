<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hand desc-hand">
  <title id="title-hand">Hand</title>
  <desc id="desc-hand">A large open child's hand with five spread fingers waving, highlighted by a bright ring, occupying most of the frame.</desc>
  <defs>
    <radialGradient id="hand-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="hand-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#hand-bg)"/>
  <ellipse cx="200" cy="278" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="hand" filter="url(#soft-shadow)">
    <!-- Wrist / sleeve -->
    <rect x="168" y="238" width="64" height="44" rx="14" fill="#3b82f6" stroke="#1e40af" stroke-width="4"/>
    <!-- Palm -->
    <path d="M148 168
             C148 128 252 128 252 168
             L252 226
             C252 258 148 258 148 226 Z"
          fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Fingers (four) -->
    <rect x="150" y="96" width="24" height="86" rx="12" fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4"/>
    <rect x="180" y="80" width="24" height="102" rx="12" fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4"/>
    <rect x="210" y="88" width="24" height="96" rx="12" fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4"/>
    <rect x="240" y="104" width="22" height="82" rx="11" fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4"/>
    <!-- Thumb -->
    <path d="M148 190 C118 182 104 208 118 224 C132 238 150 226 152 210 Z" fill="url(#hand-skin)" stroke="#b5651d" stroke-width="4" stroke-linejoin="round"/>

    <!-- Palm crease highlights -->
    <path d="M170 200 Q200 214 230 200" fill="none" stroke="#d68a4f" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M178 216 Q200 226 222 216" fill="none" stroke="#d68a4f" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Waving motion arcs -->
  <path d="M280 120 Q300 150 288 182" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/>
  <path d="M120 120 Q100 150 112 182" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/>

  <!-- Highlight ring around the hand -->
  <ellipse cx="200" cy="180" rx="104" ry="108" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="12 8"/>
</svg>
