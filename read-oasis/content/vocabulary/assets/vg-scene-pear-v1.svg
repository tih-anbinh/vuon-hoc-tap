<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-pear desc-pear">
  <title id="title-pear">Pear - Green pear fruit</title>
  <desc id="desc-pear">A large green pear with a classic bell shape, a brown stem, and a small leaf on top.</desc>
  <defs>
    <linearGradient id="pear-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="60%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="80" y1="270" x2="320" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="60" ry="6" fill="#0f172a" opacity="0.1"/>

  <g id="pear-figure" filter="url(#soft-shadow)">
    <!-- Pear body (bell shape) -->
    <path d="M200 55 C175 65 155 85 150 110 C140 150 130 190 140 220 C150 250 175 265 200 265 C225 265 250 250 260 220 C270 190 260 150 250 110 C245 85 225 65 200 55 Z" fill="url(#pear-green)" stroke="#3f6212" stroke-width="3.5"/>

    <!-- Highlight -->
    <path d="M175 100 Q195 85 210 100" fill="none" stroke="#d9f99d" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- Blush (warm side) -->
    <ellipse cx="235" cy="180" rx="25" ry="40" fill="#fbbf24" opacity="0.15"/>

    <!-- Speckles -->
    <circle cx="175" cy="150" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="195" cy="170" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="215" cy="160" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="185" cy="200" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="210" cy="210" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="225" cy="190" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="170" cy="220" r="1.5" fill="#3f6212" opacity="0.3"/>
    <circle cx="200" cy="240" r="1.5" fill="#3f6212" opacity="0.3"/>

    <!-- Stem -->
    <path d="M200 58 C198 42 196 30 200 22" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 58 C198 42 196 30 200 22" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>

    <!-- Leaf -->
    <path d="M202 30 C215 15 235 12 240 20 C235 30 218 35 202 30 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M202 30 C218 20 232 16 238 20" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>