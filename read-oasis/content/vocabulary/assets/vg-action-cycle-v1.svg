<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-cycle d-cycle">
  <title id="t-cycle">Cycle</title>
  <desc id="d-cycle">A child pedalling a two-wheeled bicycle from the side, legs on the pedals and motion lines behind, showing cycling.</desc>
  <defs>
    <radialGradient id="cyc-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#cyc-bg)"/>
  <ellipse cx="205" cy="266" rx="150" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Motion lines -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="150" x2="80" y2="150"/>
    <line x1="24" y1="185" x2="86" y2="185"/>
    <line x1="34" y1="220" x2="78" y2="220"/>
  </g>

  <!-- Bicycle -->
  <g stroke="#0f172a" stroke-width="5" fill="none">
    <circle cx="130" cy="222" r="40" fill="#fff"/>
    <circle cx="290" cy="222" r="40" fill="#fff"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="130" y1="182" x2="130" y2="262"/><line x1="90" y1="222" x2="170" y2="222"/>
      <line x1="102" y1="194" x2="158" y2="250"/><line x1="158" y1="194" x2="102" y2="250"/>
      <line x1="290" y1="182" x2="290" y2="262"/><line x1="250" y1="222" x2="330" y2="222"/>
      <line x1="262" y1="194" x2="318" y2="250"/><line x1="318" y1="194" x2="262" y2="250"/>
    </g>
    <circle cx="130" cy="222" r="7" fill="#0f172a"/>
    <circle cx="290" cy="222" r="7" fill="#0f172a"/>
    <!-- frame -->
    <path d="M130 222 L205 222 L172 160 Z" stroke="#ef4444" stroke-width="6"/>
    <line x1="205" y1="222" x2="290" y2="222" stroke="#ef4444" stroke-width="6"/>
    <line x1="172" y1="160" x2="205" y2="222" stroke="#ef4444" stroke-width="6"/>
    <!-- seat post + saddle -->
    <line x1="172" y1="160" x2="172" y2="140" stroke="#ef4444" stroke-width="6"/>
    <path d="M156 138 Q172 130 190 140" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <!-- handlebar -->
    <line x1="290" y1="222" x2="272" y2="150" stroke="#ef4444" stroke-width="6"/>
    <path d="M256 148 L288 148" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <!-- pedal -->
    <circle cx="205" cy="222" r="6" fill="#0f172a"/>
    <line x1="205" y1="222" x2="222" y2="240" stroke="#0f172a" stroke-width="5"/>
    <rect x="216" y="238" width="18" height="7" rx="3" fill="#0f172a"/>
  </g>

  <!-- Child riding -->
  <g stroke="#0f172a" stroke-width="4">
    <!-- back leg to pedal -->
    <path d="M180 158 Q178 195 205 222" fill="none" stroke="#f59e0b" stroke-width="15" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M168 100 Q198 92 210 108 L200 162 Q178 168 162 158 Z" fill="#22c55e"/>
    <!-- head + helmet -->
    <circle cx="180" cy="82" r="24" fill="#fcc79a"/>
    <path d="M156 80 A24 24 0 0 1 204 80 L204 74 Q180 58 156 74 Z" fill="#ef4444"/>
    <circle cx="192" cy="82" r="4" fill="#0f172a" stroke="none"/>
    <path d="M190 94 Q198 100 205 94" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- front arm to handlebar -->
    <path d="M200 118 Q240 120 272 150" fill="none" stroke="#22c55e" stroke-width="13" stroke-linecap="round"/>
    <!-- front leg to pedal -->
    <path d="M195 160 Q212 200 205 222" fill="none" stroke="#f59e0b" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
