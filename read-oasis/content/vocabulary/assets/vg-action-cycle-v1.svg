<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-cycle desc-cycle">
  <title id="title-cycle">Cycle - Child riding a bicycle</title>
  <desc id="desc-cycle">A child wearing a safety helmet happily riding a bright bicycle, demonstrating the action of cycling.</desc>
  <defs>
    <linearGradient id="bike-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="20" y1="265" x2="380" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Wheel ground shadows -->
  <ellipse cx="110" cy="265" rx="35" ry="8" fill="#0f172a" opacity="0.2"/>
  <ellipse cx="290" cy="265" rx="35" ry="8" fill="#0f172a" opacity="0.2"/>

  <!-- Motion breeze streaks behind the bicycle -->
  <g id="bike-motion" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="30" y1="130" x2="65" y2="130"/>
    <line x1="20" y1="160" x2="55" y2="160" stroke-width="3"/>
    <line x1="35" y1="190" x2="70" y2="190"/>
  </g>

  <!-- BICYCLE WHEELS (Layer 1) -->
  <!-- Rear Wheel (Left) -->
  <g id="rear-wheel">
    <circle cx="110" cy="210" r="48" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle cx="110" cy="210" r="43" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="110" cy="210" r="8" fill="#475569"/>
    <!-- Spokes -->
    <line x1="110" y1="167" x2="110" y2="253" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="67" y1="210" x2="153" y2="210" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="180" x2="140" y2="240" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="80" y1="240" x2="140" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Front Wheel (Right) -->
  <g id="front-wheel">
    <circle cx="290" cy="210" r="48" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle cx="290" cy="210" r="43" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="290" cy="210" r="8" fill="#475569"/>
    <!-- Spokes -->
    <line x1="290" y1="167" x2="290" y2="253" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="247" y1="210" x2="333" y2="210" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="260" y1="180" x2="320" y2="240" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="260" y1="240" x2="320" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- BICYCLE FRAME (Layer 2) -->
  <g id="bike-frame-geom" filter="url(#soft-shadow)">
    <!-- Bottom bracket / Chain ring -->
    <circle cx="190" cy="210" r="16" fill="#64748b" stroke="#334155" stroke-width="3"/>

    <!-- Frame tubes -->
    <!-- Rear stays (Rear axle to saddle base, rear axle to chain ring) -->
    <line x1="110" y1="210" x2="175" y2="150" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>
    <line x1="110" y1="210" x2="190" y2="210" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat tube (Chain ring to saddle base) -->
    <line x1="190" y1="210" x2="175" y2="145" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Down tube (Chain ring to head tube) -->
    <line x1="190" y1="210" x2="265" y2="140" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Top tube (Saddle base to head tube) -->
    <line x1="175" y1="150" x2="265" y2="140" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>
    <!-- Front fork (Front axle to head tube and handlebars) -->
    <line x1="290" y1="210" x2="265" y2="120" stroke="url(#bike-frame)" stroke-width="8" stroke-linecap="round"/>

    <!-- Saddle Seat -->
    <path d="M150 142 Q175 138 200 145 Q175 148 150 142 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>

    <!-- Handlebars -->
    <path d="M260 120 L275 110 L260 105" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIDER (Layer 3) -->
  <g id="cyclist" filter="url(#soft-shadow)">
    <!-- Back Leg / Foot on pedal -->
    <path d="M175 140 L165 180 L185 200" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="188" cy="204" rx="12" ry="7" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>

    <!-- Torso leaning forward comfortably -->
    <path d="M175 140 L220 95 L245 105 L200 155 Z" fill="#ea580c" stroke="#c2410c" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Front Leg / Thigh pushing down -->
    <path d="M190 145 L205 185 L200 220" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="204" cy="225" rx="14" ry="7" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>

    <!-- Arms reaching to handlebars -->
    <path d="M235 100 L260 112 L270 110" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="270" cy="110" r="7" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Head & Safety Helmet -->
    <circle cx="230" cy="65" r="24" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>

    <!-- Bike Helmet (Bright Yellow for child visibility) -->
    <path d="M208 62 C208 40 252 40 254 62 Q230 54 208 62 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <!-- Helmet strap -->
    <path d="M218 64 L225 82 L238 64" fill="none" stroke="#475569" stroke-width="2"/>

    <!-- Cheerful Cyclist Face looking ahead -->
    <circle cx="242" cy="66" r="4" fill="#1e293b"/>
    <circle cx="240" cy="64" r="1.5" fill="#ffffff"/>
    <path d="M238 58 Q244 56 248 59" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="236" cy="74" r="5" fill="#fca5a5" opacity="0.6"/>
    <!-- Happy smile -->
    <path d="M242 74 Q248 78 244 82" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>