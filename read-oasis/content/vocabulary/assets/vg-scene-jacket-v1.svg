<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-jacket desc-jacket">
  <title id="title-jacket">Jacket - Warm jacket</title>
  <desc id="desc-jacket">A warm green jacket with a zipper, two pockets, and a collar, displayed flat.</desc>
  <defs>
    <linearGradient id="jacket-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="60" y1="270" x2="340" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="270" rx="100" ry="7" fill="#0f172a" opacity="0.1"/>
  <g id="jacket-figure" filter="url(#soft-shadow)">
    <!-- Body -->
    <path d="M130 70 L120 260 Q200 270 280 260 L270 70 Q200 80 130 70 Z" fill="url(#jacket-green)" stroke="#15803d" stroke-width="3.5"/>
    <!-- Left sleeve -->
    <path d="M130 70 L80 85 L65 200 L100 205 L110 100 L130 90" fill="url(#jacket-green)" stroke="#15803d" stroke-width="3"/>
    <!-- Right sleeve -->
    <path d="M270 70 L320 85 L335 200 L300 205 L290 100 L270 90" fill="url(#jacket-green)" stroke="#15803d" stroke-width="3"/>
    <!-- Collar left -->
    <path d="M155 70 L145 45 L175 55 L185 75" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
    <!-- Collar right -->
    <path d="M245 70 L255 45 L225 55 L215 75" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
    <!-- Zipper line -->
    <line x1="200" y1="75" x2="200" y2="260" stroke="#fbbf24" stroke-width="4"/>
    <!-- Zipper teeth -->
    <line x1="196" y1="90" x2="200" y2="95" stroke="#d97706" stroke-width="2"/>
    <line x1="204" y1="95" x2="200" y2="100" stroke="#d97706" stroke-width="2"/>
    <line x1="196" y1="105" x2="200" y2="110" stroke="#d97706" stroke-width="2"/>
    <line x1="204" y1="110" x2="200" y2="115" stroke="#d97706" stroke-width="2"/>
    <line x1="196" y1="120" x2="200" y2="125" stroke="#d97706" stroke-width="2"/>
    <line x1="204" y1="125" x2="200" y2="130" stroke="#d97706" stroke-width="2"/>
    <!-- Zipper pull -->
    <rect x="196" y="80" width="8" height="12" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- Left pocket -->
    <path d="M140 160 L140 210 Q160 215 180 210 L180 160 Z" fill="#15803d" stroke="#166534" stroke-width="2.5"/>
    <line x1="140" y1="160" x2="180" y2="160" stroke="#166534" stroke-width="3"/>
    <!-- Right pocket -->
    <path d="M220 160 L220 210 Q240 215 260 210 L260 160 Z" fill="#15803d" stroke="#166534" stroke-width="2.5"/>
    <line x1="220" y1="160" x2="260" y2="160" stroke="#166534" stroke-width="3"/>
    <!-- Sleeve cuffs -->
    <rect x="62" y="195" width="42" height="12" rx="5" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <rect x="296" y="195" width="42" height="12" rx="5" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <!-- Bottom hem -->
    <rect x="120" y="255" width="160" height="10" rx="4" fill="#15803d" stroke="#166534" stroke-width="2"/>
  </g>
</svg>