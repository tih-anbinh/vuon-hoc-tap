<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-butterfly desc-butterfly">
  <title id="title-butterfly">Butterfly</title>
  <desc id="desc-butterfly">A colourful butterfly with big patterned wings, a thin body, and curly antennae.</desc>
  <defs>
    <linearGradient id="butterfly-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="butterfly-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#butterfly-bg)"/>
  <ellipse cx="200" cy="270" rx="110" ry="14" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Left wings -->
    <path d="M195 150 C120 70 60 90 70 140 C55 170 90 200 150 185 Z" fill="url(#butterfly-wing)" stroke="#1e293b" stroke-width="4"/>
    <path d="M195 155 C140 200 90 215 95 245 C130 270 175 220 195 190 Z" fill="#8b5cf6" stroke="#1e293b" stroke-width="4"/>
    <!-- Right wings (mirror) -->
    <path d="M205 150 C280 70 340 90 330 140 C345 170 310 200 250 185 Z" fill="url(#butterfly-wing)" stroke="#1e293b" stroke-width="4"/>
    <path d="M205 155 C260 200 310 215 305 245 C270 270 225 220 205 190 Z" fill="#8b5cf6" stroke="#1e293b" stroke-width="4"/>
    <!-- Wing spots -->
    <g fill="#fde047" stroke="#1e293b" stroke-width="2">
      <circle cx="120" cy="130" r="14"/>
      <circle cx="280" cy="130" r="14"/>
      <circle cx="140" cy="220" r="10"/>
      <circle cx="260" cy="220" r="10"/>
    </g>
    <!-- Body -->
    <ellipse cx="200" cy="170" rx="12" ry="52" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <circle cx="200" cy="120" r="15" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <!-- Antennae -->
    <path d="M193 108 Q180 85 165 82" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M207 108 Q220 85 235 82" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="163" cy="80" r="5" fill="#1f2937"/>
    <circle cx="237" cy="80" r="5" fill="#1f2937"/>
    <!-- Eyes -->
    <circle cx="194" cy="118" r="3" fill="#ffffff"/>
    <circle cx="206" cy="118" r="3" fill="#ffffff"/>
  </g>
</svg>
