<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-face desc-face">
  <title id="title-face">Face - Child's smiling face</title>
  <desc id="desc-face">A large, friendly child's face showing eyes, eyebrows, nose, mouth, ears, and rosy cheeks in a front view.</desc>
  <defs>
    <linearGradient id="face-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="face-figure" filter="url(#soft-shadow)">
    <!-- Face (large circle) -->
    <circle cx="200" cy="150" r="110" fill="url(#face-skin)" stroke="#d4a574" stroke-width="3.5"/>

    <!-- Hair -->
    <path d="M90 120 C95 60 140 20 200 20 C260 20 305 60 310 120 C315 80 280 30 200 25 C120 30 85 80 90 120 Z" fill="#451a03" stroke="#27150a" stroke-width="2.5"/>
    <!-- Hair bangs -->
    <path d="M130 75 C140 60 160 50 180 55" fill="none" stroke="#451a03" stroke-width="8" stroke-linecap="round"/>
    <path d="M155 65 C170 52 195 48 215 55" fill="none" stroke="#5c3310" stroke-width="6" stroke-linecap="round"/>

    <!-- Ears -->
    <ellipse cx="92" cy="155" rx="16" ry="22" fill="url(#face-skin)" stroke="#d4a574" stroke-width="2.5"/>
    <ellipse cx="92" cy="155" rx="8" ry="14" fill="#f5d0a9" stroke="#e0b88a" stroke-width="1.5"/>

    <ellipse cx="308" cy="155" rx="16" ry="22" fill="url(#face-skin)" stroke="#d4a574" stroke-width="2.5"/>
    <ellipse cx="308" cy="155" rx="8" ry="14" fill="#f5d0a9" stroke="#e0b88a" stroke-width="1.5"/>

    <!-- Eyebrows -->
    <path d="M148 110 Q168 100 188 110" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
    <path d="M212 110 Q232 100 252 110" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="170" cy="135" rx="16" ry="18" fill="#ffffff" stroke="#78716c" stroke-width="2.5"/>
    <circle cx="172" cy="138" r="10" fill="#78350f"/>
    <circle cx="170" cy="134" r="4" fill="#ffffff"/>

    <ellipse cx="230" cy="135" rx="16" ry="18" fill="#ffffff" stroke="#78716c" stroke-width="2.5"/>
    <circle cx="232" cy="138" r="10" fill="#78350f"/>
    <circle cx="230" cy="134" r="4" fill="#ffffff"/>

    <!-- Eyelashes -->
    <line x1="155" y1="122" x2="152" y2="116" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <line x1="163" y1="119" x2="160" y2="113" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <line x1="245" y1="122" x2="248" y2="116" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <line x1="237" y1="119" x2="240" y2="113" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M195 155 Q200 168 205 155" fill="none" stroke="#d4a574" stroke-width="3" stroke-linecap="round"/>

    <!-- Mouth (big smile) -->
    <path d="M170 185 Q200 210 230 185" fill="#ffffff" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower lip -->
    <path d="M175 190 Q200 205 225 190" fill="#fca5a5" stroke="none"/>

    <!-- Cheek blush -->
    <ellipse cx="145" cy="175" rx="15" ry="10" fill="#fca5a5" opacity="0.35"/>
    <ellipse cx="255" cy="175" rx="15" ry="10" fill="#fca5a5" opacity="0.35"/>

    <!-- Freckles -->
    <circle cx="155" cy="165" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="162" cy="170" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="148" cy="172" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="245" cy="165" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="238" cy="170" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="252" cy="172" r="2" fill="#d4a574" opacity="0.4"/>
  </g>
</svg>