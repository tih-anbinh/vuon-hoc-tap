<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ground desc-ground">
  <title id="title-ground">Ground</title>
  <desc id="desc-ground">A cross-section of the ground showing grass on top, brown soil, and rocks and roots below.</desc>
  <defs>
    <linearGradient id="ground-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="ground-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="110" fill="url(#ground-sky)"/>
  <circle cx="340" cy="45" r="24" fill="#fde047"/>

  <!-- Grass top -->
  <rect x="0" y="100" width="400" height="30" fill="#4ade80"/>
  <path d="M0 100 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 L400 130 L0 130 Z" fill="#22c55e"/>

  <!-- Soil -->
  <rect x="0" y="128" width="400" height="172" fill="url(#ground-soil)"/>

  <g filter="url(#soft-shadow)">
    <!-- Roots -->
    <path d="M80 130 Q85 170 70 200 M80 160 Q100 175 110 205 M80 150 Q60 170 50 195" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
    <!-- Rocks -->
    <ellipse cx="180" cy="200" rx="34" ry="24" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <ellipse cx="300" cy="230" rx="40" ry="26" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <ellipse cx="120" cy="250" rx="28" ry="18" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
    <!-- Worm -->
    <path d="M240 160 q12 -10 24 0 q12 10 24 0" fill="none" stroke="#fb7185" stroke-width="9" stroke-linecap="round"/>
    <!-- Soil dots -->
    <g fill="#92400e">
      <circle cx="60" cy="230" r="4"/>
      <circle cx="220" cy="255" r="4"/>
      <circle cx="350" cy="180" r="4"/>
      <circle cx="150" cy="150" r="4"/>
    </g>
  </g>
</svg>
