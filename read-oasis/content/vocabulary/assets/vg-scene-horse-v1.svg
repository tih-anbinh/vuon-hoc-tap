<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-horse desc-horse">
  <title id="title-horse">Horse - Majestic chestnut horse</title>
  <desc id="desc-horse">A proud chestnut brown horse with flowing dark mane and tail, alert ears, and sturdy black hooves, standing proudly in the center.</desc>
  <defs>
    <linearGradient id="horse-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadow -->
  <ellipse cx="205" cy="265" rx="115" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: HORSE (Occupying 70% canvas) -->
  <g id="horse-figure" filter="url(#soft-shadow)">
    <!-- Long Flowing Tail -->
    <path d="M100 155 C70 170 50 205 65 245 C75 230 85 200 105 180 Z" fill="#451a03" stroke="#291205" stroke-width="3" stroke-linejoin="round"/>
    <path d="M85 180 C65 200 55 225 70 248" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Slender Athletic Legs with Hooves -->
    <!-- Rear Left Leg -->
    <rect x="110" y="165" width="18" height="92" rx="6" fill="url(#horse-coat)" stroke="#451a03" stroke-width="3.5"/>
    <rect x="110" y="247" width="18" height="13" rx="2" fill="#1e293b"/>

    <!-- Rear Right Leg -->
    <rect x="140" y="160" width="16" height="97" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3.5"/>
    <rect x="140" y="247" width="16" height="13" rx="2" fill="#1e293b"/>

    <!-- Front Left Leg -->
    <rect x="245" y="160" width="16" height="97" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3.5"/>
    <rect x="245" y="247" width="16" height="13" rx="2" fill="#1e293b"/>

    <!-- Front Right Leg -->
    <rect x="270" y="165" width="18" height="92" rx="6" fill="url(#horse-coat)" stroke="#451a03" stroke-width="3.5"/>
    <rect x="270" y="247" width="18" height="13" rx="2" fill="#1e293b"/>

    <!-- Horse Body (Sleek, muscular torso) -->
    <rect x="95" y="125" width="185" height="75" rx="35" fill="url(#horse-coat)" stroke="#451a03" stroke-width="4"/>

    <!-- Arched Strong Neck -->
    <path d="M230 145 L275 80 L310 95 L275 160 Z" fill="url(#horse-coat)" stroke="#451a03" stroke-width="3.5"/>

    <!-- Flowing Dark Mane along the Neck -->
    <path d="M235 140 C240 120 250 100 270 75 C260 85 255 105 250 125 C245 135 240 145 235 140 Z" fill="#451a03"/>
    <path d="M250 120 C258 105 268 90 282 70 C272 82 268 98 262 115 Z" fill="#291205"/>

    <!-- Horse Head -->
    <ellipse cx="315" cy="85" rx="30" ry="22" fill="url(#horse-coat)" stroke="#451a03" stroke-width="3.5" transform="rotate(35 315 85)"/>

    <!-- Horse Muzzle / Snout -->
    <ellipse cx="342" cy="105" rx="16" ry="14" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <ellipse cx="346" cy="103" rx="3" ry="4" fill="#451a03"/>
    <path d="M336 112 Q344 116 350 112" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Alert Pointed Ears -->
    <polygon points="280,68 288,42 296,65" fill="url(#horse-coat)" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="284,65 288,48 292,64" fill="#fbcfe8"/>
    <polygon points="295,70 305,45 311,68" fill="url(#horse-coat)" stroke="#451a03" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Forelock (hair between ears) -->
    <path d="M298 62 C305 60 315 65 312 75 C308 72 302 68 298 62 Z" fill="#451a03"/>

    <!-- Friendly Eye with White Star Marking on Forehead -->
    <polygon points="310,72 313,77 318,77 314,80 316,85 311,82 306,85 308,80 304,77 309,77" fill="#ffffff" opacity="0.9"/>
    <circle cx="312" cy="88" r="5.5" fill="#1e293b"/>
    <circle cx="310" cy="86" r="1.8" fill="#ffffff"/>
  </g>
</svg>