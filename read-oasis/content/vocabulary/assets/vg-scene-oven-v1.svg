<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-oven desc-oven">
  <title id="title-oven">Oven</title>
  <desc id="desc-oven">A kitchen oven with a glowing warm door window, control knobs, and a handle.</desc>
  <defs>
    <linearGradient id="oven-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="oven-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="oven-glow" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#oven-bg)"/>
  <ellipse cx="200" cy="272" rx="130" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <rect x="100" y="60" width="200" height="210" rx="12" fill="url(#oven-body)" stroke="#475569" stroke-width="4"/>
    <!-- Control panel -->
    <rect x="100" y="60" width="200" height="46" rx="12" fill="#64748b" stroke="#475569" stroke-width="3"/>
    <circle cx="130" cy="83" r="12" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="130" y1="83" x2="130" y2="73" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="270" cy="83" r="12" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="270" y1="83" x2="277" y2="76" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <rect x="165" y="76" width="70" height="14" rx="4" fill="#22c55e"/>

    <!-- Handle -->
    <rect x="120" y="120" width="160" height="12" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Door window (glowing) -->
    <rect x="125" y="150" width="150" height="100" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <rect x="140" y="165" width="120" height="70" rx="4" fill="url(#oven-glow)"/>
    <!-- Rack line -->
    <line x1="150" y1="205" x2="250" y2="205" stroke="#78350f" stroke-width="3"/>
    <!-- Tray with food -->
    <rect x="165" y="200" width="70" height="8" rx="2" fill="#57534e"/>
    <circle cx="182" cy="196" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="205" cy="196" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="228" cy="196" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>
</svg>
