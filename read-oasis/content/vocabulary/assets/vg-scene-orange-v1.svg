<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-orange desc-orange">
  <title id="title-orange">Orange - Round orange fruit</title>
  <desc id="desc-orange">A bright round orange fruit with a dimpled skin, a small green stem, and a leaf, with a cut wedge beside it.</desc>
  <defs>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="60" y1="260" x2="340" y2="260" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="195" cy="260" rx="85" ry="8" fill="#0f172a" opacity="0.1"/>

  <g id="orange-figure" filter="url(#soft-shadow)">
    <!-- Cut wedge (behind, to the right) -->
    <path d="M290 200 L330 140 L340 210 Z" fill="#fdba74" stroke="#ea580c" stroke-width="2.5"/>
    <path d="M295 198 L328 148 L335 205 Z" fill="#fed7aa"/>
    <!-- Wedge segments -->
    <line x1="310" y1="165" x2="315" y2="200" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>
    <line x1="320" y1="155" x2="325" y2="198" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>
    <!-- Rind on wedge -->
    <path d="M290 200 L340 210" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>

    <!-- Whole orange (foreground) -->
    <circle cx="175" cy="170" r="70" fill="url(#orange-grad)" stroke="#c2410c" stroke-width="3.5"/>

    <!-- Highlight -->
    <path d="M140 130 Q175 112 210 130" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- Dimpled texture -->
    <circle cx="145" cy="155" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="165" cy="145" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="185" cy="150" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="155" cy="175" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="180" cy="170" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="200" cy="160" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="170" cy="195" r="2" fill="#c2410c" opacity="0.15"/>
    <circle cx="195" cy="185" r="2" fill="#c2410c" opacity="0.15"/>

    <!-- Navel (bottom) -->
    <circle cx="175" cy="235" r="5" fill="#c2410c" opacity="0.3"/>

    <!-- Stem -->
    <rect x="172" y="96" width="6" height="10" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>

    <!-- Leaf -->
    <path d="M178 100 C195 85 215 82 220 90 C215 100 198 105 178 100 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M178 100 C198 90 212 86 218 90" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>