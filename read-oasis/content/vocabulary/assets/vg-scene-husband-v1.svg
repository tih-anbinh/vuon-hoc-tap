<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-husband desc-husband">
  <title id="title-husband">Husband</title>
  <desc id="desc-husband">A smiling man wearing a shirt and a wedding ring on his hand, with a small heart symbol.</desc>
  <defs>
    <linearGradient id="husband-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="husband-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#husband-bg)"/>
  <ellipse cx="200" cy="278" rx="110" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Body/shirt -->
    <path d="M130 200 Q200 182 270 200 L262 285 L138 285 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="3.5"/>
    <!-- Collar -->
    <path d="M180 195 L200 218 L220 195 L210 188 L200 200 L190 188 Z" fill="#f8fafc"/>
    <!-- Neck -->
    <rect x="185" y="165" width="30" height="30" fill="url(#husband-skin)" stroke="#d4a574" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="200" cy="130" r="48" fill="url(#husband-skin)" stroke="#d4a574" stroke-width="3.5"/>
    <!-- Short hair -->
    <path d="M154 122 Q152 82 200 82 Q248 82 246 122 Q230 100 200 100 Q170 100 154 122 Z" fill="#3d2109" stroke="#27150a" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="185" cy="128" r="4.5" fill="#1e293b"/>
    <circle cx="215" cy="128" r="4.5" fill="#1e293b"/>
    <!-- Eyebrows -->
    <path d="M176 118 l16 3 M224 118 l-16 3" stroke="#3d2109" stroke-width="3" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M182 148 Q200 162 218 148" fill="none" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Small mustache -->
    <path d="M188 143 Q200 149 212 143" fill="none" stroke="#3d2109" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arm with ring hand -->
    <path d="M262 205 Q290 235 262 258" fill="none" stroke="url(#husband-skin)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="262" cy="260" r="16" fill="url(#husband-skin)" stroke="#d4a574" stroke-width="3"/>
    <!-- Wedding ring -->
    <circle cx="250" cy="254" r="6" fill="none" stroke="#facc15" stroke-width="3"/>
  </g>

  <!-- Heart -->
  <path d="M310 90 c-8 -12 -26 -4 -26 8 c0 12 16 20 26 30 c10 -10 26 -18 26 -30 c0 -12 -18 -20 -26 -8 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
</svg>
