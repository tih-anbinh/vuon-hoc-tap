<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-under desc-under">
  <title id="title-under">under</title>
  <desc id="desc-under">A cat sleeping under a table. The cat is below the table top.</desc>
  <!-- Background: soft room -->
  <rect width="400" height="300" rx="20" fill="#FFF8F0"/>
  <rect y="220" width="400" height="80" rx="0" fill="#E8F5E9"/>
  <!-- Table -->
  <rect x="80" y="120" width="240" height="14" rx="7" fill="#A1887F" stroke="#795548" stroke-width="2"/>
  <rect x="100" y="134" width="12" height="86" rx="4" fill="#8D6E63"/>
  <rect x="288" y="134" width="12" height="86" rx="4" fill="#8D6E63"/>
  <!-- Cat under table -->
  <g transform="translate(170, 168)">
    <!-- Body -->
    <ellipse cx="30" cy="32" rx="34" ry="20" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="18" r="18" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <!-- Ears -->
    <polygon points="-12,4 -16,-14 -4,-4" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
    <polygon points="12,4 16,-14 4,-4" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
    <polygon points="-10,2 -13,-10 -5,-3" fill="#FFE0B2"/>
    <polygon points="10,2 13,-10 5,-3" fill="#FFE0B2"/>
    <!-- Face — sleeping -->
    <path d="M-7,18 Q-4,21 -1,18" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <path d="M1,18 Q4,21 7,18" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="24" rx="4" ry="2.5" fill="#F48FB1"/>
    <!-- Tail -->
    <path d="M64,28 Q80,10 72,38" fill="none" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
    <!-- Zzz -->
    <text x="26" y="-2" font-family="sans-serif" font-size="11" font-weight="bold" fill="#90A4AE" opacity="0.7">z</text>
    <text x="36" y="-10" font-family="sans-serif" font-size="9" font-weight="bold" fill="#90A4AE" opacity="0.5">z</text>
  </g>
</svg>
