<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-tail desc-tail">
  <title id="title-tail">Tail</title>
  <desc id="desc-tail">A cheerful cat seen from behind with its long curved tail raised high and highlighted by a bright ring, clearly pointing out the tail.</desc>
  <defs>
    <radialGradient id="tail-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <linearGradient id="tail-cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#tail-bg)"/>
  <ellipse cx="190" cy="272" rx="120" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="cat" filter="url(#soft-shadow)">
    <!-- Cat body seen from behind (rounded rump) -->
    <ellipse cx="180" cy="200" rx="98" ry="72" fill="url(#tail-cat)" stroke="#9a3412" stroke-width="4"/>
    <!-- Back stripes -->
    <path d="M130 150 Q150 160 130 172" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 138 Q198 150 180 162" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <path d="M228 150 Q246 162 228 174" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <!-- Small ears peeking over the top -->
    <polygon points="150,138 140,108 172,130" fill="#ea580c" stroke="#9a3412" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="210,138 220,108 188,130" fill="#ea580c" stroke="#9a3412" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Back paws at bottom -->
    <ellipse cx="140" cy="266" rx="20" ry="12" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
    <ellipse cx="220" cy="266" rx="20" ry="12" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>

    <!-- TARGET: TAIL (long curved, raised high) -->
    <path d="M262 220
             C320 210 348 150 330 100
             C320 70 288 66 282 92
             C278 112 300 118 306 100
             C314 132 296 176 258 190"
          fill="none" stroke="#ea580c" stroke-width="26" stroke-linecap="round"/>
    <path d="M262 220
             C320 210 348 150 330 100
             C320 70 288 66 282 92
             C278 112 300 118 306 100
             C314 132 296 176 258 190"
          fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <!-- Tail tip stripes -->
    <path d="M330 108 L346 112 M326 128 L344 132 M316 148 L332 156" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Highlight ring around the tail -->
  <ellipse cx="308" cy="140" rx="62" ry="82" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="12 8" transform="rotate(12 308 140)"/>
</svg>
