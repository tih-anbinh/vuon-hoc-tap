<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-granddaughter desc-granddaughter">
  <title id="title-granddaughter">Granddaughter - Grandparents with their little granddaughter</title>
  <desc id="desc-granddaughter">A grandmother and grandfather with grey hair smiling at their little granddaughter, who runs to them with open arms, hearts floating above.</desc>
  <defs>
    <linearGradient id="gd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#gd-bg)"/>
  <rect x="0" y="248" width="400" height="52" fill="#f9a8d4"/>
  <line x1="0" y1="248" x2="400" y2="248" stroke="#be185d" stroke-width="3.5"/>
  <ellipse cx="200" cy="262" rx="155" ry="12" fill="#0f172a" opacity="0.13"/>
  <!-- hearts -->
  <g fill="#f472b6" stroke="#be185d" stroke-width="2.5">
    <path d="M200,44 Q200,34 209,34 Q218,34 218,43 Q218,53 200,64 Q182,53 182,43 Q182,34 191,34 Q200,34 200,44 Z"/>
    <path d="M120,72 Q120,66 125,66 Q130,66 130,71 Q130,77 120,83 Q110,77 110,71 Q110,66 115,66 Q120,66 120,72 Z"/>
    <path d="M290,70 Q290,64 295,64 Q300,64 300,69 Q300,75 290,81 Q280,75 280,69 Q280,64 285,64 Q290,64 290,70 Z"/>
  </g>
  <!-- grandfather (left) -->
  <g filter="url(#soft-shadow)">
    <circle cx="86" cy="112" r="26" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M62,104 Q62,82 86,80 Q110,82 110,104 L104,108 Q86,92 68,108 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <!-- glasses -->
    <circle cx="78" cy="110" r="7" fill="none" stroke="#334155" stroke-width="2.5"/>
    <circle cx="94" cy="110" r="7" fill="none" stroke="#334155" stroke-width="2.5"/>
    <line x1="85" y1="110" x2="87" y2="110" stroke="#334155" stroke-width="2.5"/>
    <circle cx="78" cy="110" r="2.2" fill="#0f172a"/>
    <circle cx="94" cy="110" r="2.2" fill="#0f172a"/>
    <path d="M78,122 Q86,128 94,122" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <!-- grey moustache -->
    <path d="M76,118 Q86,114 96,118 Q92,122 86,121 Q80,122 76,118 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <!-- body -->
    <path d="M64,138 L108,138 L116,224 L56,224 Z" fill="#16a34a" stroke="#14532d" stroke-width="3.5"/>
    <!-- open arm toward granddaughter -->
    <path d="M108,148 Q134,158 148,176" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="150" cy="180" r="8" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <path d="M64,148 Q48,164 46,182" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="76" y1="224" x2="76" y2="248" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <line x1="96" y1="224" x2="96" y2="248" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="74" cy="254" rx="13" ry="6" fill="#334155"/>
    <ellipse cx="98" cy="254" rx="13" ry="6" fill="#334155"/>
  </g>
  <!-- grandmother (right) -->
  <g filter="url(#soft-shadow)">
    <path d="M288,104 Q284,74 314,72 Q344,74 340,104 Q346,124 334,132 Q338,112 330,100 Q314,90 298,100 Q290,112 294,132 Q282,124 288,104 Z"
          fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <circle cx="314" cy="110" r="26" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="306" cy="107" r="3" fill="#0f172a"/>
    <circle cx="322" cy="107" r="3" fill="#0f172a"/>
    <path d="M306,119 Q314,125 322,119" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="298" cy="113" rx="5" ry="3.5" fill="#fb7185" opacity="0.55"/>
    <ellipse cx="330" cy="113" rx="5" ry="3.5" fill="#fb7185" opacity="0.55"/>
    <!-- hair bun -->
    <circle cx="314" cy="74" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
    <!-- dress -->
    <path d="M294,136 L334,136 L350,226 L278,226 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3.5"/>
    <g fill="#fde047">
      <circle cx="306" cy="166" r="4.5"/>
      <circle cx="326" cy="184" r="4.5"/>
      <circle cx="306" cy="206" r="4.5"/>
    </g>
    <!-- open arm toward granddaughter -->
    <path d="M294,146 Q268,158 254,176" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="252" cy="180" r="8" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <path d="M334,146 Q352,162 354,180" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="304" y1="226" x2="304" y2="248" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <line x1="324" y1="226" x2="324" y2="248" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="302" cy="254" rx="12" ry="6" fill="#be185d"/>
    <ellipse cx="326" cy="254" rx="12" ry="6" fill="#be185d"/>
  </g>
  <!-- GRANDDAUGHTER (hero, centre, running toward them) -->
  <g filter="url(#soft-shadow)">
    <!-- pigtails -->
    <circle cx="172" cy="140" r="11" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
    <circle cx="228" cy="140" r="11" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
    <path d="M176,138 Q176,112 200,110 Q224,112 224,138 L218,142 Q200,124 182,142 Z" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <!-- bows -->
    <path d="M168,130 L160,122 L170,120 L166,112 L176,118 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2"/>
    <path d="M232,130 L240,122 L230,120 L234,112 L224,118 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2"/>
    <!-- face -->
    <circle cx="200" cy="148" r="25" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="192" cy="145" r="3" fill="#0f172a"/>
    <circle cx="208" cy="145" r="3" fill="#0f172a"/>
    <path d="M190,157 Q200,165 210,157" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="184" cy="152" rx="5.5" ry="4" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="216" cy="152" rx="5.5" ry="4" fill="#fb7185" opacity="0.6"/>
    <!-- dress -->
    <path d="M184,171 L216,171 L232,236 L168,236 Z" fill="#22d3ee" stroke="#155e75" stroke-width="3.5"/>
    <!-- arms open wide to both grandparents -->
    <path d="M186,178 Q168,178 156,182" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <path d="M214,178 Q232,178 244,182" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <!-- running legs -->
    <path d="M190,236 Q184,248 174,254" fill="none" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round"/>
    <path d="M210,236 Q216,246 214,256" fill="none" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="170" cy="257" rx="11" ry="5" fill="#ec4899"/>
    <ellipse cx="216" cy="260" rx="11" ry="5" fill="#ec4899"/>
  </g>
</svg>
