<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-brown desc-brown">
  <title id="title-brown">Brown - The color brown shown by a bear, chocolate and acorn</title>
  <desc id="desc-brown">A big brown paint splash with brown things around it: a teddy bear face, a chocolate bar, and an acorn, showing the color brown.</desc>
  <defs>
    <linearGradient id="brn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="brn-swatch" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#brn-bg)"/>
  <ellipse cx="200" cy="272" rx="160" ry="9" fill="#0f172a" opacity="0.18"/>
  <!-- big paint splash -->
  <g filter="url(#soft-shadow)">
    <path d="M200,40 Q250,50 265,90 Q305,95 300,135 Q330,160 300,185 Q305,225 265,225 Q245,255 205,245 Q165,260 145,230 Q100,230 105,190 Q75,165 100,140 Q90,100 130,92 Q145,52 200,40 Z" fill="url(#brn-swatch)" stroke="#451a03" stroke-width="4"/>
    <ellipse cx="165" cy="105" rx="25" ry="15" fill="#e8b478" opacity="0.5" transform="rotate(-20 165 105)"/>
    <path d="M170,242 Q168,262 172,272 Q178,276 180,268 L178,244 Z" fill="#78350f"/>
    <path d="M235,240 Q236,256 232,264 Q226,268 226,258 L228,240 Z" fill="#78350f"/>
  </g>
  <!-- teddy bear face -->
  <g filter="url(#soft-shadow)">
    <circle cx="330" cy="200" r="34" fill="#a16207" stroke="#451a03" stroke-width="3.5"/>
    <circle cx="304" cy="172" r="12" fill="#a16207" stroke="#451a03" stroke-width="3"/>
    <circle cx="356" cy="172" r="12" fill="#a16207" stroke="#451a03" stroke-width="3"/>
    <circle cx="304" cy="174" r="6" fill="#e8b478"/>
    <circle cx="356" cy="174" r="6" fill="#e8b478"/>
    <ellipse cx="330" cy="210" rx="16" ry="13" fill="#e8b478" stroke="#78350f" stroke-width="2"/>
    <circle cx="320" cy="195" r="4" fill="#0f172a"/>
    <circle cx="340" cy="195" r="4" fill="#0f172a"/>
    <ellipse cx="330" cy="207" rx="6" ry="4" fill="#0f172a"/>
    <path d="M330,212 Q326,219 320,216 M330,212 Q334,219 340,216" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- chocolate bar -->
  <g filter="url(#soft-shadow)" transform="rotate(-10 70 220)">
    <rect x="35" y="195" width="70" height="52" rx="6" fill="#5c3210" stroke="#451a03" stroke-width="3.5"/>
    <g stroke="#451a03" stroke-width="2.5">
      <line x1="70" y1="195" x2="70" y2="247"/>
      <line x1="35" y1="221" x2="105" y2="221"/>
    </g>
    <g fill="#78350f" opacity="0.7">
      <rect x="41" y="200" width="24" height="16" rx="3"/>
      <rect x="76" y="200" width="24" height="16" rx="3"/>
      <rect x="41" y="226" width="24" height="16" rx="3"/>
      <rect x="76" y="226" width="24" height="16" rx="3"/>
    </g>
  </g>
  <!-- acorn -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="70" cy="90" rx="18" ry="22" fill="#a16207" stroke="#451a03" stroke-width="3"/>
    <path d="M48,80 Q70,62 92,80 Q92,92 70,90 Q48,92 48,80 Z" fill="#5c3210" stroke="#451a03" stroke-width="3"/>
    <line x1="70" y1="64" x2="70" y2="54" stroke="#451a03" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
