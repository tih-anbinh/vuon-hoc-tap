<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-mango desc-mango">
  <title id="title-mango">Mango - Ripe yellow-red mango</title>
  <desc id="desc-mango">A large ripe mango with a gradient from yellow to red-orange, a small stem, and a green leaf.</desc>
  <defs>
    <linearGradient id="mango-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="60" y1="260" x2="340" y2="260" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="260" rx="70" ry="7" fill="#0f172a" opacity="0.1"/>

  <g id="mango-figure" filter="url(#soft-shadow)">
    <!-- Mango body (kidney/oval shape) -->
    <path d="M120 150 C100 100 140 55 200 55 C260 55 310 100 300 160 C290 220 240 250 200 250 C160 250 110 220 120 150 Z" fill="url(#mango-grad)" stroke="#c2410c" stroke-width="3.5"/>

    <!-- Highlight -->
    <path d="M160 90 Q200 72 240 90" fill="none" stroke="#fef9c3" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

    <!-- Subtle blush area -->
    <ellipse cx="250" cy="120" rx="40" ry="35" fill="#ef4444" opacity="0.2"/>

    <!-- Stem -->
    <path d="M200 58 C198 45 195 38 200 32" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

    <!-- Leaf -->
    <path d="M200 35 C215 20 240 18 250 25 C245 35 225 40 200 35 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M200 35 C220 25 240 22 248 26" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Second leaf -->
    <path d="M198 38 C180 25 160 25 155 32 C160 40 178 42 198 38 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <path d="M198 38 C178 30 162 28 157 32" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sap drop -->
    <ellipse cx="200" cy="48" rx="3" ry="4" fill="#fbbf24" opacity="0.6"/>
  </g>
</svg>