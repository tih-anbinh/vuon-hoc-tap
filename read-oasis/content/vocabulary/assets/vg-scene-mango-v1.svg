<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-mango desc-mango">
  <title id="title-mango">Mango - Ripe yellow-red mango</title>
  <desc id="desc-mango">A large ripe mango with a gradient from yellow to red-orange, a small stem, and a green leaf.</desc>
  <defs>
    <linearGradient id="mango-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="mango-flesh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="mango-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <line x1="40" y1="262" x2="360" y2="262" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="150" cy="262" rx="70" ry="7" fill="#0f172a" opacity="0.1"/>
  <ellipse cx="300" cy="262" rx="52" ry="6" fill="#0f172a" opacity="0.1"/>

  <!-- Whole ripe mango (yellow-dominant) -->
  <g id="mango-figure" filter="url(#mango-sh)">
    <path d="M70 150 C52 104 92 62 150 62 C208 62 254 104 246 162 C238 218 190 250 150 250 C112 250 62 220 70 150 Z"
          fill="url(#mango-grad)" stroke="#ca8a04" stroke-width="3.5"/>
    <!-- ripe red blush -->
    <ellipse cx="106" cy="120" rx="34" ry="30" fill="#f87171" opacity="0.35"/>
    <!-- highlight -->
    <path d="M110 96 Q150 80 190 96" fill="none" stroke="#fef9c3" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <!-- stem -->
    <path d="M150 64 C148 50 145 44 150 38" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M150 42 C166 26 192 24 202 31 C196 42 176 46 150 42 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <path d="M148 44 C130 30 108 30 103 38 C109 47 128 49 148 44 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  </g>

  <!-- Cut-half showing the flat mango pit (iconic cue) -->
  <g filter="url(#mango-sh)">
    <!-- skin edge -->
    <path d="M262 170 C258 128 292 104 320 108 C352 112 366 150 356 190 C348 224 314 244 288 236 C266 230 264 200 262 170 Z"
          fill="url(#mango-grad)" stroke="#ca8a04" stroke-width="3.5"/>
    <!-- yellow flesh -->
    <path d="M272 170 C270 136 296 118 318 121 C344 125 354 154 346 186 C339 214 312 230 292 224 C276 219 274 196 272 170 Z"
          fill="url(#mango-flesh)" stroke="#eab308" stroke-width="2.5"/>
    <!-- flat oval pit -->
    <ellipse cx="308" cy="172" rx="18" ry="34" fill="#fef9c3" stroke="#d4a017" stroke-width="2.5"/>
    <g stroke="#d4a017" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M308 142 Q318 172 308 202"/>
      <path d="M300 148 Q306 172 300 196"/>
      <path d="M316 148 Q310 172 316 196"/>
    </g>
  </g>
</svg>