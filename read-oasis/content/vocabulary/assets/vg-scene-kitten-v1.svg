<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-kitten desc-kitten">
  <title id="title-kitten">Kitten - A tiny playful baby cat</title>
  <desc id="desc-kitten">A tiny orange kitten with big eyes playing with a ball of blue wool, sitting on a soft rug next to its mother cat.</desc>
  <defs>
    <linearGradient id="kt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#kt-bg)"/>
  <rect x="0" y="238" width="400" height="62" fill="#f9a8d4"/>
  <line x1="0" y1="238" x2="400" y2="238" stroke="#be185d" stroke-width="3.5"/>
  <!-- rug -->
  <ellipse cx="200" cy="252" rx="170" ry="30" fill="#c4b5fd" stroke="#6d28d9" stroke-width="4"/>
  <ellipse cx="200" cy="252" rx="120" ry="20" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <!-- mother cat in background -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="330" cy="196" rx="46" ry="34" fill="#9a3412" stroke="#431407" stroke-width="3.5"/>
    <circle cx="330" cy="146" r="27" fill="#9a3412" stroke="#431407" stroke-width="3.5"/>
    <path d="M310,130 L304,104 L322,120 Z" fill="#9a3412" stroke="#431407" stroke-width="3"/>
    <path d="M350,130 L356,104 L338,120 Z" fill="#9a3412" stroke="#431407" stroke-width="3"/>
    <path d="M318,142 Q322,138 326,142" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M334,142 Q338,138 342,142" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M326,152 Q330,156 334,152" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="330" cy="149" rx="3" ry="2.4" fill="#f472b6"/>
    <path d="M290,214 Q272,208 268,192" fill="none" stroke="#9a3412" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- KITTEN (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- tail up playful -->
    <path d="M212,204 Q244,190 240,158 Q238,144 228,142" fill="none" stroke="#f97316" stroke-width="13" stroke-linecap="round"/>
    <!-- body crouched -->
    <ellipse cx="164" cy="204" rx="58" ry="40" fill="#fb923c" stroke="#7c2d12" stroke-width="4.5"/>
    <!-- stripes -->
    <path d="M186,172 Q192,184 190,196" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <path d="M204,182 Q208,194 204,206" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <!-- white tummy -->
    <ellipse cx="148" cy="220" rx="30" ry="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <!-- big head -->
    <circle cx="120" cy="136" r="46" fill="#fb923c" stroke="#7c2d12" stroke-width="4.5"/>
    <!-- ears -->
    <path d="M86,110 L76,66 L110,92 Z" fill="#fb923c" stroke="#7c2d12" stroke-width="4"/>
    <path d="M154,110 L164,66 L130,92 Z" fill="#fb923c" stroke="#7c2d12" stroke-width="4"/>
    <path d="M90,102 L86,80 L102,94 Z" fill="#fda4af" stroke="#7c2d12" stroke-width="2.5"/>
    <path d="M150,102 L154,80 L138,94 Z" fill="#fda4af" stroke="#7c2d12" stroke-width="2.5"/>
    <!-- big kitten eyes -->
    <circle cx="104" cy="130" r="10" fill="#ffffff" stroke="#7c2d12" stroke-width="2.5"/>
    <circle cx="136" cy="130" r="10" fill="#ffffff" stroke="#7c2d12" stroke-width="2.5"/>
    <circle cx="106" cy="132" r="5.5" fill="#166534"/>
    <circle cx="134" cy="132" r="5.5" fill="#166534"/>
    <circle cx="108" cy="130" r="2" fill="#ffffff"/>
    <circle cx="136" cy="130" r="2" fill="#ffffff"/>
    <!-- nose + mouth -->
    <path d="M116,148 L124,148 L120,154 Z" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <path d="M120,154 Q116,160 110,158 M120,154 Q124,160 130,158" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#7c2d12" stroke-width="2.2" stroke-linecap="round">
      <line x1="88" y1="144" x2="62" y2="140"/>
      <line x1="88" y1="152" x2="64" y2="154"/>
      <line x1="152" y1="144" x2="178" y2="140"/>
      <line x1="152" y1="152" x2="176" y2="154"/>
    </g>
    <!-- front paws reaching for wool -->
    <path d="M118,224 Q106,236 92,240" fill="none" stroke="#fb923c" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="86" cy="242" rx="10" ry="7" fill="#ffedd5" stroke="#7c2d12" stroke-width="3"/>
    <path d="M148,234 Q142,244 132,248" fill="none" stroke="#fb923c" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="128" cy="250" rx="10" ry="7" fill="#ffedd5" stroke="#7c2d12" stroke-width="3"/>
  </g>
  <!-- ball of wool -->
  <g filter="url(#soft-shadow)">
    <circle cx="56" cy="238" r="22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3.5"/>
    <path d="M38,230 Q56,222 74,230 M36,240 Q56,232 76,240 M40,250 Q56,242 72,250" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <path d="M74,246 Q94,252 108,248" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- hearts -->
  <g fill="#f472b6" stroke="#be185d" stroke-width="2">
    <path d="M228,64 C228,58 236,55 240,60 C244,55 252,58 252,64 C252,70 240,78 240,78 C240,78 228,70 228,64 Z"/>
    <path d="M270,96 C270,92 275,90 278,93 C281,90 286,92 286,96 C286,100 278,105 278,105 C278,105 270,100 270,96 Z"/>
  </g>
</svg>
