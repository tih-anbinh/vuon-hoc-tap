<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-space desc-space">
  <title id="title-space">Space</title>
  <desc id="desc-space">Outer space with planets, a ringed planet, stars, and a crescent moon in the dark sky.</desc>
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="space-planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#space-bg)"/>

  <!-- Stars -->
  <g fill="#fef9c3">
    <circle cx="60" cy="60" r="3"/><circle cx="120" cy="40" r="2"/><circle cx="200" cy="55" r="2.5"/><circle cx="330" cy="50" r="3"/>
    <circle cx="90" cy="180" r="2"/><circle cx="360" cy="150" r="2.5"/><circle cx="40" cy="240" r="2.5"/><circle cx="310" cy="250" r="2"/>
    <circle cx="250" cy="210" r="2"/><circle cx="150" cy="250" r="2.5"/>
  </g>
  <!-- twinkle stars -->
  <g fill="#ffffff"><path d="M270 90 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/><path d="M80 120 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/></g>

  <g filter="url(#soft-shadow)">
    <!-- Blue planet -->
    <circle cx="140" cy="160" r="55" fill="url(#space-planet)" stroke="#1e3a8a" stroke-width="3"/>
    <g fill="#22c55e" opacity="0.7"><ellipse cx="120" cy="145" rx="18" ry="10"/><ellipse cx="160" cy="175" rx="14" ry="8"/></g>

    <!-- Ringed planet -->
    <circle cx="300" cy="200" r="34" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="300" cy="200" rx="60" ry="16" fill="none" stroke="#fcd34d" stroke-width="6" opacity="0.85"/>

    <!-- Crescent moon -->
    <path d="M340 80 A26 26 0 1 0 340 132 A20 20 0 1 1 340 80 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
