<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-fridge desc-fridge">
  <title id="title-fridge">Fridge</title>
  <desc id="desc-fridge">A tall two-door refrigerator with a freezer on top, handles, and a magnet on the door.</desc>
  <defs>
    <linearGradient id="fridge-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fridge-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#fridge-bg)"/>
  <ellipse cx="200" cy="275" rx="110" ry="12" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <rect x="120" y="40" width="160" height="235" rx="14" fill="url(#fridge-body)" stroke="#1e293b" stroke-width="4"/>
    <!-- Freezer / fridge split -->
    <line x1="120" y1="115" x2="280" y2="115" stroke="#1e293b" stroke-width="4"/>
    <!-- Freezer handle -->
    <rect x="248" y="75" width="10" height="28" rx="5" fill="#64748b" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Fridge handle -->
    <rect x="248" y="140" width="10" height="90" rx="5" fill="#64748b" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Magnet -->
    <circle cx="160" cy="170" r="16" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
    <path d="M152 170 q8 10 16 0" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="155" cy="166" r="2" fill="#fff"/>
    <circle cx="165" cy="166" r="2" fill="#fff"/>
    <!-- Vent lines -->
    <line x1="130" y1="100" x2="170" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <line x1="130" y1="107" x2="170" y2="107" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
