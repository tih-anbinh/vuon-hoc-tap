<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-dance desc-dance">
  <title id="title-dance">Dance</title>
  <desc id="desc-dance">A happy child dancing with one arm raised and one leg kicked out, with music notes around.</desc>
  <defs>
    <linearGradient id="dance-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="dance-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#dance-bg)"/>
  <ellipse cx="200" cy="275" rx="90" ry="14" fill="#0f172a" opacity="0.12"/>

  <!-- Music notes -->
  <g fill="#a855f7">
    <circle cx="80" cy="90" r="9"/>
    <rect x="87" y="58" width="4" height="34"/>
    <circle cx="320" cy="70" r="9"/>
    <rect x="327" y="40" width="4" height="32"/>
    <circle cx="340" cy="130" r="7"/>
    <rect x="345" y="106" width="3.5" height="26"/>
  </g>

  <g filter="url(#soft-shadow)">
    <!-- Dress (dancing) -->
    <path d="M175 150 Q200 140 225 150 L255 230 L145 230 Z" fill="#ec4899" stroke="#9d174d" stroke-width="3.5"/>
    <!-- Legs (one kicked out) -->
    <path d="M180 228 L172 275" stroke="url(#dance-skin)" stroke-width="14" stroke-linecap="round"/>
    <path d="M220 228 L260 258" stroke="url(#dance-skin)" stroke-width="14" stroke-linecap="round"/>
    <!-- Arms (one raised) -->
    <path d="M185 158 Q150 150 140 175" fill="none" stroke="url(#dance-skin)" stroke-width="13" stroke-linecap="round"/>
    <path d="M218 156 Q250 130 262 100" fill="none" stroke="url(#dance-skin)" stroke-width="13" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="200" cy="115" r="40" fill="url(#dance-skin)" stroke="#d4a574" stroke-width="3.5"/>
    <path d="M162 104 Q164 72 200 72 Q236 72 238 104 Q220 84 200 84 Q180 84 162 104 Z" fill="#3d2109" stroke="#27150a" stroke-width="2.5"/>
    <circle cx="188" cy="114" r="4.5" fill="#1e293b"/>
    <circle cx="212" cy="114" r="4.5" fill="#1e293b"/>
    <path d="M186 128 Q200 140 214 128" fill="none" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="176" cy="125" r="5" fill="#fb7185" opacity="0.5"/>
    <circle cx="224" cy="125" r="5" fill="#fb7185" opacity="0.5"/>
  </g>
</svg>
