<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-run desc-run">
  <title id="title-run">run</title>
  <desc id="desc-run">A child running fast with arms swinging and one foot off the ground.</desc>
  <rect width="400" height="300" rx="20" fill="#E3F2FD"/>
  <rect y="230" width="400" height="70" rx="0" fill="#C8E6C9"/>
  <!-- Motion lines -->
  <line x1="100" y1="140" x2="130" y2="140" stroke="#90CAF9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="90" y1="160" x2="125" y2="160" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="95" y1="180" x2="120" y2="180" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Character Mo running -->
  <g transform="translate(200, 100)">
    <!-- Back leg (stretched behind) -->
    <line x1="-10" y1="80" x2="-40" y2="120" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-44" cy="124" rx="12" ry="6" fill="#FF7043" stroke="#E64A19" stroke-width="1.5"/>
    <!-- Front leg (forward) -->
    <line x1="10" y1="80" x2="40" y2="115" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="44" cy="119" rx="12" ry="6" fill="#FF7043" stroke="#E64A19" stroke-width="1.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="22" ry="28" fill="#42A5F5" stroke="#1E88E5" stroke-width="2"/>
    <!-- Arms swinging -->
    <line x1="-8" y1="45" x2="-40" y2="70" stroke="#FFCC80" stroke-width="8" stroke-linecap="round"/>
    <line x1="8" y1="45" x2="38" y2="30" stroke="#FFCC80" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="18" r="22" fill="#FFCC80" stroke="#F9A825" stroke-width="2"/>
    <!-- Hair -->
    <path d="M-16,-2 Q-10,-18 0,-16 Q10,-18 16,-2" fill="#5D4037" stroke="#4E342E" stroke-width="1.5"/>
    <!-- Face — happy effort -->
    <circle cx="-7" cy="14" r="3" fill="#4E342E"/>
    <circle cx="9" cy="14" r="3" fill="#4E342E"/>
    <circle cx="-6" cy="13" r="1" fill="white"/>
    <circle cx="10" cy="13" r="1" fill="white"/>
    <path d="M-6,24 Q0,30 6,24" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-14" cy="20" r="4" fill="#F48FB1" opacity="0.4"/>
    <circle cx="14" cy="20" r="4" fill="#F48FB1" opacity="0.4"/>
  </g>
</svg>
