<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bean desc-bean">
  <title id="title-bean">Bean - Green bean pod with seeds inside</title>
  <desc id="desc-bean">A long curved green bean pod split open to show four bright green beans inside, on a wooden surface.</desc>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bn-pod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="bn-seed" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#bn-bg)"/>
  <ellipse cx="200" cy="220" rx="150" ry="10" fill="#0f172a" opacity="0.18"/>
  <g filter="url(#soft-shadow)">
    <!-- pod (open, curved) -->
    <path d="M70,170 Q80,110 200,110 Q320,110 330,170 Q320,190 200,190 Q80,190 70,170 Z" fill="url(#bn-pod)" stroke="#14532d" stroke-width="4"/>
    <!-- pod seam ridge -->
    <path d="M70,170 Q200,155 330,170" fill="none" stroke="#14532d" stroke-width="2.5" opacity="0.6"/>
    <!-- beans inside -->
    <g stroke="#14532d" stroke-width="2.5">
      <ellipse cx="115" cy="150" rx="22" ry="14" fill="url(#bn-seed)" transform="rotate(-8 115 150)"/>
      <ellipse cx="170" cy="145" rx="22" ry="14" fill="url(#bn-seed)" transform="rotate(-4 170 145)"/>
      <ellipse cx="230" cy="145" rx="22" ry="14" fill="url(#bn-seed)" transform="rotate(4 230 145)"/>
      <ellipse cx="285" cy="150" rx="22" ry="14" fill="url(#bn-seed)" transform="rotate(8 285 150)"/>
    </g>
    <!-- stem -->
    <path d="M330,170 L355,160 L360,145" fill="none" stroke="#14532d" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
