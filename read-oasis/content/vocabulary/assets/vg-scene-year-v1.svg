<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-year desc-year">
  <title id="title-year">Year - Four seasons around a calendar circle</title>
  <desc id="desc-year">A big circle divided into four seasons of the year: spring flowers, summer sun, autumn leaves and winter snowman, with arrows showing the year going around.</desc>
  <defs>
    <linearGradient id="yr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#yr-bg)"/>
  <!-- season wheel (dominant) -->
  <g filter="url(#soft-shadow)">
    <circle cx="200" cy="150" r="118" fill="#ffffff" stroke="#475569" stroke-width="5"/>
    <!-- quadrants -->
    <path d="M200,150 L200,32 A118,118 0 0,1 318,150 Z" fill="#fef08a" stroke="#475569" stroke-width="3"/>
    <path d="M200,150 L318,150 A118,118 0 0,1 200,268 Z" fill="#fed7aa" stroke="#475569" stroke-width="3"/>
    <path d="M200,150 L200,268 A118,118 0 0,1 82,150 Z" fill="#bae6fd" stroke="#475569" stroke-width="3"/>
    <path d="M200,150 L82,150 A118,118 0 0,1 200,32 Z" fill="#bbf7d0" stroke="#475569" stroke-width="3"/>
    <!-- spring (top-left): flower -->
    <g>
      <line x1="140" y1="110" x2="140" y2="82" stroke="#15803d" stroke-width="4"/>
      <circle cx="128" cy="76" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
      <circle cx="152" cy="76" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
      <circle cx="140" cy="64" r="9" fill="#f472b6" stroke="#be185d" stroke-width="2.5"/>
      <circle cx="140" cy="76" r="7" fill="#fde047" stroke="#a16207" stroke-width="2"/>
      <path d="M140,98 Q128,94 126,86" fill="none" stroke="#15803d" stroke-width="3"/>
    </g>
    <!-- summer (top-right): sun -->
    <g>
      <circle cx="258" cy="84" r="18" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
      <g stroke="#d97706" stroke-width="3" stroke-linecap="round">
        <line x1="258" y1="58" x2="258" y2="50"/>
        <line x1="258" y1="110" x2="258" y2="118"/>
        <line x1="232" y1="84" x2="224" y2="84"/>
        <line x1="284" y1="84" x2="292" y2="84"/>
        <line x1="240" y1="66" x2="234" y2="60"/>
        <line x1="276" y1="66" x2="282" y2="60"/>
      </g>
    </g>
    <!-- autumn (bottom-right): falling leaves -->
    <g>
      <path d="M250,190 Q262,176 274,190 Q262,206 250,190 Z" fill="#f97316" stroke="#c2410c" stroke-width="2.5"/>
      <line x1="262" y1="182" x2="262" y2="198" stroke="#c2410c" stroke-width="2"/>
      <path d="M276,218 Q288,204 300,218 Q288,234 276,218 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.5"/>
      <line x1="288" y1="210" x2="288" y2="226" stroke="#7f1d1d" stroke-width="2"/>
      <path d="M238,226 Q248,214 258,226 Q248,238 238,226 Z" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    </g>
    <!-- winter (bottom-left): snowman -->
    <g>
      <circle cx="140" cy="222" r="17" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
      <circle cx="140" cy="196" r="12" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
      <circle cx="136" cy="193" r="2" fill="#0f172a"/>
      <circle cx="144" cy="193" r="2" fill="#0f172a"/>
      <path d="M140,197 L147,199 L140,201 Z" fill="#f97316"/>
      <rect x="131" y="181" width="18" height="5" rx="2" fill="#1e293b"/>
      <rect x="134" y="172" width="12" height="10" fill="#1e293b"/>
      <g stroke="#e0f2fe" stroke-width="2" stroke-linecap="round">
        <line x1="108" y1="200" x2="116" y2="200"/>
        <line x1="112" y1="196" x2="112" y2="204"/>
        <line x1="168" y1="230" x2="176" y2="230"/>
        <line x1="172" y1="226" x2="172" y2="234"/>
      </g>
    </g>
    <!-- center hub -->
    <circle cx="200" cy="150" r="26" fill="#4c1d95" stroke="#2e1065" stroke-width="4"/>
    <!-- 12 tick marks like a clock/calendar in center -->
    <g stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round">
      <line x1="200" y1="130" x2="200" y2="136"/>
      <line x1="200" y1="164" x2="200" y2="170"/>
      <line x1="180" y1="150" x2="186" y2="150"/>
      <line x1="214" y1="150" x2="220" y2="150"/>
      <line x1="186" y1="136" x2="190" y2="140"/>
      <line x1="214" y1="136" x2="210" y2="140"/>
      <line x1="186" y1="164" x2="190" y2="160"/>
      <line x1="214" y1="164" x2="210" y2="160"/>
    </g>
    <circle cx="200" cy="150" r="4" fill="#fde047"/>
  </g>
  <!-- cycle arrows around the wheel -->
  <g fill="none" stroke="#4c1d95" stroke-width="5" stroke-linecap="round">
    <path d="M330,110 A138,138 0 0,1 330,190"/>
    <path d="M70,190 A138,138 0 0,1 70,110"/>
  </g>
  <path d="M330,190 L322,172 L342,176 Z" fill="#4c1d95"/>
  <path d="M70,110 L78,128 L58,124 Z" fill="#4c1d95"/>
</svg>
