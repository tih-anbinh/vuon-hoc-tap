<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-pink desc-pink">
  <title id="title-pink">Pink - Pink colored things</title>
  <desc id="desc-pink">A big pink paint splash surrounded by pink things: a pink flower, a pink pig, a pink ice cream and a pink heart.</desc>
  <defs>
    <linearGradient id="pk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="pk-splash" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#pk-bg)"/>
  <!-- central paint splash -->
  <g filter="url(#soft-shadow)">
    <path d="M200,60 Q245,58 268,92 Q305,100 300,140 Q322,168 295,192 Q298,232 258,235 Q235,262 200,250 Q165,262 142,235 Q102,232 105,192 Q78,168 100,140 Q95,100 132,92 Q155,58 200,60 Z" fill="url(#pk-splash)" stroke="#9d174d" stroke-width="4.5"/>
    <!-- paintbrush dipped -->
    <g transform="rotate(30 250 110)">
      <rect x="242" y="20" width="16" height="70" rx="4" fill="#a16207" stroke="#78350f" stroke-width="3"/>
      <rect x="240" y="88" width="20" height="12" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <path d="M240,100 L260,100 Q260,124 250,130 Q240,124 240,100 Z" fill="#ec4899" stroke="#9d174d" stroke-width="2.5"/>
    </g>
    <!-- drips -->
    <path d="M160,248 Q158,268 165,272 Q172,268 168,248 Z" fill="#ec4899" stroke="#9d174d" stroke-width="2.5"/>
    <path d="M235,252 Q234,266 240,269 Q246,266 242,252 Z" fill="#f472b6" stroke="#9d174d" stroke-width="2.5"/>
  </g>
  <!-- pink pig (in splash) -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="175" cy="165" rx="42" ry="34" fill="#fbcfe8" stroke="#9d174d" stroke-width="3.5"/>
    <path d="M143,140 L136,124 L152,132 Z" fill="#fbcfe8" stroke="#9d174d" stroke-width="2.5"/>
    <path d="M203,138 L212,122 L194,130 Z" fill="#fbcfe8" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="162" cy="158" r="4" fill="#0f172a"/>
    <circle cx="188" cy="158" r="4" fill="#0f172a"/>
    <ellipse cx="175" cy="175" rx="14" ry="10" fill="#f9a8d4" stroke="#9d174d" stroke-width="2.5"/>
    <circle cx="169" cy="175" r="2.5" fill="#9d174d"/>
    <circle cx="181" cy="175" r="2.5" fill="#9d174d"/>
    <path d="M212,178 Q224,172 220,162" fill="none" stroke="#f9a8d4" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- pink flower -->
  <g filter="url(#soft-shadow)">
    <g fill="#f472b6" stroke="#be185d" stroke-width="2.5">
      <ellipse cx="258" cy="150" rx="12" ry="18" transform="rotate(0 258 150)"/>
      <ellipse cx="258" cy="150" rx="12" ry="18" transform="rotate(72 258 150)"/>
      <ellipse cx="258" cy="150" rx="12" ry="18" transform="rotate(144 258 150)"/>
      <ellipse cx="258" cy="150" rx="12" ry="18" transform="rotate(216 258 150)"/>
      <ellipse cx="258" cy="150" rx="12" ry="18" transform="rotate(288 258 150)"/>
    </g>
    <circle cx="258" cy="150" r="9" fill="#fde047" stroke="#b45309" stroke-width="2.5"/>
  </g>
  <!-- pink ice cream (bottom left corner) -->
  <g filter="url(#soft-shadow)">
    <path d="M48,232 L68,282 L88,232 Z" fill="#e8b478" stroke="#92400e" stroke-width="3"/>
    <g stroke="#92400e" stroke-width="1.8" opacity="0.8">
      <line x1="54" y1="240" x2="80" y2="252"/>
      <line x1="58" y1="254" x2="78" y2="240"/>
    </g>
    <circle cx="68" cy="218" r="22" fill="#f9a8d4" stroke="#be185d" stroke-width="3"/>
    <circle cx="59" cy="211" r="6" fill="#fdf2f8" opacity="0.8"/>
  </g>
  <!-- pink heart (top left) -->
  <path d="M62,75 C56,63 38,63 38,80 C38,92 62,108 62,108 C62,108 86,92 86,80 C86,63 68,63 62,75 Z" fill="#f472b6" stroke="#9d174d" stroke-width="3.5" filter="url(#soft-shadow)"/>
  <!-- pink bow (top right) -->
  <g filter="url(#soft-shadow)">
    <path d="M340,60 Q318,45 315,68 Q314,86 338,74 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="3"/>
    <path d="M348,60 Q370,45 373,68 Q374,86 350,74 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="3"/>
    <circle cx="344" cy="67" r="8" fill="#ec4899" stroke="#be185d" stroke-width="2.5"/>
    <path d="M338,76 L330,98" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
    <path d="M350,76 L358,98" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- pink butterfly (bottom right) -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="330" cy="235" rx="5" ry="16" fill="#831843"/>
    <path d="M327,228 Q305,208 300,228 Q298,244 325,238 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
    <path d="M333,228 Q355,208 360,228 Q362,244 335,238 Z" fill="#f9a8d4" stroke="#be185d" stroke-width="2.5"/>
    <g stroke="#831843" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M328,221 Q324,212 318,210"/>
      <path d="M332,221 Q336,212 342,210"/>
    </g>
  </g>
</svg>
