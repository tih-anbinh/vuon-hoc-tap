<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-eat desc-eat">
  <title id="title-eat">Eat - Child eating from a bowl</title>
  <desc id="desc-eat">A happy child holding a spoon to their open mouth, a bowl of food in front of them.</desc>
  <defs>
    <linearGradient id="eat-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8cd"/>
      <stop offset="100%" stop-color="#f5d0a9"/>
    </linearGradient>
    <linearGradient id="eat-shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bowl-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <line x1="30" y1="265" x2="370" y2="265" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="265" rx="150" ry="6" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Table -->
    <rect x="30" y="230" width="340" height="10" fill="#a16207" stroke="#78350f" stroke-width="2.5"/>
    <rect x="60" y="240" width="10" height="25" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="330" y="240" width="10" height="25" fill="#78350f" stroke="#451a03" stroke-width="2"/>

    <!-- Bowl on table -->
    <ellipse cx="280" cy="230" rx="55" ry="8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
    <path d="M225 228 Q225 210 235 200 Q280 195 325 200 Q335 210 335 228 Z" fill="url(#bowl-grad)" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Food in bowl (noodles/pasta) -->
    <ellipse cx="280" cy="205" rx="40" ry="7" fill="#fbbf24" stroke="#a16207" stroke-width="2"/>
    <path d="M250 205 Q260 200 270 205 Q280 200 290 205 Q300 200 310 205" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <path d="M255 208 Q265 203 275 208" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="270" cy="203" r="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cx="295" cy="204" r="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Steam -->
    <path d="M270 195 Q265 185 270 175" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M290 195 Q295 185 290 175" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Body/torso -->
    <path d="M100 175 Q145 168 190 175 L200 265 L90 265 Z" fill="url(#eat-shirt)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Neck -->
    <rect x="133" y="145" width="24" height="18" fill="url(#eat-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Right arm (raised, holding spoon to mouth) -->
    <path d="M185 180 Q205 155 185 130" fill="none" stroke="url(#eat-shirt)" stroke-width="20" stroke-linecap="round"/>
    <!-- Right hand -->
    <circle cx="182" cy="128" r="11" fill="url(#eat-skin)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Spoon handle -->
    <line x1="182" y1="125" x2="170" y2="112" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Spoon bowl -->
    <ellipse cx="164" cy="108" rx="9" ry="6" fill="#cbd5e1" stroke="#475569" stroke-width="2" transform="rotate(-40 164 108)"/>
    <!-- Food on spoon -->
    <ellipse cx="163" cy="106" rx="6" ry="3.5" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(-40 163 106)"/>

    <!-- Left arm (down to bowl) -->
    <path d="M105 180 Q95 210 100 235" fill="none" stroke="url(#eat-shirt)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="102" cy="238" r="11" fill="url(#eat-skin)" stroke="#a16207" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="145" cy="115" r="35" fill="url(#eat-skin)" stroke="#a16207" stroke-width="3"/>
    <!-- Hair -->
    <path d="M112 105 Q115 78 145 72 Q175 78 178 105 Q170 88 145 85 Q120 88 112 105 Z" fill="#451a03" stroke="#27150a" stroke-width="2"/>
    <!-- Eyes (happy squints) -->
    <path d="M127 112 Q133 108 139 112" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <path d="M151 112 Q157 108 163 112" fill="none" stroke="#0c0a09" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="120" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="170" cy="128" r="5" fill="#fca5a5" opacity="0.6"/>
    <!-- Open mouth (round, eating!) -->
    <ellipse cx="150" cy="140" rx="9" ry="7" fill="#7c2d12" stroke="#0c0a09" stroke-width="2"/>
    <!-- Tongue peek -->
    <ellipse cx="150" cy="143" rx="5" ry="3" fill="#f472b6" stroke="#9f1239" stroke-width="1"/>
  </g>

  <!-- Yummy sparkles -->
  <path d="M70 90 L73 97 L80 100 L73 103 L70 110 L67 103 L60 100 L67 97 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
  <path d="M220 60 L223 67 L230 70 L223 73 L220 80 L217 73 L210 70 L217 67 Z" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>
</svg>