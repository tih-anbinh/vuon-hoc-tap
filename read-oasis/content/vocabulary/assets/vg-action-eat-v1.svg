<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t-eat d-eat">
  <title id="t-eat">Eat</title>
  <desc id="d-eat">A child lifting a spoonful of food from a bowl toward an open mouth, showing eating.</desc>
  <defs>
    <radialGradient id="eat-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="eat-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" rx="20" fill="url(#eat-bg)"/>
  <ellipse cx="200" cy="274" rx="130" ry="13" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#eat-sh)">
    <!-- Head -->
    <circle cx="180" cy="124" r="40" fill="#fcc79a" stroke="#0f172a" stroke-width="4"/>
    <path d="M141 116 C146 78 214 78 219 116 C208 94 152 94 141 116 Z" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <circle cx="170" cy="120" r="5" fill="#0f172a"/>
    <circle cx="196" cy="120" r="5" fill="#0f172a"/>
    <circle cx="160" cy="136" r="6.5" fill="#fb7185" opacity="0.35"/>
    <!-- open mouth -->
    <ellipse cx="190" cy="146" rx="11" ry="10" fill="#7f1d1d" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M181 149 Q190 156 199 149" fill="#ef4444"/>

    <!-- Body -->
    <path d="M148 172 Q182 162 216 172 L222 250 Q182 258 144 250 Z" fill="#f97316" stroke="#0f172a" stroke-width="4"/>

    <!-- Arm raising spoon -->
    <path d="M208 190 Q246 182 250 148" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
    <!-- Spoon to mouth -->
    <line x1="248" y1="150" x2="206" y2="146" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="204" cy="146" rx="11" ry="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
    <ellipse cx="204" cy="143" rx="8" ry="4" fill="#f59e0b"/>
  </g>

  <!-- Bowl of food in front -->
  <g filter="url(#eat-sh)">
    <path d="M118 214 Q200 206 282 214 Q272 258 200 260 Q128 258 118 214 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="4"/>
    <ellipse cx="200" cy="214" rx="82" ry="16" fill="#fde68a" stroke="#0f172a" stroke-width="3"/>
    <!-- noodles/food -->
    <g fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round">
      <path d="M160 214 Q170 200 182 212"/><path d="M190 214 Q202 198 214 212"/><path d="M222 214 Q232 200 242 212"/>
    </g>
    <!-- steam -->
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M170 198 q8 -10 0 -20 q-8 -10 0 -20"/>
      <path d="M230 198 q8 -10 0 -20 q-8 -10 0 -20"/>
    </g>
  </g>
</svg>
