    <path d="M102,140 Q118,168 116,190" fill="none" stroke="#fcd9b6" stroke-width="10" stroke-linecap="round"/>
    <path d="M62,208 L58,250" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <path d="M98,208 L102,250" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
