<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-person-people desc-person-people">
  <title id="title-person-people">Person and people - One person and a group of people</title>
  <desc id="desc-person-people">One person standing alone on the left, and a group of four different people together on the right, showing singular and plural.</desc>
  <defs>
