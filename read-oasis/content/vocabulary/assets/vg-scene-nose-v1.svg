<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-nose desc-nose">
  <title id="title-nose">nose</title>
  <desc id="desc-nose">A child's face with an arrow pointing to their nose, smelling a flower.</desc>
  <rect width="400" height="300" rx="20" fill="#E8F5E9"/>
  <g transform="translate(180, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="60" fill="#FFCC80" stroke="#F9A825" stroke-width="2.5"/>
    <!-- Hair -->
    <path d="M-45,-30 Q-30,-60 0,-55 Q30,-60 45,-30" fill="#5D4037" stroke="#4E342E" stroke-width="2"/>
    <!-- Eyes (closed, smelling) -->
    <path d="M-24,-10 Q-18,-15 -12,-10" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12,-10 Q18,-15 24,-10" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nose (highlighted) -->
    <path d="M-5,2 Q0,14 5,2" fill="#FFAB91" stroke="#FF7043" stroke-width="2.5"/>
    <circle cx="-3" cy="10" r="1.5" fill="#FF7043" opacity="0.4"/>
    <circle cx="3" cy="10" r="1.5" fill="#FF7043" opacity="0.4"/>
    <!-- Mouth -->
    <path d="M-8,22 Q0,28 8,22" fill="none" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-30" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
    <circle cx="30" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
  </g>
  <!-- Flower being smelled -->
  <g transform="translate(300, 130)">
    <line x1="0" y1="20" x2="0" y2="60" stroke="#66BB6A" stroke-width="3"/>
    <circle cx="0" cy="10" r="10" fill="#F48FB1"/>
    <circle cx="0" cy="0" r="8" fill="#F48FB1"/>
    <circle cx="-8" cy="8" r="8" fill="#F48FB1"/>
    <circle cx="8" cy="8" r="8" fill="#F48FB1"/>
    <circle cx="0" cy="8" r="5" fill="#FDD835"/>
    <!-- Scent lines -->
    <path d="M-20,5 Q-25,-5 -18,-10" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <path d="M-25,15 Q-32,8 -25,0" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>
  <!-- Arrow -->
  <g fill="none" stroke="#E53935" stroke-width="3">
    <path d="M120,100 Q140,120 155,140" stroke-linecap="round"/>
    <polygon points="152,143 162,143 155,152" fill="#E53935" stroke="none"/>
  </g>
  <text x="80" y="95" font-family="sans-serif" font-size="20" font-weight="bold" fill="#E53935">nose</text>
</svg>
