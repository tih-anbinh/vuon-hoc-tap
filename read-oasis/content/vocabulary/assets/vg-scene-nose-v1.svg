<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-nose desc-nose">
  <title id="title-nose">Nose - Defined nose and scent swirls</title>
  <desc id="desc-nose">A clearly defined nose in profile with nostrils and gentle aromatic scent ribbons flowing toward it, occupying the center of the frame.</desc>
  <defs>
    <linearGradient id="nose-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aromatic scent ribbons (indicating breathing / smelling function) -->
  <g id="scent-swirls" opacity="0.8">
    <path d="M50 140 C80 120 110 160 145 130 C165 110 190 140 220 160" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M70 170 C100 150 130 190 170 165 C190 150 205 160 225 175" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Little scent blossom -->
    <circle cx="45" cy="140" r="5" fill="#f43f5e"/>
    <circle cx="40" cy="135" r="4" fill="#fda4af"/>
    <circle cx="50" cy="135" r="4" fill="#fda4af"/>
    <circle cx="40" cy="145" r="4" fill="#fda4af"/>
    <circle cx="50" cy="145" r="4" fill="#fda4af"/>
  </g>

  <!-- TARGET OBJECT: NOSE (Occupying 70% canvas) -->
  <g id="nose-figure" filter="url(#soft-shadow)">
    <!-- Soft Head / Face Profile Context Lines -->
    <!-- Forehead down to brow ridge -->
    <path d="M210 35 C215 55 220 75 225 95" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- Philtrum and upper lip below nose -->
    <path d="M255 205 C250 220 260 235 250 250 C240 260 230 268 220 275" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Prominent Nose Profile -->
    <!-- Bridge of nose -> tip -> columella -> base -->
    <path d="M225 95
             C228 115 235 140 250 160
             C262 175 295 175 295 185
             C295 198 275 205 255 205
             C245 205 235 198 235 185
             C235 168 250 165 255 165"
          fill="url(#nose-skin)" stroke="#c2410c" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Nostril Wing (Ala of the nose) -->
    <path d="M255 165
             C272 165 285 175 285 190
             C285 200 270 205 255 205"
          fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>

    <!-- Nostril Opening (Dark curved oval) -->
    <ellipse cx="268" cy="195" rx="9" ry="5.5" fill="#7c2d12" transform="rotate(-15 268 195)"/>

    <!-- Soft highlight on nose tip and bridge -->
    <path d="M235 115 C242 135 252 155 265 170" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <circle cx="282" cy="180" r="5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>