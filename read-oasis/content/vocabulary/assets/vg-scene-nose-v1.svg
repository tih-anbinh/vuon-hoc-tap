<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-nose desc-nose">
  <title id="title-nose">Nose</title>
  <desc id="desc-nose">A friendly child's face with the nose highlighted by a bright ring, clearly pointing out the nose on the face.</desc>
  <defs>
    <radialGradient id="nose-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="nose-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="nose-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#nose-bg)"/>
  <ellipse cx="200" cy="272" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="face" filter="url(#soft-shadow)">
    <ellipse cx="200" cy="160" rx="92" ry="102" fill="url(#nose-skin)" stroke="#c2762e" stroke-width="4"/>
    <path d="M112 128 C120 78 280 78 288 128 C270 108 250 118 232 106 C214 122 186 122 168 106 C150 118 130 108 112 128 Z" fill="url(#nose-hair)"/>
    <ellipse cx="112" cy="168" rx="16" ry="24" fill="url(#nose-skin)" stroke="#c2762e" stroke-width="4"/>
    <ellipse cx="288" cy="168" rx="16" ry="24" fill="url(#nose-skin)" stroke="#c2762e" stroke-width="4"/>

    <ellipse cx="162" cy="150" rx="14" ry="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="164" cy="152" r="7" fill="#5b3a1e"/>
    <circle cx="161" cy="149" r="2.5" fill="#ffffff"/>
    <ellipse cx="238" cy="150" rx="14" ry="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="240" cy="152" r="7" fill="#5b3a1e"/>
    <circle cx="237" cy="149" r="2.5" fill="#ffffff"/>
    <path d="M148 128 Q162 120 178 128" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M224 128 Q238 120 252 128" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>

    <circle cx="140" cy="196" r="14" fill="#fb7185" opacity="0.35"/>
    <circle cx="260" cy="196" r="14" fill="#fb7185" opacity="0.35"/>

    <!-- TARGET: NOSE -->
    <path d="M200 158 C210 178 218 194 214 204 C210 214 190 214 186 204 C182 194 190 178 200 158 Z"
          fill="#f7b98a" stroke="#b5651d" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="192" cy="203" rx="4" ry="3" fill="#7c3a12"/>
    <ellipse cx="208" cy="203" rx="4" ry="3" fill="#7c3a12"/>
    <ellipse cx="200" cy="182" rx="4" ry="9" fill="#ffffff" opacity="0.5"/>

    <path d="M170 228 Q200 250 230 228" fill="none" stroke="#b5651d" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <circle cx="200" cy="192" r="42" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 7"/>
</svg>
