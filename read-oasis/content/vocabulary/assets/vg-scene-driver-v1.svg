<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-driver desc-driver">
  <title id="title-driver">Driver - Bus driver at the steering wheel</title>
  <desc id="desc-driver">A friendly bus driver in uniform and cap sitting behind the big steering wheel of a yellow bus, waving out of the window.</desc>
  <defs>
    <linearGradient id="dv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="dv-bus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#dv-sky)"/>
  <circle cx="352" cy="44" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="80" cy="48" rx="32" ry="11" fill="#ffffff" opacity="0.95"/>
  <!-- road -->
  <rect x="0" y="252" width="400" height="48" fill="#475569"/>
  <line x1="0" y1="252" x2="400" y2="252" stroke="#1e293b" stroke-width="4"/>
  <line x1="0" y1="278" x2="400" y2="278" stroke="#fde047" stroke-width="4" stroke-dasharray="18,14"/>
  <!-- bus front section -->
  <g filter="url(#soft-shadow)">
    <path d="M40,88 Q40,68 64,68 L336,68 Q360,68 360,88 L360,230 Q360,242 348,242 L52,242 Q40,242 40,230 Z"
          fill="url(#dv-bus)" stroke="#a16207" stroke-width="5"/>
    <!-- big driver window -->
    <rect x="64" y="86" width="150" height="92" rx="10" fill="#bae6fd" stroke="#a16207" stroke-width="4"/>
    <!-- passenger windows -->
    <rect x="238" y="86" width="50" height="44" rx="6" fill="#bae6fd" stroke="#a16207" stroke-width="3.5"/>
    <rect x="300" y="86" width="44" height="44" rx="6" fill="#bae6fd" stroke="#a16207" stroke-width="3.5"/>
    <!-- door -->
    <rect x="238" y="142" width="56" height="100" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <line x1="266" y1="142" x2="266" y2="242" stroke="#451a03" stroke-width="3"/>
    <!-- headlight + stripe -->
    <circle cx="60" cy="210" r="11" fill="#fef9c3" stroke="#a16207" stroke-width="3.5"/>
    <rect x="40" y="184" width="320" height="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
    <!-- wheels -->
    <circle cx="110" cy="244" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <circle cx="110" cy="244" r="9" fill="#94a3b8"/>
    <circle cx="310" cy="244" r="24" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <circle cx="310" cy="244" r="9" fill="#94a3b8"/>
  </g>
  <!-- THE DRIVER (hero element) visible in window -->
  <g filter="url(#soft-shadow)">
    <!-- cap -->
    <path d="M104,110 Q104,88 130,86 Q156,88 156,110 L152,114 L108,114 Z" fill="#1d4ed8" stroke="#172554" stroke-width="3.5"/>
    <path d="M104,112 L160,112 L164,120 L104,120 Z" fill="#172554"/>
    <circle cx="130" cy="98" r="5" fill="#fde047" stroke="#a16207" stroke-width="2"/>
    <!-- head -->
    <circle cx="130" cy="132" r="22" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="123" cy="129" r="3" fill="#0f172a"/>
    <circle cx="137" cy="129" r="3" fill="#0f172a"/>
    <path d="M122,141 Q130,147 138,141" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="115" cy="136" rx="5" ry="3.5" fill="#fb7185" opacity="0.5"/>
    <ellipse cx="145" cy="136" rx="5" ry="3.5" fill="#fb7185" opacity="0.5"/>
    <!-- uniform body -->
    <path d="M108,154 L152,154 L158,178 L102,178 Z" fill="#1d4ed8" stroke="#172554" stroke-width="3.5"/>
    <path d="M124,154 L136,154 L133,166 L127,166 Z" fill="#ffffff" stroke="#172554" stroke-width="2"/>
    <!-- waving arm out window -->
    <path d="M152,158 Q186,148 204,126" fill="none" stroke="#1d4ed8" stroke-width="11" stroke-linecap="round"/>
    <circle cx="208" cy="122" r="8" fill="#fcd9b6" stroke="#78350f" stroke-width="2.5"/>
    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M222,112 Q228,120 226,130"/>
      <path d="M230,104 Q240,116 236,130"/>
    </g>
    <!-- steering wheel -->
    <circle cx="96" cy="170" r="17" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="96" cy="170" r="4" fill="#1e293b"/>
    <line x1="96" y1="153" x2="96" y2="166" stroke="#1e293b" stroke-width="3.5"/>
    <line x1="80" y1="170" x2="92" y2="170" stroke="#1e293b" stroke-width="3.5"/>
    <line x1="100" y1="170" x2="112" y2="170" stroke="#1e293b" stroke-width="3.5"/>
    <!-- hand on wheel -->
    <path d="M110,156 Q104,160 102,166" fill="none" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- bus sign board on front -->
  <rect x="308" y="146" width="40" height="24" rx="4" fill="#0f172a"/>
  <g fill="#fde047">
    <circle cx="318" cy="158" r="3"/>
    <circle cx="328" cy="158" r="3"/>
    <circle cx="338" cy="158" r="3"/>
  </g>
</svg>
