<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 300" role="img" aria-labelledby="title-classroom desc-classroom">
  <title id="title-classroom">Classroom - School classroom</title>
  <desc id="desc-classroom">A school classroom scene with a green chalkboard, a teacher's desk with an apple, two student desks and chairs.</desc>
  <defs>
    <linearGradient id="wall-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="desk-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Wall/floor -->
  <rect x="0" y="0" width="400" height="200" fill="url(#wall-cream)"/>
  <rect x="0" y="200" width="400" height="100" fill="#78716c"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#292524" stroke-width="3"/>
  <!-- Floor tiles -->
  <g stroke="#525252" stroke-width="1" opacity="0.5">
    <line x1="0" y1="245" x2="400" y2="240"/>
    <line x1="80" y1="200" x2="60" y2="300"/>
    <line x1="200" y1="200" x2="200" y2="300"/>
    <line x1="320" y1="200" x2="340" y2="300"/>
  </g>
  <g filter="url(#soft-shadow)">
    <!-- Chalkboard -->
    <rect x="55" y="35" width="200" height="110" rx="4" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <rect x="63" y="43" width="184" height="94" rx="2" fill="url(#board-grad)" stroke="#052e16" stroke-width="2"/>
    <!-- Chalk writing (abstract lines) -->
    <line x1="80" y1="65" x2="130" y2="65" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <line x1="140" y1="65" x2="180" y2="65" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <line x1="80" y1="80" x2="220" y2="80" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="80" y1="95" x2="200" y2="95" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <!-- Math symbols on board (using shapes, no text) -->
    <g stroke="#fef9c3" stroke-width="2.5" fill="none">
      <line x1="90" y1="115" x2="102" y2="115"/>
      <line x1="96" y1="109" x2="96" y2="121"/>
      <line x1="115" y1="115" x2="127" y2="115"/>
      <circle cx="140" cy="115" r="4" stroke-width="2"/>
      <line x1="150" y1="115" x2="162" y2="115"/>
      <line x1="156" y1="109" x2="156" y2="121"/>
    </g>
    <!-- Chalk tray -->
    <rect x="55" y="145" width="200" height="8" fill="#451a03" stroke="#292524" stroke-width="2"/>
    <rect x="70" y="146" width="20" height="4" rx="1" fill="#ffffff"/>
    <rect x="100" y="146" width="20" height="4" rx="1" fill="#fbbf24"/>

    <!-- Teacher desk -->
    <rect x="280" y="115" width="90" height="15" rx="2" fill="url(#desk-wood)" stroke="#451a03" stroke-width="2.5"/>
    <path d="M280 130 L295 145 L370 145 L370 130 Z" fill="#b45309" stroke="#451a03" stroke-width="2.5"/>
    <rect x="290" y="145" width="10" height="45" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="355" y="145" width="10" height="45" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Apple on teacher desk -->
    <circle cx="325" cy="105" r="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M325 95 Q328 92 331 95" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="322" cy="98" rx="1.5" ry="3" fill="#166534"/>

    <!-- Student desk 1 -->
    <rect x="55" y="210" width="80" height="10" rx="2" fill="url(#desk-wood)" stroke="#451a03" stroke-width="2.5"/>
    <rect x="62" y="220" width="8" height="35" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="120" y="220" width="8" height="35" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Book on desk 1 -->
    <rect x="75" y="200" width="30" height="12" rx="1" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
    <line x1="90" y1="200" x2="90" y2="212" stroke="#1e3a8a" stroke-width="1"/>
    <!-- Chair 1 -->
    <rect x="80" y="260" width="30" height="6" fill="#78716c" stroke="#292524" stroke-width="2"/>
    <rect x="80" y="240" width="30" height="4" fill="#78716c" stroke="#292524" stroke-width="1.5"/>
    <line x1="82" y1="244" x2="82" y2="285" stroke="#292524" stroke-width="2.5"/>
    <line x1="108" y1="244" x2="108" y2="285" stroke="#292524" stroke-width="2.5"/>

    <!-- Student desk 2 -->
    <rect x="165" y="210" width="80" height="10" rx="2" fill="url(#desk-wood)" stroke="#451a03" stroke-width="2.5"/>
    <rect x="172" y="220" width="8" height="35" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="230" y="220" width="8" height="35" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Pencil on desk 2 -->
    <rect x="180" y="205" width="35" height="5" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <path d="M215 205 L222 208 L215 210 Z" fill="#1c1917"/>
    <!-- Chair 2 -->
    <rect x="190" y="260" width="30" height="6" fill="#78716c" stroke="#292524" stroke-width="2"/>
    <rect x="190" y="240" width="30" height="4" fill="#78716c" stroke="#292524" stroke-width="1.5"/>
    <line x1="192" y1="244" x2="192" y2="285" stroke="#292524" stroke-width="2.5"/>
    <line x1="218" y1="244" x2="218" y2="285" stroke="#292524" stroke-width="2.5"/>

    <!-- Clock -->
    <circle cx="330" cy="50" r="18" fill="#fef9c3" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="330" cy="50" r="2" fill="#78350f"/>
    <line x1="330" y1="50" x2="330" y2="40" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="330" y1="50" x2="338" y2="52" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>