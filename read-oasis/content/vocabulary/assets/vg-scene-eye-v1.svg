<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-eye desc-eye">
  <title id="title-eye">eye</title>
  <desc id="desc-eye">A close-up of a friendly eye with colourful iris and eyelashes.</desc>
  <rect width="400" height="300" rx="20" fill="#E8EAF6"/>
  <g transform="translate(200, 150)">
    <!-- Eye shape -->
    <path d="M-80,0 Q-40,-50 0,-55 Q40,-50 80,0 Q40,50 0,55 Q-40,50 -80,0" fill="white" stroke="#5C6BC0" stroke-width="3"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="35" fill="#64B5F6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#42A5F5" stroke-width="2"/>
    <!-- Iris pattern -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E88E5" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1565C0" stroke-width="1" opacity="0.3"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="14" fill="#1A237E"/>
    <!-- Light reflection -->
    <circle cx="-8" cy="-10" r="8" fill="white" opacity="0.7"/>
    <circle cx="6" cy="8" r="4" fill="white" opacity="0.4"/>
    <!-- Eyelashes top -->
    <g stroke="#5D4037" stroke-width="2.5" stroke-linecap="round">
      <line x1="-60" y1="-25" x2="-55" y2="-35"/>
      <line x1="-40" y1="-40" x2="-38" y2="-52"/>
      <line x1="-15" y1="-50" x2="-12" y2="-62"/>
      <line x1="10" y1="-52" x2="12" y2="-64"/>
      <line x1="35" y1="-44" x2="38" y2="-56"/>
      <line x1="55" y1="-30" x2="58" y2="-40"/>
    </g>
  </g>
</svg>
