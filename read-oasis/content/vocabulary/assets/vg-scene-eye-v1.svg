<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-eye desc-eye">
  <title id="title-eye">Eye</title>
  <desc id="desc-eye">A friendly child's face with one eye highlighted by a bright ring, clearly pointing out the eye on the face.</desc>
  <defs>
    <radialGradient id="eye-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <linearGradient id="eye-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="eye-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#eye-bg)"/>
  <ellipse cx="200" cy="272" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="face" filter="url(#soft-shadow)">
    <ellipse cx="200" cy="160" rx="92" ry="102" fill="url(#eye-skin)" stroke="#c2762e" stroke-width="4"/>
    <path d="M112 128 C120 78 280 78 288 128 C270 108 250 118 232 106 C214 122 186 122 168 106 C150 118 130 108 112 128 Z" fill="url(#eye-hair)"/>
    <ellipse cx="112" cy="168" rx="16" ry="24" fill="url(#eye-skin)" stroke="#c2762e" stroke-width="4"/>
    <ellipse cx="288" cy="168" rx="16" ry="24" fill="url(#eye-skin)" stroke="#c2762e" stroke-width="4"/>

    <!-- TARGET: EYE (left, large & detailed) -->
    <ellipse cx="162" cy="150" rx="24" ry="22" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <circle cx="164" cy="151" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <circle cx="164" cy="151" r="6" fill="#0f172a"/>
    <circle cx="159" cy="146" r="4" fill="#ffffff"/>
    <path d="M138 132 Q162 118 186 132" fill="none" stroke="#5b3a1e" stroke-width="5" stroke-linecap="round"/>

    <!-- Other eye (simpler) -->
    <ellipse cx="238" cy="150" rx="14" ry="15" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="240" cy="151" r="7" fill="#3b82f6"/>
    <circle cx="240" cy="151" r="3" fill="#0f172a"/>
    <path d="M224 132 Q238 122 252 132" fill="none" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round"/>

    <circle cx="140" cy="196" r="14" fill="#fb7185" opacity="0.35"/>
    <circle cx="260" cy="196" r="14" fill="#fb7185" opacity="0.35"/>
    <path d="M200 172 C208 188 214 200 210 208 C206 216 194 216 190 208 C186 200 192 188 200 172 Z" fill="#f7b98a" stroke="#b5651d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M172 232 Q200 252 228 232" fill="none" stroke="#b5651d" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <circle cx="162" cy="150" r="40" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 7"/>
</svg>
