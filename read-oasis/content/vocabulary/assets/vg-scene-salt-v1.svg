<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-salt desc-salt">
  <title id="title-salt">Salt</title>
  <desc id="desc-salt">A glass salt shaker with a metal top sprinkling white salt grains onto food.</desc>
  <defs>
    <linearGradient id="salt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="salt-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#salt-bg)"/>
  <ellipse cx="200" cy="272" rx="120" ry="14" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)" transform="rotate(18 200 150)">
    <!-- Glass body -->
    <path d="M155 110 L245 110 L235 220 L165 220 Z" fill="url(#salt-glass)" stroke="#94a3b8" stroke-width="4"/>
    <!-- Salt fill -->
    <path d="M160 160 L240 160 L235 220 L165 220 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g fill="#e2e8f0"><circle cx="180" cy="180" r="3"/><circle cx="205" cy="195" r="3"/><circle cx="225" cy="175" r="3"/><circle cx="195" cy="210" r="3"/></g>
    <!-- Metal cap -->
    <rect x="150" y="85" width="100" height="30" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3.5"/>
    <!-- Holes -->
    <g fill="#64748b"><circle cx="170" cy="90" r="3"/><circle cx="185" cy="88" r="3"/><circle cx="200" cy="87" r="3"/><circle cx="215" cy="88" r="3"/><circle cx="230" cy="90" r="3"/></g>
  </g>

  <!-- Sprinkling salt grains -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1">
    <rect x="235" y="130" width="6" height="6" rx="1" transform="rotate(20 238 133)"/>
    <rect x="255" y="150" width="6" height="6" rx="1" transform="rotate(35 258 153)"/>
    <rect x="245" y="175" width="6" height="6" rx="1" transform="rotate(15 248 178)"/>
    <rect x="270" y="170" width="5" height="5" rx="1" transform="rotate(30 272 172)"/>
    <rect x="258" y="200" width="6" height="6" rx="1" transform="rotate(25 261 203)"/>
  </g>

  <!-- Food (plate) -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="270" cy="235" rx="70" ry="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="270" cy="232" rx="42" ry="12" fill="#f97316" opacity="0.85"/>
  </g>
</svg>
