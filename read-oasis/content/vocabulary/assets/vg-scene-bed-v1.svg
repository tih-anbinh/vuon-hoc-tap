<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-bed desc-bed">
  <title id="title-bed">Bed - Cozy wooden bed</title>
  <desc id="desc-bed">A cozy wooden bed with a carved headboard, fluffy pillow, and patterned duvet blanket, occupying the center of the frame.</desc>
  <defs>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="30" y1="265" x2="370" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground shadow -->
  <ellipse cx="205" cy="265" rx="140" ry="12" fill="#0f172a" opacity="0.15"/>

  <!-- TARGET OBJECT: BED (Occupying 70% canvas) -->
  <g id="bed-figure" filter="url(#soft-shadow)">
    <!-- Tall Wooden Headboard (Rear) -->
    <!-- Rear Left Post -->
    <rect x="55" y="70" width="16" height="175" rx="4" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3"/>
    <circle cx="63" cy="65" r="7" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>
    <!-- Headboard Panel -->
    <rect x="71" y="90" width="18" height="90" rx="3" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
    <!-- Headboard Arch -->
    <path d="M71 90 C71 75 140 70 145 90 L145 150 L71 150 Z" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3"/>
    <!-- Rear Right Post -->
    <rect x="145" y="85" width="14" height="110" rx="4" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3"/>
    <circle cx="152" cy="80" r="6" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>

    <!-- Mattress Base / Bed Frame (3D Perspective) -->
    <polygon points="70,165 310,185 345,210 100,210" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

    <!-- Fluffy Pillow at Head -->
    <path d="M85 145 C85 130 135 130 150 145 C155 160 145 175 125 175 C95 175 85 160 85 145 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M98 152 Q120 158 135 152" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

    <!-- Cozy Quilt / Duvet (Covering mattress) -->
    <polygon points="120,155 310,175 345,225 130,215" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
    <!-- Quilt Fold / Turn-down at Top -->
    <polygon points="120,155 140,156 150,178 130,176" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>

    <!-- Quilt Overhang / Valance (Draping down the front side) -->
    <polygon points="130,215 345,225 345,245 130,240" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>

    <!-- Decorative Stars on Quilt -->
    <!-- Star 1 -->
    <polygon points="180,185 183,191 190,191 185,195 187,201 180,197 173,201 175,195 170,191 177,191" fill="#fef08a"/>
    <!-- Star 2 -->
    <polygon points="245,195 248,201 255,201 250,205 252,211 245,207 238,211 240,205 235,201 242,201" fill="#fef08a"/>
    <!-- Star 3 -->
    <polygon points="295,190 297,195 303,195 299,198 301,203 295,200 289,203 291,198 287,195 293,195" fill="#fef08a"/>

    <!-- Wooden Bed Frame Side Rail -->
    <polygon points="80,210 345,225 345,242 80,230" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3"/>

    <!-- Wooden Footboard (Front Right) -->
    <!-- Footboard Panel -->
    <polygon points="310,185 345,185 345,245 310,245" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <!-- Front Right Wooden Post & Leg -->
    <rect x="340" y="160" width="16" height="98" rx="4" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3.5"/>
    <circle cx="348" cy="155" r="6.5" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>

    <!-- Front Left Wooden Post & Leg -->
    <rect x="75" y="195" width="14" height="63" rx="3" fill="url(#wood-grad)" stroke="#451a03" stroke-width="3.5"/>
  </g>
</svg>