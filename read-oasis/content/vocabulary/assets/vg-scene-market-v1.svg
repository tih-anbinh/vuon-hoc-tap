<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-market desc-market">
  <title id="title-market">Market - A colourful fruit and vegetable market</title>
  <desc id="desc-market">A market stall with a striped awning, baskets full of apples, oranges and bananas, vegetables on display, and a person buying fruit.</desc>
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#mk-bg)"/>
  <circle cx="52" cy="46" r="20" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <rect x="0" y="244" width="400" height="56" fill="#d6d3d1"/>
  <line x1="0" y1="244" x2="400" y2="244" stroke="#57534e" stroke-width="3.5"/>
  <!-- MARKET STALL (hero element) -->
  <g filter="url(#soft-shadow)">
    <!-- posts -->
    <rect x="84" y="74" width="10" height="176" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <rect x="316" y="74" width="10" height="176" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <!-- striped awning -->
    <path d="M64,80 L346,80 L332,42 L78,42 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
    <g fill="#ef4444">
      <path d="M92,42 L120,42 L116,80 L86,80 Z"/>
      <path d="M148,42 L176,42 L174,80 L144,80 Z"/>
      <path d="M204,42 L232,42 L232,80 L202,80 Z"/>
      <path d="M260,42 L288,42 L290,80 L260,80 Z"/>
      <path d="M316,42 L332,42 L346,80 L318,80 Z"/>
    </g>
    <!-- scalloped edge -->
    <g fill="#f8fafc" stroke="#1e293b" stroke-width="3">
      <path d="M64,80 Q78,94 92,80"/>
      <path d="M92,80 Q106,94 120,80"/>
      <path d="M120,80 Q134,94 148,80"/>
      <path d="M148,80 Q162,94 176,80"/>
      <path d="M176,80 Q190,94 204,80"/>
      <path d="M204,80 Q218,94 232,80"/>
      <path d="M232,80 Q246,94 260,80"/>
      <path d="M260,80 Q274,94 288,80"/>
      <path d="M288,80 Q302,94 316,80"/>
      <path d="M316,80 Q330,94 346,80"/>
    </g>
    <!-- counter table -->
    <rect x="96" y="164" width="214" height="16" rx="4" fill="#b45309" stroke="#78350f" stroke-width="4"/>
    <rect x="104" y="180" width="198" height="64" fill="#d97706" stroke="#78350f" stroke-width="4"/>
    <line x1="150" y1="180" x2="150" y2="244" stroke="#78350f" stroke-width="3"/>
    <line x1="256" y1="180" x2="256" y2="244" stroke="#78350f" stroke-width="3"/>
    <!-- basket of apples -->
    <g>
      <path d="M112,148 L168,148 L162,166 L118,166 Z" fill="#a16207" stroke="#78350f" stroke-width="3.5"/>
      <g fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5">
        <circle cx="126" cy="142" r="9"/>
        <circle cx="144" cy="140" r="9"/>
        <circle cx="160" cy="143" r="9"/>
        <circle cx="135" cy="132" r="9"/>
        <circle cx="152" cy="131" r="9"/>
      </g>
      <line x1="135" y1="125" x2="136" y2="120" stroke="#14532d" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- basket of oranges -->
    <g>
      <path d="M180,148 L236,148 L230,166 L186,166 Z" fill="#a16207" stroke="#78350f" stroke-width="3.5"/>
      <g fill="#fb923c" stroke="#9a3412" stroke-width="2.5">
        <circle cx="194" cy="142" r="9"/>
        <circle cx="212" cy="140" r="9"/>
        <circle cx="228" cy="143" r="9"/>
        <circle cx="203" cy="132" r="9"/>
        <circle cx="220" cy="131" r="9"/>
      </g>
    </g>
    <!-- bananas -->
    <g>
      <path d="M248,148 L300,148 L294,166 L254,166 Z" fill="#a16207" stroke="#78350f" stroke-width="3.5"/>
      <g fill="#fde047" stroke="#a16207" stroke-width="2.5">
        <path d="M252,140 Q268,126 288,132 Q272,140 256,146 Z"/>
        <path d="M258,132 Q274,118 294,124 Q278,132 262,138 Z"/>
      </g>
    </g>
    <!-- veggies on front counter: carrots + tomatoes -->
    <g>
      <g fill="#fb923c" stroke="#9a3412" stroke-width="2.5">
        <path d="M116,206 L142,198 L140,208 L118,214 Z"/>
        <path d="M116,222 L142,216 L140,226 L118,230 Z"/>
      </g>
      <g stroke="#16a34a" stroke-width="3" stroke-linecap="round">
        <line x1="142" y1="200" x2="148" y2="196"/>
        <line x1="142" y1="219" x2="148" y2="215"/>
      </g>
      <g fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5">
        <circle cx="176" cy="210" r="10"/>
        <circle cx="200" cy="212" r="10"/>
        <circle cx="188" cy="226" r="10"/>
      </g>
      <g fill="#84cc16" stroke="#3f6212" stroke-width="2.5">
        <ellipse cx="276" cy="210" rx="14" ry="10"/>
        <ellipse cx="276" cy="228" rx="14" ry="10"/>
      </g>
    </g>
  </g>
  <!-- shopper -->
  <g filter="url(#soft-shadow)">
    <path d="M28,148 Q26,126 52,124 Q78,126 76,148 L70,152 Q52,138 34,152 Z" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="52" cy="156" r="21" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <circle cx="45" cy="153" r="2.6" fill="#0f172a"/>
    <circle cx="59" cy="153" r="2.6" fill="#0f172a"/>
    <path d="M45,163 Q52,169 59,163" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38,176 L66,176 L72,236 L32,236 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3.5"/>
    <path d="M64,184 Q84,192 94,200" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <!-- shopping bag -->
    <path d="M84,204 L112,204 L108,238 L88,238 Z" fill="#16a34a" stroke="#14532d" stroke-width="3.5"/>
    <path d="M90,204 Q98,192 106,204" fill="none" stroke="#14532d" stroke-width="3"/>
    <line x1="42" y1="236" x2="42" y2="250" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <line x1="60" y1="236" x2="60" y2="250" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="41" cy="255" rx="11" ry="5" fill="#334155"/>
    <ellipse cx="62" cy="255" rx="11" ry="5" fill="#334155"/>
  </g>
</svg>
