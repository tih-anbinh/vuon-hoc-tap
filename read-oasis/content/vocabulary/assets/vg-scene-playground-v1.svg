<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-playground desc-playground">
  <title id="title-playground">Playground - Slide, swing and seesaw</title>
  <desc id="desc-playground">A colorful playground with a red slide, a swing set with a child swinging, and a seesaw, on green grass under a sunny sky.</desc>
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#pg-bg)"/>
  <circle cx="52" cy="48" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="320" cy="50" rx="34" ry="12" fill="#ffffff" opacity="0.95"/>
  <rect x="0" y="240" width="400" height="60" fill="#65a30d"/>
  <path d="M0,240 Q100,233 200,240 T400,240 L400,250 L0,250 Z" fill="#86efac" opacity="0.6"/>
  <!-- slide -->
  <g filter="url(#soft-shadow)">
    <!-- ladder -->
    <line x1="48" y1="245" x2="48" y2="120" stroke="#475569" stroke-width="6"/>
    <line x1="78" y1="245" x2="78" y2="120" stroke="#475569" stroke-width="6"/>
    <g stroke="#475569" stroke-width="4">
      <line x1="48" y1="230" x2="78" y2="230"/>
      <line x1="48" y1="205" x2="78" y2="205"/>
      <line x1="48" y1="180" x2="78" y2="180"/>
      <line x1="48" y1="155" x2="78" y2="155"/>
    </g>
    <!-- platform -->
    <rect x="42" y="108" width="70" height="14" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- slide chute -->
    <path d="M108,112 Q160,170 185,238 L160,246 Q138,185 92,128 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="4"/>
    <path d="M104,116 Q152,172 174,240" fill="none" stroke="#fca5a5" stroke-width="5" opacity="0.8"/>
  </g>
  <!-- swing set with child -->
  <g filter="url(#soft-shadow)">
    <line x1="215" y1="245" x2="250" y2="95" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="345" y1="245" x2="310" y2="95" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="245" y1="98" x2="315" y2="98" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <!-- swing chains (swung forward) -->
    <line x1="268" y1="100" x2="248" y2="185" stroke="#64748b" stroke-width="4"/>
    <line x1="296" y1="100" x2="278" y2="185" stroke="#64748b" stroke-width="4"/>
    <!-- seat -->
    <rect x="238" y="182" width="52" height="10" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- child on swing -->
    <circle cx="263" cy="140" r="17" fill="#fcd9b6" stroke="#78350f" stroke-width="3"/>
    <path d="M246,137 Q247,120 263,120 Q279,120 280,137 Q272,126 263,126 Q254,126 246,137 Z" fill="#451a03"/>
    <circle cx="258" cy="142" r="2.5" fill="#0f172a"/>
    <circle cx="269" cy="142" r="2.5" fill="#0f172a"/>
    <path d="M258,149 Q263,153 269,149" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M254,156 L274,156 L278,184 L250,184 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
    <!-- legs kicked forward -->
    <path d="M256,184 Q244,196 236,196" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <path d="M272,184 Q262,198 254,200" fill="none" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="232" cy="196" rx="8" ry="5" fill="#dc2626"/>
    <ellipse cx="250" cy="201" rx="8" ry="5" fill="#dc2626"/>
    <!-- arms holding chains -->
    <path d="M252,160 L250,140" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round"/>
    <path d="M276,160 L280,140" stroke="#fcd9b6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- motion arcs behind swing -->
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="7,7" fill="none" opacity="0.7">
    <path d="M300,180 Q315,155 312,130"/>
  </g>
  <!-- seesaw -->
  <g filter="url(#soft-shadow)">
    <path d="M120,278 L145,252 L170,278 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3.5"/>
    <rect x="72" y="248" width="146" height="11" rx="5" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3" transform="rotate(-9 145 254)"/>
    <circle cx="86" cy="242" r="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
    <circle cx="204" cy="262" r="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
  </g>
</svg>
