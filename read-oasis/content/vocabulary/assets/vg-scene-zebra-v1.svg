<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-zebra desc-zebra">
  <title id="title-zebra">Zebra - Black and white striped zebra</title>
  <desc id="desc-zebra">A friendly zebra with bold black and white stripes, a standing mane and tufted tail, grazing on the African savanna with a tree behind.</desc>
  <defs>
    <linearGradient id="zb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#zb-bg)"/>
  <circle cx="345" cy="50" r="26" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <!-- acacia tree -->
  <g>
    <rect x="52" y="120" width="10" height="80" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
    <path d="M12,120 Q57,80 102,120 Q57,132 12,120 Z" fill="#65a30d" stroke="#3f6212" stroke-width="3"/>
  </g>
  <!-- savanna ground -->
  <rect x="0" y="230" width="400" height="70" fill="#d9f99d"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#65a30d" stroke-width="3.5"/>
  <ellipse cx="215" cy="262" rx="145" ry="13" fill="#0f172a" opacity="0.2"/>
  <!-- zebra -->
  <g filter="url(#soft-shadow)">
    <!-- tail with tuft -->
    <path d="M322,160 Q344,178 340,204" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <path d="M336,200 Q348,212 340,222 Q330,218 334,206 Z" fill="#0f172a"/>
    <!-- body -->
    <ellipse cx="240" cy="180" rx="86" ry="52" fill="#f8fafc" stroke="#0f172a" stroke-width="4.5"/>
    <!-- body stripes -->
    <g fill="#0f172a">
      <path d="M188,136 Q196,164 188,196 L176,190 Q184,164 178,142 Z"/>
      <path d="M218,130 Q226,162 218,206 L206,202 Q214,164 208,132 Z"/>
      <path d="M248,128 Q256,162 248,210 L236,206 Q244,164 238,130 Z"/>
      <path d="M278,132 Q286,162 278,204 L266,200 Q274,162 268,134 Z"/>
      <path d="M306,142 Q314,166 306,192 L296,188 Q302,164 296,146 Z"/>
    </g>
    <!-- legs with stripes -->
    <g>
      <rect x="180" y="216" width="18" height="52" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
      <rect x="216" y="222" width="18" height="46" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
      <rect x="258" y="222" width="18" height="46" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
      <rect x="294" y="216" width="18" height="52" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/>
      <g fill="#0f172a">
        <rect x="182" y="230" width="14" height="7" rx="3"/>
        <rect x="182" y="246" width="14" height="7" rx="3"/>
        <rect x="218" y="234" width="14" height="7" rx="3"/>
        <rect x="218" y="250" width="14" height="7" rx="3"/>
        <rect x="260" y="234" width="14" height="7" rx="3"/>
        <rect x="260" y="250" width="14" height="7" rx="3"/>
        <rect x="296" y="230" width="14" height="7" rx="3"/>
        <rect x="296" y="246" width="14" height="7" rx="3"/>
      </g>
      <!-- hooves -->
      <rect x="180" y="262" width="18" height="10" rx="4" fill="#0f172a"/>
      <rect x="216" y="260" width="18" height="10" rx="4" fill="#0f172a"/>
      <rect x="258" y="260" width="18" height="10" rx="4" fill="#0f172a"/>
      <rect x="294" y="262" width="18" height="10" rx="4" fill="#0f172a"/>
    </g>
    <!-- neck lowered to graze -->
    <path d="M168,150 Q136,158 118,190 L150,204 Q164,178 186,172 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <g fill="#0f172a">
      <path d="M158,158 Q150,170 144,182 L136,178 Q144,164 150,156 Z"/>
      <path d="M176,152 Q166,166 158,184 L150,180 Q160,162 168,150 Z"/>
    </g>
    <!-- standing mane along neck -->
    <path d="M170,146 L178,134 L182,148 L192,138 L194,152 L204,144 L204,156 L186,168 Q176,158 170,146 Z" fill="#0f172a"/>
    <!-- head grazing down -->
    <path d="M112,186 Q98,190 94,208 Q92,224 106,228 Q122,232 130,220 Q138,206 134,194 Q126,184 112,186 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <!-- muzzle -->
    <path d="M96,214 Q90,226 100,230 Q112,234 116,226 Q112,216 96,214 Z" fill="#0f172a"/>
    <!-- eye -->
    <circle cx="118" cy="200" r="5" fill="#0f172a"/>
    <circle cx="120" cy="198" r="1.8" fill="#ffffff"/>
    <!-- ears -->
    <path d="M124,184 L130,168 L138,182 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <path d="M136,186 L146,172 L150,186 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <!-- head stripes -->
    <path d="M126,190 Q120,196 118,206 L112,204 Q116,194 120,188 Z" fill="#0f172a"/>
  </g>
  <!-- grass tufts -->
  <g stroke="#65a30d" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M60,268 Q58,252 64,242"/>
    <path d="M74,270 Q76,254 70,246"/>
    <path d="M356,268 Q354,250 362,240"/>
    <path d="M372,270 Q374,254 368,246"/>
    <path d="M120,250 Q118,240 124,232"/>
  </g>
</svg>
