<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hair desc-hair">
  <title id="title-hair">hair</title>
  <desc id="desc-hair">A child's head showing their brown hair with an arrow pointing to it.</desc>
  <rect width="400" height="300" rx="20" fill="#FCE4EC"/>
  <g transform="translate(200, 160)">
    <!-- Head -->
    <circle cx="0" cy="0" r="60" fill="#FFCC80" stroke="#F9A825" stroke-width="2.5"/>
    <!-- Hair (prominent, highlighted) -->
    <path d="M-55,-20 Q-50,-60 -30,-70 Q-10,-78 0,-75 Q10,-78 30,-70 Q50,-60 55,-20 Q50,-30 40,-40 Q20,-55 0,-52 Q-20,-55 -40,-40 Q-50,-30 -55,-20" fill="#5D4037" stroke="#4E342E" stroke-width="2.5"/>
    <!-- Hair strands -->
    <path d="M-30,-65 Q-25,-72 -20,-65" fill="none" stroke="#4E342E" stroke-width="2" opacity="0.5"/>
    <path d="M0,-72 Q5,-80 10,-72" fill="none" stroke="#4E342E" stroke-width="2" opacity="0.5"/>
    <path d="M20,-68 Q25,-75 30,-68" fill="none" stroke="#4E342E" stroke-width="2" opacity="0.5"/>
    <!-- Face -->
    <circle cx="-18" cy="-5" r="5" fill="#4E342E"/>
    <circle cx="18" cy="-5" r="5" fill="#4E342E"/>
    <path d="M-8,18 Q0,24 8,18" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-28" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
    <circle cx="28" cy="10" r="6" fill="#F48FB1" opacity="0.3"/>
  </g>
  <!-- Arrow pointing to hair -->
  <g fill="none" stroke="#E53935" stroke-width="3">
    <path d="M310,70 Q280,75 250,85" stroke-linecap="round"/>
    <polygon points="248,80 242,90 254,88" fill="#E53935" stroke="none"/>
  </g>
  <text x="315" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#E53935">hair</text>
</svg>
