<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-hair desc-hair">
  <title id="title-hair">Hair</title>
  <desc id="desc-hair">A friendly child's face with a full head of hair highlighted by a bright ring, clearly pointing out the hair.</desc>
  <defs>
    <radialGradient id="hair-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </radialGradient>
    <linearGradient id="hair-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#fcc79a"/>
    </linearGradient>
    <linearGradient id="hair-color" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#5b3a1e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#hair-bg)"/>
  <ellipse cx="200" cy="272" rx="110" ry="16" fill="#0f172a" opacity="0.12"/>

  <g id="face" filter="url(#soft-shadow)">
    <!-- TARGET: HAIR (big flowing hair, dominant) -->
    <path d="M200 42
             C120 42 86 108 96 170
             C100 196 80 210 78 236
             C104 220 112 236 118 250
             C122 224 128 214 130 200
             C118 150 128 96 200 96
             C272 96 282 150 270 200
             C272 214 278 224 282 250
             C288 236 296 220 322 236
             C320 210 300 196 304 170
             C314 108 280 42 200 42 Z"
          fill="url(#hair-color)" stroke="#3f2a12" stroke-width="4" stroke-linejoin="round"/>
    <!-- Hair strand highlights -->
    <path d="M150 70 C130 110 128 150 138 190" fill="none" stroke="#ca9a3f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M250 70 C270 110 272 150 262 190" fill="none" stroke="#ca9a3f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Face -->
    <ellipse cx="200" cy="168" rx="78" ry="86" fill="url(#hair-skin)" stroke="#c2762e" stroke-width="4"/>
    <!-- Fringe over forehead -->
    <path d="M126 130 C138 96 262 96 274 130 C256 116 236 124 220 112 C206 126 194 126 180 112 C164 124 144 116 126 130 Z" fill="url(#hair-color)"/>

    <ellipse cx="172" cy="160" rx="12" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="174" cy="162" r="6" fill="#5b3a1e"/>
    <ellipse cx="228" cy="160" rx="12" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <circle cx="230" cy="162" r="6" fill="#5b3a1e"/>
    <path d="M198 175 C205 187 210 196 206 202 C202 208 194 208 190 202 C186 196 191 187 198 175 Z" fill="#f7b98a" stroke="#b5651d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="152" cy="200" r="12" fill="#fb7185" opacity="0.35"/>
    <circle cx="248" cy="200" r="12" fill="#fb7185" opacity="0.35"/>
    <path d="M174 220 Q200 238 226 220" fill="none" stroke="#b5651d" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <circle cx="200" cy="120" r="60" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 7"/>
</svg>
