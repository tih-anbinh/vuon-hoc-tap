<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-handbag desc-handbag">
  <title id="title-handbag">Handbag - Stylish purple handbag with handle</title>
  <desc id="desc-handbag">A purple handbag with a rounded handle, a golden clasp, front pocket and stitching details.</desc>
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="hb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#hb-bg)"/>
  <ellipse cx="200" cy="262" rx="130" ry="9" fill="#0f172a" opacity="0.22"/>
  <g filter="url(#soft-shadow)">
    <!-- handle -->
    <path d="M145,120 Q145,45 200,45 Q255,45 255,120" fill="none" stroke="#581c87" stroke-width="14" stroke-linecap="round"/>
    <path d="M145,120 Q145,52 200,52 Q255,52 255,120" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M105,120 L295,120 Q310,120 312,138 L320,235 Q320,252 302,252 L98,252 Q80,252 80,235 L88,138 Q90,120 105,120 Z" fill="url(#hb-body)" stroke="#581c87" stroke-width="4"/>
    <!-- top flap -->
    <path d="M100,120 L300,120 L296,160 Q200,175 104,160 Z" fill="#9333ea" stroke="#581c87" stroke-width="3"/>
    <!-- stitching -->
    <path d="M108,168 Q200,182 292,168" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
    <path d="M95,240 L305,240" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- golden clasp -->
    <circle cx="200" cy="160" r="13" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="200" cy="160" r="5" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
    <!-- front pocket -->
    <path d="M155,195 L245,195 Q252,195 252,203 L252,235 Q252,243 244,243 L156,243 Q148,243 148,235 L148,203 Q148,195 155,195 Z" fill="#a855f7" stroke="#581c87" stroke-width="3" opacity="0.9"/>
    <!-- highlight -->
    <ellipse cx="130" cy="145" rx="12" ry="20" fill="#e9d5ff" opacity="0.4" transform="rotate(-15 130 145)"/>
  </g>
</svg>
