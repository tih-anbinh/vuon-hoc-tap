<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-shower desc-shower">
  <title id="title-shower">Shower</title>
  <desc id="desc-shower">A shower head on the wall spraying streams of water down into a tiled shower stall.</desc>
  <defs>
    <linearGradient id="shower-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#shower-bg)"/>
  <!-- Tile lines -->
  <g stroke="#a5f3fc" stroke-width="2" opacity="0.7">
    <line x1="0" y1="90" x2="400" y2="90"/><line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="130" y1="0" x2="130" y2="300"/><line x1="270" y1="0" x2="270" y2="300"/>
  </g>
  <ellipse cx="200" cy="275" rx="130" ry="16" fill="#0f172a" opacity="0.1"/>

  <g filter="url(#soft-shadow)">
    <!-- Pipe -->
    <path d="M200 20 L200 55 L150 55" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <!-- Shower head -->
    <path d="M100 55 L155 55 L145 80 L110 80 Z" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
    <ellipse cx="127" cy="80" rx="20" ry="6" fill="#64748b"/>
    <g fill="#334155"><circle cx="115" cy="80" r="2"/><circle cx="127" cy="81" r="2"/><circle cx="139" cy="80" r="2"/></g>
  </g>

  <!-- Water streams -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="112" y1="88" x2="105" y2="200"/>
    <line x1="122" y1="88" x2="118" y2="215"/>
    <line x1="132" y1="88" x2="135" y2="200"/>
    <line x1="142" y1="88" x2="150" y2="215"/>
  </g>
  <!-- Water droplets -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="103" cy="215" r="4"/><circle cx="120" cy="230" r="4"/><circle cx="138" cy="218" r="4"/><circle cx="152" cy="232" r="4"/>
  </g>

  <!-- Floor drain / tray -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="127" cy="248" rx="60" ry="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="127" cy="246" rx="14" ry="5" fill="#94a3b8"/>
  </g>
</svg>
