<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-dad desc-dad">
  <title id="title-dad">Dad - Father giving his child a piggyback ride</title>
  <desc id="desc-dad">A smiling father carrying his small child on his shoulders, both laughing, in a sunny park.</desc>
  <defs>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#dd-bg)"/>
  <circle cx="60" cy="50" r="26" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <rect x="0" y="250" width="400" height="50" fill="#4d7c0f"/>
  <path d="M0,250 Q100,242 200,250 T400,250 L400,260 L0,260 Z" fill="#65a30d"/>
  <!-- tree -->
  <g filter="url(#soft-shadow)">
    <rect x="320" y="180" width="18" height="72" rx="5" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="329" cy="150" r="45" fill="#22c55e" stroke="#15803d" stroke-width="3.5"/>
    <circle cx="302" cy="168" r="28" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
    <circle cx="356" cy="168" r="28" fill="#4ade80" stroke="#15803d" stroke-width="3"/>
  </g>
  <ellipse cx="180" cy="262" rx="90" ry="9" fill="#0f172a" opacity="0.25"/>
  <!-- child on shoulders -->
  <g filter="url(#soft-shadow)">
    <circle cx="180" cy="55" r="24" fill="#fcd9b6" stroke="#78350f" stroke-width="3.5"/>
    <path d="M156,50 Q157,28 180,29 Q203,28 204,50 Q196,38 180,38 Q164,38 156,50 Z" fill="#a16207"/>
    <circle cx="172" cy="54" r="3.5" fill="#0f172a"/>
    <circle cx="188" cy="54" r="3.5" fill="#0f172a"/>
    <path d="M171,65 Q180,72 189,65" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- little body -->
    <rect x="164" y="78" width="32" height="34" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- arms raised happy -->
    <line x1="164" y1="86" x2="140" y2="66" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <line x1="196" y1="86" x2="220" y2="66" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
    <!-- legs over dad's shoulders -->
    <path d="M166,112 Q152,124 154,138" fill="none" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
    <path d="M194,112 Q208,124 206,138" fill="none" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- dad -->
  <g filter="url(#soft-shadow)">
    <circle cx="180" cy="145" r="34" fill="#f5b26b" stroke="#78350f" stroke-width="3.5"/>
    <path d="M146,138 Q148,108 180,110 Q212,108 214,138 Q204,122 180,122 Q156,122 146,138 Z" fill="#0f172a"/>
    <circle cx="169" cy="143" r="4" fill="#0f172a"/>
    <circle cx="191" cy="143" r="4" fill="#0f172a"/>
    <path d="M167,158 Q180,167 193,158" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M150,182 L210,182 L218,255 L142,255 Z" fill="#0e7490" stroke="#164e63" stroke-width="3.5"/>
    <!-- arms holding child's legs -->
    <path d="M150,192 Q132,170 150,142" fill="none" stroke="#f5b26b" stroke-width="11" stroke-linecap="round"/>
    <path d="M210,192 Q228,170 210,142" fill="none" stroke="#f5b26b" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
