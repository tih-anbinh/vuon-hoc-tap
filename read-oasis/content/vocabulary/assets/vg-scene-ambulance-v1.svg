<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-ambulance desc-ambulance">
  <title id="title-ambulance">Ambulance</title>
  <desc id="desc-ambulance">A white ambulance van with a red cross, flashing blue light, and big black wheels.</desc>
  <defs>
    <linearGradient id="ambulance-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#ambulance-bg)"/>
  <rect x="0" y="230" width="400" height="70" fill="#cbd5e1"/>
  <ellipse cx="200" cy="248" rx="160" ry="16" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Body -->
    <path d="M60 140 L250 140 L250 120 L300 120 L340 165 L340 225 L60 225 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <!-- Cab window -->
    <path d="M255 128 L295 128 L325 162 L255 162 Z" fill="#7dd3fc" stroke="#1e293b" stroke-width="3"/>
    <!-- Red stripe -->
    <rect x="60" y="185" width="190" height="16" fill="#ef4444"/>
    <!-- Red cross -->
    <rect x="130" y="150" width="14" height="42" fill="#ef4444"/>
    <rect x="116" y="164" width="42" height="14" fill="#ef4444"/>
    <!-- Blue light -->
    <rect x="150" y="122" width="34" height="18" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Wheels -->
    <circle cx="130" cy="225" r="30" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <circle cx="130" cy="225" r="12" fill="#9ca3af" stroke="#374151" stroke-width="2.5"/>
    <circle cx="290" cy="225" r="30" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <circle cx="290" cy="225" r="12" fill="#9ca3af" stroke="#374151" stroke-width="2.5"/>
    <!-- Headlight -->
    <circle cx="335" cy="200" r="7" fill="#fde047" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
