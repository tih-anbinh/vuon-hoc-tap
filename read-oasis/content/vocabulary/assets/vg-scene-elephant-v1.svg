<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-elephant desc-elephant">
  <title id="title-elephant">elephant</title>
  <desc id="desc-elephant">A big grey elephant with large ears and a long trunk.</desc>
  <rect width="400" height="300" rx="20" fill="#FFF8E1"/>
  <rect y="220" width="400" height="80" rx="0" fill="#C8E6C9"/>
  <g transform="translate(200, 80)">
    <!-- Tail -->
    <path d="M55,65 Q70,55 65,75" fill="none" stroke="#78909C" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="10" cy="70" rx="55" ry="40" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2.5"/>
    <!-- Legs -->
    <rect x="-30" y="100" width="16" height="30" rx="7" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2"/>
    <rect x="-8" y="100" width="16" height="30" rx="7" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2"/>
    <rect x="22" y="100" width="16" height="30" rx="7" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2"/>
    <rect x="44" y="100" width="16" height="30" rx="7" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="-22" cy="132" rx="10" ry="5" fill="#90A4AE"/>
    <ellipse cx="0" cy="132" rx="10" ry="5" fill="#90A4AE"/>
    <ellipse cx="30" cy="132" rx="10" ry="5" fill="#90A4AE"/>
    <ellipse cx="52" cy="132" rx="10" ry="5" fill="#90A4AE"/>
    <!-- Head -->
    <circle cx="-30" cy="40" r="30" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2.5"/>
    <!-- Ears -->
    <ellipse cx="-58" cy="35" rx="20" ry="28" fill="#B0BEC5" stroke="#90A4AE" stroke-width="2"/>
    <ellipse cx="-56" cy="35" rx="14" ry="20" fill="#FFCCBC" opacity="0.4"/>
    <!-- Eye -->
    <circle cx="-22" cy="32" r="4" fill="#37474F"/>
    <circle cx="-21" cy="31" r="1.5" fill="white"/>
    <!-- Trunk -->
    <path d="M-38,52 Q-45,75 -50,90 Q-52,98 -44,95 Q-40,92 -38,85" fill="none" stroke="#B0BEC5" stroke-width="12" stroke-linecap="round"/>
    <path d="M-38,52 Q-45,75 -50,90 Q-52,98 -44,95" fill="none" stroke="#90A4AE" stroke-width="2"/>
    <!-- Tusk -->
    <path d="M-30,55 Q-25,65 -22,60" fill="none" stroke="#FFF9C4" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
