<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-cushion desc-cushion">
  <title id="title-cushion">Cushion</title>
  <desc id="desc-cushion">A soft square cushion with a tassel at each corner and a button in the middle.</desc>
  <defs>
    <linearGradient id="cushion-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="cushion-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#cushion-bg)"/>
  <ellipse cx="200" cy="245" rx="130" ry="18" fill="#0f172a" opacity="0.12"/>

  <g filter="url(#soft-shadow)">
    <!-- Puffy cushion -->
    <path d="M95 100 Q90 80 110 78 L290 78 Q310 80 305 100 L308 200 Q310 220 290 222 L110 222 Q90 220 92 200 Z" fill="url(#cushion-fill)" stroke="#9f1239" stroke-width="4"/>
    <!-- Center button dimple -->
    <circle cx="200" cy="150" r="10" fill="#9f1239"/>
    <path d="M170 120 L200 150 M230 120 L200 150 M170 180 L200 150 M230 180 L200 150" stroke="#be123c" stroke-width="2.5" opacity="0.6"/>
    <!-- Tassels -->
    <g fill="#fde047" stroke="#ca8a04" stroke-width="1.5">
      <path d="M100 88 l-12 -12 M88 76 l-4 -8 M96 72 l0 -8 M104 74 l4 -8"/>
      <path d="M300 88 l12 -12 M312 76 l4 -8 M304 72 l0 -8 M296 74 l-4 -8"/>
      <path d="M100 212 l-12 12 M88 224 l-4 8 M96 228 l0 8 M104 226 l4 8"/>
      <path d="M300 212 l12 12 M312 224 l4 8 M304 228 l0 8 M296 226 l-4 8"/>
    </g>
  </g>
</svg>
