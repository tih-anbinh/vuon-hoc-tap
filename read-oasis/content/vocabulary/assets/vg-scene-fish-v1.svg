<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title-fish desc-fish">
  <title id="title-fish">Fish - Vibrant swimming fish</title>
  <desc id="desc-fish">A bright orange swimming fish with bold white stripes, waving translucent fins, and rising water bubbles, occupying the center of the frame.</desc>
  <defs>
    <linearGradient id="fish-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fin-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Water environment cues: Rising bubbles (delicate, non-distracting) -->
  <circle cx="340" cy="90" r="12" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <circle cx="337" cy="86" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="355" cy="60" r="7" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <circle cx="365" cy="35" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- TARGET OBJECT: FISH (Occupying 70% canvas) -->
  <g id="fish-figure" filter="url(#soft-shadow)">
    <!-- Dorsal Fin (Top) -->
    <path d="M150 100 C180 40 240 50 255 105 Z" fill="url(#fin-accent)" stroke="#c2410c" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="175" y1="90" x2="185" y2="60" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="205" y1="90" x2="215" y2="55" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="230" y1="95" x2="238" y2="70" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ventral / Pelvic Fin (Bottom) -->
    <path d="M165 200 C180 250 220 255 240 205 Z" fill="url(#fin-accent)" stroke="#c2410c" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Large Caudal Fin (Tail) -->
    <path d="M120 150 C70 85 45 90 40 120 C55 145 55 160 40 185 C45 215 70 220 120 155 Z" fill="url(#fin-accent)" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/>
    <line x1="100" y1="150" x2="52" y2="125" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="153" x2="50" y2="153" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="155" x2="52" y2="180" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Streamlined Fish Body -->
    <path d="M100 150 C120 90 220 85 300 130 C320 145 320 160 300 175 C220 220 120 215 100 150 Z" fill="url(#fish-orange)" stroke="#9a3412" stroke-width="4"/>

    <!-- White Striped Pattern (Iconic clownfish / reef fish markings) -->
    <!-- Mid Body Stripe -->
    <path d="M185 95 C195 130 195 175 185 208 C205 206 215 175 205 95 Z" fill="#ffffff" stroke="#9a3412" stroke-width="3"/>
    <!-- Head Stripe -->
    <path d="M260 105 C272 130 272 170 260 195 C275 190 282 170 275 115 Z" fill="#ffffff" stroke="#9a3412" stroke-width="3"/>

    <!-- Pectoral Fin (Side Fin - in foreground) -->
    <path d="M210 155 C230 140 255 165 245 185 C230 195 215 175 210 155 Z" fill="url(#fin-accent)" stroke="#9a3412" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Fish Eye (Big, lively, shiny) -->
    <circle cx="285" cy="138" r="14" fill="#ffffff" stroke="#9a3412" stroke-width="2.5"/>
    <circle cx="287" cy="138" r="9" fill="#0f172a"/>
    <circle cx="284" cy="135" r="3.5" fill="#ffffff"/>
    <circle cx="290" cy="142" r="1.5" fill="#ffffff"/>

    <!-- Cute Puckered Fish Lips (Mouth) -->
    <ellipse cx="316" cy="154" rx="7" ry="5" fill="#ea580c" stroke="#9a3412" stroke-width="2.5"/>
    <line x1="312" y1="154" x2="322" y2="154" stroke="#7c2d12" stroke-width="2"/>
  </g>
</svg>