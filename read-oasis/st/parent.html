:root {
  --story-px: 26px;          /* 24-30 suggested */

  --lh: 1.5;

}
html[data-theme="cream"] { --paper: #FBF4E6; --paper-2: #F3E7CF; --surface: #FFFDF8; --ink: #2A2118; --muted: #5A4D3E; --primary: #8A4F1E; --primary-soft: #F6E3D0; --accent: #2F6B2C; --accent-soft: #E4F0DD; --line: #E0D2B8; --chip: #F1E8D6; --blob-a: #F6E3C4; --blob-b: #F8D8C4; --blob-c: #E6EFD2; }

* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: var(--control-px); line-height: var(--lh); }
body { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); position: relative; overflow-x: hidden; }

body::before { width: 55vmax; height: 55vmax; left: -20vmax; top: -18vmax; background: radial-gradient(circle at 30% 30%, var(--blob-a), transparent 70%); animation: drift 26s ease-in-out infinite alternate; }

@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(6vmax, 4vmax) scale(1.08); } }

button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
button:active { transform: translateY(0) scale(.98); }
button.primary { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 78%, var(--accent))); color: var(--primary-ink); border-color: transparent; }
button.quiet { border-color: var(--line); color: var(--ink); background: color-mix(in srgb, var(--surface) 80%, transparent); box-shadow: none; }

button .ic, .ic { width: 1.4em; height: 1.4em; flex: 0 0 auto; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }

/* Top bar: stable Back / Library / Stop */
.topbar { display: flex; align-items: center; gap: .5rem; padding: .55rem .8rem; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 1.1em; margin: 0 auto 0 .25rem; font-weight: 800; letter-spacing: .01em; display: flex; align-items: center; gap: .4em; }
.topbar .stars { display: inline-flex; align-items: center; gap: .3em; color: var(--muted); font-weight: 800; padding: .2em .7em; border-radius: 999px; background: var(--chip); }
.topbar .stars .ic { color: var(--sun); }
.topbar .stars.bump { animation: bump .5s var(--ease); }
@keyframes bump { 30% { transform: scale(1.25) rotate(-6deg); } 60% { transform: scale(.95); } }

main { flex: 1; width: 100%; max-width: 64rem; margin: 0 auto; padding: 1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.2rem; box-shadow: var(--shadow-sm); }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
.chip { display: inline-flex; align-items: center; gap: .3em; background: var(--chip); border-radius: 999px; padding: .12em .75em; font-size: .85em; color: var(--muted); margin-right: .3em; font-weight: 700; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.primary { background: var(--primary-soft); color: var(--primary); }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.row.between { justify-content: space-between; }
p { margin: .4em 0; }
h2 { font-weight: 800; letter-spacing: -.01em; }

/* Hero / greeting on the library */
.hero { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; border-radius: var(--r-lg); background: linear-gradient(120deg, var(--primary-soft), var(--accent-soft)); border: 1px solid var(--line); margin-bottom: 1.2rem; }
.hero .mascot { width: 4.6rem; height: 4.6rem; flex: 0 0 auto; }
.hero h2 { margin: 0 0 .15em; }
.hero .sub { margin: 0; color: var(--muted); font-weight: 600; }

/* Library tiles: playful covers with a tilt on hover */
.book-tile { display: flex; flex-direction: column; gap: .55rem; text-align: left; align-items: stretch; padding: .75rem; min-height: 0; border-radius: var(--r-lg); border: 1px solid var(--line); color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm); font-weight: 600; }
.book-tile:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow); }
.book-tile .cover { aspect-ratio: 4/3; border-radius: var(--r-md); overflow: hidden; background: linear-gradient(160deg, var(--blob-b), var(--blob-a)); display: grid; place-items: center; position: relative; }
.book-tile .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.book-tile:hover .cover img { transform: scale(1.04); }
.book-tile .cover .ribbon { position: absolute; top: .5rem; left: .5rem; background: var(--surface); color: var(--accent); border-radius: 999px; padding: .1em .6em; font-size: .8em; font-weight: 800; box-shadow: var(--shadow-sm); }
.book-tile .t { font-weight: 800; font-size: 1.05em; }
.book-tile .progress { height: .5rem; border-radius: 999px; background: var(--chip); overflow: hidden; }
.book-tile .progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: width .6s var(--ease); }

/* Stagger entrance */
.fade { animation: fade var(--dur) var(--ease) both; }
.stagger > * { animation: fade .45s var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: .03s } .stagger > *:nth-child(2) { animation-delay: .08s } .stagger > *:nth-child(3) { animation-delay: .13s }
.stagger > *:nth-child(4) { animation-delay: .18s } .stagger > *:nth-child(5) { animation-delay: .23s } .stagger > *:nth-child(6) { animation-delay: .28s }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Reader */
.reader { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 900px) and (orientation: landscape) { .reader { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.illus { display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: .6rem; min-height: 8rem; box-shadow: var(--shadow-sm); overflow: hidden; }
.illus img, .illus svg { max-height: var(--illus-max); width: auto; border-radius: var(--r-md); animation: pop .45s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
html[data-illus="small"]  { --illus-max: 24vh; }
html[data-illus="large"]  { --illus-max: 60vh; }
html[data-illus="hidden"] .illus { display: none; }
.illus-fallback { display: flex; gap: .6rem; align-items: center; color: var(--muted); padding: .5rem; }
.story-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.3rem; box-shadow: var(--shadow-sm); }
.story { font-size: var(--story-px); line-height: var(--lh); max-width: var(--col-ch); overflow-wrap: anywhere; word-break: normal; hyphens: manual; margin: 0; font-weight: 600; }
.story .w { border-radius: 8px; padding: 0 .08em; cursor: pointer; border: none; background: none; min-height: 0; min-width: 0; font: inherit; color: inherit; display: inline; box-shadow: none; transition: background var(--dur); }
.story .w:hover { transform: none; background: var(--chip); }
.story .w.vocab { text-decoration: underline dotted; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: .2em; }
.story .w:focus-visible { outline: 3px solid var(--focus); }
.reader-nav { display: flex; justify-content: space-between; gap: .5rem; padding: .7rem .5rem; position: sticky; bottom: .5rem; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); margin-top: 1rem; }
.reader-nav .mid { display: flex; gap: .5rem; }
.pagecount { color: var(--muted); align-self: center; font-weight: 800; }
.page-dots { display: flex; gap: .35rem; justify-content: center; margin: .6rem 0 0; }
.page-dots i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--line); transition: transform var(--dur), background var(--dur); }
.page-dots i.on { background: var(--primary); transform: scale(1.35); }
.page-dots i.done { background: var(--accent); }
.parent-prompt { border-left: 6px solid var(--accent); padding: .5rem .9rem; background: var(--accent-soft); border-radius: var(--r-sm); color: var(--ink); }

/* Vocab popover below the text; never covers story */
.vocab-box { border: 2px solid var(--accent); border-radius: var(--r-md); padding: .8rem 1rem; background: var(--surface); margin-top: .7rem; box-shadow: var(--shadow-sm); animation: fade var(--dur) var(--ease); }
.vocab-box b { font-size: 1.2em; color: var(--accent); }

/* Quiz & activities */
.options { display: grid; gap: .65rem; margin: .8rem 0; }
.options button { justify-content: flex-start; text-align: left; padding: .7em 1.1em; font-size: var(--control-px); min-height: 3.2em; white-space: normal; border-radius: var(--r-md); border-color: var(--line); color: var(--ink); box-shadow: none; }
.options button:hover { border-color: var(--primary); }
.options button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.options button.correct { border-color: var(--accent); background: var(--accent-soft); animation: bump .5s var(--ease); }

@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.explain { border-left: 6px solid var(--primary); padding: .6rem .9rem; background: var(--primary-soft); border-radius: var(--r-sm); margin: .6rem 0; animation: fade var(--dur) var(--ease); }
.seq-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.seq-item { display: flex; gap: .5rem; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); padding: .5rem .75rem; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease); }
.seq-item .txt { flex: 1; font-weight: 600; }
.seq-item .ctl { display: flex; gap: .3rem; }
.seq-item .ctl button { padding: 0; box-shadow: none; }
.match-grid { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; }
.match-grid button { white-space: normal; text-align: left; justify-content: flex-start; min-height: 3.2em; border-radius: var(--r-md); }
.match-grid button.done { border-color: var(--accent); background: var(--accent-soft); opacity: .8; }
.quiz-prompt { font-size: calc(var(--story-px) * .9); font-weight: 800; }
textarea { width: 100%; min-height: 6em; border: 2px solid var(--line); border-radius: var(--r-md); padding: .7em; background: var(--surface); }

/* Celebrate: calm, finite, cute */
.celebrate { text-align: center; display: grid; gap: 1rem; justify-items: center; background: linear-gradient(160deg, var(--surface), var(--accent-soft)); }
.celebrate .big { font-size: 1.6em; font-weight: 800; }
.celebrate .mascot-big { width: 8rem; height: 8rem; }
.sparkles { position: relative; width: 100%; height: 0; }
.sparkles i { position: absolute; width: .7rem; height: .7rem; border-radius: 50%; background: var(--sun); opacity: 0; animation: sparkle 1.6s var(--ease) forwards; }
.sparkles i:nth-child(2n) { background: var(--coral); } .sparkles i:nth-child(3n) { background: var(--accent); }
@keyframes sparkle { 0% { opacity: 0; transform: translateY(0) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-70px) scale(1); } }

/* Mascot idle breathing */
.mascot { animation: breathe 4s ease-in-out infinite; transform-origin: 50% 80%; }
@keyframes breathe { 50% { transform: translateY(-3px) scale(1.02); } }

/* Break cue: banner, dismissible */
.break-banner { position: fixed; left: 50%; transform: translateX(-50%); bottom: 6rem; max-width: min(92vw, 34rem); background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r-lg); padding: .9rem 1.1rem; box-shadow: var(--shadow); z-index: 10; display: flex; gap: .8rem; align-items: center; animation: fade var(--dur) var(--ease); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 1rem; background: var(--ink); color: var(--paper); border-radius: 999px; padding: .6em 1.2em; z-index: 20; max-width: 92vw; box-shadow: var(--shadow); animation: fade var(--dur) var(--ease); font-weight: 700; }

/* Parent area */
.gate { max-width: 26rem; margin: 3rem auto; }
.gate input { width: 100%; padding: .6em; border: 2px solid var(--line); border-radius: var(--r-md); background: var(--surface); font-size: 1.3em; letter-spacing: .3em; text-align: center; }
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs button { box-shadow: none; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
label.field { display: grid; gap: .25rem; margin: .6rem 0; font-weight: 600; }
label.field input[type="range"] { min-height: var(--tap); accent-color: var(--primary); }
label.field select, label.field input[type="number"], label.field input[type="text"], label.field input[type="email"], label.field input[type="password"] { min-height: var(--tap); border: 2px solid var(--line); border-radius: var(--r-md); padding: .3em .7em; background: var(--surface); font-weight: 500; }
label.check { display: flex; gap: .6rem; align-items: center; min-height: var(--tap); font-weight: 600; }
label.check input { width: 1.4em; height: 1.4em; accent-color: var(--primary); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .45em .5em; border-bottom: 1px solid var(--line); vertical-align: top; }
.bar { height: .9em; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); }
pre.small { font-size: .8em; overflow: auto; background: var(--chip); padding: .6em; border-radius: var(--r-sm); }
.stat { display: grid; gap: .1rem; }
.stat b { font-size: 1.8em; font-weight: 800; color: var(--primary); line-height: 1.1; }
.badge-ok { color: var(--accent); font-weight: 800; }
.badge-warn { color: var(--warn); font-weight: 800; }

/* Motion opt-outs: everything still works, nothing moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  button:hover, .book-tile:hover { transform: none; }
}
html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
html[data-motion="reduce"] button:hover, html[data-motion="reduce"] .book-tile:hover { transform: none; }

@media (max-width: 480px) {
  main { padding: .6rem; }
  .match-grid { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 1em; }
  .topbar button span { display: none; }   /* icons only on tiny screens; aria-label keeps names */
  .reader-nav { border-radius: var(--r-lg); }
}

 is waiting.","timing_segments":[],"vocabulary":[{"word":"seed","definition":"The small part of a plant that can grow into a new plant.","example":"We planted a bean seed."}]},{"page_id":"p02","text":"Rain falls. Water soaks into the soil. The seed drinks the water and swells up.","image_asset":"images/ro-d-001-p02.svg","image_alt":"Rain drops fall on the soil. The seed is bigger and its coat is splitting.","image_provenance":"original SVG by Read Oasis, 2026-09-27","audio_script":"Rain falls. Water soaks into the soil. The seed drinks the water and swells up.","timing_segments":[],"vocabulary":[{"word":"swells","definition":"Gets bigger, like a sponge full of water.","example":"The balloon swells as you blow into it."}]},{"page_id":"p03","text":"First, a root pushes down into the soil. The root holds the plant and finds more water.","image_asset":"images/ro-d-001-p03.svg","image_alt":"A white root grows down from the seed into the soil.","image_provenance":"original SVG by Read Oasis, 2026-09-27","audio_script":"First, a root pushes down into the soil. The root holds the plant and finds more water.","timing_segments":[],"vocabulary":[{"word":"root","definition":"The part of a plant that grows down into the soil.","example":"The root drinks water from the ground."}]},{"page_id":"p04","text":"Next, a green sprout pushes up. It grows toward the light.","image_asset":"images/ro-d-001-p04.svg","image_alt":"A green shoot with two small leaves rises above the soil toward a sun.","image_provenance":"original SVG by Read Oasis, 2026-09-27","audio_script":"Next, a green sprout pushes up. It grows toward the light.","timing_segments":[],"vocabulary":[{"word":"sprout","definition":"A new, young plant shoot that has just started to grow.","example":"A sprout came up in the pot."}]},{"page_id":"p05","text":"The seed is awake now. With water, soil, and light, it can grow into a big plant.","image_asset":"images/ro-d-001-p05.svg","image_alt":"A small plant with several leaves stan   <script>
(() => {
"use strict";
// ---- progress-store.mjs
// Author: Huy Tran
// Company: Cadence Design Systems Vietnam
// Email: huytran@cadence.com
// Created: 2026-09-27
//
// Read Oasis progress store: local-first persistence, migrations, idempotent
// reward ledger, backup export/import with validation (Gate D: D01, D04-D06).
// Storage-agnostic: pass any object with getItem/setItem/removeItem (localStorage
// or an in-memory shim for tests).

const STORE_VERSION = 1;
const STORE_KEY = 'read_oasis.store.v1';

const DEFAULT_SETTINGS = Object.freeze({
  // Display (testing defaults, not clinical prescriptions; tune with the child)
  font_family: 'rounded',          // rounded | system | serif (rounded falls back to system-ui if Nunito is absent)
  story_font_px: 26,               // 24-30 suggested
  control_font_px: 19,
  line_height: 1.5,
  column_ch: 40,                   // max line width in ch
  illustration_size: 'medium',     // small | medium | large | hidden
  theme: 'light',                  // light | cream | dark  (no medical claims)
  reduced_motion: 'auto',          // auto | on
  // Session
  break_minutes: 20,               // 0 disables cue
  session_minutes: 15,
  sound_effects: true,
  narration: true,
  // Learning
  band: null,                      // 'A-C' | 'D-J' | 'K-P' | 'Q-Z' (parent-set after baseline)
  independent_track_band: null,    // may differ from read-aloud track (L02)
  read_aloud_track_band: null,
  focus_skills: [],
  language_home: [],
  // Privacy / rewards
  recording_enabled: false,
  recording_retain: false,
  rewards_enabled: true,
  mascot_enabled: true,
  parent_pin_hash: null,
  cloud_sync_enabled: false,       // parent opt-in; see src/sync.mjs
});

function emptyStore(profileId = 'child-1') {
  return {
    store_version: STORE_VERSION,
    profile: { id: profileId, created_at: nowIso(), display_name: 'Reader' }, // no real name / DOB
    settings: { ...DEFAULT_SETTINGS },
    baseline: null,             // L01: {recorded_at, notes, comfortable_text, challenge_text, retell, questions, support_used, visual}
    books: {},                  // book_id -> { revisions: { rev -> BookProgress } }
    attempts: [],               // quiz/activity attempts (append-only)
    observations: [],           // parent notes / rubric entries
    unseen_checks: [],          // C06/L03: transfer checks kept apart from practice
    level_suggestions: [],      // L04: {id, from, to, evidence, decision}
    ledger: [],                 // reward transactions (idempotent)
    sessions: [],               // {started_at, ended_at, minutes, breaks_shown, breaks_dismissed}
    recordings_meta: [],        // only metadata; blobs live in IndexedDB when retained
  };
}

function nowIso() { return new Date().toISOString(); }

class ProgressStore {
  constructor(storage, key = STORE_KEY) {
    this.storage = storage; this.key = key; this.data = null; this.listeners = new Set();
  }
  load() {
    let raw = null;
    try { raw = this.storage.getItem(this.key); } catch { raw = null; }
    if (!raw) { this.data = emptyStore(); this.save(); return this.data; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch { // corrupt: keep a copy, start fresh (never silently overwrite)
      try { this.storage.setItem(this.key + '.corrupt.' + Date.now(), raw); } catch { /* ignore */ }
      this.data = emptyStore(); this.save(); return this.data;
    }
    this.data = migrate(parsed);
    if (this.data.store_version !== parsed.store_version) this.save();
    return this.data;
  }
  save() {
    this.data.updated_at = nowIso();
    try { this.storage.setItem(this.key, JSON.stringify(this.data)); this.lastSaveError = null; }
    catch (e) { this.lastSaveError = e; }
    for (const fn of this.listeners) fn(this.data);
    return !this.lastSaveError;
  }
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }

  // ---------- settings
  setSettings(patch) { this.data.settings = { ...this.data.settings, ...patch }; this.save(); return this.data.settings; }

  // ---------- book progress (keyed by revision; D06 never overwrites history)
  bookProgress(bookId, revision, create = true) {
    const b = this.data.books[bookId] || (create ? (this.data.books[bookId] = { revisions: {} }) : null);
    if (!b) return null;
    const r = b.revisions[revision];
    if (r || !create) return r || null;
    // New revision: carry over nothing but note prior revisions for the UI (D06)
    const prior = Object.keys(b.revisions).map(Number).filter(n => n < revision);
    return (b.revisions[revision] = {
      revision, page_index: 0, opened_at: nowIso(), last_seen_at: nowIso(),
      completed_reads: 0, support_used: { audio: false, parent: false, vocab_taps: 0 },
      quiz_done_cycles: 0, migrated_from_revision: prior.length ? Math.max(...prior) : null,
    });
  }
  setPage(bookId, revision, pageIndex, support = {}) {
    const p = this.bookProgress(bookId, revision);
    p.page_index = pageIndex; p.last_seen_at = nowIso();
    if (support.audio) p.support_used.audio = true;
    if (support.parent) p.support_used.parent = true;
    if (support.vocab_tap) p.support_used.vocab_taps += 1;
    this.save(); return p;
  }
  completeRead(bookId, revision) {
    const p = this.bookProgress(bookId, revision); p.completed_reads += 1; p.completed_at = nowIso(); this.save(); return p;
  }
  lastOpened() {
    let best = null;
    for (const [book_id, b] of Object.entries(this.data.books)) for (const r of Object.values(b.revisions)) {
      if (!best || r.last_seen_at > best.last_seen_at) best = { book_id, ...r };
    }
    return best;
  }

  // ---------- attempts (R04: first-attempt credit tracked per question per cycle)
  recordAttempt({ bookId, revision, questionId, skill, optionId, correct, cycle, kind = 'quiz', supportUsed = {}, unseen = false, responseText = null }) {
    const prev = this.data.attempts.filter(a => a.book_id === bookId && a.revision === revision && a.question_id === questionId && a.cycle === cycle);
    const a = {
      id: `${bookId}:${revision}:${questionId}:${cycle}:${prev.length + 1}`, book_id: bookId, revision, question_id: questionId, skill,
      option_id: optionId, correct: !!correct, first_attempt: prev.length === 0, cycle, kind, at: nowIso(),
      support_used: supportUsed, unseen: !!unseen, response_text: responseText, rubric: null,
    };
    this.data.attempts.push(a); this.save(); return a;
  }
  quizCycle(bookId, revision) { return this.bookProgress(bookId, revision).quiz_done_cycles; }
  finishQuizCycle(bookId, revision) { const p = this.bookProgress(bookId, revision); p.quiz_done_cycles += 1; this.save(); return p.quiz_done_cycles; }

  // ---------- reward ledger (D01: idempotent key)
  award({ childId = this.data.profile.id, bookId, revision, activity, questionId = '-', cycle = 0, stars = 1 }) {
    if (!this.data.settings.rewards_enabled) return { granted: false, reason: 'rewards_disabled' };
    const key = [childId, bookId, revision, activity, questionId, cycle].join('|');
    if (this.data.ledger.some(t => t.key === key)) return { granted: false, reason: 'duplicate', key };
    const tx = { key, stars, at: nowIso() }; this.data.ledger.push(tx); this.save();
    return { granted: true, key, tx };
  }
  totalStars() { return this.data.ledger.reduce((s, t) => s + (t.stars || 0), 0); }

  // ---------- observations / rubric (Section 9)
  addObservation({ text, rubric = null, bookId = null, skill = null, example = null, uncertainty = null, kind = 'note' }) {
    const o = { id: 'obs-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), at: nowIso(), text, rubric, book_id: bookId, skill, example, uncertainty, kind };
    this.data.observations.push(o); this.save(); return o;
  }
  editObservation(id, patch) { const o = this.data.observations.find(x => x.id === id); if (!o) return null; Object.assign(o, patch, { edited_at: nowIso() }); this.save(); return o; }
  addUnseenCheck(entry) { const e = { id: 'unseen-' + Date.now(), at: nowIso(), ...entry }; this.data.unseen_checks.push(e); this.save(); return e; }
  setBaseline(b) { this.data.baseline = { recorded_at: nowIso(), ...b }; this.save(); return this.data.baseline; }

  // ---------- level suggestions (L04: parent accepts/rejects; history kept)
  suggestLevel(s) { const e = { id: 'sug-' + Date.now(), at: nowIso(), decision: 'pending', ...s }; this.data.level_suggestions.push(e); this.save(); return e; }
  decideSuggestion(id, decision) {
    const s = this.data.level_suggestions.find(x => x.id === id); if (!s) return null;
    s.decision = decision; s.decided_at = nowIso();
    if (decision === 'accepted') this.setSettings({ [s.track === 'read_aloud' ? 'read_aloud_track_band' : 'independent_track_band']: s.to });
    this.save(); return s;
  }

  // ---------- sessions / breaks (A07)
  startSession() { const s = { id: 'ses-' + Date.now(), started_at: nowIso(), breaks_shown: 0, breaks_dismissed: 0 }; this.data.sessions.push(s); this.save(); return s; }
  endSession(id) { const s = this.data.sessions.find(x => x.id === id); if (s && !s.ended_at) { s.ended_at = nowIso(); this.save(); } return s; }
  noteBreak(id, dismissed) { const s = this.data.sessions.find(x => x.id === id); if (s) { s.breaks_shown += 1; if (dismissed) s.breaks_dismissed += 1; this.save(); } }

  // ---------- backup (D04, D05)
  exportBackup() {
    const payload = { format: 'read-oasis-backup', store_version: STORE_VERSION, exported_at: nowIso(), data: this.data };
    payload.checksum = checksum(JSON.stringify(payload.data));
    return JSON.stringify(payload, null, 2);
  }
  /** Validates fully before touching existing data; returns {ok, reason, merged:{...counts}} */
  importBackup(text, { policy = 'merge' } = {}) {
    let payload;
    try { payload = JSON.parse(text); } catch { return { ok: false, reason: 'not valid JSON' }; }
    const v = validateBackup(payload);
    if (!v.ok) return v;
    const incoming = migrate(structuredCloneSafe(payload.data));
    const prior = structuredCloneSafe(this.data);
    try {
      const merged = policy === 'replace' ? incoming : mergeStores(prior, incoming);
      const counts = summarize(prior, merged);
      this.data = merged;
      if (!this.save()) { this.data = prior; this.save(); return { ok: false, reason: 'storage write failed; prior data kept' }; }
      return { ok: true, merged: counts };
    } catch (e) {
      this.data = prior; // D05: failure leaves prior data intact
      return { ok: false, reason: 'merge failed: ' + (e?.message || e) };
    }
  }

  // ---------- deletion (D03)
  deleteRecordingsMeta() { this.data.recordings_meta = []; this.save(); }
  deleteProfile() { this.data = emptyStore(); try { this.storage.removeItem(this.key); } catch { /* ignore */ } this.save(); }
}

function validateBackup(payload) {
  if (!payload || payload.format !== 'read-oasis-backup') return { ok: false, reason: 'unrecognized backup format' };
  if (!Number.isInteger(payload.store_version) || payload.store_version > STORE_VERSION) return { ok: false, reason: `incompatible store_version ${payload.store_version}` };
  if (!payload.data || typeof payload.data !== 'object') return { ok: false, reason: 'missing data' };
  if (payload.checksum !== checksum(JSON.stringify(payload.data))) return { ok: false, reason: 'checksum mismatch (corrupt or edited backup)' };
  const d = payload.data;
  for (const k of ['profile', 'settings', 'books', 'attempts', 'ledger']) if (!(k in d)) return { ok: false, reason: `missing section ${k}` };
  if (!Array.isArray(d.ledger) || d.ledger.some(t => typeof t.key !== 'string')) return { ok: false, reason: 'ledger entries malformed' };
  if (!Array.isArray(d.attempts) || d.attempts.some(a => typeof a.id !== 'string')) return { ok: false, reason: 'attempt entries malformed' };
  return { ok: true };
}

/** Merge without duplicates: ledger/attempts/observations by id; books by (id, revision) keep the latest last_seen_at. */
function mergeStores(a, b) {
  const out = structuredCloneSafe(a);
  out.settings = { ...DEFAULT_SETTINGS, ...a.settings, ...b.settings, parent_pin_hash: a.settings?.parent_pin_hash || b.settings?.parent_pin_hash || null };
  out.baseline = out.baseline || b.baseline;
  const byKey = (arr, k) => new Set(arr.map(x => x[k]));
  const dedupPush = (target, src, k) => { const seen = byKey(target, k); for (const x of src) if (!seen.has(x[k])) { target.push(x); seen.add(x[k]); } };
  dedupPush(out.ledger, b.ledger || [], 'key');
  dedupPush(out.attempts, b.attempts || [], 'id');
  dedupPush(out.observations, b.observations || [], 'id');
  dedupPush(out.unseen_checks, b.unseen_checks || [], 'id');
  dedupPush(out.level_suggestions, b.level_suggestions || [], 'id');
  dedupPush(out.sessions, b.sessions || [], 'id');
  for (const [bid, bk] of Object.entries(b.books || {})) {
    out.books[bid] = out.books[bid] || { revisions: {} };
    for (const [rev, rp] of Object.entries(bk.revisions || {})) {
      const cur = out.books[bid].revisions[rev];
      if (!cur || (rp.last_seen_at || '') > (cur.last_seen_at || '')) out.books[bid].revisions[rev] = rp;
    }
  }
  return out;
}

function summarize(before, after) {
  return {
    ledger_added: after.ledger.length - before.ledger.length,
    attempts_added: after.attempts.length - before.attempts.length,
    observations_added: after.observations.length - before.observations.length,
  };
}

/** Migration chain: add new versions here; never destructive. */
function migrate(data) {
  let d = data;
  if (!d.store_version) d = { ...emptyStore(), ...d, store_version: 1 };
  // future: if (d.store_version === 1) { ...; d.store_version = 2; }
  // Backfill any missing sections from the empty template.
  const tpl = emptyStore(d.profile?.id);
  for (const k of Object.keys(tpl)) if (!(k in d)) d[k] = tpl[k];
  d.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
  return d;
}

function checksum(str) { // FNV-1a 32-bit, hex; integrity only (not security)
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }

/** In-memory storage shim for tests / private mode. */
class MemoryStorage {
  constructor() { this.m = new Map(); }
  getItem(k) { return this.m.has(k) ? this.m.get(k) : null; }
  setItem(k, v) { this.m.set(k, String(v)); }
  removeItem(k) { this.m.delete(k); }
}

// ---------- evidence summaries used by the dashboard (Section 9, L03)
function evidenceSummary(data) {
  const practice = data.attempts.filter(a => !a.unseen);
  const unseen = data.attempts.filter(a => a.unseen);
  const bySkill = {};
  for (const a of practice) {
    const s = bySkill[a.skill] || (bySkill[a.skill] = { first_attempt_correct: 0, first_attempts: 0, repeats: 0, with_support: 0 });
    if (a.first_attempt) { s.first_attempts++; if (a.correct) s.first_attempt_correct++; } else s.repeats++;
    if (a.support_used?.audio || a.support_used?.parent) s.with_support++;
  }
  const unseenBySkill = {};
  for (const a of unseen) {
    const s = unseenBySkill[a.skill] || (unseenBySkill[a.skill] = { correct: 0, total: 0, with_support: 0 });
    s.total++; if (a.correct) s.correct++; if (a.support_used?.audio || a.support_used?.parent) s.with_support++;
  }
  const rubric = { not_yet: 0, with_support: 0, independent: 0 };
  for (const o of data.observations) if (o.rubric && rubric[o.rubric] != null) rubric[o.rubric]++;
  const booksRead = Object.values(data.books).reduce((n, b) => n + Object.values(b.revisions).filter(r => r.completed_reads > 0).length, 0);
  return { practice_by_skill: bySkill, unseen_by_skill: unseenBySkill, rubric, books_read: booksRead, stars: data.ledger.reduce((s, t) => s + t.stars, 0), practice_attempts: practice.length, unseen_attempts: unseen.length };
}

/**
 * Conservative level-change suggestion (Section 3.3): requires first-attempt evidence across
 * >= 3 distinct books on >= 3 distinct days in the same track. Returns null or a suggestion object.
 */
function suggestLevelChange(data, publishedBooks, track = 'independent') {
  const modes = track === 'read_aloud' ? ['read_aloud', 'shared_reading'] : ['independent_reading', 'decodable'];
  const bookMap = Object.fromEntries(publishedBooks.map(b => [b.book_id, b]));
  const rel = data.attempts.filter(a => a.first_attempt && !a.unseen && bookMap[a.book_id] && modes.includes(bookMap[a.book_id].reading_mode));
  const books = new Set(rel.map(a => a.book_id)); const days = new Set(rel.map(a => a.at.slice(0, 10)));
  if (books.size < 3 || days.size < 3 || rel.length < 9) return null;
  const acc = rel.filter(a => a.correct).length / rel.length;
  const supported = rel.filter(a => a.support_used?.audio || a.support_used?.parent).length / rel.length;
  const current = track === 'read_aloud' ? data.settings.read_aloud_track_band : data.settings.independent_track_band;
  const order = ['A-C', 'D-J', 'K-P', 'Q-Z']; const i = order.indexOf(current);
  if (i < 0) return null;
  const evidence = { books: [...books], days: [...days], attempts: rel.length, first_attempt_accuracy: +acc.toFixed(2), support_rate: +supported.toFixed(2) };
  if (acc >= 0.85 && supported <= 0.3 && i < order.length - 1) return { track, from: current, to: order[i + 1], direction: 'up', evidence, note: 'Strong first-attempt accuracy across several texts and days with little support. Parent decides.' };
  if (acc <= 0.5 && i > 0) return { track, from: current, to: order[i - 1], direction: 'vary_support', evidence, note: 'Low accuracy. Consider more support or different texts before changing level.' };
  return null;
}

// Author: Huy Tran
// Company: Cadence Design Systems Vietnam

//
// Read Oasis book schema v1 + validator (Gate A: C01, C03, C04, C05).
// Pure module: no DOM, no I/O. Mirrors tools/validate_content.py (CLI gate).

const SCHEMA_VERSION = 1;
const LEVELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const BANDS = { 'A-C': 'ABC', 'D-J': 'DEFGHIJ', 'K-P': 'KLMNOP', 'Q-Z': 'QRSTUVWXYZ' };
const READING_MODES = ['read_aloud', 'shared_reading', 'decodable', 'independent_reading'];
const STATUSES = ['DRAFT', 'SCHEMA_VALIDATED', 'CONTENT_REVIEW', 'MEDIA_REVIEW', 'PARENT_APPROVED', 'PUBLISHED'];
const SKILLS = [
  'listening_comprehension', 'decoding', 'word_knowledge', 'fluency',
  'explicit_detail', 'sequence', 'cause_effect', 'main_idea', 'inference', 'compare', 'summary',
  'knowledge', 'expression',
];
const STRANDS = [
  'oral_language', 'decoding', 'word_knowledge', 'fluency', 'comprehension', 'knowledge', 'expression',
];
const SKILL_TO_STRAND = {
  listening_comprehension: 'oral_language', decoding: 'decoding', word_knowledge: 'word_knowledge',
  fluency: 'fluency', explicit_detail: 'comprehension', sequence: 'comprehension',
  cause_effect: 'comprehension', main_idea: 'comprehension', inference: 'comprehension',
  compare: 'comprehension', summary: 'comprehension', knowledge: 'knowledge', expression: 'expression',
};
const ACTIVITY_TYPES = ['sequence_events', 'match_pairs', 'word_to_meaning', 'image_to_sentence', 'choose_evidence', 'build_summary', 'discussion'];
const DIFFICULTIES = ['easy', 'medium', 'hard'];

function bandOf(level) {
  for (const [name, letters] of Object.entries(BANDS)) if (letters.includes(level)) return name;
  return null;
}

const ID_RE = /^[a-z0-9][a-z0-9_-]{1,63}$/;
const ASSET_RE = /^(images|audio)\/[a-z0-9][a-z0-9._-]*\.(svg|png|jpg|jpeg|webp|mp3|ogg|wav|m4a)$/;

function isStr(v) { return typeof v === 'string' && v.length > 0; }
function isArr(v) { return Array.isArray(v); }

/**
 * Validate a book object. Returns { ok, errors:[{code,path,msg}], warnings:[...] }.
 * `opts.assetExists(path) -> bool` (optional) enables broken-media-path checks.
 * `opts.phonicsLexicon` (optional) { pattern: [words] } used for C03 decodability.
 */
function validateBook(book, opts = {}) {
  const errors = [];
  const warnings = [];
  const err = (code, path, msg) => errors.push({ code, path, msg });
  const warn = (code, path, msg) => warnings.push({ code, path, msg });

  if (!book || typeof book !== 'object') { err('C01', '', 'book is not an object'); return { ok: false, errors, warnings }; }

  // --- top-level scalars
  if (book.schema_version !== SCHEMA_VERSION) err('C01', 'schema_version', `expected ${SCHEMA_VERSION}`);
  if (!isStr(book.book_id) || !ID_RE.test(book.book_id)) err('C01', 'book_id', 'missing or invalid id');
  if (!Number.isInteger(book.revision) || book.revision < 1) err('C01', 'revision', 'must be integer >= 1');
  if (!STATUSES.includes(book.status)) err('C01', 'status', `must be one of ${STATUSES.join('|')}`);
  if (!isStr(book.title)) err('C01', 'title', 'required');
  if (!isStr(book.language)) err('C01', 'language', 'required');
  if (!LEVELS.includes(book.level)) err('C01', 'level', 'unsupported level (A-Z internal labels only)');
  if (!READING_MODES.includes(book.reading_mode)) err('C01', 'reading_mode', `must be one of ${READING_MODES.join('|')}`);
  if (!isStr(book.topic)) err('C01', 'topic', 'required');
  if (!['fiction', 'nonfiction'].includes(book.genre)) err('C01', 'genre', 'must be fiction|nonfiction');
  if (!isArr(book.learning_objectives) || book.learning_objectives.length === 0) err('C01', 'learning_objectives', 'at least one required');
  if (!isArr(book.prerequisite_skills)) err('C01', 'prerequisite_skills', 'must be an array');
  if (!isArr(book.target_phonics)) err('C01', 'target_phonics', 'must be an array');
  if (!isArr(book.irregular_words)) err('C01', 'irregular_words', 'must be an array (may be empty)');
  if (!book.difficulty || typeof book.difficulty !== 'object') err('C01', 'difficulty', 'required {text, conceptual, visual_support}');
  else for (const k of ['text', 'conceptual', 'visual_support']) {
    if (!['low', 'medium', 'high'].includes(book.difficulty[k])) err('C01', `difficulty.${k}`, 'must be low|medium|high');
  }

  // --- rights / provenance (C05)
  const rights = book.rights;
  if (!rights || typeof rights !== 'object') err('C05', 'rights', 'required {text_author, text_license, media_license, original}');
  else {
    if (!isStr(rights.text_author)) err('C05', 'rights.text_author', 'required');
    if (!isStr(rights.text_license)) err('C05', 'rights.text_license', 'required');
    if (rights.original !== true) err('C05', 'rights.original', 'only original content is accepted (must be true)');
  }

  // --- pages
  const pageIds = new Set();
  if (!isArr(book.pages) || book.pages.length === 0) err('C01', 'pages', 'at least one page required');
  else book.pages.forEach((p, i) => {
    const path = `pages[${i}]`;
    if (!isStr(p.page_id) || !ID_RE.test(p.page_id)) err('C01', `${path}.page_id`, 'missing or invalid');
    else if (pageIds.has(p.page_id)) err('C01', `${path}.page_id`, `duplicate page_id ${p.page_id}`);
    else pageIds.add(p.page_id);
    if (typeof p.text !== 'string') err('C01', `${path}.text`, 'text must be a string (HTML text, never baked into images)');
    if (p.image_asset != null) {
      if (!ASSET_RE.test(p.image_asset)) err('C01', `${path}.image_asset`, 'invalid asset path');
      else if (opts.assetExists && !opts.assetExists(p.image_asset)) err('C01', `${path}.image_asset`, `broken media path ${p.image_asset}`);
      if (!isStr(p.image_alt) && p.image_decorative !== true) err('C01', `${path}.image_alt`, 'meaningful image needs alt text (or image_decorative:true)');
      if (!isStr(p.image_provenance)) err('C05', `${path}.image_provenance`, 'media provenance required');
    }
    if (p.audio_asset != null) {
      if (!ASSET_RE.test(p.audio_asset)) err('C01', `${path}.audio_asset`, 'invalid asset path');
      else if (opts.assetExists && !opts.assetExists(p.audio_asset)) err('C01', `${path}.audio_asset`, `broken media path ${p.audio_asset}`);
      if (!isStr(p.audio_script)) err('C01', `${path}.audio_script`, 'audio_script required when audio present');
    }
    if (p.timing_segments != null) {
      if (!isArr(p.timing_segments)) err('C01', `${path}.timing_segments`, 'must be an array');
      else if (p.timing_segments.length > 0 && p.timing_verified !== true) {
        err('C01', `${path}.timing_verified`, 'timing_segments present but not verified; highlighting would be unsafe');
      }
    }
    if (isArr(p.vocabulary)) p.vocabulary.forEach((v, j) => {
      if (!isStr(v.word) || !isStr(v.definition)) err('C01', `${path}.vocabulary[${j}]`, 'word and definition required');
    });
  });

  // --- quiz (C01 + C04)
  const qIds = new Set();
  if (!isArr(book.quiz)) err('C01', 'quiz', 'must be an array');
  else book.quiz.forEach((q, i) => {
    const path = `quiz[${i}]`;
    if (!isStr(q.question_id) || !ID_RE.test(q.question_id)) err('C01', `${path}.question_id`, 'missing or invalid');
    else if (qIds.has(q.question_id)) err('C01', `${path}.question_id`, `duplicate question_id ${q.question_id}`);
    else qIds.add(q.question_id);
    if (!SKILLS.includes(q.skill)) err('C01', `${path}.skill`, `unknown skill ${q.skill}`);
    if (!DIFFICULTIES.includes(q.difficulty)) err('C01', `${path}.difficulty`, 'must be easy|medium|hard');
    if (!isStr(q.prompt)) err('C01', `${path}.prompt`, 'required');
    if (!isStr(q.explanation)) err('C01', `${path}.explanation`, 'required');
    const open = q.response_type === 'open';
    if (!open) {
      if (!isArr(q.options) || q.options.length < 2) err('C01', `${path}.options`, 'at least two options');
      else {
        const optIds = new Set();
        q.options.forEach((o, j) => {
          if (!isStr(o.id)) err('C01', `${path}.options[${j}].id`, 'required');
          else if (optIds.has(o.id)) err('C01', `${path}.options[${j}].id`, 'duplicate option id');
          else optIds.add(o.id);
          if (!isStr(o.text)) err('C01', `${path}.options[${j}].text`, 'required');
        });
        if (!optIds.has(q.correct_option_id)) err('C01', `${path}.correct_option_id`, 'does not match any option id');
      }
      if (!isArr(q.evidence_page_ids) || q.evidence_page_ids.length === 0) err('C04', `${path}.evidence_page_ids`, 'closed-form question must cite at least one page');
      else q.evidence_page_ids.forEach(pid => { if (!pageIds.has(pid)) err('C04', `${path}.evidence_page_ids`, `unknown page ${pid}`); });
      if (q.distractors_reviewed !== true) err('C04', `${path}.distractors_reviewed`, 'human review must confirm distractors are not also correct');
    } else {
      if (!isStr(q.rubric)) err('C01', `${path}.rubric`, 'open question needs a human-review rubric');
      if (q.auto_grade === true) err('C01', `${path}.auto_grade`, 'open-ended answers must not be auto-graded');
    }
  });

  // --- activities (optional)
  if (book.activities != null) {
    if (!isArr(book.activities)) err('C01', 'activities', 'must be an array');
    else book.activities.forEach((a, i) => {
      const path = `activities[${i}]`;
      if (!isStr(a.activity_id)) err('C01', `${path}.activity_id`, 'required');
      if (!ACTIVITY_TYPES.includes(a.type)) err('C01', `${path}.type`, `unknown activity type ${a.type}`);
      if (!SKILLS.includes(a.skill)) err('C01', `${path}.skill`, 'unknown skill');
      if (a.type === 'sequence_events') {
        if (!isArr(a.items) || a.items.length < 2) err('C01', `${path}.items`, 'sequence needs >= 2 items');
        else a.items.forEach((it, j) => {
          if (!isStr(it.id) || !isStr(it.text)) err('C01', `${path}.items[${j}]`, 'id and text required');
          if (it.page_id && !pageIds.has(it.page_id)) err('C04', `${path}.items[${j}].page_id`, 'unknown page');
        });
        if (!isArr(a.correct_order) || a.correct_order.length !== (a.items || []).length) err('C01', `${path}.correct_order`, 'must list every item id once');
      }
      if (a.type === 'match_pairs' || a.type === 'word_to_meaning') {
        if (!isArr(a.pairs) || a.pairs.length < 2) err('C01', `${path}.pairs`, 'needs >= 2 pairs');
        else a.pairs.forEach((pr, j) => { if (!isStr(pr.left) || !isStr(pr.right)) err('C01', `${path}.pairs[${j}]`, 'left/right required'); });
      }
      if (a.type === 'choose_evidence') {
        if (!isStr(a.claim)) err('C01', `${path}.claim`, 'required');
        if (!isArr(a.correct_page_ids) || !a.correct_page_ids.every(p => pageIds.has(p))) err('C04', `${path}.correct_page_ids`, 'must reference known pages');
      }

      if (!isStr(c.claim) || !isStr(c.source)) err('C05', `factual_claims[${i}]`, 'claim and source required');

  // --- review block (C02 relies on this)
  const rv = book.review;
  if (!rv || typeof rv !== 'object') err('C01', 'review', 'required');
  else {
    for (const k of ['content_approved', 'media_approved', 'parent_approved']) if (typeof rv[k] !== 'boolean') err('C01', `review.${k}`, 'boolean required');

/** Token-level decodability check. Heuristic only; flags words for human review. */
function checkDecodability(book, lexicon = {}) {
  const allowed = new Set();
  for (const pat of book.target_phonics || []) for (const w of lexicon[pat] || []) allowed.add(w.toLowerCase());
  for (const pat of book.prerequisite_skills || []) for (const w of lexicon[pat] || []) allowed.add(w.toLowerCase());

  const seen = new Set(); const unsupported = [];
  for (const p of book.pages || []) {
    for (const raw of (p.text || '').split(/\s+/)) {

      if (!w || seen.has(w)) continue;
      seen.add(w);
      if (!allowed.has(w) && !matchesPattern(w, book.target_phonics, book.prerequisite_skills)) unsupported.push(w);

// Minimal explicit pattern grammar: "cvc_short_a" etc. Anything unknown -> not matched (forces review).
const PATTERN_RULES = {
  cvc_short_a: /^[bcdfghjklmnprstvwz]a[bdgmnptx]$/,
  cvc_short_i: /^[bcdfghjklmnprstvwz]i[bdgmnptx]$/,
  cvc_short_o: /^[bcdfghjklmnprstvwz]o[bdgmnptx]$/,
  cvc_short_e: /^[bcdfghjklmnprstvwz]e[bdgmnptx]$/,
  cvc_short_u: /^[bcdfghjklmnprstvwz]u[bdgmnptx]$/,
  vc_short: /^[aeiou][bdgmnptx]$/,
  double_final_consonant: /^[bcdfghjklmnprstvwz][aeiou](ll|ss|ff|zz)$/,
};
function matchesPattern(word, ...lists) {

  return false;
}

function isPublishable(book) {

/** Content pipeline transitions (parent-only UI enforces who may call). */
function nextStatus(book, action) {
  const s = book.status;
  const T = {
    validate: { from: ['DRAFT'], to: 'SCHEMA_VALIDATED', guard: b => validateBook(b).ok },
    submit_content: { from: ['SCHEMA_VALIDATED'], to: 'CONTENT_REVIEW' },
    approve_content: { from: ['CONTENT_REVIEW'], to: 'MEDIA_REVIEW', set: { content_approved: true } },
    approve_media: { from: ['MEDIA_REVIEW'], to: 'PARENT_APPROVED', set: { media_approved: true } },
    approve_parent: { from: ['PARENT_APPROVED'], to: 'PUBLISHED', set: { parent_approved: true, published_at: 'now' } },
    reject: { from: STATUSES.filter(x => x !== 'DRAFT'), to: 'DRAFT', reset: true },
  };
  const t = T[action];
  if (!t || !t.from.includes(s)) return { ok: false, reason: `cannot ${action} from ${s}` };
  if (t.guard && !t.guard(book)) return { ok: false, reason: 'schema validation failed' };
  const review = { ...(book.review || {}) };
  if (t.reset) { review.content_approved = false; review.media_approved = false; review.parent_approved = false; delete review.published_at; }
  if (t.set) for (const [k, v] of Object.entries(t.set)) review[k] = v === 'now' ? new Date().toISOString() : v;
  review.history = [...(review.history || []), { action, from: s, to: t.to, at: new Date().toISOString() }];
  return { ok: true, book: { ...book, status: t.to, review } };
}
