<style>
:root{
  --pink:#ff8fb1;--pink-d:#c8365f;--pink-l:#ffe4ec;
  --blue:#5ba8f5;--blue-d:#2f76c9;--blue-l:#deeeff;
  --green:#4ecb82;--green-d:#278a52;--green-l:#d8f5e7;
  --yellow:#ffc94d;--yellow-d:#b87900;--yellow-l:#fff3cc;
  --purple:#9f7ae8;--purple-d:#6540b8;--purple-l:#ede5ff;
  --teal:#3ecfcf;--teal-d:#1a9999;--teal-l:#d4f6f6;
  --orange:#ff8c42;--orange-d:#c05a10;--orange-l:#ffe0cc;
  --red-c:#f05555;--red-d:#c02020;--red-l:#ffe0e0;
  --ink:#2e2852;--ink-s:#7068a0;--line:#e8e2f6;
  --bg:#f8f6ff;
  --ff:'Baloo 2',system-ui,sans-serif;
  --r:20px;
  /* lesson-scoped */
  --nc:var(--purple);--nd:var(--purple-d);--ns:rgba(159,122,232,.38);--nl:var(--purple-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{font-size:17px}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:20;background:rgba(248,246,255,.97);
  backdrop-filter:blur(16px);border-bottom:2px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px}
.hdr-logo{height:34px;width:auto}
.hdr-title{flex:1;font-weight:800;font-size:1.05rem;color:var(--ink);line-height:1.2}
.hdr-title small{display:block;font-size:.62rem;font-weight:700;color:var(--ink-s);letter-spacing:.6px}
.hdr-stat{display:flex;align-items:center;gap:5px;background:var(--purple-l);
  color:var(--purple-d);border-radius:999px;padding:5px 14px;font-weight:800;font-size:.95rem}

/* ── MAP ── */
.map{max-width:480px;margin:0 auto;padding:20px 16px 100px}

/* ── LEGEND ── */
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
  padding:10px 0 6px;font-size:.78rem;font-weight:700;color:var(--ink-s)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:13px;height:13px;border-radius:50%}

/* ── SECTION BANNER ── */
.sec{display:flex;align-items:center;gap:14px;padding:15px 22px;
  border-radius:var(--r);margin:28px 0 20px;font-weight:800;font-size:1.05rem;color:#fff}
.sec-ico{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800;flex-shrink:0}
.sec-info{line-height:1.25}
.sec-sub{font-size:.68rem;font-weight:700;opacity:.88;letter-spacing:.6px;margin-top:3px}

/* ── NODE ROW ── */
.row{display:flex;justify-content:center;margin:6px 0}
.row.L{transform:translateX(-23%)}
.row.R{transform:translateX(23%)}

/* ── NODE ── */
.nd{width:90px;height:90px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  border:4px solid transparent;transition:transform .12s, box-shadow .2s;user-select:none}
.nd:active{transform:scale(.91)!important}
.nd .ico{font-size:1.15rem;font-weight:800;line-height:1;text-align:center;max-width:74px}
.nd .lbl{font-size:.55rem;font-weight:700;margin-top:4px;text-align:center;max-width:74px;line-height:1.25;opacity:.95}
.nw{display:flex;flex-direction:column;align-items:center;gap:6px}
.nstars{font-size:.95rem;height:19px;line-height:1;letter-spacing:1px}
.nd.done{color:#fff}
.nd.active{color:#fff;animation:pulse 2.3s ease-in-out infinite}
.nd.locked{background:#eae6f5!important;border-color:#d6d0ec!important;color:#c0b8dc;cursor:default;box-shadow:none!important}
.nd.quiz{width:96px;height:96px}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06);filter:brightness(1.08)}
}

/* ── CONNECTOR ── */
.conn{width:5px;border-radius:3px;margin:0 auto;opacity:.3}
.conn.done{opacity:.6}

/* ── BOTTOM NAV ── */
.bot{position:fixed;bottom:0;left:0;right:0;z-index:15;
  background:rgba(248,246,255,.97);backdrop-filter:blur(14px);
  border-top:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bot a{display:flex;align-items:center;gap:8px;padding:11px 26px;border-radius:999px;
  background:var(--purple-l);color:var(--purple-d);font-weight:800;font-size:1rem;text-decoration:none}

/* ════════════ LESSON OVERLAY ════════════ */
.les-ov{display:none;position:fixed;inset:0;z-index:50;
  background:#fff;flex-direction:column;overflow:hidden}
.les-ov.open{display:flex}

/* top bar */
.les-hdr{display:flex;align-items:center;gap:10px;
  padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top));
  flex-shrink:0}
.les-exit{width:38px;height:38px;border-radius:50%;border:none;background:var(--line);
  font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink-s);flex-shrink:0;font-family:var(--ff);font-weight:800}
.prog-wrap{flex:1;display:flex;align-items:center;gap:5px}
.prog-dot{height:12px;flex:1;border-radius:999px;background:var(--line);transition:background .35s}
.prog-dot.done{background:var(--green)}
.prog-dot.cur{background:var(--nc)}
.les-hearts{display:flex;gap:4px;flex-shrink:0;font-size:1.4rem;line-height:1}
.heart{transition:opacity .3s;display:inline-block}
.heart.lost{opacity:.18;filter:grayscale(1)}

/* body */
.les-body{flex:1;overflow-y:auto;padding:14px 20px 10px;display:flex;flex-direction:column;gap:14px}

/* question label */
.q-label{font-size:.82rem;font-weight:800;color:var(--ink-s);text-transform:uppercase;
  letter-spacing:.9px;text-align:center}

/* visual showcase card */
.q-vis{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
  min-height:124px;border-radius:18px;background:var(--nl);
  border:3px solid var(--nc);padding:14px;
}
.vis-char{font-size:3.6rem;font-weight:800;color:var(--nc);
  letter-spacing:10px;text-align:center;line-height:1.15;font-family:var(--ff)}
.vis-count{font-size:2.5rem;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:280px}
.vis-math{font-size:2.5rem;font-weight:800;color:var(--nc);text-align:center;line-height:1.2;font-family:var(--ff)}
.vis-word{font-size:3rem;font-weight:800;color:var(--nc);text-align:center;font-family:var(--ff)}
.vis-shape svg{display:block}

/* question text */
.q-text{font-size:1.35rem;font-weight:700;text-align:center;line-height:1.4;color:var(--ink)}

/* choices 2x2 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:4px}
.ch-btn{
  padding:16px 10px;border-radius:16px;border:3px solid var(--line);
  background:#fff;font-family:var(--ff);font-size:1.1rem;font-weight:700;
  color:var(--ink);cursor:pointer;text-align:center;line-height:1.3;
  transition:border-color .15s,background .15s,transform .1s;
  min-height:72px;display:flex;align-items:center;justify-content:center
}
.ch-btn:active{transform:scale(.94)}
.ch-btn.sel{border-color:var(--nc);background:var(--nl);color:var(--nd)}
.ch-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.ch-btn.wrong{border-color:var(--red-c);background:var(--red-l);color:var(--red-d)}
.ch-btn:disabled{cursor:default}

/* footer */
.les-ft{flex-shrink:0;padding:0 20px calc(18px + env(safe-area-inset-bottom))}
.fb-bar{border-radius:16px 16px 0 0;padding:14px 18px;display:none;margin-bottom:-2px}
.fb-bar.ok{display:block;background:var(--green-l);border-top:3px solid var(--green)}
.fb-bar.ng{display:block;background:var(--red-l);border-top:3px solid var(--red-c)}
.fb-title{font-size:1.05rem;font-weight:800}
.fb-bar.ok .fb-title{color:var(--green-d)}
.fb-bar.ng .fb-title{color:var(--red-d)}
.fb-hint{font-size:.88rem;font-weight:600;color:var(--ink-s);margin-top:4px;line-height:1.4}
.les-btn{width:100%;padding:17px;border:none;border-radius:var(--r);
  font-family:var(--ff);font-weight:800;font-size:1.15rem;cursor:pointer;
  transition:background .2s,transform .1s;letter-spacing:.4px}
.les-btn:active{transform:scale(.97)}
.les-btn:disabled{background:var(--line);color:#b8b0d8;cursor:default}
.les-btn.check{background:var(--nc);color:#fff;box-shadow:0 6px 18px var(--ns)}
.les-btn.next-ok{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(78,203,130,.4)}
.les-btn.next-ng{background:var(--red-c);color:#fff;box-shadow:0 6px 18px rgba(240,85,85,.4)}

/* ── COMPLETE SCREEN ── */
.comp-ov{display:none;position:fixed;inset:0;z-index:60;
  background:rgba(46,40,82,.62);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:24px}
.comp-ov.open{display:flex}
.comp-card{background:#fff;border-radius:28px;padding:34px 26px 28px;
  width:100%;max-width:380px;text-align:center;
  box-shadow:0 16px 60px rgba(46,40,82,.28)}
.comp-trophy{font-size:4.5rem;margin-bottom:10px}
.comp-title{font-size:1.6rem;font-weight:800;color:var(--ink);margin-bottom:6px}
.comp-sub{font-size:.95rem;color:var(--ink-s);margin-bottom:18px;line-height:1.55}
.comp-stars{font-size:2.2rem;letter-spacing:5px;margin-bottom:18px}
.comp-xp{display:inline-block;background:var(--purple-l);color:var(--purple-d);
  border-radius:999px;padding:7px 22px;font-weight:800;font-size:1rem;margin-bottom:26px}
.comp-btns{display:flex;gap:12px;justify-content:center}
.comp-btn{flex:1;max-width:165px;padding:14px;border:none;border-radius:var(--r);
  font-family:var(--ff);font-weight:800;font-size:1rem;cursor:pointer;transition:transform .1s}
.comp-btn:active{transform:scale(.95)}
.comp-btn.home{background:var(--line);color:var(--ink-s)}
.comp-btn.nxt{color:#fff;box-shadow:0 5px 16px var(--ns)}

@media(max-width:360px){
  .nd{width:80px;height:80px} .nd.quiz{width:86px;height:86px}
  .ch-btn{font-size:1rem;min-height:66px}
}
</style>
</head>

  <div class="les-body" id="lesBody"></div>
  <div class="les-ft">
    <div class="fb-bar" id="fbBar">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-hint" id="fbHint"></div>
    </div>
    <button class="les-btn" id="lesBtn" disabled onclick="lesAction()">KIỂM TRA</button>
  </div>
</div>

<!-- Complete screen -->
<div class="comp-ov" id="compOv">
  <div class="comp-card">
    <div class="comp-trophy" id="compTrophy">🏆</div>
    <div class="comp-title" id="compTitle">Hoàn thành!</div>
    <div class="comp-sub" id="compSub"></div>
    <div class="comp-stars" id="compStars"></div>
    <div class="comp-xp" id="compXP">+3 sao</div>
    <div class="comp-btns">
      <button class="comp-btn home" onclick="compClose()">Trở về</button>
      <button class="comp-btn nxt" id="compNextBtn" onclick="compClose()">Tiếp theo</button>
    </div>
  </div>
</div>

<nav class="bot">

</nav>

// Fallback: 5 placeholder questions for nodes without a bank
function getQs(node){
  if(QS[node.id]) return QS[node.id];
  return Array.from({length:5},(_,i)=>({
    vis:{t:'ch',v:(i+1)+''},
    q:'Câu hỏi '+(i+1)+' cho bài "'+(node.lbl||'').replace(/\n/g,' ')+'"',
    choices:['Đáp án A','Đáp án B','Đáp án C','Đáp án D'],ans:0,
    hint:'(Câu hỏi đang được cập nhật – chọn A để tiếp tục)'
  }));
}

// ══════════════════════════════════════════
//  VISUAL SHOWCASE RENDERER
// ══════════════════════════════════════════
function renderVis(vis, color){
  if(!vis) return '';
  const {t,v,e} = vis;
  let inner='';
  if(t==='ch') inner=`<div class="vis-char">${v}</div>`;
  else if(t==='ct'){
    const emoji = e||'●';
    const count = Math.min(Number(v)||3, 10);
    inner=`<div class="vis-count">${(emoji+' ').repeat(count).trim()}</div>`;
  }
  else if(t==='mx') inner=`<div class="vis-math">${v}</div>`;
  else if(t==='wd') inner=`<div class="vis-word">${v}</div>`;
  else if(t==='sh') inner=`<div class="vis-shape">${svgShape(v,color)}</div>`;
  return `<div class="q-vis">${inner}</div>`;
}

// ══════════════════════════════════════════
const PK='vhq_skill_v1';
let progress={}, userId=null;

async function loadProgress(){
  if(sb){
    const {data:{session}}=await sb.auth.getSession().catch(()=>({data:{session:null}}));
    if(session){
      userId=session.user.id;
      const {data}=await sb.from('skill_progress').select('node_id,stars').eq('user_id',userId).catch(()=>({data:null}));
      if(data) data.forEach(r=>{ progress[r.node_id]=r.stars||1; });
      updateXP(); return;
    }
  }
  try{ progress=JSON.parse(localStorage.getItem(PK)||'{}'); }catch(e){ progress={}; }
  updateXP();
}

async function saveProgress(nodeId,stars){
  progress[nodeId]=stars;
  if(sb&&userId){
    await sb.from('skill_progress').upsert({user_id:userId,node_id:nodeId,stars,completed_at:new Date().toISOString()}).catch(()=>{});
  } else {
    localStorage.setItem(PK,JSON.stringify(progress));
  }
  updateXP();
}

function updateXP(){
  const tot=Object.values(progress).reduce((a,b)=>a+(b||0),0);
  document.getElementById('xpBadge').textContent='★ '+tot;
}

function flatNodes(){ return TREE.flatMap(s=>s.nodes); }

function getState(nodeId){
  if(progress[nodeId]) return 'done';
  const all=flatNodes(), idx=all.findIndex(n=>n.id===nodeId);
  if(idx===0) return 'active';
  if(progress[all[idx-1].id]) return 'active';
  return 'locked';
}

function starsText(nodeId){
  const s=progress[nodeId]||0;
  return s?'★'.repeat(s)+'☆'.repeat(Math.max(0,3-s)):'';
}

// ══════════════════════════════════════════
//  TREE RENDER
// ══════════════════════════════════════════
const ZPOS=['C','R','C','L','C','R','C','L'];
function render(){
  const map=document.getElementById('map');
  const leg=map.querySelector('.legend');
  map.innerHTML=''; map.appendChild(leg);
  let gi=0;
  TREE.forEach(sec=>{
    const banner=document.createElement('div');
    banner.className='sec';
    banner.style.cssText=`background:linear-gradient(135deg,${sec.color},${sec.dark});box-shadow:0 8px 24px ${sec.shadow}`;
    banner.innerHTML=`<div class="sec-ico">${sec.ico}</div><div class="sec-info"><div>${sec.label}</div><div class="sec-sub">${sec.sub}</div></div>`;
    map.appendChild(banner);

    sec.nodes.forEach((node,ni)=>{
      const state=getState(node.id);
      const pos=ZPOS[gi%ZPOS.length]; gi++;
      const row=document.createElement('div');
      row.className='row '+pos;
      const nw=document.createElement('div');
      nw.className='nw';
      const nd=document.createElement('div');
      nd.className='nd '+(node.type==='quiz'?'quiz ':'')+ state;
      if(state!=='locked'){
        nd.style.cssText=`background:linear-gradient(145deg,${sec.color},${sec.dark});border-color:${sec.dark};box-shadow:0 8px 22px ${sec.shadow}`;
        nd.onclick=()=>state==='active'?startLesson(node,sec):confirm('"'+node.lbl.replace(/\n/g,' ')+'" đã có '+starsText(node.id)+'\nHọc lại để có thêm sao?')&&startLesson(node,sec);
      }
      nd.innerHTML=`<div class="ico">${state==='locked'?'🔒':node.ico}</div><div class="lbl">${state==='locked'?'':node.lbl.replace(/\n/g,'<br>')}</div>`;
      const ns=document.createElement('div');
      ns.className='nstars';
      ns.textContent=state==='done'?starsText(node.id):state==='active'?'Bắt đầu!':'';
      nw.appendChild(nd); nw.appendChild(ns); row.appendChild(nw); map.appendChild(row);
      if(ni<sec.nodes.length-1){
        const conn=document.createElement('div');
        conn.className='conn '+(state==='done'?'done':'');
        conn.style.cssText=`background:linear-gradient(${sec.color},${sec.dark});height:24px`;
        map.appendChild(conn);
      }
    });
  });
}

// ══════════════════════════════════════════
//  LESSON FLOW
// ══════════════════════════════════════════
let L={qs:[],idx:0,sel:-1,hearts:3,wrong:0,node:null,sec:null};
let lesState='pick';

function startLesson(node,sec){
  const qs=getQs(node).slice();
  for(let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; }
  L={qs,idx:0,sel:-1,hearts:3,wrong:0,node,sec};
  document.documentElement.style.setProperty('--nc',sec.color);
  document.documentElement.style.setProperty('--nd',sec.dark);
  document.documentElement.style.setProperty('--ns',sec.shadow);
  document.documentElement.style.setProperty('--nl',sec.light);
  document.getElementById('lesOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderHearts(); renderProgress(); renderQuestion();
}

function lesExit(){
  document.getElementById('lesOv').classList.remove('open');
  document.body.style.overflow='';
}

function renderHearts(){
  for(let i=0;i<3;i++) document.getElementById('h'+i).className='heart'+(i>=L.hearts?' lost':'');
}

function renderProgress(){
  const wrap=document.getElementById('progWrap');
  wrap.innerHTML='';
  L.qs.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='prog-dot'+(i<L.idx?' done':i===L.idx?' cur':'');
    if(i===L.idx) d.style.background=L.sec.color;
    wrap.appendChild(d);
  });
}

function renderQuestion(){
  const q=L.qs[L.idx];
  const body=document.getElementById('lesBody');
  body.innerHTML=
    `<div class="q-label">Chọn đáp án đúng</div>`+
    renderVis(q.vis,L.sec.color)+
    `<div class="q-text">${q.q}</div>`+
    `<div class="choices" id="choicesGrid"></div>`;
  const grid=document.getElementById('choicesGrid');
  q.choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='ch-btn';
    btn.innerHTML=c;
    btn.onclick=()=>selectChoice(i);
    grid.appendChild(btn);
  });
  // Reset footer
  document.getElementById('fbBar').className='fb-bar';
  const lesBtn=document.getElementById('lesBtn');
  lesBtn.className='les-btn'; lesBtn.disabled=true; lesBtn.textContent='KIỂM TRA';
  L.sel=-1; lesState='pick';
}

function selectChoice(i){
  if(lesState!=='pick') return;
  L.sel=i;
  document.querySelectorAll('.ch-btn').forEach((b,j)=>{ b.className='ch-btn'+(j===i?' sel':''); });
  const lesBtn=document.getElementById('lesBtn');
  lesBtn.disabled=false; lesBtn.className='les-btn check';
}

function lesAction(){
  if(lesState==='pick') checkAnswer();
  else nextQuestion();
}

function checkAnswer(){
  const q=L.qs[L.idx];
  const ok=L.sel===q.ans;
  document.querySelectorAll('.ch-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.className='ch-btn correct';
    else if(i===L.sel&&!ok) b.className='ch-btn wrong';
  });
  const fb=document.getElementById('fbBar');
  const lesBtn=document.getElementById('lesBtn');
  if(ok){
    fb.className='fb-bar ok';
    document.getElementById('fbTitle').textContent='✓  Đúng rồi! Giỏi lắm!';
    document.getElementById('fbHint').textContent='';
    lesBtn.className='les-btn next-ok';
  } else {
    L.wrong++; L.hearts=Math.max(0,L.hearts-1); renderHearts();
    fb.className='fb-bar ng';
    document.getElementById('fbTitle').textContent='✗  Chưa đúng!';
    document.getElementById('fbHint').textContent=q.hint||'';
    lesBtn.className='les-btn next-ng';
  }
  lesBtn.textContent='TIẾP THEO';
  lesState='checked';
}

function nextQuestion(){
  L.idx++;
  if(L.idx>=L.qs.length){ completeLesson(); return; }
  renderProgress(); renderQuestion();
}

function completeLesson(){
  lesExit();
  const stars=L.wrong===0?3:L.wrong<=2?2:1;
  const prev=progress[L.node.id]||0;
  const best=Math.max(prev,stars);
  saveProgress(L.node.id,best).then(()=>render());
  showComplete(stars,best>prev);
}

// ══════════════════════════════════════════
//  COMPLETE SCREEN
// ══════════════════════════════════════════
function showComplete(stars,improved){
  document.documentElement.style.setProperty('--nc',L.sec.color);
  document.documentElement.style.setProperty('--ns',L.sec.shadow);
  document.getElementById('compTrophy').textContent=stars===3?'🏆':stars===2?'🌟':'💪';
  document.getElementById('compTitle').textContent=stars===3?'Hoàn hảo!':stars===2?'Rất tốt!':'Cố gắng lên!';
  document.getElementById('compSub').textContent=
    L.wrong===0?'Không sai một câu nào! Tuyệt vời!'
    :L.wrong===1?'Chỉ sai 1 câu – rất giỏi!'
    :L.wrong===2?'Sai 2 câu – vẫn tốt lắm!'
    :'Học lại lần nữa nhé, em sẽ làm tốt hơn!';
  document.getElementById('compStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('compXP').textContent='+'+stars+' sao'+(improved?' (mới!)':'');
  const all=flatNodes(), ci=all.findIndex(n=>n.id===L.node.id);
  const nxt=all[ci+1];
  const nxtBtn=document.getElementById('compNextBtn');
  if(nxt&&(progress[nxt.id]||getState(nxt.id)==='active')){
    const ns=TREE.find(s=>s.nodes.find(n=>n.id===nxt.id));
    nxtBtn.textContent='Tiếp theo';
    nxtBtn.style.background=(ns||L.sec).color;
    nxtBtn.onclick=()=>{ compClose(); startLesson(nxt,ns||L.sec); };
  } else {
    nxtBtn.textContent='Hoàn thành!';
    nxtBtn.style.background=L.sec.color;
    nxtBtn.onclick=compClose;
  }
  document.getElementById('compOv').classList.add('open');
}

function compClose(){
  document.getElementById('compOv').classList.remove('open');
}

// ── INIT ──
(async()=>{ await loadProgress(); render(); })();
</script>
</body>
</html>
