<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metro Học Tập - An Bình</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --metro:#1e5fa8;--metro-d:#0d3a6b;--metro-l:#deeeff;
  --yellow:#ffc107;--yellow-d:#b87900;
  --green:#4ecb82;--green-d:#278a52;--green-l:#d8f5e7;
  --red-c:#f05555;--red-l:#ffe0e0;--red-d:#c02020;
  --ink:#0d1a3a;--ink-s:#4a6080;--line:#d8e6f5;--bg:#f0f5ff;
  --ff:'Baloo 2',system-ui,sans-serif;--r:18px;
  --nc:var(--metro);--nd:var(--metro-d);--ns:rgba(30,95,168,.35);--nl:var(--metro-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{font-size:17px}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:20;background:var(--metro-d);
  padding:10px 16px 6px;padding-top:calc(10px + env(safe-area-inset-top))}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr-logo{height:30px;width:auto;filter:brightness(2)}
.hdr-title{flex:1;font-weight:800;font-size:.92rem;color:#fff;line-height:1.2}
.hdr-title small{display:block;font-size:.56rem;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.6px}
.hdr-xp{background:var(--yellow);color:var(--metro-d);border-radius:999px;
  padding:5px 14px;font-weight:800;font-size:.9rem}

/* ── MINI METRO MAP ── */
.minimap{display:flex;flex-direction:column;gap:5px;padding:2px 8px 10px}
.mm-row{display:flex;align-items:center;justify-content:center}
.mm-node{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer}
.mm-dot{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.15);position:relative;transition:background .25s;display:flex;align-items:center;justify-content:center}
.mm-dot.done{background:var(--green);border-color:var(--green)}
.mm-dot.active{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,193,7,.35)}
.mm-label{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.6);
  text-align:center;white-space:nowrap}
.mm-label.done{color:var(--green)}.mm-label.active{color:var(--yellow)}
.mm-line{height:5px;flex:1;min-width:12px;max-width:40px;
  background:rgba(255,255,255,.18);border-radius:3px;transition:background .3s}
.mm-line.done{background:var(--green)}
.mm-train{font-size:1.1rem;line-height:1;animation:trainBob .6s ease-in-out infinite alternate}
@keyframes trainBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

/* ── CITY SKYLINE ── */
.city-wrap{background:linear-gradient(175deg,#060e20 0%,#0f2248 38%,#6b2a08 72%,#d96020 100%);
  overflow:hidden;height:130px;position:relative}
.city-svg{position:absolute;bottom:0;left:0;width:100%;height:130px}
@keyframes blink{0%,88%,100%{opacity:1}93%{opacity:.25}}
.blink1{animation:blink 3.2s ease-in-out infinite}
.blink2{animation:blink 4.7s ease-in-out infinite .9s}
.blink3{animation:blink 2.8s ease-in-out infinite 1.6s}
@keyframes fly{0%{transform:translateX(-80px) translateY(0)}50%{transform:translateX(50vw) translateY(-8px)}100%{transform:translateX(110vw) translateY(0)}}
.plane{animation:fly 22s linear infinite 3s;position:absolute;top:16px;left:0;font-size:1rem}

/* ── MAP ── */
.map{max-width:480px;margin:0 auto;padding:10px 14px 100px}

/* ── METRO STATION CARD ── */
.sta{margin:20px 0 10px;border-radius:20px;border:3px solid var(--metro);
  background:#fff;overflow:hidden;box-shadow:0 6px 20px rgba(30,95,168,.12)}
.sta.complete{border-color:var(--green)}
.sta.locked{border-color:var(--line);opacity:.7;pointer-events:none}
.sta-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden}
.sta.locked .sta-hdr{background:linear-gradient(135deg,#8a9ab5,#5a6a80)}
.sta-num{width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.22);border:2.5px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem;color:#fff;flex-shrink:0}
.sta-info{flex:1;color:#fff}
.sta-name{font-size:.98rem;font-weight:800;letter-spacing:.3px}
.sta-sub{font-size:.58rem;font-weight:700;opacity:.85;letter-spacing:.5px;margin-top:2px}
.sta-badge{background:rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:4px 12px;font-size:.7rem;font-weight:800;white-space:nowrap}
.sta-body{padding:14px 14px 16px}
.nodes-grid{display:flex;flex-direction:column;gap:10px}
.nd-row{display:flex;justify-content:center;gap:10px}
.nd-row.L{transform:translateX(-14%)}
.nd-row.R{transform:translateX(14%)}
.nd-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}

/* ── NODES ── */
.nd{width:160px;height:160px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  border:4px solid transparent;transition:transform .12s,box-shadow .2s;user-select:none}
.nd:active{transform:scale(.91)!important}
.nd .ico{font-size:1.9rem;font-weight:800;line-height:1.1;text-align:center;max-width:130px}
.nd .lbl{font-size:.82rem;font-weight:700;margin-top:6px;text-align:center;max-width:130px;line-height:1.3}
.nd.done{color:#fff;background:linear-gradient(145deg,#4ecb82,#278a52);border-color:#278a52;box-shadow:0 8px 22px rgba(78,203,130,.38)}
.nd.active{color:#fff;background:linear-gradient(145deg,var(--nc),var(--nd));border-color:var(--nd);box-shadow:0 10px 28px var(--ns);animation:ndPulse 2.3s ease-in-out infinite}
.nd.locked{background:#e8ecf4!important;border-color:#c8d2e0!important;color:#9aa8be;cursor:default;box-shadow:none!important;font-size:2.2rem}
.nd.quiz{width:172px;height:172px}
.nstars{font-size:1.1rem;height:22px;line-height:1;color:var(--yellow-d)}
@keyframes ndPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);filter:brightness(1.1)}}

/* ── TRACK CONNECTOR ── */
.track-conn{width:10px;border-radius:5px;margin:0 auto;height:28px;background:var(--metro)}
.track-conn.done{background:var(--green)}
.track-conn.locked{background:var(--line)}

/* ── LESSON OVERLAY ── */
.les-ov{display:none;position:fixed;inset:0;z-index:50;background:#fff;flex-direction:column;overflow:hidden}
.les-ov.open{display:flex}
.les-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0}
.les-exit{width:38px;height:38px;border-radius:50%;border:none;background:var(--line);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-s);flex-shrink:0;font-family:var(--ff);font-weight:800}
.prog-wrap{flex:1;display:flex;align-items:center;gap:4px}
.prog-dot{height:11px;flex:1;border-radius:999px;background:var(--line);transition:background .35s}
.prog-dot.done{background:var(--green)}.prog-dot.cur{background:var(--nc)}
.les-hearts{display:flex;gap:4px;flex-shrink:0;font-size:1.35rem}
.heart{display:inline-block;transition:transform .15s}.heart.lost{filter:grayscale(1);opacity:.2}
.les-body{flex:1;overflow-y:auto;padding:14px 20px 10px;display:flex;flex-direction:column;gap:14px}
.les-body.q-in{animation:qFadeIn .28s ease}
.q-label{font-size:.8rem;font-weight:800;color:var(--ink-s);text-transform:uppercase;letter-spacing:.9px;text-align:center}
.q-vis{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;min-height:118px;border-radius:18px;background:var(--nl);border:3px solid var(--nc);padding:14px}
.vis-char{font-size:3.4rem;font-weight:800;color:var(--nc);letter-spacing:10px;text-align:center;line-height:1.2}
.vis-count{font-size:2.4rem;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:280px}
.vis-math{font-size:2.4rem;font-weight:800;color:var(--nc);text-align:center;line-height:1.25}
.vis-word{font-size:2.8rem;font-weight:800;color:var(--nc);text-align:center}
.vis-shape svg{display:block}
.q-text{font-size:1.33rem;font-weight:700;text-align:center;line-height:1.4;color:var(--ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:4px}
.ch-btn{padding:16px 10px;border-radius:16px;border:3px solid var(--line);background:#fff;font-family:var(--ff);font-size:1.1rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;line-height:1.3;transition:border-color .15s,background .15s;min-height:72px;display:flex;align-items:center;justify-content:center}
.ch-btn:active{transform:scale(.94)}
.ch-btn.sel{border-color:var(--nc);background:var(--nl);color:var(--nd)}
.ch-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.ch-btn.wrong{border-color:var(--red-c);background:var(--red-l);color:var(--red-d)}
.ch-btn:disabled{cursor:default}
.les-ft{flex-shrink:0;padding:0 20px calc(18px + env(safe-area-inset-bottom))}
.fb-bar{border-radius:16px 16px 0 0;padding:14px 18px;display:none;margin-bottom:-2px}
.fb-bar.ok{display:block;background:var(--green-l);border-top:3px solid var(--green)}
.fb-bar.ng{display:block;background:var(--red-l);border-top:3px solid var(--red-c)}
.fb-title{font-size:1rem;font-weight:800}
.fb-bar.ok .fb-title{color:var(--green-d)}.fb-bar.ng .fb-title{color:var(--red-d)}
.fb-hint{font-size:.85rem;font-weight:600;color:var(--ink-s);margin-top:4px;line-height:1.4}
.les-btn{width:100%;padding:17px;border:none;border-radius:var(--r);font-family:var(--ff);font-weight:800;font-size:1.15rem;cursor:pointer;transition:transform .1s}
.les-btn:active{transform:scale(.97)}
.les-btn:disabled{background:var(--line);color:#b8c8d8;cursor:default}
.les-btn.check{background:var(--nc);color:#fff;box-shadow:0 6px 18px var(--ns)}
.les-btn.next-ok{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(78,203,130,.4)}
.les-btn.next-ng{background:var(--red-c);color:#fff;box-shadow:0 6px 18px rgba(240,85,85,.4)}

/* ── COMP MODAL ── */
.comp-ov{display:none;position:fixed;inset:0;z-index:60;background:rgba(13,26,58,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
.comp-ov.open{display:flex}
.comp-card{background:#fff;border-radius:26px;padding:32px 24px 26px;width:100%;max-width:380px;text-align:center;box-shadow:0 16px 56px rgba(13,26,58,.28)}
.comp-trophy{font-size:4rem;margin-bottom:8px}
.comp-title{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:6px}
.comp-sub{font-size:.9rem;color:var(--ink-s);margin-bottom:16px;line-height:1.55}
.comp-stars{font-size:2.2rem;letter-spacing:5px;margin-bottom:16px;min-height:48px;display:flex;justify-content:center;gap:6px}
.comp-stars span{display:inline-block}
.comp-xp{display:inline-block;background:var(--metro-l);color:var(--metro-d);border-radius:999px;padding:6px 20px;font-weight:800;font-size:.95rem;margin-bottom:24px}
.comp-btns{display:flex;gap:12px;justify-content:center}
.comp-btn{flex:1;max-width:165px;padding:13px;border:none;border-radius:var(--r);font-family:var(--ff);font-weight:800;font-size:.95rem;cursor:pointer;transition:transform .1s}
.comp-btn:active{transform:scale(.95)}
.comp-btn.home{background:var(--line);color:var(--ink-s)}
.comp-btn.nxt{color:#fff}

/* ══ STATION ARRIVAL OVERLAY ══ */
.arr-ov{display:none;position:fixed;inset:0;z-index:65;
  background:linear-gradient(175deg,#060e1f 0%,#0d1f40 38%,#1a3a6a 72%,#0a2a5a 100%);
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.arr-ov.open{display:flex}
/* platform floor */
.arr-platform{position:absolute;bottom:0;left:0;right:0;height:36%;background:#0d1628;border-top:5px solid #1e2e48}
.arr-platform-stripe{position:absolute;top:5px;left:0;right:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0,var(--yellow) 20px,transparent 20px,transparent 36px)}
/* content */
.arr-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:16px 24px;width:100%}
.arr-emoji{font-size:3rem;margin-bottom:8px;animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.arr-title{color:#fff;font-size:1.55rem;font-weight:800;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.7);margin-bottom:16px}

/* LED BOARD */
.led-board{background:#060606;border:3px solid var(--yellow);border-radius:12px;padding:12px 22px;margin-bottom:18px;text-align:center;width:100%;max-width:340px}
.led-label{font-size:.6rem;font-weight:700;color:rgba(255,193,7,.65);letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
.led-text{font-size:1.3rem;font-weight:800;color:var(--yellow);letter-spacing:1.5px;line-height:1.3;text-shadow:0 0 14px rgba(255,193,7,.85),0 0 28px rgba(255,193,7,.4);animation:ledPulse 1.5s ease-in-out infinite}
@keyframes ledPulse{0%,100%{opacity:1}50%{opacity:.75}}
.led-sub{font-size:.64rem;color:rgba(255,255,255,.5);margin-top:4px;letter-spacing:.7px}

/* TRAIN ANIMATION */
.arr-track-wrap{width:100%;max-width:340px;margin-bottom:16px;position:relative;height:52px}
.arr-track-bed{position:absolute;bottom:10px;left:0;right:0;height:5px;background:#1a2a40;border-radius:3px}
.arr-track-ties{position:absolute;bottom:8px;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#2a3a58 0,#2a3a58 12px,transparent 12px,transparent 22px)}
.arr-train{position:absolute;bottom:14px;animation:trainArrive .85s cubic-bezier(.15,1.3,.35,1) .1s both}
@keyframes trainArrive{from{left:-150px;opacity:0}to{left:calc(50% - 58px);opacity:1}}

/* MASCOTS on platform */
.arr-mascots{position:absolute;bottom:calc(36% + 5px);display:flex;gap:20px;align-items:flex-end}
.mascot-svg{display:block;animation:mascotSway .55s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes mascotSway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.arr-mascots > div:nth-child(2) .mascot-svg{animation-delay:.22s;animation-direction:alternate-reverse}

/* BUTTON */
.arr-btn{margin-top:18px;padding:14px 38px;border:none;border-radius:999px;
  background:var(--yellow);color:var(--metro-d);font-family:var(--ff);
  font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 22px rgba(255,193,7,.5);transition:transform .1s}
.arr-btn:active{transform:scale(.95)}

/* ── STREAK BADGE ── */
.streak-badge{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:12px 30px;z-index:56;font-family:var(--ff);font-weight:800;font-size:1.1rem;color:#c05a10;box-shadow:0 10px 36px rgba(0,0,0,.22);pointer-events:none;white-space:nowrap;opacity:0}
.streak-badge.show{animation:streakAnim .42s ease forwards}

/* ── PHASE 3 ANIMATIONS ── */
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-11px)}36%{transform:translateX(11px)}54%{transform:translateX(-8px)}72%{transform:translateX(8px)}88%{transform:translateX(-4px)}}
@keyframes heartLose{0%{transform:scale(1)}25%{transform:scale(1.7);filter:brightness(1.8)}100%{transform:scale(.85);filter:grayscale(1);opacity:.18}}
@keyframes qFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes starPop{0%{transform:scale(0)rotate(-35deg);opacity:0}65%{transform:scale(1.35)rotate(6deg);opacity:1}100%{transform:scale(1)rotate(0);opacity:1}}
@keyframes correctPop{0%,100%{transform:scale(1)}40%{transform:scale(1.09)}}
@keyframes streakAnim{0%{transform:translate(-50%,-50%)scale(.4);opacity:0}65%{transform:translate(-50%,-58%)scale(1.12);opacity:1}100%{transform:translate(-50%,-50%)scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(0)rotate(0)scale(1);opacity:1}100%{transform:translateY(250px)rotate(580deg)scale(.3);opacity:0}}
.ch-btn.shake{animation:shake .48s ease}
.ch-btn.cpop{animation:correctPop .38s ease}
.heart.losing{animation:heartLose .62s ease forwards}

/* ── BOT NAV ── */
.bot{position:fixed;bottom:0;left:0;right:0;z-index:15;background:rgba(240,245,255,.97);backdrop-filter:blur(14px);border-top:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bot a{display:flex;align-items:center;gap:8px;padding:11px 26px;border-radius:999px;background:var(--metro-l);color:var(--metro-d);font-weight:800;font-size:.95rem;text-decoration:none}

/* ── STATION BANNER TRAIN ── */
.sta-banner-train{position:absolute;bottom:6px;animation:bannerTrain var(--tt,8s) linear infinite;will-change:transform;pointer-events:none}
@keyframes bannerTrain{0%{left:-120px;transform:scaleX(1)}49.9%{left:calc(100% + 5px);transform:scaleX(1)}50%{left:calc(100% + 5px);transform:scaleX(-1)}99.9%{left:-120px;transform:scaleX(-1)}100%{left:-120px;transform:scaleX(1)}}

@media(max-width:360px){.nd{width:132px;height:132px}.nd.quiz{width:144px;height:144px}.nd .ico{font-size:1.5rem}.nd .lbl{font-size:.72rem}.ch-btn{font-size:1rem;min-height:66px}}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-top">
    <img class="hdr-logo" src="logos/ab.png" alt="AB" onerror="this.style.display='none'">
    <div class="hdr-title">Metro Học Tập An Bình<small>TUYẾN SỐ 1 · SUỐI TIÊN ➜ BẾN THÀNH</small></div>
    <div class="hdr-xp" id="xpBadge">★ 0</div>
  </div>
  <div class="minimap" id="minimap"></div>
</header>

<!-- HCMC CITY SKYLINE -->
<div class="city-wrap" aria-hidden="true">
  <span class="plane">✈️</span>
  <svg class="city-svg" viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
    <circle cx="440" cy="22" r="14" fill="#ffe8a0" opacity=".92"/>
    <circle cx="448" cy="18" r="12" fill="#0f2248"/>
    <g fill="#fff" opacity=".65"><circle cx="55" cy="14" r="1.2"/><circle cx="128" cy="7" r="1"/><circle cx="198" cy="19" r="1.3"/><circle cx="305" cy="9" r="1"/><circle cx="375" cy="24" r="1.1"/><circle cx="22" cy="29" r=".9"/><circle cx="158" cy="4" r=".8"/><circle cx="420" cy="36" r="1"/></g>
    <!-- far buildings -->
    <g fill="#0a1830" opacity=".88"><rect x="0" y="82" width="28" height="48"/><rect x="30" y="68" width="22" height="62"/><rect x="55" y="76" width="18" height="54"/><rect x="76" y="60" width="30" height="70"/><rect x="109" y="73" width="20" height="57"/><rect x="348" y="72" width="22" height="58"/><rect x="374" y="61" width="30" height="69"/><rect x="407" y="76" width="20" height="54"/><rect x="430" y="64" width="26" height="66"/><rect x="459" y="79" width="21" height="51"/></g>
    <!-- Bitexco tower -->
    <g fill="#060f22"><rect x="219" y="20" width="24" height="110"/><polygon points="231,5 208,30 254,30"/><rect x="225" y="12" width="10" height="16" fill="#12274a"/></g>
    <ellipse cx="231" cy="5" rx="16" ry="4.5" fill="none" stroke="#2a4a70" stroke-width="1.8" opacity=".6"/>
    <!-- mid buildings -->
    <g fill="#0c1e38"><rect x="140" y="54" width="34" height="76"/><rect x="177" y="64" width="26" height="66"/><rect x="260" y="50" width="38" height="80"/><rect x="301" y="62" width="28" height="68"/><rect x="332" y="70" width="20" height="60"/></g>

function getQs(node){
  if(QS[node.id]) return QS[node.id];
  return Array.from({length:5},(_,i)=>({vis:{t:'ch',v:''+(i+1)},q:'Câu '+(i+1)+' – '+node.lbl.replace(/\n/g,' '),choices:['Đáp án A','Đáp án B','Đáp án C','Đáp án D'],ans:0,hint:'(Đang cập nhật – chọn A)'}));
}

function renderVis(vis,color){
  if(!vis) return '';
  const{t,v,e}=vis;
  let inner='';
  if(t==='ch') inner=`<div class="vis-char">${v}</div>`;
  else if(t==='ct'){const emoji=e||'●',count=Math.min(Number(v)||3,10);inner=`<div class="vis-count">${(emoji+' ').repeat(count).trim()}</div>`;}
  else if(t==='mx') inner=`<div class="vis-math">${v}</div>`;
  else if(t==='wd') inner=`<div class="vis-word">${v}</div>`;
  else if(t==='sh') inner=`<div class="vis-shape">${svgShape(v,color)}</div>`;
  return `<div class="q-vis">${inner}</div>`;
}

const PK='vhq_skill_v1';
let progress={},userId=null;

async function loadProgress(){
  if(sb){
    const{data:{session}}=await sb.auth.getSession().catch(()=>({data:{session:null}}));
    if(session){
      userId=session.user.id;
      let data=null;try{const r=await sb.from('skill_progress').select('node_id,stars').eq('user_id',userId);data=r.data;}catch(e){}
      if(data) data.forEach(r=>{progress[r.node_id]=r.stars||1;});
      updateXP(); return;
    }
  }
  try{progress=JSON.parse(localStorage.getItem(PK)||'{}');}catch(e){progress={};}
  updateXP();
}

async function saveProgress(nodeId,stars){
  progress[nodeId]=stars;
  if(sb&&userId){try{await sb.from('skill_progress').upsert({user_id:userId,node_id:nodeId,stars,completed_at:new Date().toISOString()});}catch(e){}}
  else{localStorage.setItem(PK,JSON.stringify(progress));}
  updateXP();
}

function updateXP(){
  const tot=Object.values(progress).reduce((a,b)=>a+(b||0),0);
  document.getElementById('xpBadge').textContent='★ '+tot;
  renderMinimap();
}

function flatNodes(){return TREE.flatMap(s=>s.nodes);}
function isSectionDone(sec){return sec.nodes.every(n=>progress[n.id]);}
function currentStationIdx(){for(let i=0;i<TREE.length;i++){if(!isSectionDone(TREE[i])) return i;}return TREE.length-1;}

function getNodeState(nodeId){
  if(progress[nodeId]) return 'done';
  const all=flatNodes(),idx=all.findIndex(n=>n.id===nodeId);
  if(idx===0) return 'active';
  if(progress[all[idx-1].id]) return 'active';
  return 'locked';
}
function starsText(nodeId){const s=progress[nodeId]||0;return s?'★'.repeat(s)+'☆'.repeat(Math.max(0,3-s)):'';}

function renderMinimap(){
  const cur=currentStationIdx();
  const el=document.getElementById('minimap');
  if(!el) return;
  function buildRow(slice,offset){
    let h='<div class="mm-row">';
    slice.forEach((sec,i)=>{
      const si=offset+i,done=isSectionDone(sec),active=si===cur;
      h+=`<div class="mm-node" onclick="scrollToStation('${sec.id}')">
        <div class="mm-dot ${done?'done':active?'active':''}">${active?'<span class="mm-train">🚇</span>':done?'✓':''}</div>
        <div class="mm-label ${done?'done':active?'active':''}">${sec.stNum}</div>
      </div>`;
      if(i<slice.length-1) h+=`<div class="mm-line ${done?'done':''}"></div>`;
    });
    return h+'</div>';
  }
  el.innerHTML=buildRow(TREE.slice(0,5),0)+buildRow(TREE.slice(5),5);
}

function scrollToStation(secId){
  const el=document.getElementById('sta-'+secId);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

const ZPOS=['C','R','C','L','C','R','C'];
function render(){
  const map=document.getElementById('map');
  map.innerHTML='';
  let gi=0;
  TREE.forEach((sec,si)=>{
    const done=isSectionDone(sec);
    const allLocked=si>0&&!isSectionDone(TREE[si-1])&&sec.nodes.every(n=>getNodeState(n.id)==='locked');
    const sta=document.createElement('div');
    sta.id='sta-'+sec.id;
    sta.className='sta '+(done?'complete':allLocked?'locked':'');
    const hdrBg=allLocked?'linear-gradient(135deg,#8a9ab5,#5a6a80)':done?`linear-gradient(135deg,${sec.color},${sec.dark})`:`linear-gradient(135deg,${sec.color},${sec.dark})`;
    const trainSvg=allLocked?'':
      `<div class="sta-banner-train" style="--tt:${sec.tt||'8s'}">
        <svg viewBox="0 0 110 30" width="100" height="27" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="108" height="22" rx="6" fill="rgba(0,0,0,.22)"/>
          <rect x="1" y="18" width="108" height="5" fill="rgba(255,255,255,.25)"/>
          <rect x="8" y="5" width="15" height="11" rx="2" fill="rgba(255,255,255,.75)"/>

          <rect x="50" y="5" width="15" height="11" rx="2" fill="rgba(255,255,255,.75)"/>
          <rect x="71" y="5" width="15" height="11" rx="2" fill="rgba(255,255,255,.75)"/>
          <circle cx="18" cy="26" r="3.5" fill="rgba(0,0,0,.4)"/><circle cx="92" cy="26" r="3.5" fill="rgba(0,0,0,.4)"/>
          <circle cx="4" cy="11" r="3" fill="rgba(255,255,255,.8)"/>
        </svg>
      </div>`;
    sta.innerHTML=`<div class="sta-hdr" style="background:${hdrBg}"><div class="sta-num">${sec.stNum}</div><div class="sta-info"><div class="sta-name">${sec.station}</div><div class="sta-sub">${sec.label} · ${sec.sub}</div></div>${done?'<div class="sta-badge">✓ Hoàn thành</div>':''}${trainSvg}</div>`;
    const body=document.createElement('div');body.className='sta-body';
    const grid=document.createElement('div');grid.className='nodes-grid';
    sec.nodes.forEach((node)=>{
      const state=getNodeState(node.id);
      const pos=ZPOS[gi%ZPOS.length]; gi++;
      const row=document.createElement('div');row.className='nd-row '+pos;
      const wrap=document.createElement('div');wrap.className='nd-wrap';
      const nd=document.createElement('div');
      nd.className='nd '+(node.type==='quiz'?'quiz ':'')+state;
      if(state!=='locked'){nd.onclick=()=>{if(state==='active') startLesson(node,sec);else if(confirm('"'+node.lbl.replace(/\n/g,' ')+'" – '+starsText(node.id)+'\nHọc lại để cải thiện sao?')) startLesson(node,sec);};}
      nd.innerHTML=`<div class="ico">${state==='locked'?'🔒':node.ico}</div><div class="lbl">${state==='locked'?'':node.lbl.replace(/\n/g,'<br>')}</div>`;
      const ns=document.createElement('div');ns.className='nstars';ns.textContent=state==='done'?starsText(node.id):state==='active'?'Bắt đầu!':'';
      wrap.appendChild(nd);wrap.appendChild(ns);row.appendChild(wrap);grid.appendChild(row);
    });
    body.appendChild(grid);sta.appendChild(body);map.appendChild(sta);
    if(si<TREE.length-1){
      const conn=document.createElement('div');
      conn.className='track-conn '+(done?'done':allLocked?'locked':'');
      map.appendChild(conn);
    }
  });
}

// ── LESSON FLOW ──
let L={qs:[],idx:0,sel:-1,hearts:3,wrong:0,streak:0,node:null,sec:null};
let lesState='pick', pendingArrival=null;

function startLesson(node,sec){
  const qs=getQs(node).slice();
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  L={qs,idx:0,sel:-1,hearts:3,wrong:0,streak:0,node,sec};
  document.documentElement.style.setProperty('--nc',sec.color);
  document.documentElement.style.setProperty('--nd',sec.dark);
  document.documentElement.style.setProperty('--ns',sec.shadow);
  document.documentElement.style.setProperty('--nl',sec.light);
  document.getElementById('lesOv').classList.add('open');
  document.body.style.overflow='hidden';
  renderHearts();renderProgress();renderQuestion();
}

function lesExit(){document.getElementById('lesOv').classList.remove('open');document.body.style.overflow='';}

function renderHearts(){for(let i=0;i<3;i++){const h=document.getElementById('h'+i);h.className='heart'+(i>=L.hearts?' lost':'');}}

function animateHeartLoss(){
  const h=document.getElementById('h'+L.hearts);
  if(!h) return;
  h.classList.add('losing');
  h.addEventListener('animationend',()=>{h.classList.remove('losing');h.classList.add('lost');},{once:true});
}

function showStreak(){
  const badge=document.getElementById('streakBadge');
  badge.textContent=L.streak>=5?'🔥 Chuỗi ×'+L.streak+'! Xuất sắc!':'🔥 Chuỗi ×'+L.streak+'!';
  badge.className='streak-badge show';
  setTimeout(()=>{badge.className='streak-badge';},2000);
}

function renderProgress(){
  const wrap=document.getElementById('progWrap');wrap.innerHTML='';
  L.qs.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='prog-dot'+(i<L.idx?' done':i===L.idx?' cur':'');
    if(i===L.idx) d.style.background=L.sec.color;
    wrap.appendChild(d);
  });
}

function renderQuestion(){
  const q=L.qs[L.idx];
  const body=document.getElementById('lesBody');
  body.className='les-body';
  body.innerHTML=`<div class="q-label">Chọn đáp án đúng</div>`+renderVis(q.vis,L.sec.color)+`<div class="q-text">${q.q}</div><div class="choices" id="choicesGrid"></div>`;
  const grid=document.getElementById('choicesGrid');
  q.choices.forEach((c,i)=>{const btn=document.createElement('button');btn.className='ch-btn';btn.innerHTML=c;btn.onclick=()=>selectChoice(i);grid.appendChild(btn);});
  document.getElementById('fbBar').className='fb-bar';
  const lesBtn=document.getElementById('lesBtn');
  lesBtn.className='les-btn';lesBtn.disabled=true;lesBtn.textContent='KIỂM TRA';
  L.sel=-1;lesState='pick';
  void body.offsetWidth;body.className='les-body q-in';
}

function selectChoice(i){
  if(lesState!=='pick') return;
  L.sel=i;
  document.querySelectorAll('.ch-btn').forEach((b,j)=>{b.className='ch-btn'+(j===i?' sel':'');});
  const lesBtn=document.getElementById('lesBtn');lesBtn.disabled=false;lesBtn.className='les-btn check';
}

function lesAction(){if(lesState==='pick') checkAnswer();else nextQuestion();}

function checkAnswer(){
  const q=L.qs[L.idx],ok=L.sel===q.ans;
  document.querySelectorAll('.ch-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.className='ch-btn correct cpop';
    else if(i===L.sel&&!ok) b.className='ch-btn wrong shake';
  });
  const fb=document.getElementById('fbBar'),lesBtn=document.getElementById('lesBtn');
  if(ok){
    L.streak++;if(L.streak>=3) showStreak();
    fb.className='fb-bar ok';document.getElementById('fbTitle').textContent='✓  Đúng rồi! Giỏi lắm!';document.getElementById('fbHint').textContent='';
    lesBtn.className='les-btn next-ok';
  } else {
    L.streak=0;L.wrong++;L.hearts=Math.max(0,L.hearts-1);animateHeartLoss();
    fb.className='fb-bar ng';document.getElementById('fbTitle').textContent='✗  Chưa đúng!';document.getElementById('fbHint').textContent=q.hint||'';
    lesBtn.className='les-btn next-ng';
  }
  lesBtn.textContent='TIẾP THEO';lesState='checked';
}

function nextQuestion(){L.idx++;if(L.idx>=L.qs.length){completeLesson();return;}renderProgress();renderQuestion();}

async function completeLesson(){
  lesExit();
  const stars=L.wrong===0?3:L.wrong<=2?2:1;
  const prev=progress[L.node.id]||0;
  const best=Math.max(prev,stars);
  const wasComplete=isSectionDone(L.sec);
  await saveProgress(L.node.id,best);
  render();
  if(isSectionDone(L.sec)&&!wasComplete) pendingArrival=L.sec;
  showComplete(stars,best>prev);
}

function showComplete(stars,improved){
  document.documentElement.style.setProperty('--nc',L.sec.color);
  document.documentElement.style.setProperty('--ns',L.sec.shadow);
  document.getElementById('compTrophy').textContent=stars===3?'🏆':stars===2?'🌟':'💪';
  document.getElementById('compTitle').textContent=stars===3?'Hoàn hảo!':stars===2?'Rất tốt!':'Cố gắng lên!';
  document.getElementById('compSub').textContent=L.wrong===0?'Không sai một câu! Tuyệt vời!':L.wrong===1?'Chỉ sai 1 câu – rất giỏi!':L.wrong===2?'Sai 2 câu – vẫn tốt lắm!':'Học lại lần nữa nhé!';
  const starsEl=document.getElementById('compStars');starsEl.innerHTML='';
  for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=i<stars?'★':'☆';s.style.cssText=`font-size:2.2rem;opacity:0;animation:starPop .42s ease ${i*.18}s forwards;color:${i<stars?'#ffc107':'#c0ccd8'}`;starsEl.appendChild(s);}
  document.getElementById('compXP').textContent='+'+stars+' sao'+(improved?' (mới!)':'');
  const nxtBtn=document.getElementById('compNextBtn');
  if(pendingArrival){
    nxtBtn.textContent='Xem kết quả ga →';nxtBtn.style.background=L.sec.color;
    nxtBtn.onclick=()=>{compClose();showStationArrival(pendingArrival);pendingArrival=null;};
  } else {
    const all=flatNodes(),ci=all.findIndex(n=>n.id===L.node.id),nxt=all[ci+1];
    if(nxt&&getNodeState(nxt.id)==='active'){
      const ns=TREE.find(s=>s.nodes.find(n=>n.id===nxt.id));
      nxtBtn.textContent='Tiếp theo';nxtBtn.style.background=(ns||L.sec).color;
      nxtBtn.onclick=()=>{compClose();startLesson(nxt,ns||L.sec);};
    } else {nxtBtn.textContent='Hoàn thành!';nxtBtn.style.background=L.sec.color;nxtBtn.onclick=compClose;}
  }
  document.getElementById('compOv').classList.add('open');
  if(stars===3) setTimeout(launchConfetti,350);
}

function compClose(){document.getElementById('compOv').classList.remove('open');}

// ── STATION ARRIVAL ──
function showStationArrival(sec){
  const secIdx=TREE.findIndex(s=>s.id===sec.id);
  const nextSec=TREE[secIdx+1],isLast=!nextSec;
  document.getElementById('arrEmoji').textContent=isLast?'🏆':'🎉';
  document.getElementById('arrTitle').textContent=isLast?'Chúc mừng! Đến Bến Thành rồi! 🏆':'Đến ga '+sec.station+'!';
  if(isLast){document.getElementById('ledText').textContent='BẾN THÀNH – ĐÍCH ĐẾN';document.getElementById('ledSub').textContent='Hoàn thành tất cả! Xuất sắc!';}
  else{document.getElementById('ledText').textContent=(nextSec.stNum+' – '+nextSec.station).toUpperCase();document.getElementById('ledSub').textContent=nextSec.label+' · '+nextSec.sub;}
  const train=document.getElementById('arrTrain');train.style.animation='none';void train.offsetWidth;train.style.animation='';
  document.getElementById('arrOv').classList.add('open');
  document.body.style.overflow='hidden';
  playArrivalChime();
  setTimeout(launchConfetti,700);
  renderMinimap();
}

function arrClose(){document.getElementById('arrOv').classList.remove('open');document.body.style.overflow='';}

function playArrivalChime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047].forEach((freq,i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      const t=ctx.currentTime+i*.18;
      gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.22,t+.05);gain.gain.exponentialRampToValueAtTime(.001,t+.55);
      osc.start(t);osc.stop(t+.55);
    });
  }catch(e){}
}

function launchConfetti(){
  const cols=['#ff8fb1','#ffc107','#4ecb82','#5ba8f5','#c97ef0','#ff8c42','#3ecfcf'];
  for(let i=0;i<28;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:fixed;z-index:80;pointer-events:none;width:${8+Math.random()*6}px;height:${8+Math.random()*6}px;border-radius:${i%3===0?'50%':'3px'};background:${cols[i%cols.length]};left:${15+Math.random()*70}vw;top:30vh;animation:confettiFall ${.7+Math.random()*.9}s ease ${Math.random()*.5}s both`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),2200);
  }
}

(async()=>{await loadProgress();render();renderMinimap();})();
</script>
